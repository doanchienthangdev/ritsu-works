# SOP-AIOPS-004 — /evolve Iteration Loop SOP
#
# Declarative spec for the /evolve loop. Read by .claude/commands/evolve.md
# and 06-ai-ops/skills/eval-evo/orchestrator/SKILL.md.
#
# NOTE: This SOP is the LOOP SOP, NOT a CLA-style 8-phase ceremony SOP.
# /evolve invocations run inside this SOP's flow once dispatched by the
# command.

sop_id: SOP-AIOPS-004
slug: evolve
name: "/evolve iteration loop"
version: "1.1.0"   # v1.1 (2026-05-27, capability evolve v1.1 Sprint 3): added skillopt subcommand phase chain (Phase A-G per spec §19)
state: operating
owner: 06-ai-ops
hitl_default: B
cost_bucket: eval-evo-orchestrator

# ----------------------------------------------------------------------
# Steps (each /evolve invocation runs once through this sequence)
# ----------------------------------------------------------------------
steps:
  - id: pre_flight
    name: "Pre-flight gates"
    actions:
      - argv_validate
      - holdout_gate_check  # _HOLDOUT.yaml has real ratings (not PENDING-FOUNDER)
      - playbook_spearman_check  # ≥0.6 correlation per playbook (R7 mitigation)
      - pnpm_check_clean
      - entity_path_resolve
      - concurrent_run_check
      - working_tree_clean_check
      - tier_classify
    hitl: A
    failure_handling:
      holdout_pending: abort_with_completion_instructions
      spearman_below_threshold: abort_with_playbook_revise_instructions
      drift: abort_with_validator_output
      concurrent: error_with_run_id
      entity_missing: suggest_via_nn_search
      working_tree_dirty: error_with_actionable_hint

  - id: insert_agent_run
    name: "Insert ops.agent_runs row"
    actions:
      - insert_ops_agent_runs
    hitl: A
    state_after: running

  - id: loop_iter
    name: "Iteration loop (1..N)"
    skill: eval-evo/orchestrator
    actions:
      - budget_check
      - load_context  # episodic-recall + corrections (~500 tok)
      - judge_pre_score  # invoke score-{type} skill
      - variance_flag_check  # R2: >5pt on unchanged artifact
      - stash_pre_state  # git stash push -- <entity-file>
      - proposer_draft  # invoke propose-improvement skill
      - apply_diff  # invoke install-improvement skill
      - drift_gate_post_apply  # pnpm check
      - judge_post_score
      - keep_or_revert  # Karpathy K4
      - stop_check
      - persist_iter  # ops.run_summaries + ops.events
    hitl: A  # within-loop
    repeats_until: stop_cond_met OR max_iters_reached OR budget_truncated

  - id: tier_b_finalize
    name: "Tier B install: in-place persists"
    condition: tier == 'B'
    actions:
      - update_agent_run_completed
      - print_summary
    hitl: A

  - id: tier_c_outside_voice
    name: "Tier C+ outside-voice"
    condition: tier == 'C'
    skill: eval-evo/outside-voice
    actions:
      - codex_primary  # codex CLI subprocess
      - subagent_fallback  # Claude general-purpose subagent
      - annotate_only_fallback
    hitl: A
    cost_bucket: eval-evo-outside-voice

  - id: tier_c_open_pr
    name: "Tier C+ PR open"
    condition: tier == 'C'
    actions:
      - assemble_pr_body
      - gh_pr_create
      - update_agent_run_pr_open
      - telegram_notify_founder  # deferred to v1.1 if Telegram bot not wired
    hitl: A  # the PR is the founder's gate
    state_after: pr-open

  - id: tier_c_post_merge
    name: "Tier C+ post-merge verification"
    condition: tier == 'C' AND pr_merged
    actions:
      - pnpm_check_clean
      - consistency_checks_rerun
    hitl: A
    failure_handling:
      post_merge_drift: alert_router_telegram_revert_option

# ----------------------------------------------------------------------
# Drift gates
# ----------------------------------------------------------------------
drift_gates:
  - phase: pre_flight
    command: pnpm check
    abort_on_fail: true
  - phase: per_iter_post_apply
    command: pnpm check
    revert_on_fail: true
  - phase: tier_c_post_merge
    command: pnpm check + ops.consistency_checks rerun
    alert_on_fail: true

# ----------------------------------------------------------------------
# Events emitted
# ----------------------------------------------------------------------
events_emitted:
  - type: ritsu.entity.evolved
    when: per-iter completion (each kept iter)
    payload:
      capability_id: evolve
      entity_type: <type>
      entity_slug: <slug>
      run_id: <uuid>
      iter: <int>
      score_pre: <int>
      score_post: <int>
      delta: <int>

  - type: ritsu.evolve.run_completed
    when: post-loop (Tier B finalize OR Tier C+ PR open)
    payload:
      capability_id: evolve
      run_id: <uuid>
      exit_reason: <str>
      scores: [<ints>]
      total_cost_usd: <float>

  - type: ritsu.evolve.calibration_pending
    when: day-30 calibration script PASS but founder hasn't run retro
    payload:
      median_gain: <float>
      judge_sigma: <float>
      ratio: <float>

  - type: ritsu.evolve.calibration_paused
    when: day-30 calibration script PAUSE-RECOMMENDED
    payload:
      median_gain: <float>
      judge_sigma: <float>
      ratio: <float>
      next_action: "founder runs /cla revise evolve OR confirms continue"

# ----------------------------------------------------------------------
# State persistence
# ----------------------------------------------------------------------
state_persisted_in:
  - ops.agent_runs (one row per /evolve invocation; state_payload JSONB)
  - ops.run_summaries (per kept iter; ~150 tokens)
  - ops.events (per kept iter)
  - ops.cost_attributions (per LLM call inside the run)
  - ops.consistency_checks (post-merge for Tier C+)
  - ops.corrections (from /evolve reject subcommand)
  - ops.decisions (Tier C+ approval at PR merge — superseded model)

# ----------------------------------------------------------------------
# v1.1 NEW — skillopt subcommand (Phase A-G per spec §19.6/§19.7)
# ----------------------------------------------------------------------
# Distinct from the default /evolve loop above. Dispatched when the
# command parses `/evolve skillopt <skill> ...`. Drives the SkillOpt
# Python subprocess + session-bridge.cjs from this Claude session.
# Subscription invariant: Python runs with ANTHROPIC_API_KEY=empty;
# every LLM call flows file-queue → bridge → Task() subagent.

skillopt_subcommand:
  entry_skill: eval-evo/skillopt-runner
  hitl_default: B          # entire flow Tier B; Tier C entities refused unless --tier-override
  cost_bucket: eval-evo-orchestrator
  budget_cap_task_kind: eval-evo-skillopt-iteration-total   # 500-msg hard ceiling per run

  phases:
    - id: phase_A_preflight
      name: "Phase A — Pre-flight"
      actions:
        - argv_validate
        - entity_exists_check
        - cost_estimator_pre_check     # node scripts/skillopt/cost-estimator.cjs
        - pnpm_check_clean
        - working_tree_clean
        - vendor_smoke                  # bash scripts/skillopt/install-vendor.sh
        - python_deps_check             # openai + pyyaml + numpy
        - acquire_entity_edit_lock      # universal lock per /update v1.0
        - tier_classify
        - resume_branch                  # --resume reads runner-state.json
      hitl: A
      failure_handling:
        cost_exceeded: abort_with_widen_cap_hint
        drift: abort_with_validator_output
        vendor_smoke_fail: abort_with_install_vendor_hint
        python_deps_missing: abort_with_pip_install_hint
        lock_held: abort_lockheld
        resume_aborted_state: refuse_terminal
        resume_too_stale: refuse_over_7_days

    - id: phase_B_gen_data
      name: "Phase B — Synthetic data generation"
      skill: eval-evo/skillopt-gen-data
      actions:
        - invoke_gen_data_skill
        - capture_dataset_path
        - founder_review_gate            # AskUserQuestion Tier B inside gen-data
      hitl: B
      failure_handling:
        founder_abort: abort_with_cleanup
        gate_rejected_x3: abort_with_regenerate_or_abort_prompt

    - id: phase_C_train_loop
      name: "Phase C — SkillOpt train loop"
      actions:
        - write_cfg_json
        - launch_python_subprocess       # env -i ANTHROPIC_API_KEY= python3 train.py
        - bridge_init                     # session-bridge.cjs init (sweeps orphan .tmp per R18)
        - poll_loop_dispatch              # parallel Task() fanout per batch
        - poll_loop_write_response        # atomic-rename per UPSTREAM-DEVIATION contract
        - poll_loop_subprocess_alive_check
        - budget_per_batch_check
      hitl: A                              # within-loop; R12 escalates to B
      failure_handling:
        rate_limit: r12_pause_resume_or_abort   # AskUserQuestion Tier B
        transient_error: retry_with_backoff      # up to 3 attempts
        other_error: write_error_response_continue
        budget_exceeded: kill_subprocess_break_loop
        subprocess_crash: capture_exit_code_break

    - id: phase_D_outer_k4
      name: "Phase D — Outer K4 (keep-or-revert)"
      actions:
        - validate_best_skill_md_exists
        - held_out_judge_pass_post        # skillopt-judge on post-iter skill
        - held_out_judge_pass_baseline    # skillopt-judge on pre-iter skill (skipped on resume)
        - compute_composite_delta         # playbooks/skill-skillopt.md formula
        - k4_decision                      # keep | borderline (Tier B prompt) | revert
      hitl: A_or_B                         # B only on borderline (0 ≤ delta < +0.10)
      failure_handling:
        subprocess_crash: exit_reason_subprocess_crash
        judge_regressed: skip_install_retain_best_skill_md

    - id: phase_E_install
      name: "Phase E — Install (skipped on dry_run or judge_regressed)"
      skill: eval-evo/install-improvement   # REUSED from v1.0
      actions:
        - install_via_git_stash_apply
        - pnpm_check_post_apply
      hitl: A
      failure_handling:
        drift_post_apply: revert_via_stash_pop

    - id: phase_F_founder_review
      name: "Phase F — Founder review"
      actions:
        - ask_keep_revert_show_diff_reject
      hitl: B
      failure_handling:
        founder_revert: git_checkout_head_skill_md
        founder_reject: revert_plus_insert_ops_corrections

    - id: phase_G_cleanup
      name: "Phase G — Cleanup + persist"
      actions:
        - release_entity_edit_lock
        - update_agent_run_completed
        - write_run_summaries             # Strategy E: ~150 tokens
        - emit_skillopt_run_completed_event
        - write_final_runner_state
      hitl: A

  state_files:
    runner_state:                          # owned by skillopt-runner; cross-phase resume
      path: "runtime/skillopt/<entity>/runs/<rid>/runner-state.json"
      schema_version: "1.0"
      written_at: ["phase_boundary", "phase_C_per_batch"]
    bridge_state:                          # owned by session-bridge.cjs; per-batch IPC
      path: "runtime/skillopt/<entity>/runs/<rid>/state.json"
      schema_doc: "scripts/skillopt/queue-protocol.md"

  events_emitted:
    - type: ritsu.evolve.skillopt-run-completed
      when: phase_G complete
      payload:
        capability_id: evolve
        run_id: <uuid>
        exit_reason: <str>           # all_phases_done | founder_abort | rate_limit_pause | budget_exceeded | judge_regressed | subprocess_crash
        scores: { baseline, post_iter, held_out_delta }
        totals: { messages_dispatched, messages_completed, judge_calls, iterations_completed }
    - type: ritsu.evolve.skillopt-rate-limit-paused
      when: phase_C R12 binds
      payload:
        run_id: <uuid>
        messages_completed_before_pause: <int>
        resume_after: <iso>

  drift_gates:
    - phase: phase_A_preflight
      command: pnpm check
      abort_on_fail: true
    - phase: phase_E_install
      command: pnpm check
      revert_on_fail: true

# ----------------------------------------------------------------------
# Failure mode summary (22 classes per spec.md §10)
# ----------------------------------------------------------------------
failure_modes_documented_at: wiki/capabilities/evolve/spec.md#10-error--rescue
