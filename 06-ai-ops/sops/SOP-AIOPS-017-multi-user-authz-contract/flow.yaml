# SOP-AIOPS-017 — Multi-user identity, authorization & enrollment contract
#
# Declarative runtime contract for capability multi-user-auth. Read by /users +
# the operator-management skill + (Sprint 1+) the install enrollment step + the
# server-side broker. RUNTIME-CONTRACT SOP (like SOP-AIOPS-014/015/016).
#
# STATUS: advisory-v0 (Sprint 0). The contract + registry + surface ship now;
# server-side enforcement (per-human Supabase Auth + per-tier RLS + the broker)
# lands Sprint 1+. The TWO boundaries that hold today: GitHub branch protection
# + the Product-DB firewall. Spec: .archives/cla/multi-user-auth/01-spec.md.

sop_id: SOP-AIOPS-017
slug: multi-user-authz-contract
name: "Multi-user identity, authorization & enrollment contract"
version: "0.1.0"
state: architecting       # Sprint 0 foundation; flips to operating when Sprint 1 enforcement lands
owner: 06-ai-ops
owner_role: founder        # owner-tier only governs this capability
hitl_default: C            # changing the security model is Tier C (owner PR review)
capability_id: multi-user-auth

# ----------------------------------------------------------------------
# The load-bearing principle
# ----------------------------------------------------------------------
principle: >
  Privileged power must NOT live on the user's laptop. It lives server-side behind
  authentication of a per-human credential the user cannot forge. The local client
  (Claude Code, MCP code, hooks, the role env var) is UNTRUSTED. A human's blast
  radius = exactly their tier's server-granted capabilities. Editing local files or
  self-asserting a role grants NOTHING server-side.

# ----------------------------------------------------------------------
# The tier model (owner ⊇ admin ⊇ user) — source: knowledge/operator-tiers.yaml
# ----------------------------------------------------------------------
tiers:
  user:  "content-production commands (/write /think /voice /image /dataviz /translate) + publish-to-stores (HITL). No data writes, no system commands, no Tier-1."
  admin: "user + data systems (ops DB + gbrain read/write, analytics read) + knowledge (/wiki /deepask /brain)."
  owner: "admin + system/self-modifying commands (/cla /evolve /update /forge) + Tier-1 + GitHub merge + money + user management. Root of trust."

# ----------------------------------------------------------------------
# Enforcement planes (where each tier is actually bounded)
# ----------------------------------------------------------------------
enforcement:
  identity:       "Sprint 1: per-human Supabase Auth (email magic-link → mailbox proof) → JWT with server-only app_metadata.tier. System/Tier-1 tier via GitHub identity."
  ops_db:         "Sprint 1: per-human JWT + per-tier RLS (drop service_role for humans). Today: service_role (advisory tier gate in the MCP)."
  gbrain_analytics:"Sprint 2: per-human identity (same JWT model)."
  money_publish_system:"Sprint 2: hosted Edge-Function broker, decision keyed on the AUTHENTICATED identity (never a client-sent tier)."
  git_tier1:      "GitHub per-human identity + CODEOWNERS + branch protection (owner review on Tier-1). REAL today once branch protection configured."
  product_db:     "the pre-tool-supabase-product firewall + no Product credential in any operator .env.local. REAL today."

# ----------------------------------------------------------------------
# Registry split
# ----------------------------------------------------------------------
registry:
  tier1: "governance/operators.yaml — human→tier→status MAP, owner-PR (CODEOWNERS), NO secrets."
  tier2: "ops.operators (Sprint 1 migration) — credential/invite HASHES + enrollment runtime state, written ONLY by owner-broker SECURITY DEFINER fns, never client SQL."
  validator: "scripts/cross-tier/validate-operators.cjs (L2 critical) — ≥1 active owner · unique emails · added_by-is-owner · no secrets."
  resolver: "scripts/local-install/lib/operator-tier.cjs — can(email, cap, registry, tiers); fail-closed."

# ----------------------------------------------------------------------
# Enrollment lifecycle: invited → active → revoked|expired
# ----------------------------------------------------------------------
enrollment_steps:
  - id: invite
    name: "owner /users add <email> --tier"
    actions: [owner_check, append_registry_pr, validate, broker_create_auth_user_and_email_invite_S1]
    hitl: C
    note: "refuse --tier=owner without joint-owner approval"
  - id: enroll
    name: "/install Step 2.5 (Sprint 1) — operator redeems the magic-link"
    actions: [redeem_magic_link_proves_mailbox, broker_issues_per_human_credential, write_refresh_token_to_env_local, status_active]
    hitl: A
    note: "BLOCKS install until authenticated (Sprint 1)"
  - id: revoke
    name: "owner /users revoke <email>"
    actions: [status_revoked_pr, broker_global_signout_ban_S1, ensure_ge1_active_owner]
    hitl: C
    note: "admin/user = single revoke, zero rotation; owner = + rotate shared keys + joint approval"

credential_hygiene:
  - short_ttl_jwt_~1h
  - rotating_refresh_token   # reuse of a rotated token = theft signal → auto-revoke
  - invite_single_use_email_bound_le_24h
  - owner_key_in_hardware_webauthn_S3
  - joint_authority_ge2_owners_for_owner_tier_actions

guards:
  - never_client_asserted_authority   # tier derives ONLY from the server-verified credential, never MCP_CALLER_ROLE or a client claim
  - fail_closed                       # resolver + validator deny/fail on any uncertainty
  - no_secrets_in_tier1_registry      # operators.yaml carries identity only
  - product_firewall_is_a_credential_property  # no human credential can reach Product, ever
  - codeowners_owner_review_on_tier1

observability:
  v0: "governance/operators.yaml (the map) + the validator. Sprint 1: ops.operators runtime + per-human audit attribution stamped server-side on every action; audit log made UPDATE/DELETE-proof + hash-chained."

# ----------------------------------------------------------------------
# Sprint 1 status + the per-human CUTOVER (founder-gated)
# ----------------------------------------------------------------------
sprint1_done:
  - "GitHub branch protection on main (require PR + CI checks + no force-push/deletions). Required-review/code-owner deferred until a 2nd owner is enrolled (1 owner self-approval-deadlocks)."
  - "Supabase Auth owner identity provisioned on ritsu-ops (app_metadata.tier=owner, magic-link only)."
  - "Migration 00049 APPLIED to live ritsu-ops: jwt-tier helpers + ops.operators + broker SECURITY DEFINER fns + audit-immutability + tier RLS (ops + metrics + public CRM) + the SECURITY INVOKER read RPC. ADDITIVE + INERT — service_role bypasses it, so the running system is unchanged."
  - "MCP per-human path shipped flag-gated (RITSU_AUTH_MODE, default service-key = no behavior change)."
  - "Phase A VALIDATED live (14/14): real owner/admin/user JWTs proved owner reads owner-only, admin+user blocked, admin append-only forensic, user denied all ops, write-denies fire. Throwaway test identities cleaned up."

sprint2_done:
  - "Refresh-token lifecycle in the MCP (RITSU_OPERATOR_REFRESH_TOKEN[_FILE]): the MCP exchanges the refresh token for a fresh ~1h access token at boot + auto-refreshes + PERSISTS each rotated token to the credential file → NO hourly re-paste, survives restarts. VALIDATED live (5/5)."
  - "Phase C EXECUTED — RITSU_AUTH_MODE=per-human is LIVE (the owner's daily MCP authenticates as the owner; confirmed by resolver caller_role='owner')."
  - "operator-broker Edge Function DEPLOYED to ritsu-ops (supabase/functions/operator-broker + _shared/operator-broker-core.ts; verify_jwt=true). The SERVER-SIDE privilege holder: verifies the caller's JWT (getUser, signature-checked), gates owner-only actions on the VERIFIED app_metadata.tier, performs privileged ops with the auto-injected service_role (off-laptop). Actions: whoami / invite (owner) / redeem (self-service) / revoke (owner) / list (owner). Immutable ops.audit_log row per invite/revoke/redeem. Hardened by a 3-agent red-team (4 high fixed: owner-immutable on re-tier, exact .eq email match, app_metadata merge, revoke TTL disclosure). VALIDATED LIVE: 12/12 broker + 4/4 enrollment-lifecycle; 31 core unit tests."
  - "gbrain + analytics MCP brought under the per-human tier (the two remaining Sprint 2 integrations). RACE-FREE design: supabase-ops is the SOLE token refresher and now also persists the short-lived ACCESS token to the shared 0600 credential file; the analytics MCP and the gbrain hook READ it (never refresh → no rotation race) and decode app_metadata.tier (exp ENFORCED — the local decode is the only gate, so a stale token can't keep granting). (a) Analytics MCP (PR #308): RITSU_AUTH_MODE=per-human gates query/list_tables by tier (owner+admin allowed, user/null/expired denied tier_not_allowed); service-key mode byte-identical; the least-priv analytics_reader DB role stays the real boundary. (b) gbrain (PR — ITEM B): a PreToolUse hook pre-tool-gbrain-tier blocks every mcp__gbrain__* call for user-tier (admin/owner allowed) — gbrain is an external bun binary that can't be RLS-gated, so this is local least-privilege defense-in-depth (the $100/mo cap + credential-less brain are the real bounds; a malicious laptop owner could disable the hook). Each adversarial red-teamed (analytics: 4-agent, 0 crit/high; gbrain: 4-agent) + validated LIVE with real minted owner/admin/user JWTs (analytics 19/19, gbrain 8/8)."

enrollment_lifecycle_live:   # the full multi-user onboarding loop now works
  - "owner: POST operator-broker {action:invite, email, tier:admin|user} → Auth user created (tier server-set) + ops.operators(invited) + audit + magic-link returned."
  - "owner forwards the magic-link (no email sender) → invitee clicks → Supabase Auth session (mailbox proven)."
  - "invitee: /install-ritsu-works writes their refresh token to THEIR .env.local credential file; POST operator-broker {action:redeem} → ops.operators invited→active."
  - "offboard: owner POST {action:revoke, email} → ban + status=revoked + audit (≥1 active owner guaranteed)."

sprint2_remaining:   # follow-on increments (separate integration efforts)
  - "DONE 2026-06-26 (PR #308 + ITEM B PR): gbrain + analytics MCP under the per-human tier (see sprint2_done). The ops-DB + enrollment core remains the load-bearing Sprint 2."
  - "The broader money/publish action-broker surface (Stripe/social) — belongs with those integrations; the operator-lifecycle broker is the Sprint-2 deliverable."
  - "DB-side INSTANT revocation — BUILT in Sprint 3 (migration 00050, see sprint3). NB the gbrain/analytics tier gates already ENFORCE exp, so a stale token is rejected at the access-token lifetime even before instant revocation is applied."

sprint3:   # hardening — BUILT this session; the DB apply + the founder-physical items are founder-gated
  built_ready_to_apply:
    - "migration 00050_instant_revocation.sql — DB-side INSTANT revocation. ANDs ops.operator_not_revoked() (a SECURITY DEFINER, caller-scoped, search_path-pinned-no-public helper reading ops.operators.status) into ops.is_owner()/is_admin_or_above(), so a revoked operator is denied at the DB IMMEDIATELY (within one statement) even with a still-valid ~1h access token — closing the stale-token window. ALL 70 per-human RLS policies + the broker fns funnel through those two helpers, so the single change propagates everywhere. ADDITIVE + INERT under the live service_role path (BYPASSRLS, no JWT → the helpers were already falsy); enforces only in per-human mode. Genesis owners NOT in ops.operators are NOT locked out (NULL status → not_revoked()=true → JWT-tier-gated). Security-reviewed (security-auditor: LOW risk, sound for apply, no fail-open, no owner-lockout; FORCE-RLS recursion tripwire + mcp_calls audit-insert fail-open documented in the migration). 11 structural tests."
  founder_applies:
    - "✅ APPLIED + verified 2026-06-30. migration 00050 applied to live ritsu-ops via `node scripts/multi-user-auth/apply-migration.cjs 00050 --apply` (Management API, ref-guarded; the classifier allowed it once the founder gave SPECIFIC per-migration intent — a vague grant was correctly denied). STRUCTURALLY VERIFIED: ops.operator_status_self + ops.operator_not_revoked exist AND both ops.is_owner + ops.is_admin_or_above are guarded by operator_not_revoked() → DB-side instant revocation is live (a revoked operator is denied within one statement, even with a still-valid ~1h token). Additive + inert under service_role. Optional end-to-end behavioral proof (throwaway identities): from your MAIN checkout `set -a; . runtime/secrets/.env.local; set +a; node scripts/multi-user-auth/validate-instant-revocation.cjs`."
    - "VALIDATE post-apply: `set -a; . runtime/secrets/.env.local; set +a; node scripts/multi-user-auth/validate-instant-revocation.cjs` — proves owner-not-locked-out + an enrolled active admin allowed + the SAME token DENIED after a status='revoked' flip (instant revocation). Creates + deletes throwaway *@example.com identities."
  founder_physical_remaining:   # genuinely need the founder; NOT buildable headless
    - "Owner hardware key (WebAuthn/passkey) — requires the founder to register a hardware authenticator (Touch ID / security key) via a browser ceremony. Cannot be done headless."
    - "Joint authority (≥2 owners approve owner-tier actions) — extends the operator-broker; testing needs 2 owner actions. Both owners are enrolled (operators.yaml v1.1.0), but the broker enforcement + the dual-approval flow are a founder-present build."
    - "Hash-chained / WORM audit log (tamper-evidence on ops.audit_log) — a further additive migration; deferred to keep this session's DB-write surface minimal."

cutover_preconditions:   # do ALL before flipping RITSU_AUTH_MODE=per-human in production
  - "Enroll a 2nd owner at a DIFFERENT mailbox (recovery) — with a single owner there is NO recovery if the owner credential/mailbox is lost (the broker refuses to mint owners). The owner's own email does NOT count (same mailbox = no recovery)."
  - "Mint the owner's REFRESH token (magic-link enrollment) and confirm it decodes to app_metadata.tier='owner' (a token minted before the tier was set lacks it → MissingTierError → fail-closed boot). [red-team #L1 — now mitigated by the refresh path: the boot exchange surfaces a bad token immediately]."
  - "Phase A already proved enforcement live; re-run against your real refresh token if desired."
  - "Then: set RITSU_AUTH_MODE=per-human + RITSU_OPERATOR_REFRESH_TOKEN (NOT service_role) in the operator's .env.local + restart (⌘Q). Verify owner works + an admin/user token is correctly constrained. Then strip service_role/Stripe/bot keys from .env.example (now safe for non-owner installs). Rollback = RITSU_AUTH_MODE=service-key + ⌘Q."
  - "Ensure deps are installed (`pnpm install` — local-install already does this): the per-human gbrain tier-gate hook (pre-tool-gbrain-tier) requires js-yaml. If node_modules is unsynced the hook FAILS CLOSED on per-human gbrain calls (blocks owner+admin too, with a 'run pnpm install' hint) — safe-direction, but install first."
  - "✅ APPLIED 2026-06-30 to live ritsu-ops (Management API, ref-guarded). migration 00051_revoke_matview_pii_grants.sql (audit 2026-06-30 finding D1-1). Live-verified via has_table_privilege: authenticated/anon SELECT on public.mv_customer_360 went true/true → false/false; service_role + postgres unaffected (MCP + REFRESH intact). Fixes: a per-human `admin` could read owner-only customer PII via `SELECT … FROM public.mv_customer_360` through the SECURITY INVOKER read RPC (matviews can't carry RLS; 00049 §5.5 only RLS-locks the 4 base tables). validate-secdef-rpc-exposure now fails CI if any public matview stays authenticated/anon-readable."
  - "Be aware of the LOCAL-gate downgrade lag (~1h): the analytics + gbrain tier gates decode the tier from a still-valid access token, so an admin→user demotion is not instant for THOSE two surfaces (migration 00050 instant-revocation covers ONLY the ops.* DB path, NOT the local gates). Instant demotion for analytics/gbrain needs upstream token revocation or a shorter access-token TTL. Documented in knowledge/analytics-sync-contract.yaml (per_human_tier_gate.downgrade_lag)."

residual_risks:   # documented, accepted for Sprint 1; hardened in Sprints 2-3
  - "admin reads of owner_only ops tables return SILENT-EMPTY (RLS), not an error — admin never sees the data, but an empty result is indistinguishable from a truly empty table. [red-team #7]"
  - "owner-mint is enforced PROCEDURALLY (broker fns block tier=owner; the table CHECK allows it for the genesis/joint-authority service_role path). A future broker fn that forgets the guard could set owner — defense-in-depth trigger deferred. [red-team #8]"
  - "decodeJwtClaims does NOT verify the JWT signature (the DB does, via RLS — a forged token is denied server-side). The decoded tier must NEVER be the sole gate for any action; for actions whose only gate is the client-side HITL check, a forged local token could bypass the client gate (but any DB effect still fails). Audit attribution from the unsigned claim could be poisoned on a forged token whose action nonetheless fails — Sprint 2 broker verifies identity server-side. [red-team #L3]"
  - "operator_redeem trusts the caller verified the invite secret + mailbox proof. It is service_role-EXECUTE-only (a raw authenticated human cannot call it), so the broker is the gate; in-fn invite_hash verification deferred to Sprint 2. [red-team #L4]"
  - "A new sensitive ops table must be added to the migration's owner_only-by-omission (it defaults to owner-only — fail-safe — but to grant admin it must be added to admin_data_rw/admin_append explicitly). A CI validator asserting every ops table is classified is deferred to Sprint 3. [red-team #9]"

