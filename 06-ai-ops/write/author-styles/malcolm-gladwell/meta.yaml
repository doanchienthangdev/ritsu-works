  such — never claimed to be Gladwell's own words.
notes: |
  Gladwell is a NARRATIVE social-science translator: his unit of work is the puzzle, not the
  thesis. The voice lives in the architecture more than the sentence: the in-medias-res
  anecdotal lede (a named person, a place, a date, one vivid detail); the pivot from story to
  a counterintuitive question; the named-researcher experiment narrated as a mini-story; the
  CATEGORY DISTINCTION (choking is not panicking; strong ties are not weak ties) deployed as
  the analytic engine; the number made narrative (a cost, a percentile, a power-law skew);
  the generous-to-everyone tone (even his villains are reasonable people inside a bad system);
  and the CALLBACK ENDING that returns to the opening character with the thesis now visible —
  often as a quiet inversion ("maybe it was the box that needed fixing"). His sentences are
  longer and more classical than Godin/Clear — comma-spliced narration with embedded
  quotation, the patient accumulation of concrete detail — but always plain words; the
  intellectual showmanship is structural, never lexical. Strongest sources: the 4 usable
  New Yorker features for the written mechanics; the No Small Endeavor + Q&A transcripts for
  his self-described method (start with the story, be interesting before being right, give
  ideas away as conversation-starters). A future re-distillation should stage The Physical
  Genius + The Coolhunt (skipped on budget) and consider the David and Goliath intro chapter.
  CAUTION baked into do-and-dont: his authority is REAL named people + REAL named studies —
  inventing a person, study, or number to sound like him is the one unforgivable move.
