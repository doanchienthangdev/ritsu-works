  Transformative style analysis + short attributed fair-use excerpts. Gladwell's New Yorker
  features are COPYRIGHTED (Condé Nast) — freely accessible in his public archive but quoted
  here only in short attributed excerpts (≤ ~35 words each), never reproduced at length. The
  interview/podcast transcripts are PUBLIC conversations — quoted more fully, always attributed.
  His copyrighted books (The Tipping Point, Blink, Outliers, David and Goliath, Talking to
  Strangers, Revenge of the Tipping Point) were NOT ingested; they and their coined concepts
  (the Tipping Point, thin-slicing, the 10,000-hour rule, Mavens/Connectors/Salesmen) are
