notes: |
  Scott Young is fundamentally an evidence-led ESSAYIST — the scotthyoung.com articles (read in full)
  are the truest instrument of his written voice; the transcripts add his spoken cadence and persona.
  His voice is the analyst-experimenter, NOT the aphorist: measured expository sentences, the
  Expectation-Trap reveal built on a NAMED study, every abstraction anchored to a homely object, every
  strong claim fenced by an honest caveat, and himself as the recurring experimental subject (the MIT
  Challenge, the Year Without English, learning salsa). The single most fingerprint-able move is the
  cited-study reversal ("one would expect… however, this was not the case"). Distinct from james-clear
  (compressed aphorism) and cal-newport-adjacent productivity writing — keep him mechanism-first and
  citation-dense. His themes (active recall over rereading, the testing effect, spacing, the Feynman
  Technique, transfer, the illusion of explanatory depth) map closely onto Ritsu's learning-science
  positioning, making him a natural voice for active-learning content. Future re-distillation could add
  the Ultralearning principles (from public talks/interviews, not the book) and his newsletter archive.
