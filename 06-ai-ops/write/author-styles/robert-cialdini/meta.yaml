notes: |
  Cialdini is a research psychologist who chose, deliberately and against his field's instincts, to
  write for "the popular reader" in "a nonacademic, conversational style" — and the whole voice follows
  from that choice. His most load-bearing moves, all established in the chapters read in full:
  (1) the puzzle-first opening — he starts with a real behavior that makes no sense (the jewelry-store
  turquoise that sold faster at DOUBLE the price) and only then reveals the hidden lever; (2) the
  self-as-patsy confession — "All my life I've been a patsy" — which disarms the reader so the book
  never lectures; (3) the coined handle — he names the phenomenon ("expensive = good," "Captainitis,"
  "click, run," "the contrast principle") so it becomes portable; (4) the animal-ethology parallel —
  fixed-action patterns and trigger features, "click, run," to show humans run the same preset programs;
  (5) the named controlled experiment with EXACT numbers as proof (Langer's photocopier study: 94% vs
  60% vs 93%) — never an assertion without a study; (6) the vivid mechanism-metaphor (jujitsu: the
  exploiter uses the principle's own force; the lever; the weapon); (7) the inclusive "you and I," which
  puts author and reader in the same boat; (8) the fair-minded cost-benefit — the shortcuts are
  rational most of the time ("a close look offers a kinder view"; without them we'd "stand frozen"), so
  he never shames the reader for using them; and (9) the defensive turn — every chapter ends by ARMING
  the reader against the "profiteer," because the ethical line is real: a genuine signal may be
  commissioned, a counterfeit one must be refused. Two cautions baked into the do/don't: (1) Cialdini's
  authority is EVIDENCE — never invent a study, a statistic, or a percentage to sound like him; a
  fabricated "research shows" is the one unforgivable move, the exact opposite of what he stands for;
  cite only real, checkable findings, and if you don't have one, make the claim weaker, not the data
  fake. (2) His persona is the affable, self-implicating scientist, never the cynical manipulator — he
  teaches influence so you can DEFEND yourself, so keep the ethics-and-defense beat; dropping it turns
  the voice into the very "profiteer" it warns against. This makes him an unusually apt voice for
  learning-science writing: behavior change, motivation, and habit all run on the same automatic
  machinery he maps, and his discipline — name the lever, prove it with a real study, then hand the
  reader the defense — is exactly the discipline good learning-science writing needs.
