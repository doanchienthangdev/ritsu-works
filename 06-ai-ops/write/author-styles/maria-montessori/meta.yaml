confidence: high   # Distilled from HER OWN authored prose across four books spanning her whole career (1912-1949) — the foundational scientific-pedagogy register (The Montessori Method, 1912), the lyrical-polemical register (The Secret of Childhood, 1936), the cosmic-education register (To Educate the Human Potential, 1948), and the mature synthesizing register (The Absorbent Mind, 1949). The voice mechanics — scene-as-proof, reframe-by-fact, redefinition-by-reversal, the embryo parable, the homely picture, the cosmic ascent, the indictment, the bench-of-the-soul condemnation of rewards — converge nearly identically across all four, which is what makes the artifact high-confidence. Caveat: her English is a translator's (George/Claremont/Carter), so the period DICTION belongs to the translators while the rhetorical ARCHITECTURE is unmistakably hers; and the sources are OCR'd scans, so quotes are verified against the OCR-normalized text rather than a pristine edition.
