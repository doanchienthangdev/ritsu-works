copyright: |
  Transformative style analysis + short attributed fair-use excerpts. Maria Montessori died in 1952,
  so her ORIGINAL ITALIAN works are public domain in life+70 jurisdictions (since 1 Jan 2023). The
  fuller quotes in this artifact are taken from THE MONTESSORI METHOD in the 1912 Anne E. George
  American translation, which is PUBLIC DOMAIN in the United States (published pre-1929) — quoted
  freely, always attributed. Quotes from the still-in-copyright English TRANSLATIONS of her later
  works (The Absorbent Mind, tr. Claremont 1949; The Secret of Childhood, tr. Carter 1936; To Educate
  the Human Potential, 1948) are kept short (<= ~25 words each) and always attributed, on the same
  posture as the other distilled authors. Her works were read in full from OCR'd Internet-Archive
  scans staged locally (never committed); every load-bearing quote was verified against the
  OCR-normalized text by grep, with obvious scanning artifacts (dropped fl-ligatures, an "I" misread
  as "IJ", mid-sentence line breaks) silently corrected to the faithful reading. Output written in
  this style is a derivative STYLE, presented as such — never claimed to be Montessori's own words.
notes: |
  Montessori's voice is unusually METHOD-shaped and METHOD-CONSISTENT: the same mechanics (scene-as-
  proof then the law, reframe-by-fact, redefinition-by-reversal, the embryo parable, the homely
  picture, the cosmic ascent, the indictment of the adult, the bench-of-the-soul condemnation of
  rewards) recur nearly identically across four books and four decades, which is what carries the
  high-confidence rating. Three cautions for writers:
  (1) Her authority is that the CASE is real and the CHILD was watched. A writer using this style on a
      new topic must bring a real observed learner and a real number; the style collapses into pious
      mush with invented children or counted "facts" that were never counted. Keep the mechanics;
      never counterfeit the scene.
  (2) Reverence is the STANCE, not a coat of paint. The voice is tender toward the learner's dignity
      and severe toward the system that wrongs it — but it never coos, never moralises the small
      child, and never ends cynical. The closes are the easiest place to break the illusion: she
      ascends to hope; she does not exhort ("we must") and she does not despair.
  (3) She is semicolon/colon/parenthesis-punctuated and fond of the em-dash for the spoken aside; the
      /write humanizer strips em-dashes, which costs this voice nothing — render the aside with a
      comma, a colon, a parenthesis, or a period plus a short sentence, all of which she already uses.
  A natural, almost native fit for learning-science and Ritsu writing: active-learning-over-passive,
  intrinsic-motivation-over-rewards, observation-over-instruction, the prepared environment, embodied
  cognition, sensitive periods, and concentration as sacred all come straight from her own pages and
  map directly onto retrieval practice, autonomy-supportive design, and an AI tutor that hands the
  learner the work rather than doing it for them. What to add next, if the posture is revisited:
  a forensic pass over The Discovery of the Child and her 1946 London Lectures for additional verbatim
  classroom scenes.
