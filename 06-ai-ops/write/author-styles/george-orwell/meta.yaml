copyright: |
  Transformative style analysis + short attributed fair-use excerpts. The six essays are sourced from
  the Orwell Foundation's freely accessible texts (reproduced there with the kind permission of the
  Orwell Estate); George Orwell died in January 1950, so his works are public domain in the UK, EU,
  and most life+70 jurisdictions since 1 January 2021, while remaining in US copyright term (95 years
  from publication). Excerpts are kept short (typically well under 45 words), always attributed by
  essay + year, and used to teach the mechanics of the voice — never to reproduce a work. The books
  (Animal Farm, Nineteen Eighty-Four, Wigan Pier, etc.) were NOT ingested; only their universally-
  attested one-liners are quoted, short and attributed. Documentary transcripts about Orwell were
  mined for biography and reported analysis, never presented as his prose. Output written in this
  style is a derivative STYLE, presented as such — never claimed to be Orwell's own words.
notes: |
  Orwell is the straightest possible fit for the /write humanize gate: his own six rules (cut every
  cuttable word, active voice, no stale figures, everyday English) ARE a de-AI checklist from 1946.
  The truest sources of the voice are the two craft essays where he states his method explicitly —
  "Why I Write" (the lie-to-expose motive, the four motives, the windowpane) and "Politics and the
  English Language" (the six rules, the six questions, let-the-meaning-choose-the-word, the euphemism
  demolition) — and the practice matches the preaching across the other four essays. His most
  load-bearing distinctive moves: the BLUNT VERDICT SENTENCE after accumulation ("Nationalism is
  power hunger tempered by self-deception"), the LIST OF PARTICULARS demolishing an abstraction
  (pacification), the SELF-INCRIMINATING CONFESSION ("solely to avoid looking a fool"), and the
  HOMELY SIMILE (cuttlefish, soft snow, Meccano set). Calibration asymmetry is the subtle tell:
  hedge facts, never morals. Two cautions baked into do-and-dont: (1) his authority is testimony —
  the witnessed scene and the exact figure must be REAL; inventing one is the unforgivable move
  (parallel to the feynman/cialdini/paul-graham don't-fake-the-evidence rule). (2) He uses spaced
  dashes for interpolation; the /write humanizer strips em-dashes, so render his asides with
  parentheses, colons, or paired commas. For Ritsu content: his frame maps perfectly onto
  learning-science writing — the comfortable lie (rereading feels like studying), the euphemism
  audit (edtech marketing cant: 'engagement', 'gamified', 'personalized'), the exact figure
  (retention percentages, hours wasted), and the verdict sentence. Period-language caution: some
  passages in the 1936-45 essays carry colonial-era racial vocabulary; the artifact samples were
  chosen to avoid it, and nothing in the style requires it.
