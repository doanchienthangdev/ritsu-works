copyright: |
  Transformative style analysis + short attributed fair-use excerpts. The fuller quotes come from
  Nir Eyal's OWN freely-published essays on nirandfar.com (his personal blog) and from his PUBLIC
  talks and interviews (two Talks at Google lectures; publicly posted podcast/YouTube interviews),
  quoted with the auto-transcript's verbatim casing. His BOOKS were NOT ingested (the PDFs in the raw
  folder were deliberately skipped): Hooked / Indistractable / Beyond Belief are referenced by name or
  idea only, with zero quoted words. Material on his blog that is NOT his own writing — a Shane Parrish
  book excerpt and three guest posts (Noah Kagan, Sahil Bloom, Will Storr) — was excluded from
  distillation entirely so the captured voice is Nir Eyal's and no one else's. Every excerpt in the
  artifact was machine-verified verbatim (grep) against the staged sources. Output written in this style
  is a derivative STYLE, presented as such — never claimed to be Nir Eyal's own words.
notes: |
  Nir Eyal's voice is unusually FRAMEWORK-shaped: the article exists to route the reader to a named
  proprietary concept (traction, internal/external triggers, timeboxing, pacts, the four steps) and one
  do-it-today tool. The mechanics recur nearly identically across his blog essays, prepared lectures,
  and unscripted interviews, which is what makes the artifact high-confidence even though the books were
  not ingested. Four cautions for writers using this style:
  (1) His authority is that the studies and numbers are REAL and the researchers are NAMED. A writer
      using this voice on a new topic must bring real examples, real (cited) studies, and a real number,
      and should route the fix back to an actual framework — never counterfeit a stat or invent a study;
      the voice collapses into self-help parody the moment a number is faked.
  (2) He uses em-dashes liberally for his signature define-in-place gloss. The /write humanizer strips
      em-dashes, which costs this voice almost nothing — render the gloss with parentheses, a colon, or
      a comma instead. The gloss is the move; the dash is incidental.
  (3) The contrarian edge is load-bearing but must stay constructive: deflate the moral panic, then hand
      over agency and a tool. Done without the tool, it reads as mere reactance; done without the
      empathy (the inclusive 'we', the self-indictment), it reads as scolding. Keep both.
  (4) The closes are the easiest place to break the illusion. He never ends on a concept or a sermon —
      he ends on a callback image turned into a command, a portable slogan, or a do-it-tonight action.
  Strongest sources: the two Talks at Google (the cleanest prepared-voice mechanics), 'The Pain Paradox'
  and 'Control Your Calendar' (his written essay architecture), and the ADHD interview (the sharpest
  contrarian register). A natural fit for learning-science and Ritsu writing: active-effort-over-passive,
  test-the-received-wisdom, do-the-work-not-the-magic, identity-based change, and 'time management is
  pain management' map directly onto active-recall and habit-of-study arguments. What to add next: if the
  posture allows, chapter-level analysis of the Hooked Hook Model and the Indistractable four-step model
  in their written forms.
