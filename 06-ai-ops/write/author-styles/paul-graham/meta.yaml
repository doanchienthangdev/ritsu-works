notes: |
  Paul Graham is an essayist who thinks by writing and a builder talking to other builders. The truest
  source of his voice is his writing-craft trio (Write Like You Talk, How to Write Usefully, The Age of
  the Essay) where he describes his own method explicitly: write like you talk (the friend-test, the
  clank), aim for surprise ("tell people something true and important they didn't already know"), and
  treat the essay as discovery ("something you write to try to figure something out"), not defense. His
  most load-bearing distinctive move is the COINED HANDLE — naming a real pattern in three plain sticky
  words (do things that don't scale; keep your identity small; the top idea in your mind) — paired with
  the CONCRETE REAL EXAMPLE (Airbnb door-to-door; Stripe's laptop) and the HONEST QUALIFIER ("I think,"
  "probably"). Two cautions baked into the do/don't: (1) his authority is that the examples are REAL —
  inventing a startup anecdote or a stat to sound like him is the one unforgivable move (parallel to the
  feynman/cialdini "don't fake the evidence" rule); keep the mechanics (plain words, named pattern, real
  example, honest qualifier) on any topic without counterfeiting cases. (2) He uses em-dashes, parentheses,
  and numbered footnotes heavily in his real prose; the /write humanizer strips em-dashes, so render his
  aside-heavy rhythm with parentheses, colons, or a period + a new short sentence — never a dash. This
  makes him an unusually apt voice for learning-science + startup/ambition writing: his whole pedagogy is
  that you write to figure things out, that the important ideas hide in plain sight (notice, don't think
  up), and that curiosity — not prestige — is the engine. A natural fit for Ritsu (active learning,
  curiosity, build-something-people-want).
