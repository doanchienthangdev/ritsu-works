copyright: |
  Transformative style analysis + short attributed fair-use excerpts. Book quotes (chiefly
  *The Sense of Style*, 2014) are kept ≤25 words and always attributed; his freely-accessible
  op-eds and letters (NYT, WSJ, Quillette, New Republic) are his own authored work, quoted in
  short attributed excerpts for voice calibration; his public talks and interviews (TED, the
  Royal Institution, the David Perell interview) are quoted more fully, always attributed. No
  passage is reproduced at length. Output written in this style is a derivative STYLE,
  presented as such — never claimed to be Pinker's own words.
