notes: |
  Taleb's voice is unusually METHOD-shaped: the mechanics (the Triad/two-types split, the semicolon
  flip, the coined-Capital-as-weapon, long-build-axiom-landing, detect-fragility-not-forecast, the
  concrete-object generalization, contempt-inside-rigor, via negativa, skin-in-the-game-as-proof,
  steelman-then-amputate) recur nearly identically across his written prologues, his aphorisms, and
  his unscripted interviews, which is what makes the artifact high-confidence. Three cautions for
  writers:
  (1) His authority is that the cases and the risk are REAL and his own. A writer using this style
  must bring real mechanisms and real (or honestly-framed) examples; invented statistics or a faked
  anecdote collapse the voice into parody. Keep the mechanics; never counterfeit the proof.
  (2) He is SEMICOLON- and colon-punctuated; in print he also leans on em-dashes, which the /write
  humanizer strips, costing this voice nothing. Render the chiastic flip on a semicolon and the
  verdict on a colon. No em-dashes in /write output.
  (3) The combat is load-bearing but DIRECTED. In his own work it names real people and professions
  and asterisks profanity. For RITSU output, aim the contempt at methods and ideas (rereading, the
  fluency illusion, passive study, "study hacks"), never at named individuals, and drop the
  profanity, per 00-core/brand_voice.md and 06-ai-ops/write/author-styles/nassim-taleb/do-and-dont.md.
  The combat survives; the target changes.
  Auto-transcript mishearings reproduced verbatim where quoted ("fil filter" for filter; "Fat tales"
  for fat tails); in GENERATED prose, spell coinages correctly (antifragile, Sharpe ratio).
  Strongest sources: Antifragile prologue + The Bed of Procrustes (the written + aphoristic spine),
  the James Altucher interview (the spoken texture + the coffee-cup generalization), Skin in the
  Game prologue (the moral spine + named-villain indictment + via negativa).
  A natural fit for learning-science and Ritsu writing: antifragility maps onto desirable
  difficulties and the testing effect (the struggle to retrieve IS the learning); the turkey / fat
  tails map onto the fluency illusion and the exam as a one-day fat-tailed event; skin in the game
  maps onto self-testing (cheap exposure to being wrong now) vs passive rereading (no exposure);
  via negativa maps onto subtractive mastery (find and remove the illusion of knowing).
  What to add next: if posture allows, the antifragility-by-layers / barbell / "touristification"
  chapters of Antifragile and the minority-rule chapter of Skin in the Game, for the body-of-book
  register beyond the prologues; and the IYI ("Intellectual Yet Idiot") essay if a public version is
  staged (the coinage is referenced by name in the spoken sources but was not quoted).
