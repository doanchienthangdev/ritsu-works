  written in this style is a derivative STYLE, presented as such — never claimed to be Urban's own words.
notes: |
  Tim Urban is an explainer-who-goes-deep: the truest source of his voice is the freely-published
  Wait But Why corpus + his public TED talk (read in full), which is where his famous characters live
  verbatim (the Monkey, the Panic Monster, the Yearning Octopus) and where the cosmic-explainer mode
  (the 1750 time-machine thought experiment, the Die Progress Unit, exponential-not-linear) lives.
  Strongest signature: personify the invisible force as a named drawn character → push one thought
  experiment to absurdity → zoom out to the cosmic/mortality scale → close on a wink — all narrated by
  a self-deprecating specimen who did the real research and credits it. His procrastination/Monkey work
  is genuinely learning-science-adjacent (self-regulation, metacognition, "the most important things
  have no deadline") and his AI Revolution work makes him an apt voice for the AI-era learning angle.
  ONE calibration caution recorded in STYLE.md §13 + do-and-dont.md: his occasional profanity is
  authentic but clashes with Ritsu brand voice — keep the irreverence, cut the swearing on Ritsu
  surfaces. Future re-distillation could add "What's Our Problem?" (short ≤25-word quotes) for his
  longer-book political/social register, and an interview transcript for finer spoken-craft calibration.
