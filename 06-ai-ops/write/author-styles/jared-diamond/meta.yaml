copyright: |
  Transformative style analysis + short attributed fair-use excerpts. The fuller quotes come from
  PUBLIC TALKS and interviews (Royal Institution 2013, UCSB/UCTV 2005, Upfront Summit 2020,
  People I (Mostly) Admire 2023, World Knowledge Forum 2025, UCLA 2025 — all publicly posted video
  transcripts, quoted with the auto-transcript's verbatim casing). The Edge.org talk-essay (1997) is
  freely published by Edge. Quotes from the copyrighted magazine essays (Discover 1987, The New Yorker
  2008, The Guardian 2014) are kept ≤ ~30 words each, always attributed. Diamond's BOOKS were NOT
  ingested (the PDFs in the raw folder were deliberately skipped): Guns, Germs, and Steel / Collapse /
  The Third Chimpanzee / The World Until Yesterday / Upheaval are referenced by name or idea only, with
  zero quoted words. Every excerpt in the artifact was machine-verified verbatim (grep) against the
  staged sources. Output written in this style is a derivative STYLE, presented as such — never claimed
  to be Diamond's own words.
notes: |
  Diamond's voice is unusually METHOD-shaped: the mechanics (modest-task opening, premise inversion,
  steelman demolition, announced enumeration, self-posed question, do-the-numbers, rice-bag anecdote,
  time-machine rescale, uncomfortable mirror, cautious-optimist close) recur nearly identically across
  his written essays, prepared lectures, and unscripted interviews from 1987 to 2025, which is what makes
  the artifact high-confidence despite the books not being ingested. Three cautions for writers:
  (1) His authority is that the cases and counts are REAL — a writer using this style on a new topic must
  bring real examples and real numbers (the style collapses into parody with invented ones); keep the
  mechanics, never counterfeit the anecdote. (2) He is comma/colon/parenthesis-punctuated; the /write
  humanizer strips em-dashes, which costs this voice nothing — render asides with commas, parentheses,
  or a period plus a short sentence. (3) The closes are the easiest place to break the illusion: he never
  exhorts. End on open questions or quantified hope, not "we must" or uplift.
  Strongest sources: Discover 1987 (written mechanics), Edge 1997 (the question-cascade + causation
  ladder), Royal Institution 2013 (do-the-numbers + warmth), Freakonomics 2023 (the mirror + 51/49).
  A natural fit for learning-science and Ritsu writing: comparison-as-method, test-the-received-wisdom,
  do-the-numbers, and his stated learning method ("the vast majority of academics... love to explain it")
  map directly onto active-learning arguments. What to add next: if posture allows, chapter-level analysis
  of Guns/Collapse prologues (Yali's question; the five-point framework in written form).
