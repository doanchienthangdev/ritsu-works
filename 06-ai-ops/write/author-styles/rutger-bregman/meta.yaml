  Bregman's own authored essays freely published in The Guardian and The Correspondent — openly
  readable, quoted in short attributed excerpts. The spoken excerpts are from public talks and
  podcast interviews (fuller quotes ok per the public-talk posture), quoted from the source
  archive's transcripts with timestamps/[music] markers stripped, never re-worded. His copyrighted
  books (Utopia for Realists, Humankind, Moral Ambition) were NOT ingested — referenced by name
