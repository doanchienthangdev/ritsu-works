  as such — never claimed to be Bregman's own words.
notes: |
  Bregman is a historian-recruiter: the voice is Dutch directness + receipts + hope-as-action.
  The three load-bearing mechanics, in order: (1) the HINGE INVERSION — state the consensus
  fairly, flip it in one anaphoric sentence, then pay for the flip in receipts (researcher +
  institution + year + number; never "studies show"); (2) the BIMODAL RHYTHM — 30-45-word
  evidence freight snapped shut by a 2-7-word stinger as its own paragraph ("This story never
  happened."), with fragment self-interviews ("The cost? Some £50,000 a year.") as transitions;
  (3) the RECRUITMENT CLOSE — circle back to the opening and hand the reader the burden
  ("The question is not… The question is…"), always agency, never doom, never guilt (cap guilt
  at 20%; "80% should be enthusiasm").
  Three cautions for /write: (a) his print twists ride spaced dashes; the humanizer strips
  dashes — render asides with parentheses, colons, a one-word question ("Harsh? Perhaps…"), or
  a period + short sentence; (b) his authority is that the receipts are REAL — inventing a study,
  number, or named case to sound like him is the unforgivable move (keep the mechanics, source
  real evidence for the actual topic); (c) the spoken tics ("right?", "I was like", self-repairs)
  belong to TALKS — in written pieces keep the spoken energy but the print discipline (the
  articles never use "right?" tags).
  Strongest sources if re-distilling: the five Correspondent/Guardian essays (written mechanics)
  + the O'Brien Full Disclosure interview (under-challenge stance). Gaps a future pass could add:
  his Davos 2019 panel remarks verbatim (the "taxes, taxes, taxes" register is currently sourced
  via his own retellings), the TED talk, and any natively-English book chapter (Moral Ambition was
  written in English) for book-length pacing. A natural voice for Ritsu/learning-science content:
  his entire method is counterintuitive-evidence-to-hopeful-action, which maps 1:1 onto
  active-learning-beats-passive-consumption.
