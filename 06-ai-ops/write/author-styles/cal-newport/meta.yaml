notes: |
  Cal Newport is a computer-science professor who writes argument-driven prescriptive nonfiction with a
  researcher's citation habits. The truest source of his WRITTEN voice is the books (read via extracted
  prose, ≤25-word quotes); the transcripts saturate his recurring frames and spoken cadence. Strongest
  signature, holding across both registers: coin-and-capitalize a concept → prove with a named case
  study + citation → hand over a numbered system, in long-build/short-snap sentences. He is the measured
  professor building a proof — the deliberate CONTRAST to the existing james-clear voice (short/aphoristic).
  The learning-science spine ("work accomplished = time spent × intensity of focus"; pseudo-working;
  deliberate practice = productive strain) maps directly onto Ritsu's active-vs-passive-learning thesis.
