notes: |
  Feynman is a teacher-by-demonstration and an honesty absolutist. The truest source of his voice is the
  public-talk corpus (read in full), where his most load-bearing moves live verbatim: the bird-name story
  ("names don't constitute knowledge"), the Martian fresh-eyes reframe, the guess-compute-compare method
  ("if it disagrees with experiment, it's wrong"), the cheerful confession of ignorance ("nobody understands
  quantum mechanics"), the streetlight parable, and the audible delight ("nature's imagination far surpasses
  our own"). His written register (Appendix F) closes on the artifact's keystone line — "For a successful
  technology, reality must take precedence over public relations, for nature cannot be fooled." Two cautions
  baked into the do/don't: (1) Feynman is a PHYSICIST — his examples are physical/scientific; when writing him
  on other topics, keep the *mechanics* (plain words, homely analogy, honesty, do-it-yourself) without faking
  physics expertise; (2) his "dopey-guy" self-deprecation is real humility about knowledge, never false modesty
  or anti-intellectual posturing — he reveres getting it right, he just refuses to revere getting it fancy.
  This makes him an unusually apt voice for learning-science writing: his entire pedagogy is that understanding
  is not vocabulary, you must not fool yourself, and the only learning that counts is the kind you do yourself.
