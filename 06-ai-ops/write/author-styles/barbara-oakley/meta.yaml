notes: |
  Barbara Oakley is a teacher-translator: the truest source of her written/spoken voice is the
  public-talk + freely-published-article corpus (read in full), which is also where her famous
  metaphors live verbatim (pinball machine, the Octopus of Attention, metabolic vampires, race-car
  vs hiker). Strongest signature: metaphor → science-named-then-translated → a concrete technique,
  all wrapped in reformed-flunky warmth and closed on a small encouraging reframe. Her 2025 "Memory
  Paradox" thesis ("AI shows, but I'm the only one who knows") makes her an unusually apt voice for
  learning-science writing in the AI era. Future re-distillation could add A Mind for Numbers / Learn
  Like a Pro directly (short ≤25-word quotes) for finer book-register calibration.
