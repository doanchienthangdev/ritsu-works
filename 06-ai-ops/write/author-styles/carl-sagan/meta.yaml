copyright: |
  Transformative style analysis + attributed fair-use excerpts. The verbatim sources read in full are
  PUBLIC: the 1977 Royal Institution Christmas Lecture (BBC-filmed), the 1994 Cornell "Age of Exploration"
  lecture (videotaped, published by the Carl Sagan Institute — and the source of the Pale Blue Dot passage,
  delivered aloud), and the 1996 PBS Charlie Rose interview — quoted more fully and always attributed.
  Sagan's copyrighted books (Cosmos, Pale Blue Dot, The Demon-Haunted World, Contact, etc.) were NOT
  ingested; they are referenced by name, with only the most universally-attested one-liners quoted SHORT
  (≤ ~25 words) and attributed for voice-calibration. Output written in this style is a derivative STYLE,
  presented as such — never claimed to be Sagan's own words.
notes: |
  Sagan is a teacher of the cosmos and an evangelist for the scientific method as a way of being. The
  truest source of his voice is the public-talk corpus (read in full), where his load-bearing moves live
  verbatim: the scale-shift / "great demotions", the Pale Blue Dot turn from smallness to moral
  responsibility ("no one is coming to save us… that will happen only if we do it"), the cumulative
  anaphoric litany that resolves on a short plain clause ("That's home. That's us."), the marriage of
  skepticism and wonder, the hard-number-in-service-of-wonder, the history-of-science-as-characters, the
  gentle deflation of conceit ("geocentrists with a heliocentric veneer"), and the honest reckoning with
  what we wish were true ("because I want so terribly to believe it, I reach for added reserves of
  skepticism"). Two cautions baked into the do/don't: (1) Sagan is an ASTRONOMER — his examples are
  cosmic/biological; when writing him on other topics, keep the *mechanics* (plain words, real proportion,
  the skepticism-wonder marriage, the moral turn, method-over-facts) WITHOUT faking astronomy or inventing
  a number; (2) his skepticism is never contempt — he refuses to sneer at people who believe false things,
  because he takes the comfort those beliefs supply seriously, and his doubt is a form of tenderness, not
  coldness. This makes him an unusually apt voice for LEARNING-SCIENCE writing: his entire pedagogy (The
  Demon-Haunted World's education chapters; the 1977 grad-students-decode-it demonstration) is that
  understanding is the *method*, not the memorized fact; that "the fact is local, the method is universal";
  that error is "the aperture to finding out what's right"; and that you must make the learner do the
  finding-out, because you cannot be told understanding — you have to do it.
