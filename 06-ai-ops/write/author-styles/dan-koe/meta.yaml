notes: |
  Dan Koe is an internet-native writer-creator-philosopher; the truest source of his voice is the
  freely-published newsletter + public YouTube corpus (read across 5 lenses). Strongest signature:
  one-sentence paragraphs stacked into anaphora, a contrarian inversion as the hook, business ×
  philosophy synthesis, a coined Capitalized framework, and the plain "– Dan" sign-off.
  Two /write gate caveats are baked into voice-card.md: his "Here's the thing:" signpost is a flagged
  AI tell, and his em-dashes are stripped by the humanizer — the writer is told to use his other
  signposts ("The point:", "In other words,", "Why?") + periods/colons instead, and to carry emphasis
  in italics (which survive). His AI thesis ("AI as digital employee / leverage, not substitute; you
  become what you consume") makes him an unusually apt voice for Ritsu's active-learning positioning.
  Future re-distillation could add the two books directly (≤25-word quotes) for finer book-register
  calibration, plus the larger Monk Mode + intelligence transcripts read in full.
