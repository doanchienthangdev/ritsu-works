case_id: case-002-pr-review-prompt
entity_type: agent
entity_name: cto
state: active
input:
  description: "Given a sample PR diff, @cto agent produces a code review."
  invocation: "(internal; orchestrator passes a sample diff)"
  sample_diff: |
    --- a/scripts/foo.cjs
    +++ b/scripts/foo.cjs
    @@ -1,3 +1,5 @@
    -function add(a, b) {
    -  return a + b;
    +function add(a, b) {
    +  if (typeof a !== 'number') throw new Error('a must be number');
    +  return a + b + 1; // off-by-one introduced
     }
expected_traits:
  - trait: catches_off_by_one
    assertion: "Review identifies the +1 as a regression"
  - trait: notes_input_validation
    assertion: "Review acknowledges the input validation addition (with caveat about consistency)"
  - trait: cites_file_line
    assertion: "Review uses file:line citation format"
  - trait: tone_terse_direct
    assertion: "Review prose is short, code-reviewer-style, not verbose"
prompt_assertions:
  - "The agent file documents PR review workflow"
notes: |
  Validates that @cto agent is fit-for-purpose on its primary task.
