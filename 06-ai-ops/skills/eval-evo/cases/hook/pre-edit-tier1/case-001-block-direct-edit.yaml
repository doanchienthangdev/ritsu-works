case_id: case-001-block-direct-edit
entity_type: hook
entity_name: pre-edit-tier1
state: active
input:
  description: "Agent attempts to directly edit governance/HITL.md outside of PR flow."
  attempted_action:
    tool: Edit
    file_path: governance/HITL.md
    invoked_by: claude-code-session (non-founder)
expected_traits:
  - trait: blocks_edit
    assertion: "Hook returns block (non-zero exit) preventing the Edit tool from executing"
  - trait: error_message_actionable
    assertion: "User receives explicit error: '00-core/, governance/, pillar SOPs require PR (Tier C) per HITL.md'"
  - trait: ops_audit_log_row
    assertion: "ops.audit_log has new row recording the blocked attempt"
  - trait: skip_flag_documented
    assertion: "Hook documents whether --no-verify skip is permitted (it should NOT be for this hook)"
prompt_assertions:
  - "The hook file cites governance/HITL.md section"
  - "The hook file lists which paths it gates"
notes: |
  Tests the hook's primary block path. case-002 tests the pass path (PR flow).
