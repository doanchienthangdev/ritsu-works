case_id: case-002-source-grouped-layout
entity_type: skill
entity_name: wiki-sync/distill
state: active
input:
  description: "Verify v4.0 source-grouped layout invariant."
  invocation: "/wiki sync raw/principles-of-marketing-kotler/chapter-7.pdf"
  source_kind: pdf
  layout_version_required: "v4.0"
expected_traits:
  - trait: source_md_at_root
    assertion: "wiki/<source-slug>/source.md is created (the source RECORD page)"
  - trait: derived_under_subfolders
    assertion: "Derived pages live in wiki/<source-slug>/{concepts,observations,decisions,ideas}/<entity>.md (NOT in wiki/concept/, wiki/observation/, etc.)"
  - trait: composite_unique_slugs
    assertion: "Same slug (e.g., 'wedge') may legitimately exist in multiple source packages; no UNIQUE collisions across packages"
  - trait: reverse_lookup_index
    assertion: "wiki/_index/<page_type>/<canonical-name>.md exists for the entity (generated by /wiki index rebuild)"
prompt_assertions:
  - "The SKILL.md cites v4.0 source-grouped layout"
  - "The SKILL.md references wiki/_index/ for reverse lookups"
  - "The SKILL.md does NOT use v2.0 entity-type-grouped layout"
notes: |
  This case validates that /evolve doesn't accidentally regress the layout
  flip from v3.0 → v4.0. A proposer change that suggests "moving concepts
  back to wiki/concepts/" would fail this trait and should score lower on C5
  (drift contribution) and C9 (cross-refs).
