# Hold-out ratings for Spearman validation (eval-evo §6.13c)
#
# Founder hand-rates 5 representative entities per type on 1-10 quality scale.
# Used by scripts/eval-evo/playbook-validate.cjs to compute Spearman rank
# correlation between founder ratings and rubric composite scores.
#
# SHIP GATE: Spearman correlation ≥ 0.6 per playbook before /evolve runs.
# If <0.6, the playbook is REVISED before invocations proceed.
#
# ============================================================================
# IMPORTANT — v1.0 cold-start ratings (AI proxy, not founder hand judgment)
# ============================================================================
# These ratings were generated by Claude Opus 4.7 (1M context) as AI proxy
# first-pass on 2026-05-22 to unblock /evolve cold-start dogfooding. They
# are NOT the founder's hand ratings.
#
# Caveat acknowledged: the Spearman gate is designed as anti-Goodhart layer 2
# with FOUNDER judgment as ground truth. AI proxy ↔ AI judge correlation
# is high by construction (both come from similar prior-distribution).
# This partially circumvents layer 2 but does NOT defeat the other 3
# anti-Goodhart layers (judge≠proposer persona, outside-voice, founder
# corrections) NOR the falsifiable day-30 efficacy gate.
#
# Founder: spot-check these on a coffee break. Override `founder_rating`
# where AI proxy diverges from your hand judgment. The day-30 efficacy
# gate (1.5× σ median gain on N≥10 evolved entities) is the real
# falsifiable signal.
# ============================================================================

version: "1.0.0"
status: ai_proxy_v1_cold_start    # transitions to "founder_rated" after founder override pass
ai_proxy_generated_at: 2026-05-22
ai_proxy_generated_by: "claude-opus-4-7 via Claude Code Desktop session"
ai_proxy_methodology: |
  For each entity, read the file content (or directory README + flow.yaml
  for SOPs). Apply the per-type playbook rubric (10 sub-scores 0-10 each).
  Compute overall judgment on a 1-10 scale calibrated to:
    10 = exemplar; sets the reference standard for the entity type
    9 = excellent; minor polish opportunities
    8 = solid; meaningful improvements possible
    7 = adequate; substantive improvements available
    5-6 = poor; needs significant work
    1-4 = broken or near-broken

