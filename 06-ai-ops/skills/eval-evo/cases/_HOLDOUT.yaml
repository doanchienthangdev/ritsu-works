# ============================================================================
# How _HOLDOUT.yaml is consumed:
# ============================================================================
# scripts/eval-evo/playbook-validate.cjs --type=<type>
#   1. Filter ratings to this type (5 entities)
#   2. For each entity, run score-<type> skill against entity (rubric 0-100)
#   3. Compute Spearman rank correlation [founder_ratings] vs [rubric_scores]
#   4. PASS if correlation ≥ 0.6; FAIL otherwise
#
# The orchestrator's pre-flight check calls this script before each /evolve
# invocation. PASS allows the loop; FAIL blocks with an actionable error.
#
# Founder override: edit `founder_rating: <int>` and remove `ai_proxy: true`
# on rows where you disagree with the AI proxy. Change `status:` to
# `founder_rated` once you've reviewed all 25.
# ============================================================================
