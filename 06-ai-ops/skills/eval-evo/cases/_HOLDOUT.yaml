# Hold-out ratings for Spearman validation (eval-evo §6.13c)
#
# Founder hand-rates 5 representative entities per type on 1-10 quality scale.
# Used by scripts/eval-evo/playbook-validate.cjs to compute Spearman rank
# correlation between founder ratings and rubric composite scores.
#
# SHIP GATE: Spearman correlation ≥ 0.6 per playbook before /evolve runs.
# If <0.6, the playbook is REVISED before invocations proceed.
#
# Status: PENDING-FOUNDER (placeholder values below; orchestrator refuses
# to run /evolve until real ratings replace ALL placeholders).
#
# How to complete:
#   1. Read each entity at its path (entity_path field below)
#   2. Rate the entity on overall quality 1-10 (your subjective judgment)
#      - 10 = exemplar; could not be substantially better
#      - 7-8 = solid; minor improvements possible
#      - 5-6 = adequate; meaningful improvements available
#      - 3-4 = poor; needs substantial work
#      - 1-2 = broken or near-broken
#   3. Replace `founder_rating: PENDING-FOUNDER` with integer 1-10
#   4. Run `node scripts/eval-evo/playbook-validate.cjs --type=<type>`
#   5. If correlation ≥ 0.6 for all 5 playbooks, /evolve unlocks
#
# Time estimate: ~5 min per entity × 25 entities = ~2 hours founder time.

