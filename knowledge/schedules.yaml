# ============================================================================
# schedules.yaml — Scheduled triggers (Bài #8)
# ============================================================================
# Tier 1 declarative file. Edit via PR governance.
# Defines when scheduled tasks fire. Dispatcher reads this + invokes skills.
#
# Schema validation: schemas/schedules.schema.json
# Engine: supabase/functions/schedule-dispatcher/
# ============================================================================

version: "1.0.0"
timezone: Asia/Ho_Chi_Minh

schedules:
  # === Founder rhythm-aware schedules ===
  
  # Morning brief assembly (Bài #19 capstone)
  - id: morning-brief-assembly
    cron: "45 5 * * *"               # 05:45 in Asia/Ho_Chi_Minh
    description: "Assemble morning brief 15 min before founder block"
    skill: synthesize-morning-brief
    enabled_when_mode: [hybrid, full_api]
    requires_api: anthropic
    fallback: queue_for_founder_review
    cost_estimate: $0.03 per run
  
  # === Domain schedules (customize per project) ===
  
  # {{ADD_DOMAIN_SCHEDULES_HERE}}
  # Examples:
  # - id: weekly-customer-pulse
  #   cron: "0 9 * * MON"
  #   description: "Weekly customer health snapshot"
  #   skill: customer-pulse-aggregator

  # Hourly ETL: Product Supabase → metrics.product_dau_snapshot.
  # Inert until SUPABASE_PRODUCT_URL + SUPABASE_PRODUCT_READONLY_ETL_KEY are
  # provisioned for the minion-worker (D-MAX per governance/HITL.md). Until
  # then the worker logs deferred_no_product_supabase_key on each fire.
  - id: etl-product-dau-hourly
    cron: "5 * * * *"
    description: "Hourly ETL of Product DAU snapshot to metrics.product_dau_snapshot"
    skill: etl-product-dau-snapshot
    enabled_when_mode: [hybrid, full_api]
    requires_api: supabase_product_read
    fallback: queue_for_founder_review
    cost_estimate: $0.00 per run

  # Cross-Tier Consistency Engine — L3 nightly sweep (v1.0b).
  # Inserts pending consistency_checks rows for each L3 invariant. Actual check
  # execution against live DB (with helper RPC functions) is wired in v1.0c.
  - id: consistency-sweep-nightly
    cron: "0 3 * * *"
    description: "Nightly L3 sweep: insert pending consistency_checks rows for each L3 invariant"
    skill: consistency-sweep
    cost_estimate: $0.00 per run

  # === Maintenance schedules ===
  
  - id: stale-decision-check
    cron: "0 9 * * MON"               # Mondays 9 AM
    description: "Identify decisions needing review (Bài #15)"
    skill: stale-decision-detector
    enabled_when_mode: [hybrid, full_api]
  
  - id: data-retention-scan
    cron: "0 3 * * *"                 # Daily 3 AM
    description: "GDPR data retention enforcement (Bài #16)"
    skill: data-retention-scanner
  
  - id: ingestion-source-poll
    cron: "*/30 * * * *"              # Every 30 min
    description: "Poll active ingestion sources (Bài #18)"
    skill: ingestion-source-poller
    enabled_when_mode: [hybrid, full_api]
  
  - id: minion-queue-cleanup
    cron: "0 4 * * *"                 # Daily 4 AM
    description: "Cleanup completed Minion jobs > 30 days (Bài #5)"
    skill: minion-queue-cleaner

  # === Wiki-sync v3.0.5 cron entries ===
  # Both added 2026-05-18 (wiki-sync v3.0.5 patch). Handler stubs in
  # supabase/functions/minion-worker/index.ts SKILL_REGISTRY satisfy the
  # L2 validator paired-handler requirement; real implementation v3.1 OR
  # founder manual invocation in the meantime.

  # Hourly backfill of soft-deferred wiki embeddings (v2.0 G3 disposition).
  # Handles both source RECORD pages AND v3.0 derived entity pages.
  # See 06-ai-ops/skills/wiki-sync/embeddings-backfill/SKILL.md.
  - id: wiki-embeddings-backfill
    cron: "0 * * * *"                 # Hourly
    description: "Backfill soft-deferred wiki embeddings (v2.0 G3 + v3.0 derived entities)"
    skill: wiki-embeddings-backfill
    enabled_when_mode: [hybrid, full_api]
    requires_api: openai
    fallback: skip_if_no_key
    cost_estimate: "$0.00004 per page"

  # Daily Telegram digest of pending_review extraction count (v3.0 — Sprint 4).
  # Self-throttles: 0 messages if pending_review count = 0.
  # See 06-ai-ops/skills/wiki-sync/review/SKILL.md.
  - id: wiki-review-queue-digest
    cron: "0 9 * * *"                 # Daily 09:00 ICT
    description: "Daily digest of pending_review extraction count (v3.0 Tier B)"
    skill: wiki-review-queue-digest
    enabled_when_mode: [hybrid, full_api]
    fallback: no_notification
    cost_estimate: "$0 per run (DB read + Telegram bot call)"

  # docs-engine drift detection (deterministic; no LLM call).
  # Added in Sprint 1 PR-3 alongside the `docs-engine-check` stub in
  # supabase/functions/minion-worker/index.ts SKILL_REGISTRY.
  #
  # Naming: SKILL_REGISTRY keys are FLAT hyphenated (no slashes — per the
  # L2 validator regex `[a-z][a-z0-9-]+`). Sub-skill `docs-engine/check`
  # (verb-per-folder umbrella convention in 06-ai-ops/skills/docs-engine/)
  # maps to SKILL_REGISTRY key `docs-engine-check` here.
  # See .claude/commands/docs.md + 06-ai-ops/skills/docs-engine/check/SKILL.md.
  - id: docs-drift-nightly
    cron: "30 2 * * *"                # 02:30 ICT — after wiki ETL window
    description: "Run /docs check to detect codebase ↔ MDX drift overnight"
    skill: docs-engine-check
    enabled_when_mode: [hybrid, full_api]
    fallback: no_op
    cost_estimate: "$0 per run (deterministic; reads filesystem + writes ops.kpi_snapshots)"

  # eval-evo day-30 falsifiable efficacy gate (capability `evolve` v1.0).
  # Per spec §6.6 / PLAN §6.13b: 30 days after capability `evolve` transitions
  # to state='operating', compute median composite gain ÷ judge σ ratio.
  # If <1.5×, PAUSE-RECOMMENDED — orchestrator's pre-flight refuses new
  # /evolve invocations until founder retro decides v1.1 redesign vs continue.
  #
  # Cron fires daily but the script short-circuits to INSUFFICIENT_DATA
  # if <10 evolved entities. The actual gate evaluation runs at most once;
  # founder retro resolves it.
  - id: evolve-day30-calibration
    cron: "0 9 * * *"                 # 09:00 ICT daily; script short-circuits when insufficient
    description: "Run /evolve falsifiable efficacy gate; alert founder on PAUSE-RECOMMENDED"
    skill: eval-evo-calibrate-efficacy
    enabled_when_mode: [hybrid, full_api]
    fallback: log_only
    cost_estimate: "$0 per run (deterministic; reads ops.agent_runs)"
    # Note: requires SUPABASE_ACCESS_TOKEN in minion-worker env (no allowed
    # enum value in schemas/schedules.schema.json yet — defer to v1.1 schema bump).

  # ==========================================================================
  # gbrain integration (capability gbrain-operational-brain v1.0 Sprint 4)
  # 3 NEW cron handlers; all wired as deferred stubs in minion-worker/index.ts
  # until Sprint 5 (.mcp.json wrapper enables gbrain MCP) lands. Founder may
  # run manually via gbrain CLI in the meantime.
  # ==========================================================================

  # Nightly CRM → gbrain mirror. ETL public.companies billing fields into
  # gbrain companies/<slug> frontmatter. Idempotent. Read-only on ritsu-ops
  # (no UPDATE), write-only on gbrain (put_page with state preserve).
  - id: crm-to-gbrain-mirror
    cron: "0 2 * * *"                 # 02:00 ICT daily
    description: "Nightly CRM → gbrain mirror (ETL public.companies billing fields → gbrain companies/ frontmatter)"
    skill: crm-to-gbrain-mirror
    enabled_when_mode: [hybrid, full_api]
    fallback: queue_for_founder_review
    cost_estimate: $0.05 per run

  # Nightly L1/L2/L3 invariant check on gbrain. Inserts pending
  # consistency_checks rows for each gbrain invariant (registered
  # cross-tier-invariants.yaml Sprint 1 PR #100). Parallels existing
  # consistency-sweep-nightly schedule.
  - id: gbrain-consistency-nightly
    cron: "0 3 * * *"                 # 03:00 ICT daily
    description: "Nightly L1+L2+L3 gbrain invariant sweep → ops.consistency_checks"
    skill: gbrain-consistency-nightly
    enabled_when_mode: [hybrid, full_api]
    fallback: log_only
    cost_estimate: $0.02 per run

  # Nightly gbrain dream cycle: dedup, citation fix, contradiction detection,
  # synthesis. Run by gbrain-maintainer role per HITL Tier A. Hard-capped at
  # $30/mo via gbrain-maintainer.economic_budget.monthly_cap_usd. Skip if
  # global gbrain.* aggregate >= $100/mo (Hard-cap Option B graceful degrade).
  - id: gbrain-dream-cycle
    cron: "0 4 * * *"                 # 04:00 ICT daily
    description: "Nightly gbrain dream cycle (dedup + citation fix + contradiction detection + synthesis), run by gbrain-maintainer role"
    skill: gbrain-dream-cycle
    enabled_when_mode: [hybrid, full_api]
    fallback: log_only
    cost_estimate: $1.00 per run (~$30/mo cap)

  # ==========================================================================
  # resolver-v3 health-check (capability resolver-v3-jit-loading v3.0.0 Sprint 4)
  # ==========================================================================
  # Hourly canary find() against mcp__resolver__find. Detects silent MCP server
  # start failures after CLAUDE.md cutover. Per spec §7.4 (eng review Finding 4).
  #
  # Behavior:
  #   - Invokes mcp__resolver__find({intent: "canary test query", limit: 1})
  #   - Logs result to ops.events event_type='resolver.health_check'
  #   - After 3 consecutive failures: emits ops.events 'resolver.health_degraded'
  #     → Tier B Telegram alert to founder (catch silent MCP boot failures)
  #
  # No API key needed (per resolver-v3 iter4 policy alignment).
  - id: resolver-v3-health-check
    cron: "0 * * * *"                 # hourly
    description: "Canary mcp__resolver__find call; alert founder on 3 consecutive failures"
    skill: resolver-v3-health-check
    enabled_when_mode: [hybrid, full_api]
    fallback: log_only
    cost_estimate: "$0 per run (no LLM call; MCP read-only + audit insert)"
    notes: |
      Stub handler — wired into supabase/functions/_shared/worker.ts in Sprint 4
      follow-up PR. Active only post-CLAUDE.md-cutover Tier C ceremony.

  # === Capability evolve v1.1 (SkillOpt integration) Sprint 4 ===
  # Monthly Spearman correlation between held-out judge scores (synth signal)
  # and post-install production correction-rate (prod signal). When < 0.5, the
  # synth signal poorly predicts real-world success → playbook revision needed.
  # Per spec §19.10.
  - id: skillopt-synth-prod-correlation-monthly
    cron: "0 9 1 * *"                 # 1st of month, 09:00 in Asia/Ho_Chi_Minh
    description: "Monthly Spearman correlation between SkillOpt held-out scores and prod correction rates"
    skill: skillopt-synth-prod-correlation     # registered as makeDeferredStubHandler in minion-worker/index.ts until Sprint 5 wires the Edge Function dispatch
    handler: scripts/eval-evo/skillopt-synth-prod-correlation.cjs
    enabled_when_mode: [hybrid, full_api]
    fallback: log_only
    cost_estimate: "$0 per run (read-only SQL + pure-JS Spearman computation)"
    notes: |
      Inserts to ops.kpi_snapshots(kpi_id='skillopt_synth_to_prod_correlation').
      Emits insufficient_data envelope (value=null) when <5 entities in 30-day
      window. Alert rules `skillopt-synth-to-prod-correlation` (critical < 0.3)
      include non-null guard so insufficient-data months don't trip critical.
      The cron dispatcher reads `handler:` when `skill:` is absent — the
      handler is a CJS script invoked directly. Wiring through the dispatcher
      is a Sprint 5 follow-up (first real /evolve skillopt run produces data
      to validate against).

# ============================================================================
# Customization checklist
# ============================================================================
# After bootstrap, customize:
# 1. Update timezone (above)
# 2. Add domain-specific schedules in {{ADD_DOMAIN_SCHEDULES_HERE}} section
# 3. Disable schedules not relevant to your project
# 4. Verify cron expressions match founder timezone
