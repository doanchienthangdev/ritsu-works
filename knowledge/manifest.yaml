# Ritsu Works — Knowledge Manifest
#
# This file is the CONTRACT that tells every agent where each kind of company
# truth lives. Read it before searching, querying, or writing data.
#
# Four tiers:
#   T1 = Canonical (this git repo) — identity, strategy, SOPs, skills, agents
#   T2 = Operational (Postgres / Supabase ritsu-ops) — current state
#   T3 = Events & Artifacts (Supabase Storage / S3) — append-only, immutable
#   T4 = Derived (Vector DB + caches) — rebuildable from T1+T3
#
# Rules:
#   - Tier 1 is the only tier where humans negotiate meaning. PRs only.
#   - Tier 2/3 may be written by agents according to RACI in each SOP.
#   - Tier 4 is never authoritative. Rebuild scripts in `scripts/sync/`.
#   - Schema for every Tier 2 table must exist in `knowledge/schemas/`.
#   - Operating AI MUST NOT write to product.supabase. Read-only via ETL.

version: 0.1.0
last_updated: 2026-05-02
owner: founder

# ---------------------------------------------------------------------------
# TIER 1 — Canonical (this repo)
# ---------------------------------------------------------------------------
tier1_canonical:
  storage: git
  repo: doanchienthangdev/ritsu-works
  branch_protection: main  # PRs required; see governance/HITL.md
  pillars:
    charter:
      path: 00-charter/
      contents: [vision, mission, values, product, glossary, brand_voice]
      change_policy: pr_human_review
    growth:
      path: 01-growth/
      status: planned
    product_ops:
      path: 02-product/
      status: planned
      note: |
        This is operations AROUND the product (roadmap intake, release notes,
        feedback triage). The product codebase itself is in a separate repo.
    delivery:
      path: 03-delivery/
      status: planned
      note: B2C product ops at scale — support, onboarding, churn, in-app engagement.
    backoffice:
      path: 04-backoffice/
      status: planned
      note: Vietnam-specific tax & compliance context.
    ai_ops:
      path: 05-ai-ops/
      status: planned
    trust_safety:
      path: 06-trust-safety/
      status: planned
      note: |
        B2C EdTech-specific. Copyright/DMCA, hallucination guardrails, GDPR/PDPA,
        minor users (under 18), user-uploaded content moderation.
    skills:
      path: skills/
      status: planned
      note: SKILL.md files following Anthropic convention. Composable.
    agents:
      path: .claude/agents/
      status: planned
    workflows:
      path: workflows/
      status: planned
    governance:
      path: governance/
      status: planned
      contents: [ROLES.md, HITL.md, BUDGET.md, SECRETS.md]
    tool_plane:
      path: mcp/
      status: planned
      note: |
        MCP server configs (servers.yaml) and custom MCP servers. This is the
        ONLY way agents reach external systems. If a needed tool isn't here,
        it doesn't exist for the workforce yet.
    human_interface:
      path: interfaces/
      status: planned
      note: |
        Telegram bot, Slack app, CLI, and (future) web dashboard. The founder's
        primary entry points to delegate work to the AI workforce.

# ---------------------------------------------------------------------------
# WORKSPACE PLANE — transient material, not canonical truth
# ---------------------------------------------------------------------------
# These three folders support the work but are not authoritative. They have
# specific sync policies enforced by .gitignore. See each folder's README.
workspace_plane:
  raw:
    path: raw/
    sync_policy: local_only
    sync_mechanism: ".gitignore excludes raw/* except .gitkeep and README.md"
    purpose: |
      Source material before extraction — PDFs, recordings, screenshots,
      exports, voice notes. Each operator collects their own. Disposable.
    lifecycle: raw -> agent extracts -> wiki/ OR Tier 3 storage -> raw can be deleted
    rules:
      - Read raw, write extracted notes to wiki/
      - Cite raw paths in wiki notes (paths are private breadcrumbs)
      - Never reference raw/ paths from Tier 1 files

  wiki:
    path: wiki/
    sync_policy: opt_in_default_sync
    sync_mechanism: |
      All files synced by default. Files with underscore prefix
      (wiki/_foo.md, wiki/sub/_bar.md) are gitignored and stay local.
    purpose: |
      Extracted reference knowledge — notes about the world. Competitor
      analysis, market research, paper notes, customer interview synthesis.
      Informs decisions but does NOT drive agent behavior directly.
    promotion_path: |
      A wiki note never automatically affects agent behavior. To act on it:
      1. Read the wiki note
      2. Decide if it should change canonical truth
      3. Open a PR to the relevant Tier 1 file
      4. Cite the wiki note in PR description
    boundary:
      wiki: "notes about the world"
      tier1: "statements about who Ritsu is and how Ritsu operates"

  archives:
    path: .archives/
    sync_policy: shell_only
    sync_mechanism: |
      .gitignore excludes .archives/* but allows .gitkeep files and README.
      Subfolder structure committed; contents stay local.
    purpose: |
      Scratch space for agent reasoning — drafts, experiments, intermediate
      outputs, multi-step plans. Disposable, no obligation to clean.
    rules:
      - Default scratch location for agent work
      - Never reference .archives/ paths from canonical files
      - Promote (move), don't reference, when content is worth keeping

# Cross-folder summary — quick lookup for agents
where_things_go:
  external_source_material: raw/
  notes_about_external_things: wiki/
  agent_drafts_and_intermediate: .archives/
  who_ritsu_is: 00-charter/
  how_ritsu_operates: 0X-pillar/SOP-*/
  what_ai_can_do: skills/
  current_state: tier2_operational
  permanent_artifacts: tier3_events
  searchable_embeddings: tier4_derived

# ---------------------------------------------------------------------------
# TIER 2 — Operational (Supabase: ritsu-ops project)
# ---------------------------------------------------------------------------
# Source of truth for "what is happening right now" in the company.
# Schema for every table MUST exist in knowledge/schemas/.
# Agents query through the Supabase MCP server (configured per session).
tier2_operational:
  storage: supabase
  project_ref: TBD  # fill when ritsu-ops project is provisioned
  region: TBD
  schemas:
    ops:
      description: Operating AI workspace — tasks, runs, decisions
      tables:
        # Examples; create migrations under knowledge/schemas/ when adding.
        - name: agent_runs
          schema_file: knowledge/schemas/agent_runs.sql
          status: planned
          purpose: |
            Audit log — one row per agent invocation. Required columns based
            on governance/HITL.md, governance/ROLES.md, and
            knowledge/memory-architecture.md:
              - id, agent_role, action_name, started_at, completed_at
              - tier ('A'|'B'|'C'|'D-Std'|'D-MAX')
              - input_payload_hash, output_payload_hash
              - tokens_used, tool_calls_count, cost_usd
              - secrets_accessed (array of secret names — for SECRETS.md audit)
              - was_override (bool), override_reason, override_method
              - approved_by, approved_at, approval_message_url
              - outcome ('success'|'failed'|'rejected'|'timeout'|'aborted'|'blocked')
              - cooldown_seconds, correcting_run_id (for D-MAX corrections)
              - recall_run_ids (uuid[]) — past runs that informed this one
              - recall_tokens_loaded (int) — context cost of recall
            Constraint: BEFORE UPDATE trigger raises if was_override = true.
        - name: run_summaries
          schema_file: knowledge/schemas/run_summaries.sql
          status: planned
          purpose: |
            Post-hoc ~150-token summary of each completed agent_run. Powers
            episodic-recall skill (Type 2 memory in memory-architecture.md).
            Columns: run_id (PK, FK to agent_runs), agent_role, action_name,
            summary (text), artifacts (jsonb), ts.
            One row per agent_run with `emit_run_summary: true` in role config.
        - name: corrections
          schema_file: knowledge/schemas/corrections.sql
          status: planned
          purpose: |
            Founder corrections to agent outputs. Powers learning loop in
            memory-architecture.md Strategy E.
            Columns: id, run_id (FK), corrected_by, correction_kind
            ('reject'|'edit'|'redirect'|'reframe'), correction_note (text), ts.
            Indexed on run_id and on (agent_role, ts) via join with agent_runs.
        - name: campaigns
          schema_file: knowledge/schemas/campaigns.sql
          status: planned
          purpose: Marketing/growth campaigns; FK from content, leads.
        - name: tasks
          schema_file: knowledge/schemas/tasks.sql
          status: planned
          purpose: |
            Cross-pillar task queue + multi-agent orchestration state
            (per knowledge/orchestration-architecture.md).
            Required columns:
              - id, status, created_at, updated_at
              - parent_task_id (FK to tasks.id) — for parent-child orchestration
              - spawned_by_run (FK to agent_runs.id) — provenance
              - assignee_role text NOT NULL — which role should execute
              - state_payload jsonb DEFAULT '{}' — structured task state
              - blocked_on uuid[] DEFAULT '{}' — task dependencies
              - estimated_done_at, retries_left (default 3)
              - acceptance_criteria text — what "done" means
              - tier ('A'|'B'|'C'|'D-Std'|'D-MAX') — HITL tier propagated from parent
            Status state machine: pending → ready → in_progress → done/failed/blocked.
            Indexes: parent_task_id, blocked_on (GIN), (assignee_role, status).
        - name: task_state_transitions
          schema_file: knowledge/schemas/task_state_transitions.sql
          status: planned
          purpose: |
            Append-only audit log for every status change on a task.
            Columns: id, task_id (FK), from_status, to_status, by_run_id (FK
            to agent_runs), reason text, ts.
            Indexed on (task_id, ts). Powers debugging and orchestration
            forensics.
        - name: cost_attributions
          schema_file: knowledge/schemas/cost_attributions.sql
          status: planned
          purpose: |
            Per-LLM-call cost attribution
            (per knowledge/economic-architecture.md Axis 1).
            Required columns: id, run_id, task_id, agent_role, task_kind,
            model, service_tier, input_tokens, cache_creation_tokens,
            cache_read_tokens, output_tokens, cost_usd numeric(10,6), ts.
            Populated by `pre-llm-call-budget` hook on each LLM call.
            Indexes: (agent_role, ts DESC), (agent_role, task_kind, ts DESC),
            (task_id), (ts DESC).
            Daily reconciled against Anthropic Usage Admin API; >5%
            discrepancy alerts founder.
        - name: budget_alerts
          schema_file: knowledge/schemas/budget_alerts.sql
          status: planned
          purpose: |
            Per-role per-month budget breach events plus weekly Economic
            Health Score history.
            Required columns: id, alert_kind ('warning_80'|'escalate_100'|
            'hard_block_150'|'health_score_low'), agent_role, period_month,
            current_cost_usd, budget_usd, ratio numeric, health_score int,
            score_breakdown jsonb, ts, resolved_ts, founder_action text.
            Indexes: (agent_role, period_month, alert_kind),
            (alert_kind, ts DESC) WHERE resolved_ts IS NULL.
        - name: optimization_recommendations
          schema_file: knowledge/schemas/optimization_recommendations.sql
          status: planned
          purpose: |
            Output of `cost-optimization-review` skill — weekly proposed
            changes to reduce cost.
            Required columns: id, generated_at, period_start, period_end,
            recommendation_kind ('model_downgrade'|'prompt_caching'|
            'batch_tier'|'context_trim'|'task_kind_split'|'budget_adjust'),
            target_role text, target_task_kind text, current_cost_usd,
            estimated_savings_usd, risk_level ('low'|'medium'|'high'),
            description text, suggested_diff_path text, status
            ('proposed'|'approved'|'rejected'|'implemented'), pr_url text,
            founder_decision_ts.
            Indexes: (status, generated_at DESC), (target_role).
    metrics:
      description: ETL'd snapshots of Product metrics (read-only mirror)
      tables:
        - name: product_dau_snapshot
          schema_file: knowledge/schemas/product_dau_snapshot.sql
          status: planned
          source: product.supabase via scheduled ETL
          refresh: hourly
  isolation:
    cannot_write_to:
      - project: ritsu  # the Product Supabase
        rationale: |
          Operating AI must not be able to harm paying users. Even read access
          to product.* should go through views in ops.* populated by ETL, not
          direct queries.

# ---------------------------------------------------------------------------
# TIER 3 — Events & Artifacts (Supabase Storage / S3-compatible)
# ---------------------------------------------------------------------------
# Append-only. Immutable. Every item has a stable URI.
tier3_events:
  storage: supabase_storage
  buckets:
    - name: ops-transcripts
      purpose: Founder voice notes, calls, agent conversations exported.
      retention: indefinite
      naming: "yyyy/mm/dd/<source>-<id>.{json,txt,mp3}"
    - name: ops-artifacts
      purpose: Generated content drafts, screenshots, exported reports.
      retention: 365d
    - name: ops-agent-logs
      purpose: Full agent action logs (also indexed in tier 2 agent_runs).
      retention: 90d
  index_table: ops.tier3_index  # in Tier 2 — every blob has a row here

# ---------------------------------------------------------------------------
# TIER 4 — Derived (Vector DB + caches)
# ---------------------------------------------------------------------------
# Never authoritative. Always rebuildable.
tier4_derived:
  vector_store:
    provider: TBD  # candidates: Supabase pgvector, Pinecone, Qdrant
    namespaces:
      - name: charter_embeddings
        source: tier1_canonical.charter
        rebuild_script: scripts/sync/rebuild-charter-embeddings.sh
        status: planned
      - name: skills_embeddings
        source: tier1_canonical.skills
        rebuild_script: scripts/sync/rebuild-skills-embeddings.sh
        status: planned
      - name: transcripts_embeddings
        source: tier3_events.buckets[ops-transcripts]
        rebuild_script: scripts/sync/rebuild-transcripts-embeddings.sh
        status: planned
  cache_layer:
    provider: TBD  # candidates: Upstash Redis, Cloudflare KV
    purpose: Memoize expensive LLM calls and tool results.

# ---------------------------------------------------------------------------
# Cross-tier ETL flows
# ---------------------------------------------------------------------------
etl_flows:
  - name: product_metrics_to_ops
    direction: product_supabase -> ritsu_ops
    mode: read_only
    cadence: hourly
    script: scripts/sync/etl-product-metrics.sh
    status: planned
    rationale: |
      Operating AI needs DAU, MRR, churn to make growth/delivery decisions
      without ever touching the production database directly.
  - name: tier3_to_tier4_embeddings
    direction: storage -> vector_store
    cadence: nightly
    script: scripts/sync/embed-new-artifacts.sh
    status: planned

# ---------------------------------------------------------------------------
# Secrets & access — pointer to governance/SECRETS.md
# ---------------------------------------------------------------------------
# Secrets never live in this file or anywhere in the repo. This is the high-
# level map; the canonical role-to-secret matrix lives in governance/SECRETS.md
# and the values live in the chosen secret manager (TBD: 1Password Service
# Accounts recommended; see SECRETS.md).
secrets_map:
  policy_doc: governance/SECRETS.md
  manager:
    provider: TBD
    candidates:
      - 1password_service_accounts
      - doppler
      - supabase_vault  # for DB-internal only
  critical_boundaries:
    - boundary: product_database_isolation
      rule: |
        Only role 'etl-runner' holds SUPABASE_PRODUCT_READONLY_ETL_KEY.
        SUPABASE_PRODUCT_FULL_SERVICE_KEY does not exist in this repo's
        secret manager — it lives in the product repo. Operating AI cannot
        write to ritsu (Product Supabase).
    - boundary: stripe_money_movement
      rule: |
        No agent role holds any Stripe key that can move money. Refunds and
        charges require founder action via Tier C/D ceremony per HITL.md.
    - boundary: github_force_actions
      rule: |
        No agent PAT has permission to merge, approve, or force-push. Only
        GITHUB_TOKEN_FOUNDER (founder-only) has those capabilities.

# ---------------------------------------------------------------------------
# How to add a new data source (checklist for agents and humans)
# ---------------------------------------------------------------------------
add_new_source_checklist:
  - decide_tier: Is this canonical, operational, event, or derived?
  - if_tier1: Add file under appropriate pillar; open PR.
  - if_tier2: Write migration in knowledge/schemas/; add entry under tier2_operational.schemas; open PR.
  - if_tier3: Add bucket entry under tier3_events; document naming convention; open PR.
  - if_tier4: Add namespace under tier4_derived; write rebuild script in scripts/sync/; open PR.
  - update_etl: If cross-tier, add to etl_flows.
  - update_secrets_map: If new credentials needed.
