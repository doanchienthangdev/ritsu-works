            invariant evaluation (L1/L2/L3). States: pending → running →
            passed | failed | fix_proposed | fix_merged | fix_reverted |
            wont_fix. Owned by SOP-AIOPS-002. Powers founder dashboard +
            alerts + drift-weekly-retro (deferred).
        # ====================================================================
        # Resolver capability v1.0 → v2.0 (LLM-Native Catalog) audit table
        # ====================================================================
        - name: resolver_decisions
          migration_file: supabase/migrations/00034_resolver_decisions.sql
          extended_by: supabase/migrations/00035_resolver_decisions_llm_reasoning.sql
          status: live
          purpose: |
            Per-query audit log for capability `resolver` (v1) and `resolver-v2`
            (v2 LLM-Native Catalog). One row per resolver invocation across all
            three modes (A=in-session, B=explicit, C=keyword-fallback).

            v1 base columns (00034): run_id (UUID PK), ts, trigger,
            trigger_normalized, matched_route_id, confidence numeric(3,2),
            alternatives JSONB, semantic_used bool, caller_role, latency_ms,
            decision (enum dispatch_silently|surface_candidates|no_match|
            role_denied), metadata JSONB.

            v2 extension (00035): llm_reasoning text (Mode B LLM rationale,
            truncated 2000 chars), mode char(1) CHECK ('A'|'B'|'C') DEFAULT 'B',
            catalog_files_loaded text[] (which recipients/*.md contributed),
            composition_supporting text[] (supporting recipient IDs for
            composition assembly).

            Indexed on (ts), (matched_route_id), (decision), (caller_role),
            (mode, ts). Partial index on rows with composition_supporting.
            RLS: founder + etl-runner full; other roles read own caller_role.
        # ====================================================================
        # Capability `update` v1.0 — universal entity-edit lock (Sprint 1)
        # ====================================================================
        - name: entity_edit_locks
          migration_file: supabase/migrations/00039_universal_entity_edit_lock.sql
          extended_by: supabase/migrations/00042_v1_1_entity_edit_locks_extend.sql
          status: live
          purpose: |
            Universal lock for entity-level edit serialization across /update,
            /evolve, /cla extend, and future writers. Keyed on
            (entity_type, entity_name). First-acquirer wins; stale takeover
            after 24h with explicit REFUSE if prior holder was in
            awaiting_review/reviewing phase.

            Companion functions:
              ops.acquire_entity_edit_lock(p_entity_type, p_entity_name,
                p_holder_kind, p_holder_run_id, p_session_id) -> JSONB
              ops.release_entity_edit_lock(p_entity_type, p_entity_name,
                p_holder_run_id) -> BOOLEAN

            Replaces /evolve's pre-v1.0 `WHERE agent_slug='evolve'` against
            ops.agent_runs (Sprint 1 refactor; behind feature flag
            evolve_uses_universal_lock per @cto NIT 4 staged migration).

            Tier C decision: ops.decisions[a683a371-0611-49c7-9650-53503027d60e].
            Spec: wiki/capabilities/update/spec.md §4 (after Phase 8 promotion);
            draft .archives/cla/update/spec.md.
        # ====================================================================
        # Capability `update` v1.0 — citation spine (Sprint 2)
        # ====================================================================
        - name: v_entity_update_lineage
          migration_file: supabase/migrations/00041_v_entity_update_lineage.sql
          kind: view
          status: live
          purpose: |
            Chronological lineage of /update runs per entity. One row per
            agent_run with agent_slug='update'; LEFT JOINs evolve_extractions
            bucket counts (auto_accepted, pending_review, rejected_low_confidence,
            founder_accepted, founder_rejected, founder_edited).

            lineage_depth column: 0 = most recent run for the (entity_type,
            entity_slug) pair; 1 = next prior; etc. Lets /update history
            filter to the most-recent or walk the chain.

            Consumed by:
              /update history <type> <name> (command subcommand)
              KPI entity_update_run_count_monthly (aggregates this view)
              founder ad-hoc audits

            Sprint 4 of capability `update` v1.0.
        - name: evolve_extractions
          migration_file: supabase/migrations/00040_evolve_extractions.sql
          status: live
          purpose: |
            Citation spine for /update distill outputs (and future /evolve
            --refs). Every proposed entity change traces to a ref chunk
            (ref_path + ref_chunk_index) with raw_quote + proposed_change +
            confidence + review_state.

            3-bucket confidence convention (per wiki-sync/distill calibration):
              confidence >= 0.85 → auto_accepted (terminal-on-insert)
              0.6 <= confidence < 0.85 → pending_review (founder reviews)
              confidence < 0.6 → rejected_low_confidence (terminal-on-insert)

            Review state machine (enforced by trigger):
              pending_review → founder_accepted | founder_rejected | founder_edited
              auto_accepted, rejected_low_confidence: terminal-on-insert
              founder_* states: terminal once set
            Activates the L1 invariant `evolve-extractions-review-state-machine-valid`
            (was `status: deferred` post-Sprint 1; flipped to `live` Sprint 2).

            Naming uses `evolve_` prefix because the table lives in the shared
            eval-evo skill folder convention. /update is the v1.0 writer;
            future /evolve --refs (if approved v1.1) could also write here.

            Tier C decision: ops.decisions[a683a371-0611-49c7-9650-53503027d60e].
            Spec: wiki/capabilities/update/spec.md §4 (after Phase 8 promotion);
            draft .archives/cla/update/spec.md.
        # ====================================================================
        # Capability `deepask` v1.0 — observability + learning substrate (Sprint 1)
        # ====================================================================
        - name: deepask_runs
          migration_file: supabase/migrations/00045_deepask_observability.sql
          status: live
          purpose: |
            One audit row per /deepask query (incl. --dry-run rows). Columns:
            id, ts, caller_role, question, format, depth, sources_filter,
            dry_run, verdict ('COMPLETE'|'PARTIAL'; NULL while running),
            sub_need_count, resolver_find_calls (breaker-budget accounting vs
            SESSION_HARD_CAP=20), recipients_touched jsonb, artifact_path,
            cost_usd, latency_ms, metadata jsonb.
            Powers the 3 deepask KPIs (complete_verdict_rate, uncited_claim_rate,
            breaker_trip_rate) and a future /evolve target. Mirrors
            ops.resolver_decisions (00034). RLS: founder + etl-runner full;
            other roles read own caller_role.
            Tier C decision: ops.decisions[861f8eb4-6572-4df5-b1cc-44aac0a7b014].
            Spec: wiki/capabilities/deepask/spec.md (after Phase 8 promotion);
            draft .archives/cla/deepask/spec.md.
        - name: deepask_coverage
          migration_file: supabase/migrations/00045_deepask_observability.sql
          status: live
          purpose: |
            One row per decomposed sub-need of a deepask run. Columns: id,
            run_id (FK ops.deepask_runs ON DELETE CASCADE), sub_need,
            ia_type ('A'|'B'|'C'|'D'), planned_recipients jsonb (from
            ResolverPlan v1), executed jsonb, got_data bool, gap_reason
            (no_match|stale|empty|not_built|breaker_budget), remedy.
            The honest-no-coverage spine: every PARTIAL verdict traces to
            per-sub-need gap rows here. RLS inherits parent run's caller_role.
        # ====================================================================
        # Capability `book-to-capability` (/forge) v0.1 — provenance view (Sprint 2)
        # ====================================================================
        - name: v_forge_lineage
          migration_file: supabase/migrations/00046_v_forge_lineage.sql
          kind: view
          status: live
          purpose: |
            Provenance of /forge runs. One row per agent_run with
            agent_slug='forge'; reads input_payload.need + output_payload.
            {forge_verdict, route, entity_target, spawned_run_id}; LEFT JOINs
            ops.evolve_extractions for the citation spine. source_refs (array)
            expresses the many-to-many: 1 capability <- N sources per row;
            unnest source_refs across rows for 1 source -> N capabilities.
            lineage_depth: 0 = most recent forge run touching an entity_target.
            NO new table — verdict sink = ops.agent_runs.output_payload (gps
            cannot write ops.decisions, invariant #4). Mirrors
            v_entity_update_lineage. Sprint 2 of capability book-to-capability;
            applied to ritsu-ops post-merge (empty until first /forge run).
    metrics:
      description: ETL'd snapshots of Product metrics (read-only mirror) + derived rollup views
      tables:
        - name: product_dau_snapshot
          migration_file: supabase/migrations/00019_metrics_schema_product_mirror.sql
          status: live
          source: product.supabase via scheduled ETL
          refresh: hourly
          note: |
            Table exists as structural placeholder. ETL flow
            etl_flows.product_metrics_to_ops is still `planned` — no rows yet.
        - name: gbrain_cost_daily
          migration_file: supabase/migrations/00037_metrics_gbrain_cost_daily_view.sql
          kind: view
          status: live
          source: ops.cost_attributions (filtered to cost_bucket LIKE 'gbrain.%')
          refresh: real_time
          note: |
            v1.0 (2026-05-25, capability gbrain-operational-brain v1.0 Sprint 3
            migration 00037). Daily rollup view of gbrain.* cost-bucket entries,
            split by role + op. Consumed by synthesize-morning-brief, cost-report,
            brain.cost_usd_monthly_rolling30d KPI, and Sprint 5 .mcp.json wrapper
            scripts/pre-budget-check.sh for $100/mo HARD cap enforcement
            (Hard-cap Option B graceful degrade).
  public_schema:
    description: |
      Schema `public` holds customer-entity tables (00005_customer_entity.sql):
      customers, persons, companies, company_persons + materialized view
      mv_customer_360. These are Operating-AI-owned (CRM-style), distinct from
      Product user data which never appears here.
    tables: [customers, persons, companies, company_persons, mv_customer_360]
  isolation:
    cannot_write_to:
      - project: ritsu  # the Product Supabase
        rationale: |
          Operating AI must not be able to harm paying users. Even read access
          to product.* should go through views in metrics.* populated by ETL,
          not direct queries. The ONLY role holding the product read key is
          `etl-runner` (governance/SECRETS.md).

# ---------------------------------------------------------------------------
# TIER 3 — Events & Artifacts (Supabase Storage / S3-compatible)
# ---------------------------------------------------------------------------
# Append-only. Immutable. Every item has a stable URI.
tier3_events:
  storage: supabase_storage
  buckets:
    - name: ops-transcripts
      purpose: Founder voice notes, calls, agent conversations exported.
      retention: indefinite
      naming: "yyyy/mm/dd/<source>-<id>.{json,txt,mp3}"
    - name: ops-artifacts
      purpose: Generated content drafts, screenshots, exported reports.
      retention: 365d
    - name: ops-agent-logs
      purpose: Full agent action logs (also indexed in tier 2 agent_runs).
      retention: 90d
  index_table: ops.tier3_index  # in Tier 2 — every blob has a row here

# ---------------------------------------------------------------------------
# TIER 4 — Derived (Vector DB + caches)
# ---------------------------------------------------------------------------
# Never authoritative. Always rebuildable.
# Implementation: pgvector inside the ritsu-ops Postgres
# (ops.knowledge_embeddings, HNSW index from migration 00006). NOT a separate
# external vector store.
tier4_derived:
  vector_store:
    provider: pgvector  # in-database, via ops.knowledge_embeddings
    physical_table: ops.knowledge_embeddings
    index_method: HNSW (vector_cosine_ops)
    migration_file: supabase/migrations/00006_knowledge_graph.sql
    namespaces:
      # Namespaces are logical partitions inside ops.knowledge_embeddings,
      # distinguished by source_kind + source_ref columns. Rebuild scripts
      # populate the same table with different source_kind values.
      - name: charter_embeddings
        source: tier1_canonical.charter
        source_kind: charter_page
        rebuild_script: scripts/sync/rebuild-charter-embeddings.sh
        status: planned
      - name: skills_embeddings
        source: 05-ai-ops/skills/
        source_kind: skill
        rebuild_script: scripts/sync/rebuild-skills-embeddings.sh
        status: planned
      - name: transcripts_embeddings
        source: tier3_events.buckets[ops-transcripts]
        source_kind: tier3_blob
        rebuild_script: scripts/sync/rebuild-transcripts-embeddings.sh
        status: planned
      # Added per Sprint 1 of wiki-sync-from-refs (Bài #14 + Bài #18):
      # v4.0 update (Sprint 1, 2026-05-18): source-grouped layout. Embeddings
      # are page_id-keyed (file_path-agnostic) so re-embed only triggers when
      # the migrate-to-v4 script UPDATEs file_path on existing rows.
      - name: wiki_embeddings
        source: tier1_canonical.wiki (the wiki/ folder; v4.0 source-grouped layout)
        source_kind: wiki_page          # matches knowledge_pages.page_type values (singular per CHECK enum); file_path is now wiki/<source-slug>/source.md (source RECORDs) or wiki/<source-slug>/<page_type>s/<entity-slug>.md (derived)
        rebuild_script: scripts/sync/rebuild-wiki-embeddings.sh
        status: planned                  # advances to `active` when Sprint 4 lands
  cache_layer:
    provider: TBD  # candidates: Upstash Redis, Cloudflare KV
    purpose: Memoize expensive LLM calls and tool results.

# ---------------------------------------------------------------------------
# Cross-tier ETL flows
# ---------------------------------------------------------------------------
etl_flows:
  - name: product_metrics_to_ops
    direction: product_supabase -> ritsu_ops
    mode: read_only
    cadence: hourly
    implementation: supabase/functions/_shared/worker.ts (makeEtlProductDauSnapshotHandler)
    scheduled_via: knowledge/schedules.yaml (id=etl-product-dau-hourly)
    status: code_ready_secrets_pending
    rationale: |
      Operating AI needs DAU, MRR, churn to make growth/delivery decisions
      without ever touching the production database directly.
    activation_requires: |
      Founder must provision SUPABASE_PRODUCT_URL and
      SUPABASE_PRODUCT_READONLY_ETL_KEY into the minion-worker Edge Function
      env. This is a D-MAX action per governance/HITL.md (any access to
      Product Supabase). Until provisioned, the hourly fire returns
      `deferred_no_product_supabase_key` and writes nothing.
    product_contract:
      view: v_ops_dau_export
      owner: product team (separate repo)
      columns: |
        snapshot_at timestamptz, dau int, wau int, mau int,
        new_signups_24h int, paid_users int, free_users int,
        churned_users_24h int, extra jsonb
  - name: analytics_sync_nightly
    direction: product_supabase -> ritsu_analytics
    mode: read_only
    cadence: nightly
    implementation: in-DB pg_cron on ritsu-analytics (cron.job analytics-sync-nightly '0 11 * * *' UTC) calling live.sync_all()
    scheduled_via: in_db_pg_cron (NOT knowledge/schedules.yaml — that registry is for the ops dispatcher; this runs inside the ritsu-analytics DB)
    status: operating
    capability_id: product-db-readonly-access
    rationale: |
      Door 2 of product-db-readonly-access: ops AI answers behavioral / unit-
      economics questions from Product-derived data without touching Product and
      without raw PII. Product builds PII-stripped + HMAC-hashed views; analytics
      pulls ONLY those (postgres_fdw) into live.*; identity + content never cross.
    activation_requires: |
      Product-side (founder D-MAX, already applied PoC): analytics_export.* views +
      analytics_secret salt + uh() + analytics_export_ro role. Analytics-side
      ([A], applied): FDW + staging→canary→swap + analytics_reader role. Expanding
      synced_tables is a founder D-MAX product-side DDL touch (Sprint 3 applied
      2026-06-03: PoC-3 → 17 views = behavioral/billing/config core).
    product_contract:
      views: "analytics_export.* — 30 PII-stripped views incl. REVENUE (payments/lemon_variants/credit_packs — LemonSqueezy) (canonical list = knowledge/analytics-sync-contract.yaml synced_tables; PoC-3 → 17 Sprint 3 → 30 Sprint 5)"
      owner: product DB (founder-applied; local-only SQL in the brainstorm dir)
      privacy: "user_hash = HMAC(user_id, product-held salt); email/name/content DROPPED; PII-canary=0 enforced before each swap"
    consumer: "mcp__supabase-analytics__{query,list_tables} as analytics_reader (SELECT live.* only)"
    contract: knowledge/analytics-sync-contract.yaml + SOP-AIOPS-009
    freshness_kpi: analytics_sync_freshness  # ≤26h SLO
  - name: tier3_to_tier4_embeddings
    direction: storage -> vector_store
    cadence: nightly
    script: scripts/sync/embed-new-artifacts.sh
    status: planned

# ---------------------------------------------------------------------------
# Secrets & access — pointer to governance/SECRETS.md
# ---------------------------------------------------------------------------
# Secrets never live in this file or anywhere in the repo. This is the high-
# level map; the canonical role-to-secret matrix lives in governance/SECRETS.md
# and the values live in the chosen secret manager (TBD: 1Password Service
# Accounts recommended; see SECRETS.md).
secrets_map:
  policy_doc: governance/SECRETS.md
  manager:
    provider: TBD
    candidates:
      - 1password_service_accounts
      - doppler
      - supabase_vault  # for DB-internal only
  critical_boundaries:
    - boundary: product_database_isolation
      rule: |
        Only role 'etl-runner' holds SUPABASE_PRODUCT_READONLY_ETL_KEY.
        SUPABASE_PRODUCT_FULL_SERVICE_KEY does not exist in this repo's
        secret manager — it lives in the product repo. Operating AI cannot
        write to ritsu (Product Supabase).
    - boundary: stripe_money_movement
      rule: |
        No agent role holds any Stripe key that can move money. Refunds and
        charges require founder action via Tier C/D ceremony per HITL.md.
    - boundary: github_force_actions
      rule: |
        No agent PAT has permission to merge, approve, or force-push. Only
        GITHUB_TOKEN_FOUNDER (founder-only) has those capabilities.

# ---------------------------------------------------------------------------
# How to add a new data source (checklist for agents and humans)
# ---------------------------------------------------------------------------
add_new_source_checklist:
  - decide_tier: Is this canonical, operational, event, or derived?
  - if_tier1: Add file under appropriate pillar; open PR.
  - if_tier2: Write migration in supabase/migrations/ (next sequence number); add entry under tier2_operational.schemas with migration_file pointer; open PR; apply with `supabase db push` after merge.
  - if_tier3: Add bucket entry under tier3_events; document naming convention; insert blobs via Edge Function that also writes ops.tier3_index; open PR.
  - if_tier4: Add a new namespace under tier4_derived with source_kind value; write rebuild script in scripts/sync/ that inserts into ops.knowledge_embeddings; open PR.
  - update_etl: If cross-tier, add to etl_flows.
  - update_secrets_map: If new credentials needed.

