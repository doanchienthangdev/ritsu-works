# ---------------------------------------------------------------------------
# TIER 1 — Canonical (this repo)
# ---------------------------------------------------------------------------
tier1_canonical:
  storage: git
  repo: doanchienthangdev/ritsu-works
  branch_protection: main  # PRs required; see governance/HITL.md

  # Pillar architecture v1.0.1: two-layer model (evergreen functional + stage composition)
  # Total: 11 pillars (10 evergreen + 1 stage), 6 DEEP at this stage, 3 LITE, 2 skeleton
  pillars:
    core:
      path: 00-core/
      layer: evergreen
      stage_status: maintenance
      pillar_code: CORE
      contents: [vision, mission, values, product, glossary, brand_voice, founder_profile, transparency, north_star, icp_summary, positioning, principles, ai_native_philosophy, design_system, wedge, pricing_philosophy, operating_cadence, decision_rights_narrative, INDEX]
      change_policy: pr_human_review
      status: alive
      sub_files:
        expected:
          - {file: product.md, status: canonical, layer: identity, auto_load: true}
          - {file: brand_voice.md, status: canonical, layer: identity, auto_load: true}
          - {file: transparency.md, status: canonical, layer: identity, auto_load: true}
          - {file: charter.md, status: canonical, layer: identity, auto_load: false}
          - {file: founder-profile.md, status: canonical, layer: identity, auto_load: false, walker_excluded: true}
          - {file: values.md, status: v0.1-draft, layer: identity, auto_load: false, revisit_at: 30-paying}
          - {file: ai-native-philosophy.md, status: v0.1-draft, layer: identity, auto_load: false, revisit_at: 30-paying}
          - {file: north-star.md, status: canonical, layer: strategy, auto_load: false}
          - {file: icp-summary.md, status: canonical, layer: strategy, auto_load: false}
          - {file: positioning.md, status: canonical, layer: strategy, auto_load: false}
          - {file: principles.md, status: v0.1-draft, layer: operating, auto_load: false, revisit_at: 30-paying}
          - {file: glossary.md, status: stub, layer: meta, entry_condition: "first 10 SOPs land"}
          - {file: design-system.md, status: canonical, layer: brand-design, auto_load: false}   # graduated stub→canonical 2026-06-01 (capability design-system-styling, G1); companion folder 00-core/design-system/<name>/ holds the owned DESIGN.md systems
          - {file: wedge.md, status: stub, layer: strategy, entry_condition: "SOP-PRODUCT-002 N=10 strangers complete"}
          - {file: pricing-philosophy.md, status: stub, layer: strategy, entry_condition: "first SOP-PRODUCT-010 pricing-pull-test"}
          - {file: operating-cadence.md, status: stub, layer: operating, entry_condition: "cofounder formal join OR 50 paying users"}
          - {file: decision-rights-narrative.md, status: stub, layer: operating, entry_condition: "cofounder formal join"}
          - {file: INDEX.md, status: canonical, layer: meta, auto_load: false}
          - {file: README.md, status: canonical, layer: meta, auto_load: false}
        validator: scripts/cross-tier/validate-core-pillar.cjs
        command: .claude/commands/core.md
        skill: 06-ai-ops/skills/core-management/core-fill/SKILL.md
        helpers:
          - scripts/core/lib/frontmatter.cjs
          - scripts/core/compose.cjs
          - scripts/core/reindex.cjs
          - scripts/core/validate.cjs
      note: |
        Renamed 2026-05-21 from "charter" → "core" (more general — contains
        ALL ritsu-works core docs, not just the charter spec). Folder
        renamed 00-charter/ → 00-core/. The charter spec (charter.md) lives
        inside this pillar as one of multiple core docs. SOP namespace
        unchanged (no SOPs under this pillar yet). docs-engine charter-
        adapter retained name for now (walks 00-core/*.md unchanged).

    marketing:
      path: 01-marketing/
      layer: evergreen
      stage_status: lite
      pillar_code: MARKETING
      sops_namespace: SOP-MARKETING-NNN
      sub_pillars: [icp, brand-voice-kit, content-templates]
      composes_from: [core]
      note: |
        Brand, positioning, content engine, ICP definition. Modules feed GTM.
        Defer SEO-deep, brand campaigns, partnerships until post-PMF.

    sales:
      path: 02-sales/
      layer: evergreen
      stage_status: lite
      pillar_code: SALES
      sops_namespace: SOP-SALES-NNN
      sub_pillars: [pricing-tiers, conversion-funnel, plg-self-serve, free-to-paid-triggers]
      composes_from: [marketing, product]
      note: |
        Pricing experiments, conversion funnel, free→paid mechanics. Modules feed GTM.
        Defer outbound + enterprise until 1 paying ≥$500/mo OR 3 enterprise leads.

    gtm:
      path: 03-gtm/
      layer: stage
      stage_status: deep
      pillar_code: GTM
      sops_namespace: SOP-GTM-NNN
      sub_pillars:
        - icp-and-segmentation
        - launch-sequence
        - distribution-engine
        - funnel-orchestration
        - pmf-instrumentation
        - collison-install-protocol
      composes_from: [marketing, sales, product, customer, ai-ops, metrics]
      dissolves_when: "≥100 paying retained 30d AND NPS ≥40 AND week-4 retention ≥25%"
      note: |
        Stage composition pillar. Drives "100 paying customers who love" goal.
        Dissolves on PMF; sub-pillars relocate per dissolution-target mapping
        in .archives/pillars/PLAN.md §4.1.

    product:
      path: 04-product/
      layer: evergreen
      stage_status: deep
      pillar_code: PRODUCT
      sops_namespace: SOP-PRODUCT-NNN
      sub_pillars:
        - wedge-discovery
        - build-loop
        - feedback-pipeline
        - pricing-experiments
        - ab-test-discipline
      composes_from: [core, sales]
      critical_pg_gate: "SOP-PRODUCT-002 mandates N=10 strangers observed using product before any major feature build"

    customer:
      path: 05-customer/
      layer: evergreen
      stage_status: deep
      pillar_code: CUSTOMER
      sops_namespace: SOP-CUSTOMER-NNN
      sub_pillars:
        - success
        - onboarding
        - support
        - retention
        - feedback-and-research
        - customer-data
      composes_from: [product, founder, metrics]
      critical_pg_gate: "SOP-CUSTOMER-006 = founder personally onboards first ~30 paying via Zoom; SOP-CUSTOMER-009 automates from N=31"
      note: |
        Big pillar covering full customer lifecycle. Renamed from 05-customer-success
        (success is now sub-pillar `success`). Matches public.customers + persons +
        companies schema (00005_customer_entity.sql).

    ai_ops:
      path: 06-ai-ops/
      layer: evergreen
      stage_status: deep
      pillar_code: AIOPS
      sops_namespace: SOP-AIOPS-NNN
      sub_pillars:
        - sop-engine
        - skill-library
        - mcp                                 # Merged from old mcp-tooling + integrations-as-mcp
        - hooks-enforcement
        - cost-budget-architecture
        - episodic-memory-architecture
        - cross-tier-consistency
        - workforce-personas                  # v1.0.2 — C-suite façade layer (see knowledge/workforce-personas.yaml)
        - eval-evo                            # v1.0 (2026-05-22) — /evolve self-improvement loop (capability `evolve`)
        - gbrain                              # v1.0 (2026-05-25) — Type 4 Semantic Memory governed extension (capability `gbrain-operational-brain`)
      composes_from: []
      status: alive  # skills/ + sops/ exist on disk

    trust_safety:
      path: 07-trust-safety/
      layer: evergreen
      stage_status: skeleton
      pillar_code: TS
      sops_namespace: SOP-TS-NNN
      sub_pillars: []
      entry_conditions:
        - "First DMCA notice received → SOP-TS-002-dmca-evaluation"
        - "First ToS report → SOP-TS-003-tos-violation-classification"
        - "First hallucination incident → SOP-TS-004-hallucination-triage"
        - "EU launch confirmed → GDPR-deep sub-pillar"
        - "100 paying users milestone → proactive content moderation review"
      note: |
        B2C EdTech-specific. Copyright/DMCA, hallucination guardrails, GDPR/PDPA,
        minor users (under 18), user-uploaded content moderation. Active only when
        first incident.

    finance:
      path: 08-finance/
      layer: evergreen
      stage_status: skeleton
      pillar_code: FIN
      sops_namespace: SOP-FIN-NNN
      sub_pillars: []
      entry_conditions:
        - "50 paying users → invoicing-prep + tax-classification sub-pillars"
        - "VN entity formed → placeholders/compliance-vn (separate pillar)"
        - "$10K MRR → accounting-tool integration sub-pillar"
        - "Founder decides to raise → investor-financials sub-pillar"
      note: Vietnam-specific tax & compliance context. Stripe revenue tracking, runway calculator, invoice prep.

    founder:
      path: 09-founder/
