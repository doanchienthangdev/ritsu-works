# ============================================================================
# design-systems.yaml — Design-system registry (capability design-system-styling)
# ============================================================================
# Single index for the universal --style=<name> output layer. SPLIT registry:
#   - owned/canonical  → Tier-1 00-core/design-system/<name>/ (PR-governed identity)
#   - downloaded/built  → runtime/design-systems/<name>/ (gitignored, re-downloadable cache)
#
# registration != materialization (AD-2): a system may be registered metadata-
# first (status: not_cached / pending) and materialized lazily on first --style use.
#
# Schema: knowledge/schemas/design-systems.schema.json
# Gate:   scripts/cross-tier/validate-design-systems.cjs (structural + file-existence)
# Spec:   wiki/capabilities/design-system-styling/spec.md (after Phase 8 promotion;
#         draft .archives/cla/design-system-styling/spec.md). Decision bf3a6323.
# ============================================================================

version: "1.0.0"
