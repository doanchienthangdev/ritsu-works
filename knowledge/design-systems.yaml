  # INSTALLED Sprint 2: DESIGN.md + assets/ + previews live in 00-core/design-system/ritsu/;
  # the 00-core/design-system.md stub graduated stub → canonical (G1).
  - name: ritsu
    origin: owned
    source: built-from-repo
    source_ref: /Users/doanchienthang/omg/ritsu
    path: 00-core/design-system/ritsu/DESIGN.md
    status: installed
    license: null
    last_synced: "2026-06-01"
