# link-inference-rules.yaml — Knowledge graph (Bài #14)
# Auto-link extraction patterns (zero-LLM regex)
version: "1.0.0"

link_types:
  - id: works_at
    pattern: "(?:works at|employed by|employee of) \\[\\[company/([^\\]]+)\\]\\]"
    source_type: person
    target_type: company
  
  - id: founded
    pattern: "(?:founded|founder of|created) \\[\\[(?:company|organization)/([^\\]]+)\\]\\]"
    source_type: person
    target_type: company

  # Added per Sprint 1 of wiki-sync-from-refs:
  - id: cites
    pattern: "\\[\\[(?:article|book|episode|repo|paper)/([^\\]]+)\\]\\]"
    source_type: any
    target_type: any
    description: "Page cites another wiki page as a source/reference."

  - id: defines
    pattern: "(?:defined in|definition from) \\[\\[concept/([^\\]]+)\\]\\]"
    source_type: any
    target_type: concept

  - id: references_section
    pattern: "(?:see|cf\\.|cf|see also) \\[\\[(?:book|article)/([^\\]]+)#([^\\]]+)\\]\\]"
    source_type: any
    target_type: any
    description: "References a specific section in another page (page#section anchor)."

  # Added per Sprint 2 PR3 of wiki-sync-from-refs (G2 — concept→concept coverage):
  - id: related_concept
    pattern: "(?:see also|cf\\.) \\[\\[concept/([^\\]]+)\\]\\]"
    source_type: any
    target_type: concept
    description: "Informal cross-reference between concepts via 'see also' or 'cf.' prefix. Sprint 2 PR3 / v2.0.0 — fills the gap where `cites` excludes concept/ and `references_section` requires #anchor."

  # NOTE on evaluation order (CTO NIT 2): rules are evaluated top-to-bottom.
  # `related_concept` MUST fire before any future generalized prefix rule that
  # also matches `(see also)` or `(cf.)`, or it gets silently swallowed.
  # Today no such generalized rule exists; if/when one is added, place it BELOW
  # this entry OR write its prefix to explicitly exclude `(see also|cf\.)`.

  - id: transcribes
    pattern: "(?:transcript of|verbatim from) \\[\\[(?:episode|meeting)/([^\\]]+)\\]\\]"
    source_type: any
    target_type: any

  - id: excerpted_from
    pattern: "(?:excerpted from|quoting) \\[\\[(?:book|article|episode|meeting)/([^\\]]+)\\]\\]"
    source_type: any
    target_type: any
