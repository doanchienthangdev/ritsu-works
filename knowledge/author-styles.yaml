    one_line: "The physician-scientist who carried the laboratory into the schoolroom and knelt at what she saw: she builds every argument from one precisely-watched child (an age, an exact act, 'forty-two times'), extracts the law in a short flat verdict, redefines the reader's sure words by reversal (discipline, reward, 'teacher'), makes the invisible mind visible with an embryo parable or a homely picture, condemns the prize as 'the bench of the soul', and lifts the single child up the scale until he is 'fashioning humanity itself' — reverent, never cynical, closing on hope."
