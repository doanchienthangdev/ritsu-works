# ============================================================================
# Cross-Tier Invariants — Ritsu Works Consistency Engine
# ============================================================================
# Declarative manifest of relationships between Tier 1 git artifacts, Tier 2
# Supabase ops state, and (later) Tier 3/4 derived artifacts. Consumed by:
#   - L1 pre-commit: structural invariants (file existence, basic refs)
#   - L2 CI validators: cross-tier checks (manifest ↔ DB, skills ↔ tables, ...)
#   - L3 AI nightly sweep (v1.0b+): semantic invariants with ai_check_prompt
#
# Schema: knowledge/schemas/cross-tier-invariants.schema.json
# Background: .archives/ceo-plans/2026-05-14-cross-tier-consistency-engine.md
# ============================================================================

version: "1.0.0"

invariants:
  # --------------------------------------------------------------------------
  # Schema snapshot freshness (L3 deferred — needs Docker/pg_dump)
  # --------------------------------------------------------------------------
  # In v1.0a we skip the snapshot file; L2 validators read directly from
  # supabase/migrations/*.sql (concatenated). When a snapshot file is added
  # in v1.0b (via Docker or direct pg_dump), this invariant turns on.
  - id: snapshot-header-matches-newest-migration
    description: "supabase/schema-snapshot.sql header must reference the newest migration file"
    kind: header_match
    layer: L3
    status: deferred
    source:
      tier: 1
      ref: supabase/schema-snapshot.sql
      query: "header:last_migration"
    target:
      tier: 1
      ref: supabase/migrations/
      query: "ls | sort -V | tail -1"
    severity: critical
    hitl_tier: B
    fix_strategy: regen_bundle
    notes: |
      Deferred — no snapshot file in v1.0a/b/c. Activates when v1.0d adds
      `supabase db dump` pipeline (requires Docker or direct pg_dump).

  # --------------------------------------------------------------------------
  # Manifest ↔ migrations (L2 — derived from concatenated migrations)
  # --------------------------------------------------------------------------
  - id: manifest-tier2-tables-subset
    description: "Every table listed in manifest.tier2_operational.schemas.ops MUST be CREATE TABLE'd by some migration"
    kind: subset
    layer: L2
    source:
      tier: 1
      ref: knowledge/manifest.yaml
      query: "$.tier2_operational.schemas.ops.tables[*].name"
    target:
      tier: 1
      ref: supabase/migrations/
      query: "regex:CREATE TABLE (?:IF NOT EXISTS )?ops\\.([a-z_]+)"
    severity: critical
    hitl_tier: C
    fix_strategy: patch_yaml

  - id: manifest-tier2-metrics-tables-subset
    description: "Every table listed in manifest.tier2_operational.schemas.metrics MUST be CREATE TABLE'd by some migration"
    kind: subset
    layer: L2
    source:
      tier: 1
      ref: knowledge/manifest.yaml
      query: "$.tier2_operational.schemas.metrics.tables[*].name"
    target:
      tier: 1
      ref: supabase/migrations/
      query: "regex:CREATE TABLE (?:IF NOT EXISTS )?metrics\\.([a-z_]+)"
    severity: critical
    hitl_tier: C
    fix_strategy: patch_yaml

  # --------------------------------------------------------------------------
  # Manifest migration_file paths must exist (L1, deterministic)
  # --------------------------------------------------------------------------
  - id: manifest-migration-file-refs-exist
    description: "Every migration_file: path in manifest.yaml must point to an existing file"
    kind: exists
    layer: L1
    source:
      tier: 1
      ref: knowledge/manifest.yaml
      query: "$..migration_file"
    target:
      tier: 1
      ref: "."
      query: "file:exists"
    severity: critical
    hitl_tier: B
    fix_strategy: patch_yaml

  - id: manifest-extended-by-paths-exist
    description: "Every extended_by: path in manifest.yaml must point to an existing migration file"
    kind: exists
    layer: L1
    source:
      tier: 1
      ref: knowledge/manifest.yaml
      query: "$..extended_by"
    target:
      tier: 1
      ref: "."
      query: "file:exists"
    severity: critical
    hitl_tier: B
    fix_strategy: patch_yaml

  # --------------------------------------------------------------------------
  # Schedules ↔ skill registry (L2)
  # --------------------------------------------------------------------------
  - id: schedules-skills-registered
    description: "Every `skill:` referenced in schedules.yaml must be in minion-worker SKILL_REGISTRY"
    kind: subset
    layer: L2
    source:
      tier: 1
      ref: knowledge/schedules.yaml
      query: "$.schedules[*].skill"
    target:
      tier: 1
      ref: supabase/functions/minion-worker/index.ts
      query: "regex:\"([a-z-]+)\":\\s*make[A-Z]"
    severity: critical
    hitl_tier: B
    fix_strategy: open_pr

  # --------------------------------------------------------------------------
  # Skills/Edge Functions ↔ DB tables (L2)
  # --------------------------------------------------------------------------
  - id: code-table-references-exist
    description: "Every `.from('<table>')` in supabase/functions/ must reference a table CREATE'd by some migration"
    kind: subset
    layer: L2
    source:
      tier: 1
      ref: "supabase/functions/"
      query: "regex:\\.from\\(['\"]([a-z_]+)['\"]\\)"
    target:
      tier: 1
      ref: supabase/migrations/
      query: "regex:CREATE TABLE (?:IF NOT EXISTS )?(?:ops|metrics|public)\\.([a-z_]+)"
    severity: critical
    hitl_tier: B
    fix_strategy: open_pr

  # --------------------------------------------------------------------------
  # Governance ROLES ↔ skills (L2)
  # --------------------------------------------------------------------------
  - id: roles-skills-exist
    description: "Every skill mentioned in governance/ROLES.md must exist under 05-ai-ops/skills/"
    kind: subset
    layer: L2
    source:
      tier: 1
      ref: governance/ROLES.md
      query: "regex:^\\s*-\\s+([a-z][a-z0-9-]+)\\s*$"
    target:
      tier: 1
      ref: 05-ai-ops/skills/
      query: "ls"
    severity: warn
    hitl_tier: B
    fix_strategy: manual_only
    notes: |
      ROLES.md is prose-heavy; the regex query is best-effort. False positives
      acceptable in v1.0a; refine in v1.1 with marker comments.

  # --------------------------------------------------------------------------
  # HITL.md tier classifications ↔ enforcement hooks (L2)
  # --------------------------------------------------------------------------
  - id: hitl-tier-d-actions-have-hook-or-exemption
    description: "Every Tier D action in governance/HITL.md must have an enforcement hook in .claude/hooks/ OR be marked not_enforced"
    kind: implies
    layer: L2
    source:
      tier: 1
      ref: governance/HITL.md
      query: "section:Tier D"
    target:
      tier: 1
      ref: .claude/hooks/
      query: "ls"
    severity: warn
    hitl_tier: C
    fix_strategy: manual_only
    notes: |
      v1.0a uses heuristic mapping. v1.1 will introduce explicit
      hitl_action_id ↔ hook_file marker comments for exact coverage.

  # --------------------------------------------------------------------------
  # Schedules bundle freshness (L1)
  # --------------------------------------------------------------------------
  - id: schedules-bundle-matches-yaml
    description: "schedules.generated.ts must match the current schedules.yaml (regenerate via wave2-bundle-schedules.cjs)"
    kind: equal
    layer: L1
    source:
      tier: 1
      ref: knowledge/schedules.yaml
      query: "$.schedules[*].id"
    target:
      tier: 1
      ref: supabase/functions/_shared/schedules.generated.ts
      query: "regex:^\\s*\"([a-z][a-z0-9-]+)\":\\s*\\{"
    severity: critical
    hitl_tier: A
    fix_strategy: regen_bundle

  # --------------------------------------------------------------------------
  # Event subscriptions ↔ event types emitted (L2)
  # --------------------------------------------------------------------------
  - id: event-subscriptions-types-exist
    description: "Every event_type in event-subscriptions.yaml must appear in at least one emitter (migration COMMENT, skill, hook) OR be marked as external"
    kind: implies
    layer: L2
    source:
      tier: 1
      ref: knowledge/event-subscriptions.yaml
      query: "$..event_type"
    target:
      tier: 1
      ref: "supabase/migrations/, supabase/functions/, 05-ai-ops/skills/"
      query: "regex:event_type[\"':\\s]+([a-z][a-z0-9._-]+)"
    severity: warn
    hitl_tier: B
    fix_strategy: manual_only

  # --------------------------------------------------------------------------
  # Schema snapshot existence (L3 deferred — see snapshot-header invariant)
  # --------------------------------------------------------------------------
  - id: schema-snapshot-exists
    description: "supabase/schema-snapshot.sql must exist"
    kind: exists
    layer: L3
    status: deferred
    source:
      tier: 1
      ref: supabase/schema-snapshot.sql
      query: "file:exists"
    target:
      tier: 1
      ref: "."
      query: "file:exists"
    severity: critical
    hitl_tier: A
    fix_strategy: regen_bundle
    notes: |
      Deferred — needs Docker or direct pg_dump. Activates with v1.0d.

  # --------------------------------------------------------------------------
  # Live-DB invariants (L3, runnable in v1.0c via ops.get_ops_* RPC helpers)
  # --------------------------------------------------------------------------
  - id: live-db-tables-match-manifest
    description: "Every ops.* table in live DB must appear in manifest.tier2_operational.schemas.ops.tables"
    kind: subset
    layer: L3
    status: live
    source:
      tier: 2
      ref: "ops.*"
      query: "rpc:ops.get_ops_tables"
    target:
      tier: 1
      ref: knowledge/manifest.yaml
      query: "$.tier2_operational.schemas.ops.tables[*].name"
    severity: critical
    hitl_tier: C
    fix_strategy: patch_yaml
    notes: |
      Mirror of L2 manifest-tier2-tables-subset but uses LIVE DB (not migrations
      on disk). Catches drift introduced via Supabase UI direct edits.

  - id: live-db-tables-have-rls
    description: "Every ops.* table in live DB should have RLS enabled"
    kind: implies
    layer: L3
    status: live
    source:
      tier: 2
      ref: "ops.*"
      query: "rpc:ops.get_ops_rls_state"
    target:
      tier: 2
      ref: "ops.*"
      query: "rpc:ops.get_ops_rls_state[rls_enabled=true]"
    severity: warn
    hitl_tier: B
    fix_strategy: add_migration
    notes: |
      Catches the failure pattern seen with capability_runs and
      capability_phase_events — added in migration 00011, RLS forgotten until
      00020 caught it manually. With this invariant active, any future RLS
      gap would be reported within 24h.

  # === docs-engine invariants (Tier 1 ↔ docs/ MDX) ===
  # Status `deferred` until Sprint 1 lands the walker + validator. Once the
  # docs-engine `check` skill ships, flip to `live`. See capability `docs-engine`
  # in knowledge/capability-registry.yaml.
  - id: docs-page-has-source
    description: "Every MDX page in docs/content/ with source_path frontmatter must have a matching live source file in the codebase. Surfaces orphan pages."
    kind: exists
    layer: L1
    status: deferred
    source:
      tier: 1
      ref: docs/content/
      query: "frontmatter:source_path for *.mdx"
    target:
      tier: 1
      ref: "<source_path values>"
      query: "fs:exists"
    severity: critical
    hitl_tier: B
    fix_strategy: open_pr
    notes: |
      docs-engine v1.0 capability. Activates when Sprint 1 PR-3 lands the
      walker + scripts/validate-docs-coverage.cjs. Auto-fix: /docs sync
      regenerates MDX from source; if source deleted, /docs sync removes
      orphan MDX. Reports into docs_drift_count KPI.

  - id: docs-source-has-page
    description: "Every operating skill/agent/hook/command/SOP must have an MDX page in docs/content/. Surfaces missing pages."
    kind: subset
    layer: L2
    status: deferred
    source:
      tier: 1
      ref: "<docs-engine walker scope>"
      query: "fs:walk + matches walker scope"
    target:
      tier: 1
      ref: docs/content/
      query: "rg '^source_path:' for each source file"
    severity: warn
    hitl_tier: A
    fix_strategy: open_pr
    notes: |
      docs-engine v1.0 capability. Activates with Sprint 1. Reports into
      docs_drift_count KPI. Currently deferred until the walker validator
      lands; once active, this invariant is the source of truth for
      whether docs are in sync with the codebase. Auto-fix flow: /docs sync
      generates the missing MDX and opens a PR (per `open_pr` strategy).

  # ==========================================================================
  # gbrain integration (capability `gbrain-operational-brain` v1.0)
  # Schema constraints: id kebab-case (no dots); kind ∈ enum; fix_strategy ∈ enum.
  # ==========================================================================
  - id: gbrain-l1-page-embeddings-fresh
    description: "Every gbrain page has an up-to-date embedding (re-embed when page content sha differs from embedded sha)"
    kind: equal
    layer: L1
    status: deferred
    source:
      tier: 4
      ref: "gbrain DB pages.content_sha"
      query: "SELECT page_id, content_sha FROM pages"
    target:
      tier: 4
      ref: "gbrain DB embeddings.embedded_sha"
      query: "SELECT page_id, embedded_sha FROM embeddings"
    severity: warn
    hitl_tier: B
    fix_strategy: regen_bundle
    notes: |
      gbrain-operational-brain v1.0. Activates Sprint 6 when validator handler
      lands in scripts/cross-tier/. Auto-fix: gbrain-maintainer dream cycle
      re-embeds stale pages nightly.

  - id: gbrain-l2-cross-link-integrity
    description: "Every ops.capability_runs.gbrain_proposal_slug exists as a gbrain page. Same for capability_phase_events and decisions."
    kind: subset
    layer: L2
    status: deferred
    source:
      tier: 2
      ref: "ops.capability_runs.gbrain_proposal_slug + capability_phase_events.gbrain_meeting_slug + decisions.gbrain_concept_slug"
      query: "SELECT gbrain_proposal_slug FROM ops.capability_runs WHERE gbrain_proposal_slug IS NOT NULL"
    target:
      tier: 4
      ref: "gbrain DB pages.slug"
      query: "SELECT slug FROM pages"
    severity: warn
    hitl_tier: B
    fix_strategy: open_pr
    notes: |
      gbrain-operational-brain v1.0 Sprint 3 migration adds the 3 cross-link
      columns. This invariant activates Sprint 6. Surfaces when a CLA run is
      deleted but its gbrain narrative pages remain, or vice versa.

  - id: gbrain-l3-promotion-staleness
    description: "Brain pages with state=mature for >30 days imply ritsu.gbrain.promotion_pending event fires for weekly review"
    kind: implies
    layer: L3
    status: deferred
    source:
      tier: 4
      ref: "gbrain DB pages.state"
      query: "SELECT slug FROM pages WHERE state = 'mature' AND state_since < now() - interval '30 days'"
    target:
      tier: 2
      ref: "ops.events"
      query: "SELECT * FROM ops.events WHERE event_type = 'ritsu.gbrain.promotion_pending' AND payload->>'slug' = $1 AND created_at > now() - interval '7 days'"
    severity: info
    hitl_tier: A
    fix_strategy: manual_only
    notes: |
      gbrain-operational-brain v1.0 Sprint 4 emits ritsu.gbrain.promotion_pending
      event from the nightly cron. This invariant ensures the event keeps firing
      until founder acts (weekly promotion review per SOP-AIOPS-GBRAIN-002).

  - id: gbrain-l1-mcp-json-consistency
    description: ".mcp.json gbrain entry exists when knowledge/mcp-tools.yaml lists gbrain server tools"
    kind: exists
    layer: L1
    status: deferred
    source:
      tier: 1
      ref: knowledge/mcp-tools.yaml
      query: "$.mcp_tools[?(@.server == 'gbrain')]"
    target:
      tier: 1
      ref: .mcp.json
      query: "$.mcpServers.gbrain"
    severity: critical
    hitl_tier: C
    fix_strategy: patch_yaml
    notes: |
      gbrain-operational-brain v1.0 Sprint 5 lands .mcp.json gbrain entry.
      This invariant catches future drift between the entry and the tool
      catalog. Companion to NEW L2 validator
      scripts/cross-tier/validate-mcp-json-tools-consistency.cjs (Sprint 6).

  - id: gbrain-l2-role-allowlist-consistency
    description: "governance/ROLES.md mcp_servers grants for gbrain MUST be subset of knowledge/mcp-roles.yaml entries"
    kind: subset
    layer: L2
    status: deferred
    source:
      tier: 1
      ref: governance/ROLES.md
      query: "extract role blocks with mcp_servers containing 'gbrain'"
    target:
      tier: 1
      ref: knowledge/mcp-roles.yaml
      query: "$.roles[*].id"
    severity: critical
    hitl_tier: C
    fix_strategy: patch_yaml
    notes: |
      gbrain-operational-brain v1.0 Sprint 1 establishes the grants. This
      invariant ensures ROLES.md grants don't drift past mcp-roles.yaml. Same
      pattern as existing L2 'workforce personas ↔ ROLES.md ↔ runtime' validator.

  - id: gbrain-l3-pii-email-placeholder-confirmed-7d
    description: "Companies pages with EMAIL_PLACEHOLDER must imply pii_placeholder_replaced event within 7 days"
    kind: implies
    layer: L3
    status: deferred
    source:
      tier: 4
      ref: "gbrain DB pages"
      query: "SELECT slug FROM pages WHERE page_type = 'company' AND content LIKE '%<<EMAIL_PLACEHOLDER>>%' AND state = 'draft' AND created_at < now() - interval '7 days'"
    target:
      tier: 2
      ref: "ops.events"
      query: "SELECT * FROM ops.events WHERE event_type = 'ritsu.gbrain.write_committed' AND payload->>'slug' = $1 AND payload->>'pii_placeholder_replaced' = 'true'"
    severity: warn
    hitl_tier: B
    fix_strategy: manual_only
    notes: |
      gbrain-operational-brain v1.0 Sprint 4 ships post-stripe-customer-created
      hook with PII placeholder pattern. This invariant catches placeholder pages
      sitting unconfirmed >7d (founder forgot to fill in email after Tier B
      notify). Auto-fix: re-notify customer-lead role.

  # --------------------------------------------------------------------------
  # Capability `update` v1.0 — universal entity-edit lock invariants
  # --------------------------------------------------------------------------
  - id: entity-edit-locks-holder-run-references-valid
    description: "Every ops.entity_edit_locks.holder_run_id MUST exist in ops.agent_runs.id (for update/evolve writers) OR ops.capability_runs.id (for cla_* writers)"
    kind: subset
    layer: L2
    status: live
    source:
      tier: 2
      ref: "ops.entity_edit_locks"
      query: "SELECT holder_run_id, holder_kind FROM ops.entity_edit_locks WHERE holder_run_id IS NOT NULL"
    target:
      tier: 2
      ref: "ops.agent_runs ∪ ops.capability_runs"
      query: "SELECT id FROM ops.agent_runs UNION ALL SELECT id FROM ops.capability_runs"
    severity: critical
    hitl_tier: B
    fix_strategy: manual_only
    notes: |
      Lock rows must reference a real run. Orphan lock rows indicate a writer
      crashed mid-acquire OR a foreign-key constraint violation. Validator
      should branch by holder_kind: update/evolve → ops.agent_runs;
      cla_propose/cla_extend/cla_revise/cla_fix/cla_tune/cla_deprecate →
      ops.capability_runs. manual_edit → no run reference required.
      Spec: wiki/capabilities/update/spec.md §4 (post-Phase-8); draft
      .archives/cla/update/spec.md.

  - id: evolve-extractions-review-state-machine-valid
    description: "ops.evolve_extractions.review_state transitions follow legal moves only (pending_review → founder_{accepted|rejected|edited}; auto_accepted terminal-on-insert; rejected_low_confidence terminal-on-insert)"
    kind: implies
    layer: L1
    status: deferred
    source:
      tier: 2
      ref: "ops.evolve_extractions"
      query: "SELECT id, review_state FROM ops.evolve_extractions"
    target:
      tier: 1
      ref: "knowledge/state-machines.yaml"
      query: "$.entity_update_extraction_review.transitions"
    severity: critical
    hitl_tier: B
    fix_strategy: add_migration
    notes: |
      Activates when migration 00040_evolve_extractions.sql lands (Sprint 2 of
      capability `update` v1.0; renumbered from draft 00039). Until then,
      status: deferred. Legal transitions:
        pending_review → founder_accepted (founder reviewed + accepted)
        pending_review → founder_rejected (founder reviewed + rejected)
        pending_review → founder_edited (founder reviewed + provided edited text)
        auto_accepted (terminal — set at insert when confidence >= 0.85)
        rejected_low_confidence (terminal — set at insert when confidence < 0.6)

  - id: entity-update-runs-role-attribution-correct
    description: "Every ops.agent_runs WHERE agent_slug='update' MUST be triggered by role='entity-update-orchestrator'"
    kind: implies
    layer: L2
    status: live
    source:
      tier: 2
      ref: "ops.agent_runs"
      query: "SELECT id, triggered_by_kind, triggered_by_id, state_payload->>'role' AS role FROM ops.agent_runs WHERE agent_slug = 'update'"
    target:
      tier: 1
      ref: "governance/ROLES.md"
      query: "regex:^- role: entity-update-orchestrator$"
    severity: warn
    hitl_tier: B
    fix_strategy: manual_only
    notes: |
      Catches drift if /update runs are mis-attributed to a different role
      (e.g., gps or founder direct) — undermines cost-bucket attribution
      ($30/mo cap on ai-ops-entity-update) and per-task-kind cap enforcement.
      Vacuously true until first /update run lands; first row will exercise
      the check. Validator extracts role from state_payload->>'role' since
      ops.agent_runs has no dedicated triggered_by_role column.
