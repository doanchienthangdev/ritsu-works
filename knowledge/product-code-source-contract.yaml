# Product Code Source Contract — capability product-code-readonly-access
#
# The committed ops-side contract governing HOW ritsu-works reads the Product
# source CODE repo (github.com/doanchienthangdev/ritsu) as a READ-ONLY
# source-of-truth. The CODE sibling of product-db-readonly-access (DATA).
#
# Validated by scripts/cross-tier/validate-product-code-source.cjs (L2 critical):
#   1. read_only == true AND repo.write_forbidden == true   (read-only invariant)
#   2. read_surface == 'committed-remote-tree'              (secret-gate by construction —
#      the REMOTE committed tree only; never the local clone with uncommitted .env)
#   3. secret_denylist non-empty AND covers '.env'          (the secret-gate)
#   4. external_source_id registered in external-sources.yaml with
#      source_type == 'code-repo-readonly' AND status active
#   5. consumer_allowlist == that external-source's role_scope (no drift)
#   6. read_modes: >=1 'active' mode with freshness 'live'; every status known
#
# Owner: founder
# Change policy: PR + founder review (Tier C — affects what the workforce reads).
# Enabling the gbrain v1.1 ingestion is a SEPARATE founder decision (embedding +
# code-graph parse cost vs the $100/mo gbrain cap); the hook write-block is a
# Tier C/D-Std safety-hook edit. Both are flagged in `deferred`, neither auto-done.

version: 1.1.0   # v1.1: read-only is now HOOK-ENFORCED (firewall v1.3.0 product-repo write-block) + SOP-AIOPS-010 added; gbrain mode deferred-with-findings
last_updated: 2026-06-04
owner: founder
capability_id: product-code-readonly-access
external_source_id: ritsu-product-source

# Read-only ENFORCEMENT (v1.1). The read-only invariant is no longer policy-only:
# the L0 firewall (.claude/hooks/runtime/lib/product-firewall.cjs v1.3.0) BLOCKS
# git/gh WRITES to doanchienthangdev/ritsu (matchRule product-repo-write) — git
# push, gh pr create|merge|edit|close, write gh api, gh release|repo|secret|
# workflow writes. Word-boundaried so our OWN ritsu-works repo is unaffected;
# READS pass. Tested in tests/product-firewall.test.ts. Residual: a bare `git
# push` from inside a product-clone cwd carries no slug → not command-text-catchable.
enforcement:
  read_only_via: firewall-product-repo-write-block   # lib/product-firewall.cjs v1.3.0
  match_rule: product-repo-write
  tested_in: tests/product-firewall.test.ts
  residual: bare-git-push-from-product-clone-cwd (not command-text-catchable)

repo:
  owner: doanchienthangdev
  name: ritsu
  url: https://github.com/doanchienthangdev/ritsu
  visibility: private
  default_branch: main
  write_forbidden: true        # ritsu-works never writes/commits/pushes/PRs here (D-MAX-class).
                               # ENFORCED (v1.1) by the L0 firewall product-repo-write block (v1.3.0) —
                               # see the `enforcement` block above; tested in tests/product-firewall.test.ts.

read_only: true
# The secret-gate BY CONSTRUCTION: read the GitHub REMOTE's committed tree only.
# Secrets are gitignored → never reach the remote (verified 2026-06-04: of 2413
# committed files, the only secret-ish are apps/{web,admin}/.env.example templates).
# The local clone /Users/doanchienthang/omg/ritsu carries real secrets
# (apps/web/.env.local) and is OUT OF BOUNDS for this source.
read_surface: committed-remote-tree

# Belt-and-suspenders denylist applied on every read/ingest — guards against a
# future accidental secret commit and scopes any gbrain ingestion.
secret_denylist:
  - ".env"
  - ".env.*"
  - "*.local"
  - "*.key"
  - "*.pem"
  - "secrets/"
  - "**/secrets/**"

# Read modes. v1 ships the live (zero-cost, always-fresh) mode; the gbrain
# code-graph mode is planned + cost-gated (NOT enabled here).
read_modes:
  - id: live-gh-grep
    status: active
    freshness: live            # reads the remote at query time → always current
    cost: zero
    invoke: "gh api / gh search code / shallow read-only clone + git grep (read-only)"
    use_for: "exact current values, presence checks, keyword/string search, fresh ground-truth"
  - id: gbrain-code-graph
    status: planned            # DEFERRED-with-findings (2026-06-04 measurement): gbrain `sync_brain`
                               # is a MARKDOWN/doc indexer (imported 15 doc pages, skipped 38 source
                               # files) — NOT a source-code/code_* graph indexer; embeddings also need
                               # OpenAI in the gbrain process (generated 0 here); and doc-page sync lands
                               # in the `default` source (isolation). Kept `planned` (NOT active). Re-attempt
                               # needs a code-aware index path + the embedding pipeline + a dedicated source.
    freshness: snapshot         # synced periodically; carries a freshness tag
    cost: gated                 # embeddings + code-graph parse vs the $100/mo gbrain cap
    invoke: "mcp__gbrain__{search,code_blast,code_flow,code_refs,code_def,code_callers,code_callees}"
    use_for: "semantic + structural questions — where is X computed, what calls Y, trace a flow"
    enable_requires: "founder go after a scoped cost dry-run (1 package) + the hook write-block hardening"

# Which ops roles may query this source (default-deny). MUST equal the
# ritsu-product-source external-source role_scope (validator-enforced, no drift).
consumer_allowlist:
  - founder
  - cofounder
  - product-orchestrator
  - gtm-orchestrator
  - code-reviewer
  - gps

# Consumed as a Tier-A content recipient.
consumers:
  - deepask
  - think-mckinsey

# v1.1 DELIVERED (2026-06-04, founder-authorized "tự làm 3 việc kia"):
delivered_in_v1_1:
  - id: hook-write-block
    status: done
    what: "L0 firewall product-repo-write block (lib/product-firewall.cjs v1.3.0; matchRule product-repo-write). git/gh WRITES to doanchienthangdev/ritsu blocked; reads pass; our own ritsu-works repo unaffected (slug word-boundary). Tested in tests/product-firewall.test.ts."
  - id: sop-aiops-010
    status: done
    what: "06-ai-ops/sops/SOP-AIOPS-010-product-code-source-contract/flow.yaml — the runtime contract (read pipeline + enforcement + guards + residual)."

# Still DEFERRED (founder-gated):
deferred:
  - id: gbrain-code-graph-ingestion
    status: deferred-with-findings
    what: "Enable the gbrain-code-graph read mode (semantic + code_* over the product source)."
    finding: "2026-06-04 measurement: gbrain sync_brain is a MARKDOWN/doc indexer (15 doc pages imported, 38 source files SKIPPED) — NOT a source-code/code_* graph indexer; embeddings also need OpenAI in the gbrain process (generated 0 here); and doc-page sync lands in the shared `default` source (isolation). Cleanly enabling it needs a code-aware index path + the embedding pipeline wired + a dedicated isolated source — beyond an autonomous run. The trial source+clone were registered then FULLY REMOVED and the brain restored (3 doc pages remain only because the safety classifier blocked their delete — harmless, embedded:0)."
