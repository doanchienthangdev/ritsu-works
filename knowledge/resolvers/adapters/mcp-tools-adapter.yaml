# Adapter: knowledge/mcp-tools.yaml → resolver routes (mcp kind)
#
# READ-ONLY translator. Projects ~25 MCP tools as mcp/<server>:<id> routes.
# Source YAML remains authoritative for mcp-server access enforcement.
#
# Per architect T-1 fix + spec §12.2: routes/ + overrides/ AUTHORITATIVE at
# runtime; adapter feeds discovery. Phase-2 semantic tools (`status: planned`)
# also projected so callers can see what's coming.

source: knowledge/mcp-tools.yaml
iterate_over: tools                   # source.tools[] array → one route per tool
projected_recipient_kind: mcp

projected_route_template:
  id: "mcp/{server}:{id}"             # e.g. mcp/supabase-ops:query
  status: active
  triggers:
    keywords:
      - "{id}"                        # tool id alone (e.g. "query", "insert")
  recipient:
    kind: mcp
    slug: "{id}"
  invocation:
    mechanism: mcp_call
    args:
      server: "{server}"
      tool: "{id}"
  role_scope: ["*"]                   # actual enforcement at mcp-server layer
  hitl_tier_default: "{tier_default}"  # carried from source
  metadata:
    pillar: 06-ai-ops
    cost_bucket: "{cost_bucket}"
    introduced_in: "auto-adapter-mcp-tools"
    derived: true
    adapter: mcp-tools-adapter.yaml
    legacy_source: knowledge/mcp-tools.yaml
    disambiguator: "MCP tool registered in mcp-tools.yaml"
