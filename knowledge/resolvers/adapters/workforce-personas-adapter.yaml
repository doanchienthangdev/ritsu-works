# Adapter: knowledge/workforce-personas.yaml → resolver routes (persona kind)
#
# READ-ONLY translator. Projects 4 active + 8 planned C-suite personas as
# persona/<slug> routes. Slash-command + subagent-mention invocations from
# persona's `invocations` block. Phase-status carried as metadata.
#
# Per architect T-1 fix: source YAML stays authoritative for persona spec
# (binds_to, voice_profile, etc); adapter exposes routing surface only.
# Overlaps with cla-routing-adapter (same persona kind, same slugs) —
# resolved via priority + adapter de-dup at load (last-write-wins by file
# order; both adapters use the same persona slug so producing same id is
# OK — load-index will de-dup by id).

source: knowledge/workforce-personas.yaml
iterate_over: personas                # source.personas.<slug> → one route per persona
projected_recipient_kind: persona

projected_route_template:
  id: "persona/{key}"                 # key = persona slug (e.g. ceo, cto)
  status: active                      # active/planned/deferred from source.status
  triggers:
    keywords:
      - "{key}"                       # short slug
      - "{full_name}"                 # e.g. "Chief Executive Officer"
  recipient:
    kind: persona
    slug: "{key}"
  invocation:
    mechanism: subagent
    args:
      subagent_type: "{key}"
  role_scope: ["*"]                   # persona dispatch is universal
  hitl_tier_default: "{default_hitl_max}"  # from source
  metadata:
    pillar: 06-ai-ops
    cost_bucket: ai-ops-meta
    introduced_in: "auto-adapter-workforce-personas"
    derived: true
    adapter: workforce-personas-adapter.yaml
    legacy_source: knowledge/workforce-personas.yaml
    disambiguator: "workforce persona registry"
