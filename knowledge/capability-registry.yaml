      entity refresh. Distinct from /evolve (memory-driven self-improvement).
      Both commands SHARE 100% of underlying infrastructure (eval-evo skill
      suite, universal entity-edit lock, audit tables) but expose distinct
      command surfaces for distinct intents (separate-commands + shared-
      infrastructure architecture v3.0, approved 2026-05-26 after
      /plan-ceo-review + /plan-eng-review + outside-voice review).

      Phases: PRE-FLIGHT → DISTILL (per-chunk LLM, 3-bucket confidence) →
      REVIEW (founder queue for 0.6-0.85 bucket) → SCORE PRE → PROPOSE
      (extractions_context input) → CLASSIFY (trivial/medium/structural;
      structural ABORTs with /cla extend forward) → INSTALL (git stash +
      marker + 3-way diff guard) → TESTS (eval-evo/test-gen with
      All-Edge-Cases-Test 5-phase rule COMMITTED verbatim) → SCORE POST
      + K4 ratchet (±5pt slack for /update; strict for /evolve) → FINALIZE
      (pnpm resolver:index, ops.events, release lock).

      Scope v1.0: skill, command, agent, sop. Defer hook (D-Std safety),
      pillar/folder/workflow (semantic gaps) to v1.1+.

      Third foundational write-loop alongside /cla (create) and /evolve
      (self-improve). Fills the "ingest external truth" gap in ritsu-works.
