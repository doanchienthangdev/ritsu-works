  - id: resolver-v2
    name: "/resolver v2 — LLM-Native Catalog (supersedes resolver v1)"
    description: |
      Resolver redesigned per founder critique: replaced keyword-matching engine
      with LLM-native catalog leveraging Claude Code's ambient context. Catalog
      lives in knowledge/recipients/*.md (5 files, ~16K tokens). Auto-loaded via
      @knowledge/recipients/*.md imports in .claude/CLAUDE.md.

      THREE CONSUMER MODES:
        Mode A (preferred, 90%+ usage): in-session ambient catalog — caller
          reasons naturally about trigger→recipient; zero extra LLM call;
          0ms latency; $0 cost.
        Mode B (operator-facing, audit/debug): /resolver query "<trigger>"
          loads catalog as structured prompt, current-session LLM produces JSON
          decision (validated against catalog IDs to reject hallucinations),
          audit row written. ~5-500ms; $0 in-session.
        Mode C (CRON/edge fn): scripts/resolver-v2/keyword-fallback.cjs reads
          SAME catalog, applies simple whole-word matching. ~30% recall
          (acknowledged degradation); deterministic for non-LLM consumers.

      v1 → v2 KEY CHANGES:
        - 1832 LOC → 600 LOC (-67%)
        - Recall 30% → 80%+ (Mode A)
        - Composition: none → native (LLM returns primary + supporting)
        - Single source of truth: routes/+overrides/+adapters/ → recipients/*.md
        - Auto-derive from frontmatter (same as v1 sync.cjs)
        - Audit table extended: + llm_reasoning, + mode, + composition_supporting,
          + catalog_files_loaded (migration 00035, additive)

      Founder critique that triggered v2 (this conversation):
        1. "Keyword search yếu cho trigger matching"
        2. "Big table flat đủ nhỏ load context, dùng chính Claude Code phân tích"
        3. "Trigger matching nên dùng LLM chứ không search keyword"

      Strategic decisions:
        Option A: in-session LLM call (founder confirmed)
        Option 2C: minimal Mode C fallback reading from same catalog
        Option 3A: clean rewrite (zero real v1 consumers; green-field)

      Spec: .archives/cla/resolver-v2/spec.md (compressed Phases 1-5; jump to
      Phase 6-8 execution).
