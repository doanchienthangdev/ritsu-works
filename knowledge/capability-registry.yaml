    description: |
      A general, reused-many-times data-visualization capability — the /dataviz
      command + a pluggable renderer layer (--use), mirroring /image. From a data
      source + a one-sentence MESSAGE it chooses the chart type FROM THE MESSAGE
      (Gene Zelazny "Say It With Charts") and renders a McKinsey-grade exhibit:
      one-highlight-only, data-ink minimalism, direct labels, action-title-on-the-
      chart, source-footer-on-every-exhibit. Brands via the SAME --style design-
      system + --art-style axes as /image + /deepask (structure ⊥ brand).
      v0.1 backend = svg-native: a ZERO-DEPENDENCY, pure-Node, byte-stable SVG-string
      renderer (renderChart(type,data,spec,theme)->svg is a PURE function → unit-
      tested with toBe/toEqual, no vitest snapshots; no d3 [ESM-only], no canvas/DOM,
      no native build). 60 BUILT chart types across all six Datylon families; 14 cataloged
      types map to the nearest built + an honest reason. v0.4: chart SELECTION is LLM-NATIVE
      — the calling agent (Claude Code/Codex) reads a generated catalog (catalog.md, from
      lib/taxonomy.cjs) + the situation (message + data-shape + audience, Zelazny) and picks
      the best chart itself (multilingual, context-aware), recording select_mode=agent + its
      reason; select.cjs (the v0.2 regex selector) is retained as the deterministic fallback
      for headless/out-of-band callers. PURE/OFFLINE — no secret, no API key (selection uses
      the session model; render is pure-Node). Grounded in 3 real local McKinsey reports (the
      mckinsey-grounding-research workflow) + the dataviz-design-brief. Consumed by /think
      mckinsey (mckinsey-sell, v2.2) + routable from /deepask's chart format (the repo's only
