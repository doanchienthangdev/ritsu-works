      .archives/cla/voice/. Future /cla extend: ElevenLabs/Azure backends, multi-speaker
      dialogue (Gemini), ops.voice_runs + KPIs, voice-clone, SRT/subtitle sidecars.

# === Capability dependencies ===
# Some capabilities depend on others being deployed first.
dependencies:
  # capability_id: [list of prerequisite capability ids]
  # Example:
  # daily-customer-acquisition: [lead-source-polling, multi-locale-publishing]
  deepask: [resolver-plan]   # /deepask is a pure consumer of resolver-plan's ResolverPlan v1

# === Cost-bucket aggregation ===
# Maps capabilities to Bài #7 cost-buckets cho monthly reporting.
cost_buckets:
  ai-ops-meta:
    description: "Meta operations (CLA, infrastructure, /core)"
    capabilities: [capability-lifecycle-architecture, cla-update-mechanism, core-redesign-and-command]

  ai-ops-knowledge:
    description: "Knowledge engine — wiki sync, RAG queries, ref-ingestion, audit. Activates dormant Bài #14 / #18 infrastructure."
    capabilities: [wiki-sync-from-refs]

  ai-ops-docs:
    description: "Live docs site — Fumadocs scaffolder, walker + 9 adapters, drift detector, secret redactor, Vercel deploy. docs-engine capability."
    capabilities: [docs-engine]

  ai-ops-skill-library:
    description: "Skill-library capabilities — guidance documents that structure thinking and output of invoking agents. Zero per-invocation LLM cost; one-time authoring cost only."
    capabilities: [thinking-toolkit]

  ai-ops-deepask:
    description: "deepask runtime — federated retrieval + capability-execution + cited synthesis. Subscription (in-session) orchestration; gbrain reads under the global $100/mo cap. Per-run cost logged to ops.cost_attributions + ops.deepask_runs.cost_usd."
    capabilities: [deepask]

  ai-ops-design-system:
    description: "design-system styling layer — /design-system command (list/show/search/add/build --from/preview/lint/vendor/remove) + the universal --style resolver. Build-once layer: ~$0/mo ongoing; per-instance LLM cost is the build --from repo→DESIGN.md generation (task_kind design-system-build). NO MCP, NO API key (CLI-on-demand)."
    capabilities: [design-system-styling]

  ai-ops-image:
    description: "image-platform runtime — /image command + pluggable adapter layer (gpt-image-2 real; nano-banana/midjourney/flux registered-not-built stubs). Image generation uses OPENAI_API_KEY out-of-band via scripts/image/gen.cjs (task_kind image-gen, cap $0.50); --enhance prompt refinement is in-session/subscription (task_kind image-enhance, cap $0.10). Per-run --max-cost-usd circuit breaker (default 1.00) is orthogonal. Build-once foundational primitive; reuses deepask image helpers (no duplicate API spend path)."
    capabilities: [image-platform]

  ai-ops-analytics:
    description: "product-db-readonly-access Door 2 — pseudonymized Product→analytics sync + read-only supabase-analytics MCP. NEAR-ZERO ongoing: the sync is in-DB pg_cron on ritsu-analytics (free); the consumer MCP is read-only SELECT as analytics_reader (subscription, no API key — api-key-vs-subscription compliant). One-time build cost only (4 sprints)."
    capabilities: [product-db-readonly-access]

  ai-ops-voice:
    description: "voice-platform runtime — /voice command + pluggable TTS adapter layer (gemini-tts-3.1-flash + openai-tts real; elevenlabs/azure-tts registered-not-built stubs). Speech synthesis uses GEMINI_API_KEY/OPENAI_API_KEY out-of-band via scripts/voice/gen.cjs (task_kind voice-gen, cap $0.50, ~$0.015-0.03/min audio); voice-direction preprocessing is in-session/subscription (task_kind voice-preprocess, cap $0.10). Per-run --max-cost-usd circuit breaker (default 1.00) is orthogonal. Build-once foundational primitive; ffmpeg stitch; run.json = forward-compat superset of a future ops.voice_runs."
    capabilities: [voice-platform]

