# ============================================================================
# capability-registry.yaml — Capability Registry (Bài #20)
# ============================================================================
# Tier 1 declarative file (Tier 1 #19). Tracks all capabilities deployed on
# Agent OS — proposed, in-progress, deployed, deprecated.
#
# Each capability = unit of business value packaged as:
# - 1+ skills, 0-N SOPs, 0-N Tier 1 changes, 0-N migrations,
# - 0-N integrations, 0-N frontend pages, 0-N external services
#
# See playbook chương 33 + DRAFT bai-20-capability-lifecycle.
# ============================================================================

version: "1.0.0"
schema: knowledge/schemas/capability-registry.schema.json

# === Lifecycle states (matches ops.capability_runs.state) ===
# proposed: founder proposed, Phase 1-3 in progress
# analyzing: Phase 2-3 (domain + system)
# architecting: Phase 4-5 (options + spec)
# planning: Phase 6 (sprint plan)
# implementing: Phase 7 (active development)
# deployed: Phase 8 done, in production
# operating: stable, ongoing operation (no longer "newly deployed")
# deprecated: scheduled for removal
# superseded: replaced by newer capability

# === HITL tier thresholds ===
# Each phase transition has minimum HITL tier:
hitl_thresholds:
  proposed_to_analyzing: tier_a
  analyzing_to_architecting: tier_a
  architecting_to_planning: tier_b      # founder picks option
  planning_to_implementing: tier_c      # founder approves architecture
  implementing_to_deployed: tier_b      # per PR review
  deployed_to_deprecated: tier_c        # founder approves deprecation

# === Capabilities catalog ===
# When CLA workflow runs, it appends capabilities here.

capabilities:
  # === Meta capability: CLA itself (ALWAYS first, deployed) ===
  - id: capability-lifecycle-architecture
    name: "Capability Lifecycle Architecture (Bài #20)"
    description: "Standardized workflow để propose, analyze, architect, build new capabilities"
    version: "1.0.0"
    state: deployed
    state_since: 2026-05-04
    proposed_at: 2026-05-04
    deployed_at: 2026-05-04
    pillar_owner: 06-ai-ops
    bài_toán_touched: [1, 2, 4, 5, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 18, 19]
    spec_path: knowledge/phase-a2-extensions/bai-20-capability-lifecycle-DRAFT.md
    cost_bucket: ai-ops-meta
    notes: "Meta-capability. Deploys itself bootstrap-style trong Wave 1."

  # === v1.1 extension: update sub-flows ===
  - id: cla-update-mechanism
    name: "CLA Update Sub-flows (v1.1 — fix/extend/revise/tune/deprecate)"
    description: "Right-sized evolution sub-flows for operating capabilities. Extends Bài #20 v1.0 with 5 sub-commands + dependency-scanner + spec versioning + concurrency lock + lineage chain. First non-meta capability built via Approach E (use /cla on itself). Resolves Bài #20 OQ-CLA-2."
    version: "1.0.0"
    state: operating
    state_since: 2026-05-15
    proposed_at: 2026-05-15
    deployed_at: 2026-05-15
    pillar_owner: 06-ai-ops
    bài_toán_touched: [1, 2, 5, 7, 9, 10, 11, 13, 15, 20]
    spec_path: wiki/capabilities/cla-update-mechanism/spec.md
    retrospective_path: wiki/capabilities/cla-update-mechanism/retrospective.md
    sprint_plan: ".archives/cla/cla-update-mechanism/sprint-plan.md (local-only working)"
    cost_bucket: ai-ops-meta
    estimated_cost_setup_usd: 2.00
    estimated_cost_recurring_usd: 0
    estimated_founder_hours: 1.5
    actual_cost_setup_usd: 2.00
    actual_cost_recurring_usd: 0
    actual_founder_hours: 1.5
    estimated_completion: 2026-05-15
    notes: |
      Extends parent capability `capability-lifecycle-architecture` (v1.0).
      Shipped in PR series #26 / #27 / #28. Phase 8 promotion completed
      Sprint 3. Dogfood TODO: /cla fix capability-lifecycle-architecture.

  # === Project-specific capabilities (added as founder runs CLA) ===

  - id: wiki-sync-from-refs
    name: "Wiki Sync from External Refs (v4.0 source-grouped distill+extract)"
    description: |
      v4.0 (2026-05-18): SOURCE-GROUPED layout flip. Same distill+extract
      semantic as v3.0 — founder drops PDF / URL / Markdown / YouTube /
      meeting transcript / FOLDER into raw/<topic>/; LLM extracts important
      entities (concept / observation / decision / idea) with citation via
      ops.knowledge_extractions. v4.0 changes the on-disk layout from
      entity-type-grouped (wiki/concept/, wiki/observation/, …) to source-
      grouped (wiki/<source-slug>/{source.md, concepts/, observations/,
      decisions/, ideas/, chapters/}/). Skill input contract: `input =
      wiki/<source-slug>/` is a coherent package. Composite UNIQUE on
      derived entities (extracted_from_source_id, slug) — same slug
      (e.g. 'wedge') can legitimately exist in multiple packages.
      Reverse-lookup link-lists at wiki/_index/<page_type>/<canonical-name>.md
      (generated by /wiki index rebuild; excluded from /wiki audit orphan
      checks). /wiki ask gains --source / --packages flags for package-
      scoped retrieval; citation format includes package suffix (v4 B9).
      NEW commands: /wiki package <slug>, /wiki index rebuild.
      v3.0 commitments carry forward: per-type model picker (Haiku for
      concept+idea; Sonnet for observation+decision), per-edge confidence
      3-bucket, attribution-watcher (A11), --verbatim flag with v3.1
      auto-deprecation trigger.
      HARD KILL CRITERION (carries from v3.0; v4.0 does NOT reset): if
      day-30 (2026-06-17) shows < 5 growth-domain ingests OR day-60
      (2026-07-17) shows 0 content pieces citing v3.0+ entities → freeze v3.x.
      7-day post-v4-ship commitment (Muse Paul Graham M1, Tier C ceremony):
      founder ingests ≥3 growth playbooks by 2026-05-25.
    state: operating       # Promoted 2026-05-18 (Phase 8 of v4.0 revise); Sprint 1 merge 0cd0c62; Sprint 2 merge 70ee2ee; migration 00032 applied 2026-05-18; ops.capability_runs[f75502d4] operating_since 2026-05-18T~09:30Z. v4.1 minor extension 2026-05-18 (recursive folder support). v4.2 minor extension 2026-05-18 (namespace output folder).
    version: "4.3.0"       # Minor bump from 4.2.0 — adds /wiki get subcommand + wiki-sync/get skill (extract bundled context from source-grouped package). Pure filesystem read, no LLM, no DDL, no migration. Backward compatible.
    state_since: 2026-05-18
    proposed_at: 2026-05-16
    deployed_at: 2026-05-18  # v4.0 Sprint 1 + Sprint 2 merged 2026-05-18
    operating_since: 2026-05-18  # ops.capability_runs[f75502d4] operating_since at Phase 8 promotion
    pillar_owner: 06-ai-ops
    bài_toán_touched: [1, 2, 4, 5, 7, 9, 11, 12, 13, 14, 15, 17, 18, 19, 20]
    spec_path: wiki/capabilities/wiki-sync-from-refs/spec.md
    retrospective_path: wiki/capabilities/wiki-sync-from-refs/retrospective-v4.3.0.md
    cost_bucket: ai-ops-knowledge
    estimated_cost_setup_usd: 36.50     # v3.0 ($22-30) + v4.0 revise ($4.50-6.50) cumulative
    estimated_cost_recurring_usd: 35.00 # unchanged from v1.0 spec; per-source caps redistributed in v3.0 §0
    estimated_founder_hours: 56          # v3.0 (38-50) + v4.0 (11-14) cumulative; v4 honest estimate (Muse M4)
    actual_cost_setup_usd: 29.00         # v1.0 (~$8) + v2.0 (~$6) + v3.0 (~$10) + v4.0 (~$5) cumulative
    actual_founder_hours: 17             # v3 = 14h + v4 = ~3h (largely approval gates) — AI-executed
    selected_option: "B (v1.0) → Hybrid B/A (v2.0 revise) → B full 4-entity + CTO+Muse NITs (v3.0 revise) → B source-grouped + _index/ (v4.0 revise)"
    migration_files:
      - 00027_wiki_sync_extensions.sql                 # v1.0
      - 00028_capability_lock_allow_implementing.sql   # v2.0 Phase 0 unblock (bonus)
      - 00029_capability_runs_root_only_unique.sql     # v2.0 Phase 0 unblock (bonus)
      - 00030_wiki_sync_v2_schema_deltas.sql           # v2.0 Sprint 2 PR1
      - 00031_wiki_distillation.sql                    # v3.0 Sprint 1 (citation spine + 4 new knowledge_pages columns + RLS)
      - 00032_wiki_v4_source_grouped.sql               # v4.0 Sprint 1 (composite UNIQUE on derived slugs via partial indexes — source-grouped layout flip)
    notes: |
      Lineage chain (3-deep):
        911973a2 (v1.0.0, superseded 2026-05-17)
        ← 638811f8 (v2.0.0, superseded 2026-05-18)
        ← 36836749 (v3.0.0, operating 2026-05-18).
      v3.0 reframes the core semantic: v1+v2 = ingest+index (verbatim
      projection); v3 = distill+extract (LLM extracts entities into separate
      wiki pages). Per founder Vietnamese clarification 2026-05-18 that
      wiki-sync IS the PMF tool for growth-content-prep (process growth
      playbooks into content/copy/plans), not internal-infra alternative
      to PMF. Cabinet Phase 4 initially recommended DEFER; founder
      reconsidered with new S1 evidence; Tier C ceremony APPROVED Option B
      + all CTO + Muse NITs. ops.decisions[562b2e4e] state=decided.
      v3.0 single-session execution 2026-05-18 (AI-executed per founder
      delegation across all 6 sprints). Founder action items: apply
      migration 00031 (Tier D-MAX-adjacent), merge feature branch
      feat/wiki-sync-v3-distill-extract, run acceptance corpus
      (/wiki sync tests/wiki-sync/fixtures/growth-playbook-fixture.md +
      /wiki sync raw/5-star/).
      Kill criterion clock: starts at migration apply; day-30 + day-60
      evaluation per spec §0. If 0 content cites v3.0 entities by day 60,
      freeze v3.x and reopen only with paying-user-tied evidence.
      v3.0.5 + v3.1 re-trigger conditions in retrospective-v3.0.0.md §10.

      v4.0 revise PROMOTED 2026-05-18 (Phase 8):
      Layout flip from entity-type-grouped to source-grouped per
      ops.decisions[e558913a-fb5d-444a-ab0b-305f38ce80a0] (Tier C approved
      2026-05-18). Capability run id: f75502d4-c7b2-44c1-86a5-395b4578f93d
      (state operating since Phase 8 promotion). Sprint 1 (PR #45 commit
      0cd0c62) shipped migration 00032 + migrate-to-v4.cjs + 13 skill
      rewrites + Tier 1 yaml flips. Sprint 2 (PR #46 commit 70ee2ee)
      shipped /wiki package + /wiki index rebuild + /wiki ask --source
      flag + wiki/_index/ reverse-lookup + post-migration FS state.
      Migration 00032 applied 2026-05-18. migrate-to-v4 ran 2026-05-18
      (15 FS moves + 1 new sample source RECORD; all 16 DB rows now in v4
      layout: file_path ~ '^wiki/[^/]+/(source\.md|[^/]+/[^/]+\.md)$').
      Lineage chain (4-deep, post-promotion):
        911973a2 (v1.0.0, superseded 2026-05-17)
        ← 638811f8 (v2.0.0, superseded 2026-05-18)
        ← 36836749 (v3.0.0, operating 2026-05-18 → superseded 2026-05-18)
        ← f75502d4 (v4.0.0, operating 2026-05-18).
      v3.0 kill criterion clock continues (day-30: 2026-06-17; day-60:
      2026-07-17) — v4.0 does NOT reset it. Founder 7-day post-ship
      commitment (Muse M1): ingest ≥3 growth playbooks via /wiki sync
      by 2026-05-25.

      v4.1 (2026-05-18, minor extension via /cla extend Tier B):
      folder-adapter recursive support via BFS, bounded by --depth=N
      (default 3, hard cap 10) and --max-nodes=N (default 20, hard cap 500).
      Each LEAF folder becomes its own wiki/<col-slug>/ source-grouped
      package; files within a visited folder ingested wholesale; truncated
      folders reported when budget exhausts. No DDL change; lifts the
      v2.0 hard-refuse on subdirectories. Triggered by founder needing
      to ingest raw/5-star/ (11 playbook subfolders × 4 files each).

      v4.2 (2026-05-18, minor extension via /cla extend Tier B):
      namespace output folder. --out=<name> flag (default slugify(basename
      (input)), auto-suffix -1, -2, … if wiki/<name>/ already exists)
      wraps ALL ingestion output under wiki/<namespace>/. Multi-package
      mode: wiki/<namespace>/<col-slug>/source.md per package (BFS leaf
      folders). Single-package collapse: when BFS finds 1 leaf == root AND
      col_slug == namespace, files land at wiki/<namespace>/<file>/source.md
      (no inner col_slug layer). No DDL change. Validator + index-rebuild
      walker accept both shapes. migrate-to-v4.2.cjs retrofit script moves
      legacy top-level packages into a namespace. Triggered by founder
      observing top-level wiki/ name conflicts after raw/5-star/ ingest.

  - id: docs-engine
    name: "Live Documentation Engine (Fumadocs + Vercel, bilingual VI+EN)"
    description: |
      Live operator + AI runtime context bundle. docs/ folder ở repo root
      (Next.js subproject + Fumadocs MDX) auto-deploys lên Vercel Hobby
      at https://ritsu-works.vercel.app. /docs command drives walker (9
      adapters render ~226 source files: commands, skills, agents, hooks,
      charter, governance, pillar READMEs, SOPs, knowledge yamls into
      browsable MDX). v1.1: bilingual VI+EN via Fumadocs i18n; sidebar
      grouping; landing redirect /→/docs; Cards navigation.
      3-layer fail-loud secret redactor (walker-exclude + MDX regex scrub +
      CI gate). `{/* generated-by */}` JSX comment idempotency marker
      (CTO Phase 2 mod). AI runtime endpoint /api/raw/<slug> serves raw MDX
      for subagent context (CPO Phase 4 P0 reframe).
    version: "1.2.0"
    state: operating
    state_since: 2026-05-19
    proposed_at: 2026-05-19
    deployed_at: 2026-05-19
    operating_since: 2026-05-19
    pillar_owner: 06-ai-ops
