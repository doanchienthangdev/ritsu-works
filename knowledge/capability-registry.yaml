  - id: playbook-builder
    name: "Playbook PDF Builder — automated rebuild + version bump + publish + docs-sync integration"
    description: |
      Automation layer for the AI-Native Company Playbook PDF
      (`.archives/ritsu-handoff-bundle/playbook/`). Founder updates chapter
      content frequently (7 versions in 24 days, v2.8 → v4.2). Manual rebuild
      cycle today: edit chapter → 4-field TOC version bump (Phiên bản, Ngày,
      chapter entry, prose section) → update build_pdf.py CHAPTER_ORDER +
      pdf_path + cover-meta → setup Python (anaconda3, NOT venv) +
      DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib → run build_pdf.py → cp
      build/playbook-vX.Y.pdf to playbook root. ~5-15 min orchestration per
      update + ~10 min one-time env discovery cost per machine.

      Playbook-builder target capability: single command `/playbook build`
      that detects chapter changes, auto-bumps version (semver: patch/minor/
      major), syncs TOC entries from chapter H1s, syncs CHAPTER_ORDER from
      directory listing, builds PDF in the captured-once environment,
      publishes to root. Drift validator catches missing CHAPTER_ORDER entries
      or version-mismatch across 4 sync points. Integration with /docs sync:
      when Tier 1 source changes have corresponding playbook chapters (mapping
      captured in capability config), proactively trigger playbook rebuild.

      Zero per-invocation LLM cost — pure deterministic build orchestration.
      HITL: Tier A autonomous build; Tier B only for MAJOR version bumps
      (architectural restructure of playbook itself).
