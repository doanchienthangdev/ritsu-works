  - id: voice-platform
    name: "Text-to-speech platform (/voice command)"
    description: "OPERATING since 2026-06-08 (Tier-A runtime; founder-proxy autonomous build + ship). Foundational, build-once-use-forever TEXT-TO-SPEECH primitive exposed as /voice <input> [flags]: a model-agnostic front door with a pluggable adapter layer (--use=<adapter>) so new TTS engines plug in WITHOUT command-side code change (mirrors the image-platform / wiki-sync / docs-engine umbrella-skill + adapters/<id>/ + routing-table pattern). Input = inline text · a file · or a folder (one audio file per source file, mirrored). Reads the content in the context of a --type (ads/podcast/story/blog/educational/news/narration/conversational/meditation/announcement/default), AUTHORS a content-aware voice-direction (voice/tone/emotion/--pace/volume/intonation/pauses) + lightly marks up the script (pauses via punctuation/breaks for both engines; inline [bracket] audio tags for Gemini), records OUT-OF-BAND via the provider key, and stitches with ffmpeg. Two LIVE-VERIFIED engines: gemini-tts-3.1-flash (default; Gemini Developer API → gemini-3.1-flash-tts-preview, 30 voices, returns base64 PCM → WAV-wrapped) + openai-tts/whisper (gpt-4o-mini-tts, 13 voices marin/cedar best, native mp3 + instructions field) ; elevenlabs/azure-tts = registered-not-built stubs. Universal sensibly-defaulted parameter vocabulary (--type --pace --voice --gender --format --use --model --instructions --lang --chunk-chars --concurrency --max-cost-usd --dry-run --out --stitch); each adapter declares supports() and WARNS (never silently drops) on unsupported params (--speed ignored by both engines → pace via spoken words; --multi-speaker/--markup Gemini-only). Long inputs / folders fan out through a Claude Code Workflow (preprocess→gen per chunk/file in PARALLEL → stitch). NEW knowledge/voice-adapters.yaml split-registry (+schema, mirrors image-adapters.yaml) + scripts/cross-tier/validate-voice-adapters.cjs (L2 critical, wired into check-consistency.cjs AND .github CI). Adapter output contract {ok, outcome, file, chunks, cost_usd, model, voice, warnings[]}. Cost-bucket ai-ops-voice under gps; GEMINI_API_KEY/OPENAI_API_KEY out-of-band (api-key-vs-subscription compliant); preprocessing in-session/subscription. Tier A runtime; per-run --max-cost-usd breaker; artifacts to .archives/voice/<date>-<slug>/."
