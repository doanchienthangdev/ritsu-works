# ============================================================================
# dataviz-renderers.yaml — /dataviz pluggable renderer registry
# (capability `dataviz` v0.1 — McKinsey-caliber data visualization)
# ============================================================================
# Mirrors knowledge/image-adapters.yaml (the split-registry convention): a built
# renderer carries `status: installed` + a `generator` path that MUST exist on disk;
# a `registered-not-built` stub carries none (documents intent + the engine surface,
# awaiting implementation). Each renderer's supports[]/supports_stretch[]/
# unsupported_warn[] must each be ⊆ UNIVERSAL_PARAMS (scripts/dataviz/lib/params.cjs)
# — enforced by scripts/cross-tier/validate-dataviz-renderers.cjs (L2 critical;
# wired into check-consistency.cjs AND .github/workflows/cross-tier-consistency.yml).
#
# v0.1 ships ONE real backend: svg-native (the zero-dependency, pure-Node, byte-
# stable SVG-string renderer). echarts-ssr + vega-lite are documented stubs (the
# engine fallbacks if hand-rolled layout ever outruns budget — both are no-DOM/
# no-native-build SVG paths; vega-lite's accurate-text path historically pulls
# node-canvas, so it is the LAST resort).
#
# Schema:    knowledge/schemas/dataviz-renderers.schema.json
# Consumer:  06-ai-ops/skills/dataviz/SKILL.md (--use=<renderer>)
# ============================================================================

version: "1.3.0"
schema: knowledge/schemas/dataviz-renderers.schema.json

renderers:
  - id: svg-native
    status: installed
    generator: scripts/dataviz/render.cjs
    skill: 06-ai-ops/skills/dataviz/renderers/svg-native/SKILL.md
    default_theme: mckinsey
    # v0.3: 60 BUILT types across all 6 families (source of truth: scripts/dataviz/lib/taxonomy.cjs `BUILT`).
    chart_types: [bar, column, grouped, lollipop, dot, dumbbell, slope, radar, quadrant, bullet, scatter, bubble, heatmap, stacked, stacked100, pie, donut, marimekko, diverging, funnel, line, area, stacked-area, histogram, box, waterfall, kpi, small-multiples, range, matrix-chart, table-chart, connected-scatter, hexbin, waffle, treemap, population-pyramid, sunburst, dendrogram, venn, semicircle-donut, bump, spline, step-line, gantt, candlestick, ohlc, barcode, density, ridgeline, violin, strip, jitter, beeswarm, horizon, sankey, chord, arc, network, flowchart, tile-map]
    # CATALOGED v0.3 (14: 10 anti-McKinsey + 4 infeasible-in-pure-renderer — choropleth/geo-heatmap need real boundary polygons, contour needs a continuous-field/marching-squares engine, euler needs general set geometry; the selector maps each to the nearest built type + an honest reason).
    deferred_chart_types: [pictogram, icon-chart, radial-bar, nightingale, parallel-coordinates, word-cloud, contour, icon-array, euler, gauge, stream, radial-histogram, choropleth, geo-heatmap]
    supports: [message, chart, data, title, title-style, source, footnotes, highlight, sort, unit, decimals, percent, thousands, style, theme, format, ar, width, height, use, out, max-cost-usd, dry-run, explain, audience, target, x-label, y-label]
    supports_stretch: []
    unsupported_warn: [art-style]
    auth:
      env: null            # PURE / offline — no secret, no API key (unlike /image's OPENAI_API_KEY)
      billing: in-process-pure
    notes: "Zero-dependency pure-Node SVG-string renderer (no d3/canvas/DOM). renderChart(chartType,data,spec,theme)->svgString is a PURE function → byte-stable, snapshot-free toBe()/toEqual() tests. v0.3 (extend): 60 built chart types across all six Datylon families + the intelligent context-aware selector (scripts/dataviz/select.cjs) backed by the full chart taxonomy (scripts/dataviz/lib/taxonomy.cjs); only 14 forms stay cataloged (10 anti-McKinsey + 4 infeasible-in-pure-renderer). The default output wordmark is the Ritsu brand (the 'McKinsey' label is the design discipline, not the output brand). Format png/pdf rasterization remains a stretch (svg/html/inline)."

  - id: flow-graphviz
    status: installed
    generator: scripts/dataviz/flow-render.cjs
    skill: 06-ai-ops/skills/dataviz/renderers/flow-graphviz/SKILL.md
    default_theme: mckinsey
    # v0.5 (extend): the PRO renderer for the Flow/workflow family. Claude Code AUTHORS
    # brand-themed Graphviz DOT (graph structure / sub-variety / labels — an LLM's strength);
    # Graphviz `dot` does the AUTO-LAYOUT (the part hand-rolled code can't do well). The same
    # family's `flowchart` on svg-native stays the DETERMINISTIC headless/CRON fallback.
    chart_types: [flowchart, workflow, process-map, decision-tree, swimlane, org-chart, user-flow, network, state-diagram, dependency-graph]
    supports: [message, chart, data, title, title-style, source, footnotes, style, theme, format, ar, width, height, use, out, max-cost-usd, dry-run, explain, audience]
    supports_stretch: []
    unsupported_warn: [highlight, sort, unit, decimals, percent, thousands, target, x-label, y-label, art-style]
    auth:
      env: null            # local `dot` render; DOT authoring is in-session/subscription — no API key
      billing: in-session-authoring-plus-local-render
    notes: "LLM-authored flowchart/workflow renderer (capability dataviz v0.5 extend). Two inputs: --dot=<authored DOT> (PREFERRED — a brand theme preamble is injected as graph/node/edge defaults; per-element attrs the author sets win) or --spec=<structured JSON> (deterministic headless/test path; specToDot() is PURE + unit-tested). Renders via Graphviz `dot -T{svg,png,pdf}` — the gold-standard DAG/flowchart layout engine, native, no browser/puppeteer. format png/pdf are NATIVE here (unlike svg-native where they're a stretch). Graceful when `dot` is absent (saves the .dot + an install hint; never throws raw). Brand: classic McKinsey palette by default; --style=<brand> overrides palette/type while the SEMANTIC amber/green/red (decision/win/drop) stay. The Flow family's PREFERRED renderer; svg-native `flowchart` is the headless/CRON fallback. Inherited by /think mckinsey Sell + reasoning-trace + /deepask flow exhibits."

  - id: echarts-ssr
    status: registered-not-built
    skill: null
    chart_types: []
    supports: []
    auth:
      env: null
      billing: in-process-pure
    notes: "STUB. Apache ECharts server-side render — echarts.init(null,null,{renderer:'svg',ssr:true}).renderToSVGString() with animation:false for byte-stability. The ONLY chart engine meeting no-DOM + no-native-build (true since 5.3.0). The documented fallback if hand-rolled per-chart layout outruns budget. Adds a dep; not built in v0.1."

  - id: vega-lite
    status: registered-not-built
    skill: null
    chart_types: []
    supports: []
    auth:
      env: null
      billing: in-process-pure
    notes: "STUB / LAST RESORT. Vega-Lite JSON spec → SVG. Rejected for v0.1: v4+ is ESM-only (not require()-able from a .cjs), and its accurate-text SVG path historically pulls node-canvas (native build) which breaks the zero-native-build mandate AND the direct-label positioning McKinsey depends on."
