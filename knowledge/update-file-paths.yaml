# ============================================================================
# update-file-paths.yaml — Path-tier classifier for /update file <path> mode
# ============================================================================
# Tier 1 declarative — consumed by scripts/update/path-classify.cjs at /update
# file time. Globs evaluated in DECLARED ORDER; first match wins.
#
# Tier values:
#   refuse — REFUSED (route to /cla extend, PR, or explicit forward command)
#   C      — Tier C (opens PR for founder review + merge)
#   B      — Tier B (in-place apply + founder AskUserQuestion confirmation)
#
# Schema: knowledge/schemas/update-file-paths.schema.json
# Spec:   wiki/capabilities/update/spec.md §15 (v1.1 extension; promoted Sprint 3)
# Brainstorm: .archives/cla/update/v1.1-brainstorming/05-file-arbitrary.md
# Capability: update v1.1 (extend of v1.0 — same capability_run_id)
# ============================================================================

version: "1.0.0"

# Globs are matched in order via fnmatch-style glob (** = any depth).
# default applies when NO rule matches the path.
default: refuse_unclassified

rules:
  # ──────────────────────────────────────────────────────────────────
  # REFUSE (highest priority — Tier 1 paths route elsewhere)
  # ──────────────────────────────────────────────────────────────────
  - path_glob: "00-core/**"
    tier: refuse
    reason: "Tier 1 identity (charter, brand voice, product spec) — use /cla extend or PR"
    forward_to: "/cla extend update OR direct PR to main"

  - path_glob: "governance/**"
    tier: refuse
    reason: "HITL + roles + secrets — schema-changing edits need /cla extend with @cto review"
    forward_to: "/cla extend update OR PR with founder review"

  - path_glob: "supabase/migrations/**"
    tier: refuse
    reason: "DDL schema changes — additive migrations should be standalone /cla capability or PR"
    forward_to: "/cla propose OR PR"

  - path_glob: "supabase/functions/_shared/*.generated.ts"
    tier: refuse
    reason: "Auto-generated; edit source yaml + run bundler"
    forward_to: "Edit source yaml then re-run pnpm bundlers"

  - path_glob: ".mcp.json"
    tier: refuse
    reason: "MCP server config — security-critical; D-Std change"
    forward_to: "D-Std PR via founder"

  - path_glob: ".claude/hooks/**"
    tier: refuse
    reason: "Hooks — use /update hook <name> with D-Std magic-phrase ceremony"
    forward_to: "/update hook <name> --refs=<csv>"

  - path_glob: "package.json"
    tier: refuse
    reason: "Dependency manifest — use pnpm tooling, not /update"
    forward_to: "pnpm add/remove + commit"

  - path_glob: "pnpm-lock.yaml"
    tier: refuse
    reason: "Lockfile — auto-generated by pnpm"
    forward_to: "pnpm install"

  - path_glob: "knowledge/manifest.yaml"
    tier: refuse
    reason: "Cross-tier contract — schema changes via /cla extend"
    forward_to: "/cla extend"

  - path_glob: "knowledge/cross-tier-invariants.yaml"
    tier: refuse
    reason: "Validator rules — /cla extend"
    forward_to: "/cla extend"

  - path_glob: "raw/**"
    tier: refuse
    reason: "raw/ is local-only intake; not for /update (no provenance chain)"
    forward_to: "Hand-edit local"

  - path_glob: "runtime/**"
    tier: refuse
    reason: "runtime/ is gitignored ephemeral"
    forward_to: "Hand-edit local"

  - path_glob: "node_modules/**"
    tier: refuse
    reason: "Vendored dependencies — managed by pnpm"
    forward_to: "pnpm operations only"

  - path_glob: ".git/**"
    tier: refuse
    reason: "Git internals — never edit"
    forward_to: "(none — never edit .git/)"

  - path_glob: ".archives/**"
    tier: refuse
    reason: ".archives/ is scratch space; not for /update"
    forward_to: "Hand-edit local"

  # ──────────────────────────────────────────────────────────────────
  # Tier C — opens PR; founder reviews + merges
  # ──────────────────────────────────────────────────────────────────
  - path_glob: "knowledge/*.yaml"
    tier: C
    reason: "Tier 1 declarative state (KPIs, schedules, alerts, etc.)"

  - path_glob: "wiki/**/*.md"
    tier: C
    reason: "Wiki canonical reference — PR review"

  - path_glob: "01-marketing/**/*.md"
    tier: C
    reason: "Pillar docs — PR review"

  - path_glob: "02-sales/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "03-gtm/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "04-product/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "05-customer/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "07-trust-safety/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "08-finance/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "09-founder/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "10-metrics/**/*.md"
    tier: C
    reason: "Pillar docs"

  - path_glob: "06-ai-ops/sops/**/*.md"
    tier: C
    reason: "SOP docs"

  - path_glob: "06-ai-ops/sops/**/*.yaml"
    tier: C
    reason: "SOP flow.yaml + schema yaml — structural detector applies"

  # ──────────────────────────────────────────────────────────────────
  # Tier B — trivial in-place applies allowed (founder confirms via AskUserQuestion)
  # ──────────────────────────────────────────────────────────────────
  - path_glob: ".claude/agents/**"
    tier: B
    reason: "Agent leaf files — prefer /update agent <name>; file mode is fallback"

  - path_glob: ".claude/commands/**"
    tier: B
    reason: "Command leaf files — prefer /update command"

  - path_glob: "06-ai-ops/skills/**/SKILL.md"
    tier: B
    reason: "Skill leaf — prefer /update skill"

  - path_glob: "06-ai-ops/skills/**/cases/**"
    tier: B
    reason: "Cases under existing skills"

  - path_glob: "06-ai-ops/skills/**/tests/**"
    tier: B
    reason: "Tests under existing skills"

  - path_glob: "scripts/**/*.cjs"
    tier: B
    reason: "Helper scripts — non-Tier-1 code"

  - path_glob: "scripts/**/*.js"
    tier: B
    reason: "Helper scripts"

  - path_glob: "tests/**/*.test.ts"
    tier: B
    reason: "Tests — non-blocking edit"

  - path_glob: "tests/**/*.test.cjs"
    tier: B
    reason: "Tests"

  - path_glob: "docs/**/*.md"
    tier: B
    reason: "Docs site content"

  - path_glob: "docs/**/*.mdx"
    tier: B
    reason: "Docs MDX (auto-regenerated for some; manual for tutorials)"

  - path_glob: "README.md"
    tier: B
    reason: "Repo-level README"

  - path_glob: ".gitignore"
    tier: B
    reason: ".gitignore — non-Tier-1 config"

  - path_glob: ".gitattributes"
    tier: B
    reason: ".gitattributes — non-Tier-1 config"

# Hard refuse for any path not matching above. To allow a new path:
# 1. Open a PR adding a rule above with explicit tier + reason
# 2. Founder reviews + merges
# 3. /update file <new-path> then works
catch_all: refuse_with_explicit_forward
