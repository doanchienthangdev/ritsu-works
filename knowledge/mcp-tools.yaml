  # gbrain MCP server — capability gbrain-operational-brain v1.0 (2026-05-25)
  # ===========================================================================
  # External stdio MCP server: ~/.bun/bin/gbrain serve (cd runtime/brain/).
  # Backed by Supabase Free project ritsu-brain (ap-southeast-2) — SEPARATE
  # from ritsu-ops. ~70 tools total; HITL tier classification per
  # governance/HITL.md Appendix A. Sprint 1 v1.0 registers a representative
  # subset (~30 tools across all 4 tiers); Sprint 2+ expands per usage signal.
  # Tools NOT enumerated below follow the naming pattern:
  #   read-only / introspection (search/get/list/find/traverse/code_*/whoami/...)
  #     → tier_default: A
  #   single-page mutations (put/update/archive/file_upload/add_link/...)
  #     → tier_default: B
  #   multi-page batch ops (mass_/bulk_/schema_migrate/regenerate_all/dream_cycle_manual)
  #     → tier_default: C
  #   destructive (mass_purge/drop_all_links/reset_brain)
  #     → tier_default: D-Std
  #
  # Per-tool registration here is REQUIRED for the .mcp.json wrapper allowlist
  # enforcement. Tools not listed default-deny.

