# Analytics Sync Contract — capability product-db-readonly-access (Door 2)
#
# The single COMMITTED, repo-side source of truth for the pseudonymized
# Product→analytics data path. Everything product-side (the stripped views, the
# salt, the FDW) lives in the product DB and a local-only SQL file; THIS file is
# the ops-side contract a validator can check deterministically.
#
# Validated by scripts/cross-tier/validate-analytics-readonly.cjs (L2 critical):
#   1. synced_tables ∩ forbidden_content_tables == ∅  (no content table ever synced)
#   2. consumer_allowlist == ANALYTICS_ALLOWED_ROLES in
#      mcp-server-analytics/src/governance/role-allowlist.ts  (no allowlist drift)
#   3. mcp_server is registered in .mcp.json
#   4. read_surface_schema == 'live' and the two roles are present
#   5. synced_tables == the live.sync_all() table array in
#      mcp-server-analytics/sql/analytics-machinery.sql (no sync-scope drift, both
#      directions: a table missing there never syncs; a table there but not here
#      bypasses check 1)
#
# Owner: founder
# Change policy: PR + founder review (Tier C). Expanding synced_tables also
# requires a founder D-MAX product-side DDL touch (Sprint 3).

version: 1.2.0                        # Sprint 5 — synced_tables 17 → 30 (+ REVENUE: payments/lemon_variants/credit_packs LemonSqueezy; + learning-research quiz/flashcard/activity/achievements; + anonymous content engagement). Sprint 3 was 3 → 17.
last_updated: 2026-06-03
owner: founder
capability_id: product-db-readonly-access

project:
  name: ritsu-analytics
  ref: ddgbabvbfjrsznvzhizf          # us-west-1; isolated from Product (ixfvqxnohlmayzuesrrq)
  region: us-west-1
  org: same-org-as-product           # accepted residual (free-tier quota) — flagged in DPIA; revisit at scale
  read_surface_schema: live          # the ONLY schema the consumer MCP may read

roles:
  consumer: analytics_reader         # least-priv: LOGIN, SELECT on live.* only; read-only txn + statement_timeout (role-level). The MCP connects AS this.
  product_export: analytics_export_ro  # product-side FDW export role: SELECT on the PII-stripped analytics_export.* views only

# The ONLY tables synced Product → analytics (Door 2). 30 as of Sprint 5.
# Each is a PII-stripped + HMAC-hashed VIEW product-side (analytics_export.*),
# pulled via postgres_fdw into ext.*, validated in staging, swapped into live.*.
# Every user column is uh()-hashed (user_hash); enums cast ::text in the view;
# all free-text/identity/content/JSONB dropped (default-deny per doc 17 §1-2).
# MUST stay disjoint from forbidden_content_tables (validator-enforced).
synced_tables:
  # PoC-3 (user behavioral)
  - profiles
  - learning_sessions
  - learning_progress
  # Sprint 3 — behavioral / billing (user_hash-keyed)
  - sources
  - learning_projects
  - learning_plans
  - learning_units            # no user_hash; joins via plan_id → learning_plans
  - pok_progress
  - session_shares
  - ai_usage_logs
  - credit_transactions
  - user_pok_analytics        # product-side aggregate view, per user_hash
  # Sprint 3 — config / reference (no user data; columns enumerated, enum-safe)
  - tier_limits
  - ai_providers
  - ai_models
  - command_model_configs
  - onboarding_categories
  # Sprint 5 — REVENUE (LemonSqueezy)
  - payments                  # revenue ledger (amount_usd). Drops lemon_customer_id/order/sub/refund ids + invoice/update-payment-method URLs + metadata jsonb
  - lemon_variants            # price catalog (config, no user)
  - credit_packs              # credit-pack catalog (config, no user)
  # Sprint 5 — learning-research / engagement (user_hash-keyed)
  - quiz_attempts             # drops user_answer (jsonb)
  - flashcard_reviews         # SM-2 spaced-repetition metrics
  - activity_results          # drops details (jsonb)
  - user_achievements
  - achievements              # config catalog (no user)
  - resource_providers        # config cost-per-unit (no user)
  # Sprint 5 — anonymous content engagement (session_hash, NO user_id)
  - blog_post_views
  - docs_article_views
  - docs_article_feedback     # drops comment (free-text) + user_agent (fingerprint)
  - learn_tutorial_views

# Content / identity tables — NEVER synced. They stay in Product forever.
# default-deny already excludes anything not in synced_tables; this list is an
# explicit tripwire — if any of these EVER appears in synced_tables, the
# validator fails (critical).
forbidden_content_tables:
  - chat_messages
  - source_contents
  - source_images
  - chunks
  - pok_content
  - messages
  - documents
  - notes
  # Sprint 5 — explicit tripwires for the highest-risk live tables (audit 2026-06-04)
  - webhook_events            # raw LemonSqueezy webhook payloads — customer email/card
  - content_subscribers       # email list (PII)
  - admin_users               # admin PII
  - admin_audit_log           # admin/system audit
  - system_settings           # may hold secrets
  - password_change_otp       # auth/security

# Which ops roles may query the supabase-analytics MCP at all (default-deny).
# MUST equal ANALYTICS_ALLOWED_ROLES in
# mcp-server-analytics/src/governance/role-allowlist.ts — the validator enforces.
# Applies in the DEFAULT service-key auth mode (agent-role identity).
consumer_allowlist:
  - founder
  - cofounder
  - customer-lead
  - product-orchestrator
  - gtm-orchestrator
  - feedback-aggregator

# Per-human authorization (capability multi-user-auth, Sprint 2 — ITEM A).
# When RITSU_AUTH_MODE=per-human the analytics MCP gates by the operator's
# VERIFIED tier (read from app_metadata.tier in the access token supabase-ops
# persists to the credential file — read-only, never refreshed → no token-rotation
# race), NOT the self-asserted agent role. Per knowledge/operator-tiers.yaml.
# Fail-closed: a null/unknown tier is denied (tier_not_allowed). This is
# least-privilege defense-in-depth — the least-priv analytics_reader DB role
# (SELECT-only over pseudonymized live.*, no PII, isolated project) stays the
# REAL confidentiality boundary, so even a malicious laptop owner who forges a
# local token reaches only that read-only, pseudonymized, non-PII data.
per_human_tier_gate:
  allowed_tiers: [owner, admin]      # ANALYTICS_ALLOWED_TIERS in role-allowlist.ts
  denied_tiers: [user]               # + null/unknown/expired → denied (fail-closed)
  real_boundary: "analytics_reader DB role (read-only, pseudonymized, isolated) — unchanged"
  exp_enforced: true                 # unlike supabase-ops (RLS re-checks server-side), the analytics
                                     # local decode is the ONLY gate, so an EXPIRED access token is
                                     # rejected → a stale tier cannot keep granting. Caps the
                                     # downgrade/revocation blind spot to the token lifetime (~1h).
  staleness_note: "tier from a non-expired ≤~1h access token; DB-side instant revocation is Sprint 3"
  # Downgrade lag (audit 2026-06-30 completeness gap). The two LOCAL tier gates
  # (this analytics gate + the gbrain hook) decode the tier from a still-valid
  # access token, so an admin→user (or any) demotion does NOT take effect until
  # that token expires/rotates — i.e. up to the access-token lifetime (~1h).
  # IMPORTANT: migration 00050 (DB-side INSTANT revocation) ANDs ops.operators.status
  # into the ops.* RLS helpers and therefore covers ONLY the supabase-ops DB path —
  # it does NOT cover these two local-decode gates (analytics never transmits the
  # token; gbrain is an external binary). For analytics+gbrain, instant demotion
  # requires upstream token revocation (sign-out / refresh-token revoke) or a
  # shorter access-token TTL. Accepted tradeoff; bounded by exp_enforced + the real
  # least-priv analytics_reader DB boundary.
  downgrade_lag: "~1h (access-token lifetime); 00050 instant-revocation does NOT cover the local gates"

  # The tier is resolved FRESH per tool call (server.ts resolveCtx), not once at boot:
  # supabase-ops may persist the access token a moment after analytics starts, and a
  # later refresh must unblock analytics without an MCP restart.
  tier_resolution: per_call

  # Denial diagnosability (2026-07-10). Previously EVERY way of failing to establish a
  # tier collapsed into tier "unknown", so an operator could not tell an expired token
  # from a missing credential file from an account with no tier claim. The denial now
  # carries a machine-readable `reason` + a `remediation`, while the coarse wire code
  # (`tier_not_allowed`) is unchanged. This is a DIAGNOSIS, not a permission: every
  # reason below still denies (fail-closed), as pinned by the invariant tests in
  # mcp-server-analytics/test/credential-diagnostics.test.ts.
  #   Source of truth: CredentialReason in
  #   mcp-server-analytics/src/governance/operator-credential.ts
  denial_reasons:
    - tier_not_permitted              # a real tier was decoded, but it is 'user'
    - no_credential_source            # neither inline token nor credential-file path configured
    - credential_file_missing         # supabase-ops has never persisted
    - credential_file_unreadable      # exists but unreadable / not a JSON object
    - credential_file_no_access_token # cold start: refresh token persisted, access token not yet
    - token_undecodable               # not a decodable 3-part JWT
    - token_no_exp                    # undated token — refused (could otherwise grant forever)
    - token_expired                   # the common one: supabase-ops is not running / its refresh token is spent
    - token_no_tier_claim             # live token, no app_metadata.tier

mcp_server: supabase-analytics       # must be registered in .mcp.json (validator checks)

privacy:
  pseudonymized: true                # user_hash = HMAC(user_id, salt); never email/name
  salt_location: product-only        # analytics_secret.config (RLS-locked); never reaches ops/analytics
  pii_canary: per-text-column-and-array-element  # live.pii_canary() (Sprint 3: array-aware — also unnests text[] cols) must return 0 before any staging→live swap
  gdpr_erasure: nightly-full-replace # an erased user drops out next sync; formalized in SOP-CUSTOMER-023

schedule:
  job: analytics-sync-nightly        # in-DB pg_cron on ritsu-analytics (NOT the ops dispatcher)
  cron: "0 11 * * *"                 # 11:00 UTC daily
  freshness_slo_hours: 26            # KPI analytics_sync_freshness alerts if last success older than this
