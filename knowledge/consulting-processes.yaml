        frameworks:
          - prioritisation-matrix-2x2
          - time-blocking
          - four-ds-email
          - deep-work-protocol
      - 'n': 6
        name: Manage Your Team
        goal: >-
          Build a high-performing, cohesive team with a clear mission, defined ways of working, strong trust, and a
          culture of coaching and accountability.
        key_question: How do I turn a group of individuals into a high-performing team with shared purpose and clear accountability?
        gate: >-
          Team produces its signed charter, agreed OKRs, and validated RACI — and leader has held the first round of
          GROW coaching sessions with all direct reports
        frameworks:
          - five-dysfunctions-lencioni
          - team-charter
          - okr-framework
          - raci-matrix
          - grow-coaching-model
          - adkar-change-model
      - 'n': 7
        name: Manage Your Stakeholders
        goal: >-
          Build a systematic stakeholder management practice that identifies every party who can affect or be affected
          by the leader's work, and implements tailored engagement plans to secure their support.
        key_question: Who are the key people I need to influence, and how do I manage each relationship proactively?
        gate: >-
          Leader has met with all 'Manage Closely' stakeholders within the first 30 days and has an active engagement
          plan for each
        frameworks:
          - stakeholder-mapping-matrix
      - 'n': 8
        name: Facilitate Meetings and Workshops
        goal: >-
          Enable the leader to design and facilitate high-energy, outcome-driven meetings and workshops where every
          participant contributes and every session produces a clear decision or plan.
        key_question: How do I run meetings and workshops that consistently produce decisions, not just discussion?
        gate: All participants confirm the meeting purpose was achieved and can name the 3 key decisions made
        frameworks:
          - facilitation-foundations
      - 'n': 9
        name: Define Personal Mission, Goals, and Values
        goal: >-
          Ground the leader's development in a clear personal identity: a mission statement, long- and short-term goals,
          and explicit values that guide every day's decisions.
        key_question: What kind of leader do I want to be, what am I driving toward, and what principles will I never compromise?
        gate: >-
          Leader can articulate their mission statement from memory and identify one concrete action this week that
          serves each long-term goal
        frameworks:
          - personal-mission-canvas
          - smart-problem-definition
    routing_card:
      trigger: engagement requires building leadership capability or diagnosing people/team/org effectiveness
      plugs_into: structure
      value: >-
        gives you a proven 9-phase spine (problem→communicate→negotiate→time→team→stakeholders→facilitation→mission)
        instead of an ad-hoc people-framework pick
      key_question: >-
        What leadership system does this leader or team need to close the gap between current capability and required
        performance?
  - slug: financial-modeling-planning-analysis
    title: Financial Modeling, Planning & Analysis
    domain: finance
    model_name: >-
      3-Phase FP&A Cycle (Financial Modeling Foundation → Financial Analysis → Financial Planning → Implement, Track &
      Manage)
    when_to_use: >-
      Use this toolkit when: (1) you need to evaluate the financial viability of a project, acquisition, or new
      business; (2) you are building an annual operating plan, multi-year strategic financial plan, or budget; (3) you
      need to consolidate financial performance across business units; (4) you are preparing investor-grade valuation
      materials (DCF, comparable companies, precedent transactions); (5) you want to establish a repeatable FP&A
      function with dashboards, governance, and continuous improvement; or (6) you are a CFO, FP&A lead, or strategy
      consultant who needs one authoritative reference for all modeling and planning methods.
    core_value: >-
      The ability to translate strategy into numbers — building accurate financial models, a coherent multi-year
      financial plan, and the governance to track and improve performance — so executives can make decisions with
      quantified confidence instead of intuition.
    phases:
      - 'n': 1
        name: Financial Modeling Foundation
        goal: >-
          Build or select the right financial model for the decision at hand — from a basic three-statement model to a
          full M&A or DCF valuation — so all downstream analysis rests on technically sound, auditable numbers.
        key_question: Which model type fits this decision, and is it built to investment-grade standards?
        gate: >-
          All standard models built, peer-reviewed, and version-controlled in shared drive. Modeling best-practices
          document signed off by CFO.
        frameworks:
          - financial-modeling-best-practices
          - three-statement-model
          - project-business-case-model
          - dcf-model
          - wacc-model
          - scenario-sensitivity-model
          - comparable-company-analysis
          - precedent-transaction-analysis
          - ma-model
          - business-units-consolidation-model
          - cap-table-model
          - discounted-earnings-model
      - 'n': 2
        name: Carry Out a Financial Analysis
        goal: >-
          Develop a comprehensive, fact-based understanding of the company's historical and current financial health —
          income, balance sheet, cash flows, ratios, and competitive position — as the foundation for realistic
          planning.
        key_question: >-
          Where do we actually stand financially, and what are the key value drivers and risks in our current
          performance?
        gate: >-
          CFO and CEO have reviewed and aligned on the financial baseline findings. Key questions are documented for
          input into Phase 3 planning.
        frameworks:
          - income-statement-analysis
          - balance-sheet-analysis
          - cash-flow-analysis
          - three-statement-model
          - sales-costs-analysis
          - financial-ratios-analysis
          - financial-benchmarking
          - dcf-model
          - discounted-earnings-model
          - business-units-consolidation-model
      - 'n': 3
        name: Define Your Financial Plan
        goal: >-
          Translate strategic objectives into a quantified, funded financial plan with a prioritized initiative roadmap,
          a multi-year forecast, and budget allocations that make the plan executable.
        key_question: >-
          What financial performance do we need to achieve our vision, and exactly how will we get there — initiative by
          initiative, dollar by dollar?
        gate: >-
          Board or executive committee approves the financial plan, budget allocations, and top-10 initiative portfolio.
          Financial KPI targets formally set.
        frameworks:
          - mission-vision-strategic-objectives
          - dcf-model
          - scenario-sensitivity-model
          - financial-kpis-objectives
          - budget-allocation
          - initiative-list
          - project-business-case-model
          - initiative-prioritization
          - business-roadmap
      - 'n': 4
        name: Implement, Track & Manage Progress
        goal: >-
          Execute the financial plan with rigorous governance, real-time dashboards, and continuous improvement —
          closing the loop between plan and performance so the finance function drives outcomes, not just reports them.
        key_question: Are we on track to hit our financial plan, and how do we course-correct fast when we are not?
        gate: >-
          Year-end: financial plan objectives met or CFO has a credible corrective action plan presented to Board.
          Annual FP&A capability review completed with next-year improvement targets set.
        frameworks:
          - financial-governance
          - financial-dashboards
          - agile-methodology
          - design-thinking-methodology
          - traditional-project-management
          - quarterly-financial-update
          - continuous-improvement-fpa
          - program-project-evaluation
    routing_card:
      trigger: client needs a multi-year financial plan, valuation, budget, or performance management system
      plugs_into: structure
      value: >-
        provides a four-phase spine (model → analyze → plan → track) that sequences every financial tool in the right
        order, preventing the common failure of jumping to planning before rigorous analysis
      key_question: >-
        What financial performance must we achieve to realize our strategic vision, and are we currently on track to get
        there?
  - slug: data-analytics-ai-strategy
    title: Data Analytics & AI Strategy
    domain: technology
    model_name: >-
      The 6-phase Data Analytics & AI Strategy (Strategy → 4 Pillars → Use Cases → Business Cases → Roadmap → Change
      Management)
    when_to_use: >-
      When a board or executive asks 'how do we actually use AI?'; when data quality is blocking decisions; when the
      analytics team produces dashboards nobody acts on; when the company has multiple data sources but no single source
      of truth; when a CDO or CTO needs a defensible 3-year data roadmap; or when an organisation is launching a major
      digital or AI transformation and needs a structured programme framework.
    core_value: >-
      The structured capability to move from ad-hoc reporting to a data-driven operating model — auditing what you have,
      designing the right platform architecture, governing data so it is trusted, deploying analytics and AI against
      proven use cases, and measuring whether any of it is producing real business value. The buyer is purchasing the 'I
      finally know how to run a data and AI programme end-to-end' outcome.
    phases:
      - 'n': 1
        name: Define the Data Analytics & AI Strategy
        goal: >-
          Produce a signed-off strategy document that captures the corporate context, current and target maturity,
          vision/mission/values, strategic objectives and KPIs, team and budget plan, and guiding principles — for both
          the Data Analytics and AI dimensions.
        key_question: >-
          What do we want to achieve with data analytics and AI, how mature are we today, and what is the plan to close
          the gap?
        gate: >-
          Strategy gate: Is the Data Analytics & AI Strategy signed off by the CEO, CDO and CFO — including the budget
          and the KPI targets? No pillar work or use-case funding begins without sign-off.
        frameworks:
          - strategy-alignment-mapping
          - data-analytics-maturity-model
          - vision-mission-values-framework
          - strategic-objectives-kpi-framework
          - team-budget-planning
          - guiding-principles-framework
      - 'n': 2
        name: Build the 4 Pillars
        goal: >-
          Design and implement the four structural enablers — Data Management & Infrastructure, Data Governance &
          Compliance, Analytics Tools & Techniques, and Data-Driven Organisation — that make the strategic objectives
          achievable.
        key_question: >-
          What infrastructure, governance, tools and organisational capabilities must we build to deliver the strategic
          objectives at scale?
        gate: >-
          Pillar readiness gate: Are the four pillars sufficiently built to support the use-case delivery in Phase III?
          Specifically: is the priority data governed and quality-scored? If not, return to Pillar 2.
        frameworks:
          - data-architecture-patterns
          - data-pipeline-design
          - dimensional-modelling
          - data-governance-framework
          - technology-selection-matrix
          - analytics-tools-selection-matrix
          - analytics-org-model
          - data-literacy-programme
      - 'n': 3
        name: Identify Use Cases and Potential Initiatives
        goal: >-
          Build an exhaustive, prioritised portfolio of data analytics and AI use cases mapped to each pillar and each
          function, with value and feasibility estimates.
        key_question: >-
          What are the highest-value analytics and AI use cases for each business function, and which should we fund
          first?
        gate: >-
          Portfolio gate: Is there a shared, business-sponsor-validated view of the top-10 use cases? No business case
          is developed without a sponsoring business leader willing to own the value delivery.
        frameworks:
          - use-case-discovery-framework
          - value-feasibility-matrix
      - 'n': 4
        name: Build Business Cases and Financial Models
        goal: >-
          For each priority use case, build a rigorous business case that quantifies the financial return, the
          investment required, and the risk — enabling go/no-go investment decisions.
        key_question: Does each use case justify its investment, and how do we measure whether it has delivered its promised value?
        gate: >-
          Investment gate: Has the CFO approved the financial model methodology and the top-5 funded use cases? Only
          CFO-approved use cases enter the implementation roadmap.
        frameworks:
          - analytics-business-case-model
          - sensitivity-analysis
      - 'n': 5
        name: Prioritise, Plan and Implement Projects
        goal: >-
          Build and execute the project portfolio — from roadmap and governance to delivery using the right methodology
          (agile, design thinking, traditional) — with continuous improvement and post-implementation evaluation.
        key_question: >-
          How do we deliver the use-case portfolio on time, within budget, and with quality sufficient to change
          business decisions?
        gate: >-
          Delivery gate: Has Wave 1 delivered at least 3 working use cases that demonstrably change a business decision
          in the direction of better outcomes? If not, audit the portfolio before committing Wave 2 funding.
        frameworks:
          - project-prioritisation-framework
          - business-roadmap-framework
          - programme-governance-model
          - crisp-dm
          - agile-delivery-framework
          - post-implementation-review
          - mlops-framework
      - 'n': 6
        name: Change Management, Communication and Stakeholder Engagement
        goal: >-
          Ensure the organisation has the will, the skills and the management routines to adopt data-driven and
          AI-enabled ways of working — so the technology investment translates into lasting behavioural change.
        key_question: >-
          How do we make data-driven decision-making the default operating mode, not the exception — and how do we
          sustain it after the programme ends?
        gate: >-
          Sustainability gate: Is data-driven decision-making embedded in the management routines (business reviews,
          ExCo dashboards, hiring criteria) such that it will persist without a programme team to enforce it?
        frameworks:
          - adkar-change-model
          - change-management-plan
          - internal-comms-strategy
          - change-adoption-scorecard
    routing_card:
      trigger: client asks how to build or reset their data, analytics, or AI strategy end-to-end
      plugs_into: structure
      value: >-
        replaces ad-hoc issue trees with a six-phase validated spine covering maturity, pillars, use-case portfolio,
        business cases, roadmap, and change management
      key_question: >-
        What must this organisation build — technically, organisationally, and culturally — to reliably generate value
        from data and AI at scale?
  - slug: personal-finance-buffett-investing
    title: Personal Finance & Warren Buffett Investing
    domain: finance
    model_name: 6-Phase Personal Wealth & Value Investing Lifecycle
    when_to_use: >-
      Use this toolkit when you want to move from reactive money management to a deliberate wealth-building system: when
      you feel you have no clear picture of your net worth or cash flows; when you are ready to invest in equities but
      lack a disciplined, repeatable stock-selection process; when you are transitioning from index funds to individual
      stock picking; or when past speculative trades have not produced consistent returns and you want to rebuild on
      Buffett's first-principles value investing methodology.
    core_value: >-
      A practitioner gains the complete system to diagnose their current financial health, build a sustainable savings
      engine, then deploy surplus capital exactly as Warren Buffett would — selecting only businesses with durable
      competitive moats at prices that guarantee a margin of safety — so they can compound wealth across decades rather
      than speculate month-to-month.
    phases:
      - 'n': 1
        name: Personal Finance Baseline
        goal: >-
          Establish a precise, quantified picture of your current net worth, income, costs, savings rate, and
          wealth-building trajectory so you know exactly how much capital is available to invest and on what timeline.
        key_question: >-
          What is my true financial position today — assets, liabilities, income, expenses, and free cash flow for
          investing?
        gate: Investable monthly surplus ≥ chosen minimum AND emergency fund fully funded → proceed to Phase 2
        frameworks:
          - net-worth-statement
          - income-expense-savings-dashboard
          - investment-options-ladder
      - 'n': 2
        name: Warren Buffett Value Investing Philosophy
        goal: >-
          Build the intellectual foundation for Buffett-style investing by internalising the core principles drawn from
          the six canonical texts, so every subsequent decision is grounded in a coherent philosophy, not headlines or
          tips.
        key_question: >-
          What are the first principles that make Buffett's approach work, and which of my existing beliefs must be
          discarded?
        gate: Manifesto written and reviewed → proceed to Phase 3
        frameworks:
          - buffett-philosophy-canvas
      - 'n': 3
        name: Warren Buffett Value Investing Strategy Design
        goal: >-
          Translate philosophy into a concrete, personalised investment strategy by specifying the eight strategic
          parameters that will govern every decision — from what you buy to how much cash you keep.
        key_question: >-
          What are my precise, written rules for how I will invest — objective, portfolio structure, mindset guardrails,
          decision process, frequency, cash reserve, horizon, and valuation models?
        gate: IPS complete and all valuation models functional → proceed to Phase 4
        frameworks:
          - investment-policy-statement
          - portfolio-construction-rules
          - buffett-mindset-rules
          - dcf-valuation
          - owner-earnings-model
          - irr-calculator
      - 'n': 4
        name: Stock Watchlist and Screener
        goal: >-
          Build and maintain an ongoing pipeline of high-quality business candidates that pass Buffett's preliminary
          filters, so Phase 5 due diligence is applied only to genuinely promising investments.
        key_question: >-
          Which businesses currently on the market meet my preliminary quality and price filters, and how do I
          systematically track and update this list?
        gate: >-
          Watchlist populated with ≥ 10 qualified companies, all with investment thesis and estimated intrinsic value →
          proceed to Phase 5
        frameworks:
          - buffett-stock-screener
          - moat-assessment-framework
          - margin-of-safety
      - 'n': 5
        name: Detailed Stock Investment Decision-Making Process
        goal: >-
          Apply Buffett's four-gate decision framework to each watchlist company that enters the buying zone, producing
          a rigorous, documented buy/no-buy decision with full supporting analysis.
        key_question: >-
          Does this specific company — at this specific price — pass all four gates: personal fit, business quality,
          durable MOAT, and value pricing?
        gate: All four gates pass AND written Investment Case document complete → execute trade
        frameworks:
          - circle-of-competence
          - investment-policy-statement
          - financial-statement-analysis
          - porters-five-forces
          - moat-assessment-framework
          - dcf-valuation
          - owner-earnings-model
          - irr-calculator
          - margin-of-safety
          - portfolio-construction-rules
      - 'n': 6
        name: Stock Portfolio Management
        goal: >-
          Maintain a disciplined, ongoing record of all trades, monitor portfolio performance against benchmark, and
          make informed decisions about holding, adding to, or exiting positions — without the emotional noise of daily
          price movements.
        key_question: >-
          Is my portfolio performing as expected relative to the S&P 500, are the businesses I own still fundamentally
          strong, and is there anything I should add, hold, or exit?
        gate: >-
          Ongoing — exit any position when Gate 2/3 fundamentals fail; hold until fundamentals deteriorate or price
          exceeds 150% of intrinsic value
        frameworks:
          - portfolio-management-system
          - moat-assessment-framework
          - financial-statement-analysis
    routing_card:
      trigger: >-
        individual needs to build or audit a disciplined value-investing process from personal financial baseline to
        active portfolio
      plugs_into: structure
      value: >-
        replaces ad-hoc stock-picking with a gated 6-phase lifecycle that connects personal cash flow, written strategy,
        systematic screening, and ongoing portfolio governance
      key_question: >-
        Given my current financial position and temperament, which businesses can I understand, own for a decade, and
        buy at a significant discount to intrinsic value?
