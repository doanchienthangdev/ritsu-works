  - slug: leadership-development
    title: Leadership Development
    domain: people
    model_name: 9-Module Leadership Mastery System
    when_to_use: >-
      Use this toolkit when (1) a newly promoted manager or senior individual contributor needs a structured fast-track
      to executive-level leadership skills; (2) an organisation is running a leadership development programme for its
      top-100 or top-500; (3) a team is underperforming and the root cause traces to leadership capability gaps; (4) a
