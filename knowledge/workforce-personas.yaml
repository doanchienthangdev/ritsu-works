personas:

  ceo:
    full_name: Chief Executive Officer
    phase: 1
    status: active
    pillar_home: 06-ai-ops/workforce-personas/ceo/
    binds_to:
      primary: gps
      contextual: [founder-coach]
    invocations:
      slash_command: /ceo
      subagent_mention: "@ceo"
    routing_targets:
      - cto
      - cgo
      - cpo
      # Phase 2-4 targets activated when those personas ship:
      - cmo
      - cso
      - cco
      - cdo
      - cfo
      - ciso
      - cds
      - coo
    voice_profile: strategic-terse-decisive
    default_hitl_max: C
    notify_founder: true
