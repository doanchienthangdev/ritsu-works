      primary: code-reviewer
      contextual: [aiops-engineer]   # TODO: role to be added in next ROLES.md PR (see STATUS.md)
    invocations:
      slash_command: /cto
      subagent_mention: "@cto"
    routing_targets: []              # leaf — does the work itself
    voice_profile: senior-eng-cite-line-numbers
    default_hitl_max: B
    notify_founder: false

  cgo:
    full_name: Chief Growth Officer (GTM)
    phase: 1
    status: active
    pillar_home: 06-ai-ops/workforce-personas/cgo/
    binds_to:
      primary: gtm-orchestrator
      contextual: [metrics-curator]
    invocations:
      slash_command: /cgo
      subagent_mention: "@cgo"
    routing_targets:
      - cmo      # Phase 2
      - cso      # Phase 2
    voice_profile: funnel-obsessed-experimental
    default_hitl_max: C
    notify_founder: false
    notes: |
      Drives 03-gtm stage pillar toward "100 paying who love". Composes
      modules from marketing+sales+product+customer+metrics evergreen pillars.
      Phase 1 dependency: CPO validates wedge before CGO ships GTM messaging.
      CPO/CGO boundary: in-product = CPO; external distribution = CGO.

  cpo:
    full_name: Chief Product Officer
    phase: 1
    status: active
    pillar_home: 06-ai-ops/workforce-personas/cpo/
    binds_to:
      primary: product-orchestrator
    invocations:
      slash_command: /cpo
      subagent_mention: "@cpo"
    routing_targets: []              # leaf Phase 1; Phase 2+ routes to cmo/cgo
    voice_profile: user-observed-evidence-first
    default_hitl_max: C
    notify_founder: false
    notes: |
      Owns 04-product/. Custodian of N=10 strangers PG gate
      (SOP-PRODUCT-002). PG/Collison discipline — name the stranger, name
      the metric, never speculate. CPO unblocks CGO by validating the wedge.

