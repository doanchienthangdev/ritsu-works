# ---------------------------------------------------------------------------
# Naming policy (enforced by validators)
# ---------------------------------------------------------------------------
naming_policy:
  slug_pattern: "^[a-z]{3,5}$"         # lowercase 3-5 letters (CISO=4, default expected 3)
  slash_command_pattern: "^/[a-z]{3,5}$"
  mention_pattern: "^@[a-z]{3,5}$"
  no_prefix: "no ritsu:/rs: namespace; flat slugs only"
