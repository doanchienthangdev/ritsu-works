    source_books:
      - elements-of-style-strunk-white
  - id: classic-style-window
    name: Classic Style (Window onto the World)
    family: style
    rank: 109
    score: 39
    structure: >-
      1) Fix the truth you can already see before writing — you are showing, not figuring out. 2) Cast the idea
      as concrete objects and people DOING things a reader could watch. 3) Orient the reader's gaze as one equal
      pointing something out to another in conversation. 4) Trust the reader to connect the dots — no spelling
      out every step. 5) Present, don't hedge or argue.
    when_to_use: The default voice for explaining anything clearly — the strongest cure for academese and jargon.
    applies_to_types:
      - blog
      - tutorial
      - article
      - essay
      - course
      - newsletter
      - landing-page
      - email
      - faq
    how_to_apply: >-
      Rewrite each abstract sentence as 'a real actor does a visible thing', then read it as if pointing across
      a table to a friend ('As we have seen…', not 'This section demonstrates…'). The #1 discipline is killing
      metaconcepts and zombie nouns — if you can't 'see a perspective on the street', cut it and turn the
      -ance/-ment/-ation noun back into a verb.
    example: >-
      Not 'The acquisition process involves spaced retrieval.' But 'You re-quiz yourself a day later, then a
      week later, and the fact sticks.'
    source_books:
      - sense-of-style-pinker
  - id: concrete-image-test
    name: Concrete-Image Test (See It, Feel It)
    family: style
    rank: 110
    score: 39
    structure: >-
      1) Read each sentence and ask: can the reader form a picture or feel a motion? 2) If it names an
      abstraction (a 'stimulus', an 'assessment'), replace it with the concrete thing it stands for (a tap on
      the arm, the word TRUE). 3) Prefer the specific over the generic ('the ivory chess set fell off the table'
      beats 'the set fell off'). 4) Keep idioms and imagery physically coherent so the reader's visual brain
      stays on.
    when_to_use: Whenever explaining a concept, process, or finding that risks reading as gray abstraction.
    applies_to_types:
      - tutorial
      - blog
      - course
      - video-script
      - presentation
      - article
      - faq
      - landing-page
    how_to_apply: >-
      Underline every abstract noun and ask 'could I point to one on the street?' — if not, swap in the seeable
      thing, because readers remember concrete language far better. The #1 failure mode is functional fixity:
      you name things by the role they play for you, not by how they'd look to the reader.
    example: >-
      Not 'Learners exhibit retrieval failure under load.' But 'You blank on the formula the second the timer
      starts ticking.'
    source_books:
      - sense-of-style-pinker
      - everybody-writes-handley
  - id: coherence-connectives
    name: Arcs of Coherence (Connective Discipline)
    family: style
    rank: 111
    score: 36
    structure: >-
      1) For each pair of adjacent sentences, name what the second does to the first: RESEMBLE (similarity,
      contrast, elaboration, example, exception), be CONTIGUOUS in time/place (sequence), or
      CAUSE/ENABLE/PREVENT. 2) Choose the connective that names that exact relation (and, but, because, so, for
      example, however). 3) For compare/contrast, hold the wording constant and vary ONLY the word carrying the
      difference (parallel syntax). 4) Never rename the same thing mid-comparison.
    when_to_use: Any multi-sentence explanation, argument, or comparison where the reader must track the logic.
    applies_to_types:
      - essay
      - blog
      - article
      - report
      - tutorial
      - proposal
      - paper
      - review
      - course
    how_to_apply: >-
      After drafting, label the link between each sentence pair with one connective word; if you can't, the
      logic is missing or the connective is wrong. The #1 failure mode is 'synonymomania' — renaming the same
      thing while comparing two items makes readers hunt for a second referent that doesn't exist.
    example: >-
      'Flashcards test recognition; active recall tests retrieval.' (parallel — only the contrasting verbs
      change).
    source_books:
      - sense-of-style-pinker
  - id: one-idea-per-sentence
    name: One-Idea-Per-Sentence (Linear Sequencing)
    family: learn
    rank: 112
    score: 38.5
    structure: >-
      1) Write the explanation. 2) Find any sentence carrying two dissimilar thoughts and split it at the
      period. 3) Ensure each sentence contains exactly one idea, delivered in the order the learner needs it. 4)
      Front-load mood-changers (but, yet, however, meanwhile) so the reader is primed for a turn before it
      happens. 5) Read aloud to confirm each step lands before the next begins.
    when_to_use: Explaining technical, sequential, or unfamiliar material a learner must follow step by step.
    applies_to_types:
      - tutorial
      - course
      - article
      - research-paper
      - faq
      - report
      - presentation
      - essay
      - blog
    how_to_apply: >-
      Remember 'readers process one idea at a time, in linear sequence', so never make one sentence do too much
      work — break a long sentence into two or three. The #1 failure mode is the dense compound sentence that
      forces the learner to re-read; most writers don't reach the period soon enough.
    example: >-
      Split 'Mitosis copies the DNA which then condenses into chromosomes that line up so the cell can divide'
      into four plain steps, one per sentence.
    source_books:
      - on-writing-well-zinsser
  - id: control-sprawl-modifiers
    name: Control Sprawl (Resumptive / Summative / Free Modifiers)
    family: style
    rank: 113
    score: 32
    structure: >-
      When a sentence must run long, reach a complete subject-verb-object first, then extend AFTER it with one
      named move: RESUMPTIVE (pause with a comma, repeat a key noun, continue with 'that…'); SUMMATIVE (end a
      clause, add a noun summing it up, continue with 'that…'); or FREE (add an -ing/-ed/adjective phrase
      commenting on the subject). Avoid stacking subordinate clause onto subordinate clause.
    when_to_use: Writing an inevitably long, detail-rich sentence without it collapsing into a train of ungainly clauses.
    applies_to_types:
      - essay
      - article
      - report
      - research
      - blog
      - speech
      - book
      - novel
      - screenplay
      - proposal
      - paper
    how_to_apply: >-
      Get to a grammatically complete statement, then graft the extension on with deliberate punctuation and one
      of the three moves. The #1 discipline is never letting a 'which… that… because…' chain dangle off the tail
      — free modifiers are the most versatile and can also lead the sentence, adding texture while keeping the
      spine clean.
    example: >-
      'Ritsu turns a PDF into a study plan — a plan that orders topics by difficulty and auto-builds a quiz for
      each.' (resumptive on 'plan')
    source_books:
      - style-clarity-grace-williams
  - id: translate-the-jargon
    name: Translate the Jargon (Calibrate to the Reader)
    family: style
    rank: 114
    score: 38
    structure: >-
      1) List the jargon, abbreviations, and named concepts in your draft. 2) For each, ask: is this an
      entrenched chunk for THIS audience, or only for my clubhouse? 3) State the point once in precise field
      language, then immediately again in plain everyday words. 4) Spell out every coined abbreviation on first
      use. 5) When unsure, assume too little — bore a few experts rather than baffle the majority.
    when_to_use: Explaining any specialized or abstract concept to a non-expert (the core EdTech job).
    applies_to_types:
      - tutorial
      - blog
      - article
      - course
      - video-script
      - faq
      - newsletter
      - presentation
      - social-post
      - landing-page
      - email
      - product-description
    how_to_apply: >-
      Blend formal and colloquial deliberately — state it professionally, then restate it bluntly — and make the
      everyday version FAITHFUL, not a dumbing-down that distorts. The #1 discipline is assuming readers are as
      smart as you but happen not to know what you know; clarity is not condescension, and the curse of
      knowledge hides the gap from you.
    example: >-
      'Ritsu auto-generates SRS decks from your PDF.' → 'Ritsu turns your PDF into flashcards that resurface
      right before you'd forget them (spaced repetition).'
    source_books:
      - sense-of-style-pinker
      - they-say-i-say-graff
  - id: ideal-reader-test
    name: The Ideal-Reader Test (Close the Loop)
    family: ops
    rank: 115
    score: 36
    structure: >-
      1) Pick ONE specific person you write for; during drafting, keep asking 'what will they think of this
      part?' 2) Finish the draft. 3) Hand it to 1-3 people resembling that reader (or anyone not you). 4) Ask
      what was confusing, not whether they liked it — and watch WHERE they set it down (that's the boring part).
      5) Revise a point only when more than one reader flags it; when reactions split, tie goes to the writer.
    when_to_use: Calibrating pace, clarity, and 'is this landing?' for any audience-facing piece before publishing.
    applies_to_types:
      - blog
      - article
      - tutorial
      - course
      - newsletter
      - email
      - essay
      - landing-page
      - press-release
      - product-description
      - proposal
      - faq
    how_to_apply: >-
      Get a real signal — trying harder to imagine the reader does NOT cure the curse of knowledge; only actual
      readers reveal what's obvious to you but not them. The #1 discipline is NOT implementing every note:
      weight by agreement, because 'good prose is never written by committee' and pandering to every comment
      produces incoherent non-sequiturs.
    example: >-
      Before shipping a Ritsu onboarding email, have two non-power-users read it and circle the first sentence
      that made them pause.
    source_books:
      - on-writing-king
      - sense-of-style-pinker
  - id: signpost-sparingly
    name: Signpost Sparingly (Kill Metadiscourse)
    family: style
    rank: 116
    score: 34
    structure: >-
      1) Cut throat-clearing previews that read like a scrunched-up table of contents ('This section will
      discuss X'). 2) Replace them with a question ('What makes X happen?') or the vision metaphor ('As we have
      seen…', 'Now we arrive at…'). 3) Lay the material in an obvious sequence (general→specific, big→small) so
      each turn is self-evident. 4) Keep only light conversational signposts ('In other words', 'To make a long
