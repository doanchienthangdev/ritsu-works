# ============================================================================
# write-frameworks.yaml — writing/sales/marketing/learning framework library
# ============================================================================
# 100 ranked formulas the writer can apply with /write --framework=<id>. Composable
# WITH --type / --template / --author-style (a framework is a STRUCTURE/formula, not a
# full skeleton). Ranked by fit to Ritsu + ritsu-works (an AI-Native Company that markets a
# learning product) via the rubric below (Σ max 50; C1 Ritsu-learning-core is weighted highest).
#
# Schema: knowledge/schemas/write-frameworks.schema.json
# Gate:   scripts/cross-tier/validate-write-registries.cjs
# Resolved by: scripts/write/lib/frameworks.cjs ; reference: 06-ai-ops/write/FRAMEWORKS.md
# ============================================================================

version: 1.0.0
