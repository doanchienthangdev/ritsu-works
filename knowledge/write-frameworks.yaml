    when_to_use: >-
      Org-voice copy — onboarding emails, product pages, support replies, FAQ, announcements — that reads cold
      or corporate.
    applies_to_types:
      - email
      - landing-page
      - product-description
      - faq
      - press-release
      - memo
      - newsletter
      - proposal
      - report
      - blog
      - social-post
    how_to_apply: >-
      Apply clarity, simplicity, brevity, humanity: 'readers identify with people, not abstractions', so every
      faceless sentence ('evaluative procedures were established') becomes a human one ('at the end of the year
