    when_to_use: Longer explainers, guides, and essays prone to academic over-structuring.
    applies_to_types:
      - tutorial
      - blog
      - article
      - essay
      - course
      - report
      - newsletter
      - presentation
    how_to_apply: >-
      Delete every sentence that talks ABOUT the text instead of advancing it, then make the route so clear that
      signposts become unnecessary. The #1 discipline is the cost test: a signpost must save the reader more
      work than decoding it costs, or it's just professional narcissism.
    example: >-
      Not 'In this guide, we will first cover, then discuss, then summarize spaced repetition.' But 'Why do you
      forget what you studied last week?'
    source_books:
      - sense-of-style-pinker
  - id: reverse-engineer-prose
    name: Reverse-Engineer Good Prose
    family: style
    rank: 117
    score: 35
    structure: >-
      1) Collect 3-4 passages that genuinely move you in your genre. 2) Read each slowly, phrase by phrase. 3)
      For every striking phrase, name WHY it works — fresh wording? concrete image? parallel syntax? planned
      surprise? a telling detail vs telling us? 4) Extract the reusable move. 5) Practice that move on your own
      material.
    when_to_use: Building a 'writerly ear' and a personal toolbox before drafting a new content type.
    applies_to_types:
      - blog
      - thread
      - social-post
      - essay
      - article
      - video-script
      - newsletter
    how_to_apply: >-
      Annotate sentence-by-sentence like a code review — write the reason beside each phrase, not just 'nice'.
      The #1 discipline is naming the MECHANISM, because only a named move is reusable; admiring prose without
      dissecting it transfers nothing.
    example: >-
      Study one viral study-tips thread; label each line ('hook = stark claim', 'proof = concrete number', 'turn
      = surprise') and reuse that skeleton for a Ritsu exam-prep thread.
    source_books:
      - sense-of-style-pinker
  - id: humanize-the-institution
    name: Humanize the Institution (I-Ness Warmth)
    family: copy
    rank: 118
    score: 38
    structure: >-
      1) Identify where the draft hides behind passive voice and abstraction ('initiatives were undertaken',
      'utilization', concept nouns). 2) Put a person back in: switch to I/we/you with active verbs that show
      someone doing something. 3) If 'I' is forbidden, at least THINK 'I' as you write — or draft in first
