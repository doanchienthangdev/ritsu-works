# ============================================================================
# write-frameworks.yaml — writing/sales/marketing/learning framework library
# ============================================================================
# 183 ranked formulas (100 base + 83 from /write learn master books) the writer applies with /write --framework=<id> (default auto =
# the orchestrator picks the best-fit OR writes free-style). Composable WITH --type /
# --template / --author-style. Each entry carries structure + when_to_use + how_to_apply
# (the PROCESS, so a writer who doesn't know it can apply it) + a concrete example.
# Ranked by fit to Ritsu + ritsu-works via the rubric below (Σ max 50; C1 learning-core ×3).
#
# Schema: knowledge/schemas/write-frameworks.schema.json
# Gate:   scripts/cross-tier/validate-write-registries.cjs
# Resolved by: scripts/write/lib/frameworks.cjs ; reference: 06-ai-ops/write/FRAMEWORKS.md
# ============================================================================

version: 1.1.0
schema: knowledge/schemas/write-frameworks.schema.json
families:
  - learn
  - headline
  - blog
  - story
  - video
  - social
  - copy
  - ops
  - landing
  - email
  - style
  - persuasion
  - advertising
  - screenwriting
  - academic
rubric:
  c1_ritsu_learning_core: 3
  c2_gtm_marketing: 2.5
  c3_frequency_breadth: 2
  c4_template_ability: 1.5
  c5_evidence_authority: 1
  max: 50
frameworks:
  - id: tutorial-step-by-step
    name: Step-by-Step Tutorial
    family: learn
    rank: 1
    score: 46.5
    structure: Prereqs → numbered steps (do → see) → verify → troubleshoot → next
    when_to_use: 'The default teaching structure: get the reader to a working result.'
    applies_to_types:
      - tutorial
      - video-script
    how_to_apply: >-
      List the prerequisites a reader must already have, then write numbered steps where each step pairs ONE action with
      the exact result they should see, so they can self-check before moving on. The #1 failure is skipping the 'see'
      half — a step that says 'click Upload' but never shows the confirmation leaves the reader unsure they succeeded;
      always include the observable outcome, a verify checkpoint at the end, and a short troubleshoot list for the 2-3
      ways it commonly breaks.
    example: >-
      Prereqs: a PDF on your device. 1. Drop the file into Ritsu → you'll see 'Analyzing…'. 2. Wait ~30s → a quiz
      appears. Verify: 5 questions on screen.
  - id: how-to-headline
    name: '"How to" Headline'
    family: headline
    rank: 2
    score: 46
    structure: How to [achieve desired outcome] [without the feared obstacle]
    when_to_use: The highest-utility headline — also teaches.
    applies_to_types:
      - blog
      - ad
      - video-script
    how_to_apply: >-
      State the exact outcome the reader wants, then name the SPECIFIC obstacle they're sure will block them and negate
      it with 'without' or 'even if'. The #1 mistake is a vague obstacle ('without the hassle') — pin down the real fear
      your reader voices ('without re-reading the whole textbook', 'even if you procrastinated all semester'). The
      'without' clause is what makes it credible, so spend most of your effort there.
    example: How to pass your anatomy final without re-reading 400 pages — even if your exam is in 3 days.
  - id: ultimate-guide
    name: Ultimate Guide / Pillar Page
    family: blog
    rank: 3
    score: 44
    structure: Promise mastery → chaptered sections → internal links → CTA
    when_to_use: The definitive resource that owns a topic + teaches.
    applies_to_types:
      - article
      - blog
      - tutorial
    how_to_apply: >-
      Open by promising a complete outcome ('by the end you'll be able to X'), then break the topic into self-contained
      chapters ordered by how a learner actually progresses, not alphabetically. Make each chapter skimmable with its
      own H2 and a one-line takeaway, and link sibling sections so the page works as a hub. The #1 mistake is padding
      for word count — every section must teach something the reader can't get from a thin competitor, or cut it.
    example: >-
      'The Complete Guide to Studying for Finals': chapters on spaced repetition, active recall, building a quiz from
      your notes — each linking to a focused how-to, closing with a free upload CTA.
  - id: abt
    name: ABT (And-But-Therefore)
    family: story
    rank: 4
    score: 43.5
    structure: Setup AND context → BUT the problem → THEREFORE the resolution
    when_to_use: One-sentence narrative engine (great for science communication).
    applies_to_types:
      - essay
      - blog
      - speech
      - social-post
    how_to_apply: >-
      Write the AND clause as agreed, friendly common ground (no conflict yet), then pivot hard on a single BUT that
      names ONE specific tension, then let THEREFORE state the consequence or action that resolves it. The discipline:
      keep it to one sentence with exactly one 'but' — the #1 mistake is stacking multiple problems (an 'AND-AND-AND'
      list) so the contrast goes flat and nothing feels at stake.
    example: >-
      Students highlight their textbooks and feel productive, BUT highlighting doesn't build recall, THEREFORE Ritsu
      turns each chapter into a quiz that actually makes it stick.
  - id: explainer-ps
    name: Explainer (Problem-Solution-How)
    family: video
    rank: 5
    score: 42.5
    structure: Problem → solution → how it works → CTA
    when_to_use: A 60-90s explainer that also teaches.
    applies_to_types:
      - video-script
    how_to_apply: >-
      Open by naming the viewer's pain in their own words within the first 5 seconds (no logo intro), then name your
      product as the solution in one plain sentence before showing how it works in 2-3 concrete steps tied to a visible
      on-screen action. The #1 mistake is front-loading features before the viewer feels the problem — earn the 'how' by
      making the pain land first, and keep 'how it works' to the smallest demo that proves the claim, ending on one
      specific CTA (not 'learn more').
    example: >-
      "Cramming a 60-page PDF the night before? Drop it into Ritsu, get a quiz in 30 seconds, and test yourself till it
      sticks. Try your first upload free."
  - id: scqa
    name: SCQA / Minto (Situation-Complication-Question-Answer)
    family: story
    rank: 6
    score: 42.5
    structure: Situation → Complication → Question → Answer
    when_to_use: Open any doc or pitch with a tight, logical setup.
    applies_to_types:
      - memo
      - proposal
      - report
      - essay
    how_to_apply: >-
      State the Situation as stable facts the reader already accepts, introduce the Complication as the change or
      problem that destabilizes it, let that tension raise the Question the reader is now asking, then make your Answer
      the direct, governing reply (which becomes the doc's thesis). The discipline: the Question must arise naturally
      from the Complication — the #1 mistake is a Situation that's secretly already the problem, which collapses the
      setup and makes the Answer feel unearned.
    example: >-
      Situation: teachers assign reading. Complication: students arrive unprepared and can't self-test. Question: how do
      we make any document practice-ready? Answer: Ritsu auto-generates quizzes from the upload.
  - id: hook-retain-reward
    name: Hook-Retain-Reward
    family: social
    rank: 7
    score: 42
    structure: 3-sec hook → retain (open loops) → reward (payoff) → CTA
    when_to_use: The short-video retention spine (Reel/Short/TikTok).
    applies_to_types:
      - video-script
      - social-post
    how_to_apply: >-
      Front-load the single most arresting visual or claim into the first 3 seconds — before any logo, intro, or setup —
      because viewers decide to stay or swipe almost instantly. Then plant an open loop ('here's what almost nobody
      does') so curiosity carries them through the middle, deliver the concrete payoff they were promised, and close
      with one CTA. The #1 mistake is a slow warm-up: if the hook is context instead of payoff-tease, you lose half the
      audience before the value lands.
    example: >-
      Hook: 'You're studying wrong.' Retain: 'Re-reading feels productive but it's the weakest method.' Reward: 'Upload
      notes, get quizzed instead.' CTA: 'Try it free.'
  - id: x-thread-formula
    name: X / Thread Formula
    family: social
    rank: 8
    score: 42
    structure: Post 1 = whole promise → one beat per post → payoff + ask
    when_to_use: A thread where each post earns the next.
    applies_to_types:
      - thread
      - social-post
    how_to_apply: >-
      Make post 1 a self-contained promise that states the full payoff and a reason to keep reading — it must work even
      if no one expands the thread. Then give exactly one idea per post (no post does double duty) and end each on a
      small cliff that pulls to the next, before closing with the payoff and a clear ask. The most common failure is a
      vague or cute opener; if post 1 doesn't promise something specific and worth the scroll, the rest is never read.
    example: >-
      Post 1: '7 study habits that quietly waste hours. The fix for each takes 2 minutes.' Then one habit per post,
      ending: 'Want this automated? Link below.'
  - id: listicle-post
    name: Listicle Article
    family: blog
    rank: 9
    score: 42
    structure: Title number = promise → each item a claim + payoff → through-line close
    when_to_use: A scannable list where every item earns its place.
    applies_to_types:
      - blog
      - article
    how_to_apply: >-
      Make the number in the title a real promise, then ensure every item delivers a distinct claim plus a concrete
      payoff (what the reader gains by doing it) — no filler entries added just to hit a round number. Order items by
      impact or logical sequence, not randomly, and end with a through-line sentence that ties them into one idea so it
      reads as an argument, not a pile. The common failure is items that overlap or restate each other; each should
      survive a 'why is this separate?' test.
    example: >-
      '7 Ways to Actually Remember What You Read': each item names a technique, gives a 2-line how, and a payoff —
      closing 'all seven share one move: retrieve, don't reread.'
  - id: tiktok-hcp
    name: TikTok Hook-Context-Payoff
    family: social
    rank: 10
    score: 41
    structure: Hook → minimal context → payoff → one CTA
    when_to_use: Vertical short script optimized for completion.
    applies_to_types:
      - video-script
      - social-post
    how_to_apply: >-
      Open on the result or the tension, not the backstory, then give only the minimum context needed to make the payoff
      land — usually one sentence. Reach the payoff fast and add a single CTA so completion (the metric the algorithm
      rewards) stays high. The classic error is over-explaining context: every extra setup second is a swipe risk, so
      cut anything the payoff doesn't strictly require.
    example: >-
      Hook: 'I crammed a 40-page chapter in one night.' Context: 'I stopped re-reading.' Payoff: 'I turned it into a
      quiz and drilled the gaps.' CTA: 'Try it.'
  - id: skyscraper
    name: Skyscraper
    family: blog
    rank: 11
    score: 41
    structure: Find the best existing piece → make it more complete/current → promote
    when_to_use: Rank by out-doing the top result.
    applies_to_types:
      - blog
      - article
    how_to_apply: >-
      Find the current top-ranking piece for your target query, list exactly where it falls short (outdated stats,
      missing steps, no examples, poor depth), then build a version that beats it on completeness, recency, and clarity
      — not just length. After publishing, actively promote it to sites already linking to the inferior piece, since the
      technique only works if the better asset gets seen. The mistake is making it merely longer; 'better' means more
      useful per the reader's actual job, with fresher data and clearer structure.
    example: >-
      Competitor's '2019 guide to flashcard apps' omits AI auto-generation; you publish a 2026 version covering
      auto-quiz-from-PDF, with side-by-side screenshots and updated pricing, then pitch it to their linkers.
  - id: aida
    name: AIDA
    family: copy
    rank: 12
    score: 41
    structure: Attention → Interest → Desire → Action
    when_to_use: The universal persuasion arc for ads, emails, pages.
    applies_to_types:
      - ad
      - landing-page
      - email
      - social-post
    how_to_apply: >-
      Write four distinct beats in order: a hook that earns the first glance (a question, stat, or pattern-break), a
      hook of relevance that connects the topic to the reader's situation, a vivid picture of the win that makes them
      WANT it, then one unmistakable next step. The #1 mistake is collapsing Interest and Desire into a feature list —
      Interest is 'this is about you,' Desire is 'imagine having this,' and they must feel different.
    example: >-
      Failing the exam Friday? Your 80-page textbook is unstudiable as-is. Upload it; get a quiz that drills exactly
      what you'll be tested on. Start free.
  - id: pas
    name: PAS (Problem-Agitate-Solution)
    family: copy
    rank: 13
    score: 41
    structure: Problem → Agitate (twist the knife) → Solution
    when_to_use: Lead with the reader's pain; the workhorse of direct response.
    applies_to_types:
      - ad
      - email
      - landing-page
      - social-post
    how_to_apply: >-
      Name the specific pain in the reader's own words, then Agitate by making the cost vivid and near-term (what it
      leads to, how it feels, what it's already costing) before offering the Solution as relief. The key discipline:
      Agitate must twist a pain the reader already feels — never manufacture fake urgency — and stay on the consequence,
      not yet the product.
    example: >-
      You reread the chapter three times and still blank on the test. Cramming harder won't fix passive reading. Ritsu
      turns any document into active recall practice.
  - id: feynman-technique
    name: Feynman Technique
    family: learn
    rank: 14
    score: 40.5
    structure: Concept → explain to a 12-year-old → find the gaps → simplify + analogy
    when_to_use: Teach/explain any concept so the reader truly gets it (and to expose what they don't).
    applies_to_types:
      - tutorial
      - essay
      - blog
      - video-script
    how_to_apply: >-
      Write the explanation as if speaking to a curious 12-year-old: short sentences, plain words, no jargon unless you
      immediately define it. The discipline is to hunt for the spots where you reach for a technical term or hand-wave —
      those are the gaps where YOUR understanding is thin; rewrite each with a concrete analogy until a smart child
      would nod. Never let an undefined abstraction survive the second pass.
    example: >-
      'Spaced repetition' = reviewing a fact right before you'd forget it, like watering a plant only when the soil
      dries — not too soon, not too late.
  - id: worked-example
    name: Worked Example
    family: learn
    rank: 15
    score: 40.5
    structure: State problem → show every step + the why → fade to a you-try
    when_to_use: Teach a procedure/skill by showing then fading the scaffolding.
    applies_to_types:
      - tutorial
      - blog
    how_to_apply: >-
      Pick one representative problem and solve it completely on the page, annotating not just each step but WHY you
      chose it ('we factor here because the equation is quadratic'). Then strip the scaffolding progressively: a second
      near-identical problem with one blank for them to fill, then a full 'you try' with no help. The common mistake is
      showing the steps but omitting the reasoning, which teaches imitation instead of judgment.
    example: >-
      Solve 2x+6=14: subtract 6 (isolate the x-term) → 2x=8; divide by 2 (undo the multiply) → x=4. Now you try:
      3x+9=24.
  - id: problem-solution-blog
    name: Problem-Solution Article
    family: blog
    rank: 16
    score: 40.5
    structure: Name the problem → why it persists → the solution → how to apply
    when_to_use: The default helpful-content shape (teaches + ranks).
    applies_to_types:
      - blog
      - article
      - tutorial
    how_to_apply: >-
      Name the problem in the reader's own words so they feel seen, briefly explain why it persists (the failed obvious
      fixes), then present your solution and walk through applying it step by step. Spend real estate on the 'why it
      persists' beat — that's what earns trust and separates you from surface advice. The frequent error is jumping to
      the solution before the reader believes you understand the pain, which makes the fix feel generic.
    example: >-
      'Why you forget 80% of a lecture by Friday': cramming fails because recall isn't practiced → solution: turn the
      slides into a daily 5-question quiz → here's how in 30 seconds.
  - id: pixar-spine
    name: Pixar Story Spine
    family: story
    rank: 17
    score: 40.5
    structure: Once upon a time… every day… until one day… because of that… until finally…
    when_to_use: A reliable mini-story skeleton.
    applies_to_types:
      - story
      - social-post
      - speech
    how_to_apply: >-
      Fill each clause in order: establish a normal world ('once upon a time'), show the stable routine ('every day'),
      break it with one inciting event ('until one day'), then chain the consequences ('because of that…' repeated as
      needed) to a clear payoff ('until finally'). The discipline: the 'until one day' must overturn the 'every day' you
      just set up — the #1 mistake is a routine and a disruption that don't connect, so the consequence chain has
      nothing to push against.
    example: >-
      Once upon a time a med student crammed flashcards every day, until one day exams stacked up; because of that she
      uploaded her notes to Ritsu, until finally she walked in prepared.
  - id: pyramid-principle
    name: Pyramid Principle (Minto)
    family: ops
    rank: 18
    score: 40
    structure: Answer first → grouped supporting arguments → data
    when_to_use: Structure any argument top-down, MECE.
    applies_to_types:
      - memo
      - report
      - proposal
      - research
    how_to_apply: >-
      Lead with your single governing answer in one sentence, then group every supporting point under 3-5 MECE buckets
      (mutually exclusive, collectively exhaustive — no overlaps, no gaps), and only drop into data at the bottom of
      each branch. The discipline most people miss: each group must independently prove the line above it, and you must
      resist burying the answer under throat-clearing context — if a reader stops after sentence one, they should
      already have the takeaway.
      Before grouping, do the upstream force-ranking Heath calls finding the core: from everything you could say, rank to the SINGLE most important idea and state it first as a 'Commander's Intent' line a novice could act on alone — and accept that finding the core means discarding many true, good points.
    example: >-
      "Switch the free tier to 3 quizzes/day. Usage caps drive upgrades, our churn data confirms it, and rivals already
      gate harder." Then evidence under each.
  - id: comparison-x-vs-y
    name: Comparison (X vs Y)
    family: blog
    rank: 19
    score: 40
    structure: Frame the decision → criteria → head-to-head → who-should-pick-what
    when_to_use: Capture high-intent "X vs Y" search + help a real choice.
    applies_to_types:
      - blog
      - article
      - review
    how_to_apply: >-
      Open by framing the actual decision the reader faces, define 3-6 criteria that matter for that decision, then go
      head-to-head on each criterion before closing with clear 'pick X if… / pick Y if…' verdicts. Stay genuinely useful
      and fair — name where each option wins — because high-intent comparison readers smell bias instantly. The mistake
      is declaring one universal winner; real buyers differ, so segment the recommendation by use case.
    example: >-
      'Flashcards vs. Practice Quizzes for exam prep': criteria = recall depth, setup time, retention. Verdict:
      flashcards for vocab, auto-generated quizzes for applying concepts under time pressure.
  - id: heros-journey
    name: Hero's Journey
    family: story
    rank: 20
    score: 40
    structure: Ordinary world → call → trials → transformation → return changed
    when_to_use: Epic narrative arc for brand/origin/case stories.
    applies_to_types:
      - story
      - video-script
      - speech
    how_to_apply: >-
      Anchor the reader in the hero's ordinary world and dissatisfaction, hit them with a call (a problem or goal), show
      real trials and a low point where the old way fails, then deliver a transformation via a tool/mentor and a return
      where they're visibly changed. The discipline: keep the audience (or customer) as the hero and your brand as the
      mentor, not the hero — the #1 mistake is making your product the protagonist, which kills reader identification;
      also don't skip the trials, since the struggle is what makes the change credible.
    example: >-
      An anxious self-learner drowning in PDFs answers the call to truly master them, fails with passive rereading,
      meets Ritsu as guide, and returns acing the material he once feared.
  - id: bab
    name: Before-After-Bridge
    family: copy
    rank: 21
    score: 40
    structure: Before (pain world) → After (dream world) → Bridge (your offer)
    when_to_use: Fast, vivid framing for ads, emails, hooks.
    applies_to_types:
      - ad
      - email
      - social-post
      - landing-page
    how_to_apply: >-
      Paint the Before as the reader's frustrating present in concrete sensory detail, jump to the After as the same
      person in their solved future (same life, problem gone), then make the Bridge the shortest possible path from one
      to the other — your offer. The common failure is a weak contrast: Before and After must describe the same person's
      day so the gap feels real and personal, not generic.
    example: >-
      Before: highlighting pages, hoping it sticks. After: walking into the exam already quizzed on every concept.
      Bridge: drop your PDF into Ritsu, study active in 30 seconds.
  - id: 4u-headline
    name: 4 U's Headline
    family: headline
    rank: 22
    score: 40
    structure: Useful + Urgent + Unique + Ultra-specific
    when_to_use: Score and sharpen any headline/subject line.
    applies_to_types:
      - ad
      - blog
      - email
      - social-post
    how_to_apply: >-
      Treat this as a scoring rubric, not a template: rate your draft headline 1-4 on each U (Useful, Urgent, Unique,
      Ultra-specific), find the weakest, and rewrite to lift it. Most headlines fail on Ultra-specific and Urgent — swap
      abstractions for numbers/timeframes and add a real reason to act now. Don't force all four to maximum; a forced
      'unique' often reads as gimmicky — aim to clear a 3 on each.
    example: Turn tonight's lecture PDF into a 20-question quiz before you sleep — in 30 seconds, no signup.
  - id: hero-section
    name: Hero Section
    family: landing
    rank: 23
    score: 40
    structure: Promise headline → subhead → CTA → instant proof
    when_to_use: The above-the-fold that earns the scroll.
    applies_to_types:
      - landing-page
    how_to_apply: >-
      Lead with the single transformation the visitor wants, stated as a concrete outcome (not your feature or
      category). Write the headline first as a specific promise, let the subhead name WHO it's for plus the mechanism
      that makes the promise believable, make the CTA a verb-first next step, and place proof (a number, logo, or
      rating) within eyeball range of the button. The #1 mistake is a vague or clever headline that describes the
      product instead of the result — if a stranger can't tell what they GET in 5 seconds, rewrite it.
      Audit the first screen as a four-question test answered without scrolling — what is it, who is it for, why should I care, what do I do next — and treat any unanswered question (most often 'why care', or a buried CTA) as a leak; clever branding often answers 'what is it' poorly, so prioritize plain clarity over personality up top.
    example: >-
      Headline: "Turn any PDF into an exam-ready tutor in 30 seconds." Subhead names students + the AI quiz engine. CTA:
      "Upload your first file free." Proof: "Trusted by 40,000 learners."
  - id: educational-video-khan
    name: Khan-style Explainer
    family: learn
    rank: 24
    score: 39.5
    structure: Start where they are → one idea → narrate the work → check understanding
    when_to_use: A calm, build-from-zero teaching video (Ritsu's house style).
    applies_to_types:
      - video-script
    how_to_apply: >-
      Open at the viewer's current knowledge, not the textbook's starting point, and commit to teaching exactly ONE idea
      per video. Narrate your thinking out loud as you work a live example — including a small hesitation or correction
      so it feels human, not pre-baked — then close with a quick understanding-check the viewer can pause and attempt.
      The mistake to avoid is cramming three concepts in; if you can't name the single takeaway, split the script.
    example: >-
      'You already know how to divide. Today: what a fraction really is. Watch me cut this pizza into 4… so 3/4 means
      three of those slices. Pause — shade 2/4.'
  - id: case-study-blog
    name: Case Study
    family: blog
    rank: 25
    score: 39.5
    structure: Subject + goal → problem → approach → result (numbers) → takeaway
    when_to_use: Proof-driven story that sells without selling.
    applies_to_types:
      - blog
      - article
      - proposal
    how_to_apply: >-
      Introduce the subject and their concrete goal, establish the problem they faced, describe the approach taken, then
      report results with real numbers and end on a transferable takeaway. The discipline is quantifying the result
      (percentages, time saved, scores) — a case study without numbers is just an anecdote. The common failure is making
      it a thinly veiled ad; let the data sell and keep the narrative honest, including what was hard.
    example: >-
      'How a pre-med student raised her quiz scores 40%': drowning in 200-page notes → uploaded them, drilled
      auto-generated questions nightly → 62%→87% in three weeks. Takeaway: test before you reread.
  - id: inverted-pyramid
    name: Inverted Pyramid
    family: blog
    rank: 26
    score: 39.5
    structure: Most important first → supporting detail → background
    when_to_use: 'Journalism''s structure: the reader can stop anytime.'
    applies_to_types:
      - article
      - press-release
      - blog
    how_to_apply: >-
      Lead with the single most important fact or conclusion in the first sentence, then layer supporting details in
      descending order of importance, with background last. Write so a reader who stops after one paragraph still gets
      the core message — assume they will. The mistake is burying the lede with throat-clearing context or chronology;
      the newest/most-consequential point goes first, always.
    example: >-
      'Ritsu now turns any YouTube lecture into a quiz in 30 seconds.' Then: which formats, who it's for, accuracy notes
      — and finally, the backstory of why we built it.
  - id: exam-cram-3-day
    name: Exam-in-3-Days Plan
    family: learn
    rank: 27
    score: 39
    structure: Triage by weight → active recall blocks → spaced reviews → simulate the test
    when_to_use: 'Ritsu''s sharpest wedge: a high-stakes timed study plan.'
    applies_to_types:
      - tutorial
      - blog
      - email
    how_to_apply: >-
      Start by ranking every topic by its weight on the actual exam and the learner's current weakness, then allocate
      the scarce hours to the high-weight/weak intersection first — never study in syllabus order under time pressure.
      Fill the days with active-recall blocks (closed-book self-quizzing), schedule short spaced reviews of earlier
      material each day, and end with a full timed mock under real conditions. The #1 error is passive rereading, which
      feels productive but builds almost no retrieval strength.
    example: >-
      Day 1: triage — 60% of marks are Units 3 & 5, both shaky → drill those with closed-book quizzes. Day 2: re-quiz +
      new weak spots. Day 3: full timed mock exam.
  - id: story-lesson-application
