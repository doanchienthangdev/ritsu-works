      reader nothing.
    example: >-
      Not 'Ritsu provides enhanced learning environments via multimodal instructional materials.' Instead
      'Upload your notes and we'll turn them into quizzes you can actually pass.'
    source_books:
      - on-writing-well-zinsser
      - ogilvy-on-advertising
  - id: second-person-singular
    name: Second-Person-Singular Letter Voice
    family: copy
    rank: 119
    score: 37.5
    structure: >-
      1) Picture ONE reader, alone, reading. 2) Write as if penning that person a personal letter — 'you',
      singular. 3) Open with a grabber first sentence, never a mushy statement of the obvious. 4) Use short
      sentences, short paragraphs, everyday words. 5) Tell them what it does for THEM.
    when_to_use: Any direct, reader-facing copy where warmth and one-to-one intimacy drive trust and action.
    applies_to_types:
      - email
      - landing-page
      - ad
      - newsletter
      - blog
      - social-post
      - product-description
    how_to_apply: >-
      Replace stadium-address phrasing ('students everywhere love…') with one-human-to-another address, and make
      the first paragraph seize attention rather than ease in. The #1 failure mode is opening with the obvious —
      'Going on vacation is a pleasure everyone looks forward to' loses the reader in line one.
    example: >-
      'You've got the exam Friday and 80 pages you haven't touched. Drop the PDF in. In 30 seconds Ritsu hands
      you a quiz on exactly that chapter.'
    source_books:
      - ogilvy-on-advertising
  - id: specifics-over-superlatives
    name: Specifics Over Superlatives
    family: copy
    rank: 120
    score: 35
    structure: >-
      1) Hunt every vague claim and superlative in the draft (best, fastest, world-class, 'a lot', 'less than
      you think'). 2) Replace each with an exact figure, count, or named mechanism that implies you measured. 3)
      Prefer a number that sounds tested (78, 130, 2×) over a round invented-looking one. 4) Surface the single
      most surprising true specific into the headline. 5) If a claim can't be made specific, cut it.
    when_to_use: Whenever copy is leaning on adjectives and superlatives to do persuasion's job.
    applies_to_types:
      - ad
      - landing-page
      - product-description
      - email
      - blog
      - social-post
      - report
    how_to_apply: >-
      Run a superlative-hunt pass — every 'best/most/leading' is a red flag — and convert to a definite
      statement, because 'a man who makes a specific claim is either telling the truth or a lie, and people
      don't expect an advertiser to lie'. The #1 discipline is never shipping a number you couldn't defend; a
      false specific destroys more trust than a vague claim.
    example: >-
      Not 'Ritsu makes studying way more effective.' Instead 'Ritsu turns 1 PDF into 40 quiz questions and 25
      flashcards in 30 seconds.'
    source_books:
      - ogilvy-on-advertising
      - scientific-advertising-hopkins
  - id: offer-service
    name: Offer Service (Lead With What They Get)
    family: advertising
    rank: 121
    score: 36.5
    structure: >-
      1) Drop the ask — never open with 'buy', 'choose us', or the brand name as if it mattered. 2) Picture the
      reader's selfish gain: information they want, a result they crave, a risk removed. 3) Make a service offer
      that proves the claim at the reader's zero cost (free sample, try-before-pay, money-back). 4) Let the
      natural result of the value be the purchase — earn the decision instead of demanding it.
    when_to_use: >-
      Any persuasive piece (ad, landing page, email, product page) where the instinct is to say 'sign up' or
      'pick us'.
    applies_to_types:
      - landing-page
      - ad
      - email
      - product-description
      - social-post
    how_to_apply: >-
      Rewrite every 'buy/choose/get our app' line as the service the reader receives, then back it with a
      no-risk trial — 'the good salesman pictures the customer's side of his service until the natural result is
      to buy'. The #1 failure mode is talking about YOUR interest; read the draft and delete every sentence that
      serves the seller, not the reader.
    example: >-
      Not 'Sign up for Ritsu.' Instead 'Upload your hardest chapter — get a free 10-question quiz in 30 seconds.
      Keep it whether or not you stay.'
    source_books:
      - scientific-advertising-hopkins
  - id: preemptive-claim
    name: The Preemptive Claim
    family: advertising
    rank: 122
    score: 36
    structure: >-
      1) Find a true fact about how the product or process works that EVERY competitor could also claim but none
      has bothered to. 2) Be the first to tell it — in vivid, specific process detail. 3) Own it: the public now
      associates that universal truth with you alone. 4) Bonus: pair it with a coined or descriptive name so
      rivals can't ride the demand you created.
    when_to_use: Entering a crowded category where everyone makes the same vague claim ('pure', 'effective', 'AI-powered').
    applies_to_types:
      - landing-page
      - ad
      - press-release
      - blog
      - product-description
    how_to_apply: >-
      Audit your process for an unstated-but-ownable mechanism and describe it concretely before anyone else
      does — Hopkins's brewer detailed filtered air and washing every bottle four times, claims any brewer could
      have made, and owned the category. The #1 discipline is vivid process specifics, not the abstract claim.
    example: >-
      Every study app says 'AI-powered'. Ritsu instead: 'Every quiz question is traced to a line in YOUR
      document — tap it to see the exact source sentence. No invented facts.'
    source_books:
      - scientific-advertising-hopkins
  - id: benefit-or-news-headline
    name: Benefit-or-News Headline
    family: headline
    rank: 123
    score: 38
    structure: >-
      1) Lead the headline with the single strongest reader BENEFIT or a piece of NEWS. 2) Make the promise
      concrete and specific (a number, a named gain). 3) Put the brand or product name IN the headline. 4) Flag
      the target audience by name if it's a niche. 5) Telegraph plainly — no puns, no double meanings, no blind
      cleverness.
    when_to_use: Any short, scannable opener where most readers will only ever read that one line.
    applies_to_types:
      - ad
      - landing-page
      - email
      - blog
      - social-post
      - newsletter
    how_to_apply: >-
      Write 10+ headline variants, then keep only those that promise a benefit or break news, rejecting every
      'clever' headline that doesn't say what the thing does. The #1 failure mode is the witty headline that
      wins at the bar and loses at the cash register — five times as many people read the headline as the body,
      so a headline that doesn't sell wastes 90% of the work.
    example: >-
      'How to ace your biology final in 3 days — turn your textbook into 40 quiz questions.' (benefit + news +
      specific)
    source_books:
      - ogilvy-on-advertising
  - id: big-idea-five-questions
    name: Big-Idea Five-Question Test
    family: advertising
    rank: 124
    score: 34
    structure: >-
      Score any candidate concept against five gates: 1) Did it make me gasp when I first saw it? 2) Do I wish
      I'd thought of it? 3) Is it unique? 4) Does it fit the strategy to perfection? 5) Could it run for 30
      years? A real big idea passes all five.
    when_to_use: >-
      Selecting the central creative concept or hook for a campaign or flagship piece before building everything
      around it.
    applies_to_types:
      - ad
      - landing-page
      - video-script
      - presentation
      - social-post
      - blog
    how_to_apply: >-
      Generate by stuffing your conscious mind with research then unhooking rational thought (a walk, a shower);
      then run each survivor through the five questions and kill anything that fails gate 4 (on-strategy) or
      gate 3 (unique). The #1 failure mode is 'irrelevant brilliance' — a dazzling idea that doesn't fit the
      strategy.
    example: >-
      'Your textbook, talking back to you' — a tutor that quizzes from your own pages — passes unique +
      on-strategy + durable; a generic 'study smarter' tagline fails the gasp test.
    source_books:
      - ogilvy-on-advertising
  - id: do-your-homework
    name: Do-Your-Homework Pre-Write
    family: ops
    rank: 125
    score: 36
    structure: >-
      Before writing a word: 1) Study the product until a surprising fact surfaces. 2) Study competitors'
      messaging and results. 3) Talk to real prospects — learn the language THEY use and what promise would move
      them. 4) Decide positioning: 'what it does, and who it's for.' 5) Only then write.
    when_to_use: >-
      Front-loading any persuasive piece so the copy rests on a real, differentiating fact rather than
      invention.
    applies_to_types:
      - ad
      - landing-page
      - email
      - blog
      - article
      - product-description
      - proposal
      - press-release
    how_to_apply: >-
      Spend disproportionate time reading and interviewing before drafting — Ogilvy spent three weeks on
      Rolls-Royce and found the 'electric clock' line that became the headline. The #1 discipline is that even
      informal talks with half-a-dozen real users beat writing from your own assumptions; skipping homework
      risks 'the slippery surface of irrelevant brilliance'.
    example: >-
      Before writing Ritsu's exam-cram page, interview 6 students mid-finals; the phrase 'I just need it to quiz
      me on THIS chapter' becomes the headline.
    source_books:
      - ogilvy-on-advertising
  - id: editorial-not-ad
    name: Editorial-Not-Ad Format
    family: landing
    rank: 126
    score: 33
    structure: >-
      1) Make the piece look like editorial content, not a promotion. 2) Order elements the way the eye scans:
      image → headline-under-image → copy. 3) Put a selling caption under every image (captions out-read body
      copy). 4) Use clean readable type — dark text on light, serif body. 5) Strip the graphic 'tells' that
      scream 'skip me'.
    when_to_use: Any visual piece competing for attention where 'looks like an ad' kills readership.
    applies_to_types:
      - landing-page
      - blog
      - ad
      - newsletter
      - social-post
      - presentation
      - article
    how_to_apply: >-
      Construct it pretending you're an editor — roughly six times as many people read the average article as
      the average ad. The #1 levers: put the headline BELOW the image (read by ~10% more people) and never run
      an image without a selling caption carrying the brand name plus the promise.
    example: >-
      A Ritsu blog header reading like a study-skills article — image of an annotated textbook page, headline
      beneath, caption: 'Ritsu turned this chapter into 40 questions.'
    source_books:
      - ogilvy-on-advertising
  - id: test-before-scale
    name: Test-Before-Scale
    family: ops
    rank: 127
    score: 34.5
    structure: >-
      1) Before committing budget to one version, run 2+ variants of the load-bearing element (headline, offer,
      subject line) against a small real audience. 2) Measure to the outcome that matters — cost per CUSTOMER or
      per action, not per click or applause. 3) Keep only the winner; the difference between variants is
      routinely 5-10×. 4) Scale the proven version unchanged.
    when_to_use: Any time you'd otherwise pick the 'best' copy by opinion around a table.
    applies_to_types:
      - ad
      - email
      - landing-page
      - social-post
      - newsletter
    how_to_apply: >-
      Pick the single highest-leverage element (usually the headline), write several honest variants, ship them
      small, and read the keyed return — 'go to the court of last resort: the buyers of your product'. The #1
      failure mode is judging by what YOU admire: 'the appeals we like best will rarely prove best, because we
      do not know enough people to average up their desires'.
    example: >-
      A/B three email subject lines to 500 trial users — 'Your exam is in 3 days' vs 'Finish your study guide
      tonight' vs 'You uploaded a PDF — here's your quiz' — scale only the one with the most
      opens-to-activation.
    source_books:
      - scientific-advertising-hopkins
  - id: gradualization
    name: Gradualization (the Belief-Bridge)
    family: persuasion
    rank: 128
    score: 36
    structure: >-
      1) Open with a statement the reader already accepts as true (a shared resentment, symptom, or fact) — NOT
      your strongest claim. 2) Add an inclusion-question they answer 'yes' to. 3) Stack 5-8 more small
      agreements (symptom lists, 'how many times this week…'). 4) Only now introduce each bigger claim, each one
      logically bridged from the accepted facts before it. 5) Reach the payoff claim last, when it lands as
      inevitable.
    when_to_use: >-
      When your true claim is too big, too good, or too unfamiliar to be believed if stated cold — common for
      any 'you can do X yourself' or transformation promise.
    applies_to_types:
      - landing-page
      - email
      - ad
      - blog
      - video-script
      - course
    how_to_apply: >-
      Build a 'Habit of Agreement': never ask the reader to jump a believability chasm — lay one stepping-stone
      of already-accepted fact, then the next, each prepared by the one before. The #1 failure mode is leading
      with your power-claim; one fully-believed promise outsells ten half-believed ones.
    example: >-
      Don't open 'Ace any exam in 3 days.' Open 'Ever crammed all night and still blanked on the test?' → yes →
      then build to the 3-day claim.
    source_books:
      - breakthrough-advertising-schwartz
  - id: mass-desire-selection
    name: Mass-Desire Selection (Urgency × Staying-Power × Scope)
    family: persuasion
