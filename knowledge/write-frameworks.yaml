      passes and keeps her scholarship (student = hero).
    source_books:
      - everybody-writes-handley
  - id: six-elements-marketing-story
    name: Six Elements of a Marketing Story
    family: story
    rank: 171
    score: 37
    structure: >-
      A compelling story is: 1) True (real people, real data, cited sources). 2) Human (about how it improves
      actual people's lives — ideally one person). 3) Original (a fresh perspective only you can give). 4)
      Customer-as-hero (what you do FOR others, not what you do). 5) Emotionally moving. 6) Strategy-aligned
      (grows from positioning, value, and goals) — but put strategy LAST.
    when_to_use: As a pre-publish checklist / quality gate on any brand or product narrative before it ships.
    applies_to_types:
      - blog
      - press-release
      - presentation
      - video-script
      - landing-page
      - speech
      - story
    how_to_apply: >-
      Score the draft against all six; a story missing any one is weaker. The #1 discipline is order — 'start
      with people, infuse with emotion, align with strategy', because leading with strategy makes the story read
      like an instruction manual; use the logo-cover test for 'original'.
    example: >-
      A Ritsu student-success story: true (real grade jump) · human (one named learner) · original ·
      student-as-hero · emotional (relief on results day) · strategy (proves the mastery promise) — strategy
      stated last.
    source_books:
      - everybody-writes-handley
  - id: hermit-crab-content
    name: Hermit Crab Content
    family: social
    rank: 172
    score: 34.5
    structure: >-
      1) Pick a familiar, ready-made format ('shell') your audience instantly recognizes — recipe, Rx
      prescription, magazine profile, game show, dating profile, instruction manual. 2) Move your own message or
      story into that shell. 3) Keep the borrowed format's conventions so the contrast is the delight. 4)
      Deliver real utility inside the shell.
    when_to_use: When a topic is dry or over-familiar and you want stop-the-scroll novelty without a big budget.
    applies_to_types:
      - blog
      - social-post
      - newsletter
      - presentation
      - ad
      - thread
      - video-script
    how_to_apply: >-
      Borrow a shell from outside marketing and pour your story in, matching the shell's tone exactly so the
      juxtaposition lands. The #1 discipline is that the shell must genuinely fit the message and still carry
      utility — novelty alone, with no payoff, is a gimmick.
    example: >-
      A Ritsu study guide written as a cooking recipe: 'Ingredients: 1 messy PDF, 20 min. Method: upload, let it
      preheat into a quiz, serve flashcards warm.'
    source_books:
      - everybody-writes-handley
  - id: lede-kicker
    name: Lede + Kicker (Open With a Punch, Close With a Kick)
    family: blog
    rank: 173
    score: 37
    structure: >-
      OPENINGS (pick one): put the reader in a scene · articulate their pain · set a stage · ask a question the
      piece answers · open with a surprising stat · offer a curious POV · tell a personal anecdote · use an
      analogy · start with a quote · the fake-out swerve. CLOSINGS (pick one): recast the biggest takeaway ·
      point to the next resource · add a tonal surprise · let an interviewee have the last word — always with a
      sense of completion and (if apt) a CTA.
    when_to_use: The first and last sentences of any piece — the two highest-leverage lines you'll write.
    applies_to_types:
      - blog
      - article
      - newsletter
      - essay
      - email
      - speech
      - social-post
    how_to_apply: >-
      Spend disproportionate love on line one and the last line — 'a good lede invites you to the party and a
      good kicker makes you wish you could stay longer'. The #1 discipline is never trailing off or ending on
      the lazy 'So what do you think?', and using the question-lede sparingly so you don't sound like an
      infomercial.
    example: >-
      Lede (pain): 'It's 11pm. You have 200 pages of bio to know by 8am and no idea where to start.' Kicker
      (recast + CTA): 'Tomorrow you'll walk in ready. Drop your file in Ritsu tonight.'
    source_books:
      - everybody-writes-handley
  - id: fifteen-angles
    name: Fifteen Angles to Frame a Piece
    family: blog
    rank: 174
    score: 35
    structure: >-
      Choose a structural angle for the SAME topic: Quiz · Skeptic · Explainer (plain English) · Case study ·
      Contrarian · How-to · Quick how-to · How NOT to · First person · Comparison · Q&A · Data · Influencers ·
      Outrageous · Insider secrets · Literary treatment.
    when_to_use: >-
      Topic-ideation, when one subject must become many pieces, or when a draft feels generic and needs a
      sharper frame.
    applies_to_types:
      - blog
      - article
      - thread
      - newsletter
      - social-post
      - video-script
      - course
      - article-series
    how_to_apply: >-
      Hold the topic fixed and rotate the frame — the format often suggests the organization. The #1 discipline
      is picking the ONE angle that best serves the reader's need right now (a listicle fails when someone needs
      to learn how your product works); use the list to multiply one idea into a content cluster.
    example: >-
      Topic 'spaced repetition' → Explainer ('Spaced Repetition in Plain English'), How-to ('5 Steps to a
      Routine'), Contrarian ('Why Cramming Beats Spacing — Sometimes'), Data, Quiz.
    source_books:
      - everybody-writes-handley
  - id: cta-lift-the-a
    name: Lift the A in CTA
    family: email
    rank: 175
    score: 35.5
    structure: >-
      1) Start from the generic CTA ('Download', 'Register', 'Learn more'). 2) Make it literally actionable with
      a visible action verb. 3) Infuse brand voice or quirk. 4) Swap work-words for outcome-words (Learn →
      Finally understand; See how → Discover). 5) Optionally rhyme it for memorability.
    when_to_use: Every button, link, and call to action in emails, landing pages, ads, and headlines.
    applies_to_types:
      - email
      - landing-page
      - ad
      - newsletter
      - social-post
      - product-description
    how_to_apply: >-
      Lift the A — make the Action vivid and seeable ('Access the ebook' → 'Grab your copy') — and cut words
      that imply work or don't hint at the outcome, because readers are a little lazy. The #1 lever is the
      outcome-word swap; rhyme triggers the Rhyme-as-Reason bias so people judge it more true.
    example: >-
      Not 'Start free trial.' Try 'Turn your notes into a quiz — free.' Or rhymed: 'Ace it faster, be the
      master.'
    source_books:
      - everybody-writes-handley
  - id: landing-page-five-things
    name: Landing Page Five-Things (Less Is More)
    family: landing
    rank: 176
    score: 36.5
    structure: >-
      Convey exactly five things and nothing more: 1) Where they are (match the headline to the promise that
      brought them). 2) What you're making available, and for whom — framed as benefit, not product. 3) Why now.
      4) Validation/proof from others. 5) One clear CTA.
    when_to_use: Any single-goal landing page reached from a targeted email, ad, or social campaign.
    applies_to_types:
      - landing-page
      - email
      - ad
      - product-description
    how_to_apply: >-
      Strip the page to the five elements and resist 'arcade-ifying' it with bells and whistles that overwhelm.
      The #1 discipline is killing 'message mismatch' — the first thing the visitor sees must be exactly what
      the ad or email promised, and benefit-driven headlines beat product-driven ones.
    example: >-
      Headline: 'Create a full study set from your lecture slides in 10 minutes' (benefit), proof: '12,000
      students', why now: 'finals are 2 weeks out', CTA: 'Upload your slides.'
    source_books:
      - everybody-writes-handley
  - id: headline-90-10
    name: Headline Recipe (90% Clear, 10% Clever)
    family: headline
    rank: 177
    score: 37
    structure: >-
      1) Be 90% clear, 10% clever (the headline must stand alone without the story). 2) Open a curiosity gap —
      but deliver on it, no hyperbole. 3) Put the READER in it. 4) Be specific; use oddball numbers (3½, 17,
      37). 5) Signal why now. 6) Prefer 'the/these/their' over 'a/an/some'. 7) Front-load the key words. 8)
      Write SEVEN headlines, pick the best. 9) Read it aloud.
    when_to_use: Every headline, blog title, subject line, and social post hook.
    applies_to_types:
      - blog
      - article
      - newsletter
      - social-post
      - thread
      - ad
      - email
    how_to_apply: >-
      Spend as much time on the headline as on the piece, then run the 9-point pass and generate seven variants
      before choosing. The #1 discipline is that clever-without-clear fails, and the curiosity gap must be
      honest — '14 Surprising Ways…' only works if they're actually surprising.
    example: >-
      Not '14 Study Tips.' Try '7 Things to Quiz Yourself On Before Tomorrow's Exam (Most Students Skip #4)' —
      reader-in-it, oddball number, why-now, honest gap.
    source_books:
      - everybody-writes-handley
  - id: brand-voice-four-words
    name: Brand Voice in Four Words
    family: ops
    rank: 178
    score: 36
    structure: >-
      1) Define your Youness: pick 4 adjectives, ideally placing yourself on the four axes (funny↔serious,
      formal↔casual, respectful↔irreverent, enthusiastic↔matter-of-fact). 2) Translate each word into a style
      with sentences and anecdotes. 3) Document it in a living doc with a 'Like This / Not Like This' chart. 4)
      Look for nonobvious places to apply it (CTAs, confirmation emails, the first bill, 404 pages).
    when_to_use: >-
      Establishing or auditing a brand's written voice so any writer sounds like the brand, not like everyone
      else.
    applies_to_types:
      - blog
      - email
      - social-post
      - landing-page
      - newsletter
      - ad
      - faq
      - product-description
    how_to_apply: >-
      Build the 4-word kit, then make each word concrete with examples and revisit it quarterly. The #1
      discipline is avoiding table-stakes words (friendly, reliable) and buzzwords (cutting-edge); run the
      logo-cover test — mask the logo, read aloud, and check you still sound like you, not your competitors.
    example: >-
      Ritsu's four words → Encouraging · Concrete · Calm · Honest. 'Encouraging' = 'Nice — you just mastered
      cell respiration. One topic down.' Not: 'Leverage our AI-powered learning paradigm.'
    source_books:
      - everybody-writes-handley
  - id: they-say-i-say
    name: They Say / I Say
    family: academic
    rank: 179
    score: 38
    structure: >-
      1) THEY SAY — open by summarizing the existing view or conversation you're entering. 2) I SAY — state your
      own claim explicitly as a RESPONSE to it. 3) Keep returning to the 'they say' at strategic points so the
      response never loses its motivation.
    when_to_use: >-
      Any persuasive or explanatory piece that needs a reason-for-being, not just true statements floating in a
      vacuum.
    applies_to_types:
      - essay
      - blog
      - article
      - newsletter
      - social-post
      - video-script
      - email
      - landing-page
      - speech
      - review
    how_to_apply: >-
      Never lead with your own claim cold — first name the view you're correcting, adding to, or complicating,
      then present your thesis as the answer, stating the two together up front. The #1 failure mode is the
      'isolation-booth' draft that asserts smart things with no 'they say', so the reader sees WHAT you say but
      never WHY.
    example: >-
      'Most students think re-reading their notes is studying. In fact, recall — being quizzed — is what makes
      it stick, which is why Ritsu drills you instead of showing you.'
    source_books:
      - they-say-i-say-graff
  - id: quotation-sandwich
    name: Quotation Sandwich
    family: academic
    rank: 180
    score: 36
    structure: >-
      Top slice: a lead-in that says WHO is speaking and sets up the point. Filling: the quotation (or cited
      fact/stat). Bottom slice: a follow-up that explains in your own words what it means and how it bears on
      YOUR argument.
    when_to_use: Any time you drop in a quote, statistic, study, or external source and need it to actually land.
    applies_to_types:
      - essay
      - article
      - blog
      - research
      - paper
      - report
      - newsletter
      - review
      - presentation
      - email
    how_to_apply: >-
      Frame every quotation both before AND after — introduce the source, then restate its meaning in your own
      words and connect it to your point. The #1 failure mode is the 'hit-and-run' quotation slapped in and
      abandoned; a bare quote does NOT speak for itself, so if you don't say what it means, the reader won't
      know why it's there.
    example: >-
      'Education researchers studied the testing effect. One found students who self-quizzed recalled 50% more a
      week later. In other words, the quiz isn't the assessment — it IS the studying.'
    source_books:
      - they-say-i-say-graff
  - id: plant-a-naysayer
    name: Plant a Naysayer
    family: academic
    rank: 181
    score: 37
    structure: >-
      1) Surface the strongest objection a skeptic would raise ('some might object…'). 2) Give it a real, fair
      hearing — even a full paragraph. 3) Answer it convincingly, or honestly concede the limited point. 4)
      Optionally NAME the naysayer (a school of thought, a labelled group) for precision.
    when_to_use: Whenever a claim is contestable and you want to pre-empt doubt and look credible rather than one-sided.
    applies_to_types:
      - essay
      - blog
      - article
      - proposal
      - memo
      - landing-page
      - email
      - speech
      - report
      - review
    how_to_apply: >-
      Voice the counterargument BEFORE the reader thinks of it — this preemptive strike disarms critics and
      signals you respect the reader as a critical thinker. The #1 discipline is giving the objection a genuine,
      non-strawman hearing (don't dispatch it in half a sentence); naming the naysayer adds precision over a
      faceless 'anybody'.
    example: >-
      'Some will object that AI-made quizzes can't match a teacher's. It's a fair worry — a wrong question
      teaches the wrong thing. That's exactly why every Ritsu item is graded against your source.'
    source_books:
      - they-say-i-say-graff
  - id: so-what-who-cares
    name: So What? / Who Cares?
    family: academic
    rank: 182
    score: 37
    structure: >-
      WHO CARES? — name a specific person or group with a stake in your claim (often the people whose old belief
      you're correcting). SO WHAT? — link the claim to a larger consequence the reader already cares about.
      State both explicitly, up front.
    when_to_use: Any piece at risk of a 'sounds-true-but-why-should-I-care' shrug — the stakes-setting layer.
    applies_to_types:
      - essay
      - blog
      - article
      - landing-page
      - email
      - newsletter
      - social-post
      - proposal
      - presentation
      - video-script
      - ad
    how_to_apply: >-
      Answer both questions IN the text rather than assuming the reader supplies them — 'who cares?' identifies
      an invested party, 'so what?' ties your point to something already deemed important (grades, money, time).
      The #1 failure mode is a clear, correct claim with no stated stakes, which 'ultimately loses your
      audience's interest'.
    example: >-
      'So what if you forget 80% within a week? For an exam-taker, that's the difference between a B and an A —
      and it's why spacing your reviews, not cramming, is the whole game.'
    source_books:
      - they-say-i-say-graff
  - id: yes-no-okay-but
    name: Yes / No / Okay-But (Three Ways to Respond)
    family: academic
    rank: 183
    score: 35
    structure: >-
      Pick one stance and declare it plainly early: AGREE ('yes, and here's a fresh angle'), DISAGREE ('no, and
      here's why'), or BOTH ('I agree that X, but I cannot agree that Y'). Then unfold the complexity within
      that frame.
    when_to_use: Any response, reaction, take, or review where the reader must quickly locate where you stand.
    applies_to_types:
      - review
      - blog
      - essay
      - social-post
      - thread
      - newsletter
      - memo
      - article
      - email
    how_to_apply: >-
      State agree/disagree/both with a direct, no-nonsense formula BEFORE the mass of detail, so readers can
      place you on their mental map. The disciplines: when agreeing, 'agree with a difference' (add new
      evidence, don't parrot); when disagreeing, give REASONS, not just a 'not'; the strongest option is
      agreeing and disagreeing at once inside an 'on the one hand / on the other' frame.
    example: >-
      'Yes — flashcards work. But raw flashcards aren't enough: without spacing and active recall they're just
      pretty re-reading, which is why Ritsu schedules them for you.'
    source_books:
      - they-say-i-say-graff
