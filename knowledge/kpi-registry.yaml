# kpi-registry.yaml — KPIs (Bài #10)
version: "1.0.0"

kpis:
  # Operational KPIs (cross-cutting)
  - id: minion_queue_depth
    type: operational
    description: "Pending Minion jobs"
    threshold_warn: 100
    threshold_critical: 1000
  
  - id: hitl_backlog_size
    type: operational
    description: "Pending HITL approvals"
    threshold_warn: 5
    threshold_critical: 20

  - id: docs_drift_count
    type: operational
    description: "Pages where source_hash mismatch between codebase source and docs/ MDX. Surfaces drift between Tier 1 + .claude/ runtime and the live Fumadocs site (docs-engine capability)."
    threshold_warn: 1
    threshold_critical: 10

  - id: core_docs_filled_count
    type: operational
    description: "Count of 00-core/*.md docs with status in (canonical, v0.1-draft). Measured by scripts/core/validate.cjs --json output. Excludes stubs (which graduate on entry_condition fire). Introduced by capability core-redesign-and-command v1.0.0."
    owner_pillar: 00-core
    owner_role: founder
    target: 10
    threshold_warn: 9
    threshold_critical: 7
    cadence: on_demand
    source: "node scripts/cross-tier/validate-core-pillar.cjs --json"

  - id: core_command_verbs_phase_1
    type: operational
    description: "Count of working /core Phase-1 verbs in .claude/commands/core.md (target 7: show, list, diff, check, compose, scaffold, fill). Phase-2 verbs (init/reindex/review/status/<doc>:apply/build/export) tracked separately. Introduced by capability core-redesign-and-command v1.0.0."
    owner_pillar: 00-core
    owner_role: founder
    target: 7
    threshold_warn: 6
    threshold_critical: 4
    cadence: on_demand
    source: ".claude/commands/core.md subcommand table parse"

  # ==========================================================================
  # gbrain integration KPIs (capability gbrain-operational-brain v1.0)
  # 5 NEW KPIs registered Sprint 2; activate Sprint 4-5 when source systems
  # land. All owned by metrics-curator per knowledge/kpi-ownership.yaml.
  # ==========================================================================

  - id: brain.write_roles_operational
    type: operational
    description: "Count of distinct roles that have written to gbrain in last 30 days (via mcp__gbrain__put_page / add_link / update_page). Target 6 by 2026-09-30 (customer-lead, feedback-aggregator, gtm-orchestrator, cs-coach, product-orchestrator, eval-evo-orchestrator)."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 6
    threshold_warn: 4
    threshold_critical: 2
    cadence: weekly
    source: "SELECT COUNT(DISTINCT split_part(cost_bucket, '.', 2)) FROM ops.cost_attributions WHERE cost_bucket LIKE 'gbrain.%' AND ts > now() - interval '30 days' AND cost_bucket NOT LIKE 'gbrain.shared.%'"

  - id: brain.read_roles_active_30d
    type: operational
    description: "Count of distinct caller_roles that invoked any gbrain READ tool (search/get_page/list_pages/traverse_graph/find_*/code_*) in last 30 days. Target 20 by 2026-09-30 (all non-etl-runner roles)."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 20
    threshold_warn: 15
    threshold_critical: 8
    cadence: weekly
    source: "SELECT COUNT(DISTINCT caller_role) FROM ops.agent_runs WHERE tool_name LIKE 'mcp__gbrain__%' AND tool_name NOT IN ('mcp__gbrain__put_page','mcp__gbrain__update_page','mcp__gbrain__add_link','mcp__gbrain__remove_link','mcp__gbrain__archive_page') AND started_at > now() - interval '30 days'"

  - id: brain.operational_pages_total
    type: operational
    description: "Total gbrain pages excluding system templates. Mirrored to ops.kpi_snapshots daily via gbrain-dream-cycle handler push. Target 500 by 2026-09-30 (40-60 seed batch + 440-460 organic from CLA + customer + product workflow)."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 500
    threshold_warn: 300
    threshold_critical: 100
    cadence: daily
    source: "SELECT count(*) FROM gbrain.pages WHERE page_type != 'system' — mirrored to ops.kpi_snapshots via Sprint 4 cron handler"

  - id: brain.cost_usd_monthly_rolling30d
    type: business
    description: "Aggregate USD cost of all gbrain.* cost_bucket entries over rolling 30 days. HARD cap $100/mo enforced by .mcp.json wrapper scripts/pre-budget-check.sh (Hard-cap Option B graceful degrade — WRITES + dream cycle blocked at cap; READS continue). (Type 'business' chosen — closest semantic; existing schema has only operational/business/founder enum.)"
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 100
    threshold_warn: 80
    threshold_critical: 150
    cadence: daily
    source: "SELECT SUM(usd) FROM ops.cost_attributions WHERE cost_bucket LIKE 'gbrain.%' AND ts > now() - interval '30 days'"

  - id: brain.dream_cycle_success_rate_7d
    type: operational
    description: "Pct of gbrain-maintainer nightly dream cycle runs completed successfully in last 7 days. Target ≥ 0.95 (≥ 6.65 of 7 nights). Failures emit ritsu.gbrain.dream_cycle_failed event → hitl-router Tier B alert."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 0.95
    threshold_warn: 0.85
    threshold_critical: 0.70
    cadence: daily
    source: "SELECT count(*) FILTER (WHERE state = 'completed')::float / NULLIF(count(*), 0) FROM ops.agent_runs WHERE persona_slug = 'gbrain-maintainer' AND started_at > now() - interval '7 days'"

  # === Capability `update` v1.0 KPIs (Sprint 4) ===
  - id: entity_update_run_count_monthly
    type: operational
    description: "Total completed /update runs per calendar month. Measures founder adoption of the third foundational write-loop. Target ≥ 10/month by day 30 post-ship (per SC1)."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 10
    threshold_warn: 5
    threshold_critical: 1
    cadence: monthly
    source: "SELECT count(*) FROM ops.agent_runs WHERE agent_slug = 'update' AND state = 'completed' AND date_trunc('month', started_at) = date_trunc('month', now())"

  - id: entity_update_extractions_reviewed_count
    type: operational
    description: "Pending_review extractions reviewed by founder per month (transitions from pending_review → founder_{accepted|rejected|edited}). Measures verify gate exercise. Target ≥ 5/month by day 30 (per SC3) — proves the citation discipline gate is engaging."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 5
    threshold_warn: 1
    threshold_critical: 0
    cadence: monthly
    source: "SELECT count(*) FROM ops.evolve_extractions WHERE review_state IN ('founder_accepted', 'founder_rejected', 'founder_edited') AND date_trunc('month', founder_decision_at) = date_trunc('month', now())"

  # v1.1 Sprint 2 KPI (file mode adoption)
  - id: entity_update_file_mode_run_count_monthly
    type: operational
    description: "Total /update file <path> runs per month (subset of entity_update_run_count_monthly). Measures arbitrary-file mode adoption. File mode is the fallback when no typed entity fits — expect lower volume than typed types."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 3
    threshold_warn: 0
    threshold_critical: 0
    cadence: monthly
    source: "SELECT count(*) FROM ops.agent_runs WHERE agent_slug = 'update' AND input_payload->>'entity_type' = 'file' AND state = 'completed' AND date_trunc('month', started_at) = date_trunc('month', now())"

  - id: entity_update_revert_rate
    type: operational
    description: "K4 revert rate over 30-day rolling window: reverted_quality_regression outcomes / total terminal outcomes. Target ≤ 0.20 (≤ 20%). Warn at > 0.30 (noisy proposer or distill prompt drift). Critical at > 0.50 (K4 broken or refs corrupted). Per spec §4 SC2/SC4."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 0.20
    threshold_warn: 0.30
    threshold_critical: 0.50
    cadence: weekly
    source: "WITH terminal AS (SELECT outcome FROM ops.agent_runs WHERE agent_slug = 'update' AND state IN ('completed', 'failed') AND ended_at > now() - interval '30 days') SELECT count(*) FILTER (WHERE outcome = 'reverted_quality_regression')::float / NULLIF(count(*), 0) FROM terminal"

  # === Capability evolve v1.1 (SkillOpt integration) Sprint 4 ===

  - id: skillopt_runs_monthly
    type: operational
    description: "Monthly count of completed /evolve skillopt runs (any outcome — all_phases_done, founder_abort, judge_regressed, etc.). Tracks adoption + execution volume of the SkillOpt path. Informational metric — no automated alert (low-=-bad direction not modeled by the kpi-registry threshold convention which assumes higher-=-worse). Adoption check is a manual founder review of the dashboard."
    owner_pillar: 06-ai-ops
    owner_role: eval-evo-orchestrator
    target: 5
    # Intentionally NO threshold_warn / threshold_critical — adoption metric
    # uses "low = bad" direction which the current kpi-registry threshold
    # convention (low = good, alert when high) doesn't support. Founder
    # reviews the dashboard tile manually. Alert wiring deferred until a
    # `direction` field lands in the schema (separate Sprint).
    cadence: monthly
    source: "SELECT count(*) FROM ops.agent_runs WHERE agent_slug = 'evolve' AND state_payload->>'mode' = 'skillopt' AND state IN ('completed', 'failed') AND date_trunc('month', started_at) = date_trunc('month', now())"

  - id: skillopt_synth_to_prod_correlation
    type: operational
    description: "Spearman correlation (rolling 30-day) between held-out judge composite scores from /evolve skillopt runs (synth signal) and post-install production correction-rate (prod signal). When < 0.5, the synth signal poorly predicts real-world success → playbook revision needed. Per spec §19.10."
    owner_pillar: 06-ai-ops
    owner_role: eval-evo-orchestrator
    target: 0.5
    threshold_warn: 0.5
    threshold_critical: 0.3
    cadence: monthly
    source: "Computed by scripts/eval-evo/skillopt-synth-prod-correlation.cjs (cron skillopt-synth-prod-correlation-monthly). Inserted to ops.kpi_snapshots."
    notes: "Insufficient-data months (n_entities < 5 in window) → value=null, not 0. Alert rule includes non-null guard."

  - id: skillopt_post_install_correction_rate_delta
    type: operational
    description: "Ratio of post-install correction rate to pre-install baseline per skill (averaged across all skills with both a /evolve skillopt run AND ≥30 days of post-install production data). >2× means skillopt may be regressing entities. Per spec §19.10."
    owner_pillar: 06-ai-ops
    owner_role: eval-evo-orchestrator
    target: 1.0
    threshold_warn: 2.0
    threshold_critical: 5.0
    cadence: monthly
    source: "Computed alongside skillopt_synth_to_prod_correlation by the same cron handler. Pre-install baseline = correction rate in the 30 days BEFORE the /evolve skillopt run's install commit; post-install = correction rate in the 30 days AFTER."

  # deepask KPIs (capability deepask v1.0, Sprint 6 — substrate: ops.deepask_runs/coverage, migration 00045)
  - id: deepask.complete_verdict_rate
    type: operational
    description: "% of /deepask runs ending COMPLETE (vs PARTIAL-with-honest-gaps). Trends up as catalog coverage + source ingestion improve. Per capability deepask spec §6."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.8
    threshold_warn: 0.6
    threshold_critical: 0.4
    cadence: monthly
    source: "ops.deepask_runs: COUNT(verdict='COMPLETE') / COUNT(dry_run=false). Inserted to ops.kpi_snapshots."
    notes: "A low complete rate is not inherently bad — deepask is honest about gaps. Pair with deepask.breaker_trip_rate to separate 'genuinely uncovered' from 'budget-starved'."

  - id: deepask.uncited_claim_rate
    type: operational
    description: "Fraction of synthesized claims lacking >=1 citation across /deepask runs. HARD guardrail — MUST be 0 (citation-discipline invariant enforced per-run by scripts/deepask/citation-audit.cjs)."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.0
    threshold_warn: 0.001
    threshold_critical: 0.01
    cadence: monthly
    source: "Aggregated from scripts/deepask/citation-audit.cjs uncitedRate self-check recorded per run. Any non-zero is a citation-discipline breach to investigate."

  - id: deepask.breaker_trip_rate
    type: operational
    description: "% of /deepask runs whose PARTIAL carried gap_reason='breaker_budget' (resolver session-breaker exhaustion). Makes the #1 runtime risk (shared SESSION_HARD_CAP=20) first-class observable. Per @cto Phase-2 finding + Muse panel."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.05
    threshold_warn: 0.15
    threshold_critical: 0.3
    cadence: monthly
    source: "ops.deepask_coverage.gap_reason='breaker_budget' joined to ops.deepask_runs. High rate → sessions over-spending resolver finds; revisit depth defaults / breaker tuning."

  # capability book-to-capability (/forge) v0.1 — Sprint 2 KPIs (spec §6 acceptance)
  - id: forge.citation_coverage
    type: operational
    description: "Fraction of /forge runs that PASSED the funnel and built/extended a skill whose change traces to >=1 wiki source chunk. HARD guardrail — target 1.0 (every promotion is citation-backed via ops.evolve_extractions). Per capability book-to-capability spec §6."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 1.0
    threshold_warn: 0.99
    threshold_critical: 0.95
    cadence: monthly
    source: "ops.v_forge_lineage: COUNT(citation_count > 0) / NULLIF(COUNT(*) FILTER (WHERE forge_verdict='PASS'), 0). Any non-citation-backed promotion is a discipline breach."
    notes: "Citation discipline is the whole point of the distill gate (gate 1). A drop below 1.0 means a promotion bypassed the citation spine."

  - id: forge.gate_rejection_rate
    type: operational
    description: "% of /forge candidates the 5-gate selection-funnel REJECTs (stays latent / → Tier-1 doc) rather than building. Proves the anti-over-build funnel is LOAD-BEARING, not a rubber stamp. A HIGH rate is healthy (knowledge is ~5-50x cheaper than capability). Per spec §6."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.5
    threshold_warn: 0.3
    threshold_critical: 0.15
    cadence: monthly
    source: "ops.v_forge_lineage: COUNT(forge_verdict='REJECT') / NULLIF(COUNT(*), 0). Low rate → funnel rubber-stamping (over-build risk); investigate the gates."
    notes: "Inverse-polarity KPI: low is BAD. Calibration baseline = the 2026-06-01 reserve-walk (~90% of 64 ideas correctly rejected as non-skills)."

  - id: forge.new_vs_extend_ratio
    type: operational
    description: "Ratio of net-new skill births to extends among funnel-PASS /forge routes. Lower = healthier (reuse/extend over sprawl). Per spec §6 (forge.new_vs_extend_ratio)."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.5
    threshold_warn: 1.0
    threshold_critical: 2.0
    cadence: monthly
    source: "ops.v_forge_lineage: COUNT(route='net-new') / NULLIF(COUNT(route='extend'), 0). Persistently high → every need becomes a NEW skill = sprawl; the classifier or the corpus needs review."
    notes: "Observational. At healthy maturity extend should dominate (more skills exist to extend)."

  - id: forge.post_install_score_delta
    type: operational
    description: "Median eval-evo score delta of the entity a /forge run built/extended, pre vs post. K4 ratchet — must be >= 0 (no /forge promotion regresses an entity's quality; auto-reverted by the /update delegate otherwise). Per spec §6."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.0
    threshold_warn: -0.5
    threshold_critical: -1.0
    cadence: monthly
    source: "Median score_delta from the spawned /update runs: ops.v_entity_update_lineage.score_delta joined via ops.v_forge_lineage.spawned_run_id. Negative = a forge promotion degraded the entity (K4 breach)."
    notes: "The build quality is enforced by the delegate's K4 ratchet (/update auto-reverts on regression); this KPI surfaces it at the forge level."

  # capability design-system-styling v1.0 (Phase 8) — 3 KPIs (cost-bucket ai-ops-design-system)
  - id: design_system.library_size
    type: operational
    description: "Count of registered design systems in knowledge/design-systems.yaml (owned + downloaded + built-from-repo). Deterministic registry scan. Library populated (~31: ritsu + getdesign/designmd curated + big-tech from VoltAgent/awesome-design-md); grows via /design-system add."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 30
    threshold_warn: 10
    threshold_critical: 1
    cadence: monthly
    source: "scripts/design-system/registry-io.cjs readRegistry().design_systems.length"
  - id: design_system.styled_artifact_rate
    type: operational
    description: "% of deepask FILE-mode artifacts emitted with a non-plain --style. R1 FALSIFIABILITY GATE: >= 6 DISTINCT non-default --style artifacts within 60 days of v1 (by ~2026-07-31) → keep; else founder decides /cla deprecate or de-scope to ritsu-only. Makes the capability evidence-killable despite N~1 emitter (Muse data-pragmatist gate)."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.2
    threshold_warn: 0.05
    threshold_critical: 0.0
    cadence: monthly
    source: "ops.deepask_runs.metadata.style (non-null, file mode) / file-mode runs"
  - id: design_system.style_resolve_failure_rate
    type: operational
    description: "StyleResolveError count / total --style resolutions. Catches broken installs / cache-miss-in-CI. Should stay low (< 5%)."
    owner_pillar: 06-ai-ops
    owner_role: gps
    target: 0.05
    threshold_warn: 0.05
    threshold_critical: 0.15
    cadence: monthly
    source: "ops.agent_runs.output_payload (resolve-style StyleResolveError occurrences)"

  # capability product-db-readonly-access (Door 2) — Sprint 2
  - id: analytics_sync_freshness
    type: operational
    description: "Hours since the last successful ritsu-analytics nightly sync (max live._sync_runs.finished_at WHERE status='ok'). Alerts if staler than the 26h SLO — the Door-2 dataset is going stale."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 24
    threshold_warn: 26
    threshold_critical: 48
    cadence: daily
    source: "ritsu-analytics live._sync_runs (max finished_at WHERE status='ok'); surfaced via the supabase-analytics MCP or the Sprint-4 alert ETL"
  - id: analytics_pii_canary_trips
    type: operational
    description: "Count of PII-canary trips in the analytics sync (live.pii_canary > 0 on any staged table). MUST be 0 — a non-zero value means email-shaped data crossed the boundary; P0."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 0
    threshold_warn: 1
    threshold_critical: 1
    cadence: daily
    source: "ritsu-analytics live._sync_runs (status='failed' with canary detail) + live.pii_canary() per synced table"

  # Business KPIs (customize per project)
  # {{ADD_BUSINESS_KPIS}}
