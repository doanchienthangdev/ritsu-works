# kpi-registry.yaml — KPIs (Bài #10)
version: "1.0.0"

kpis:
  # Operational KPIs (cross-cutting)
  - id: minion_queue_depth
    type: operational
    description: "Pending Minion jobs"
    threshold_warn: 100
    threshold_critical: 1000
  
  - id: hitl_backlog_size
    type: operational
    description: "Pending HITL approvals"
    threshold_warn: 5
    threshold_critical: 20

  - id: docs_drift_count
    type: operational
    description: "Pages where source_hash mismatch between codebase source and docs/ MDX. Surfaces drift between Tier 1 + .claude/ runtime and the live Fumadocs site (docs-engine capability)."
    threshold_warn: 1
    threshold_critical: 10

  - id: core_docs_filled_count
    type: operational
    description: "Count of 00-core/*.md docs with status in (canonical, v0.1-draft). Measured by scripts/core/validate.cjs --json output. Excludes stubs (which graduate on entry_condition fire). Introduced by capability core-redesign-and-command v1.0.0."
    owner_pillar: 00-core
    owner_role: founder
    target: 10
    threshold_warn: 9
    threshold_critical: 7
    cadence: on_demand
    source: "node scripts/cross-tier/validate-core-pillar.cjs --json"

  - id: core_command_verbs_phase_1
    type: operational
    description: "Count of working /core Phase-1 verbs in .claude/commands/core.md (target 7: show, list, diff, check, compose, scaffold, fill). Phase-2 verbs (init/reindex/review/status/<doc>:apply/build/export) tracked separately. Introduced by capability core-redesign-and-command v1.0.0."
    owner_pillar: 00-core
    owner_role: founder
    target: 7
    threshold_warn: 6
    threshold_critical: 4
    cadence: on_demand
    source: ".claude/commands/core.md subcommand table parse"

  # ==========================================================================
  # gbrain integration KPIs (capability gbrain-operational-brain v1.0)
  # 5 NEW KPIs registered Sprint 2; activate Sprint 4-5 when source systems
  # land. All owned by metrics-curator per knowledge/kpi-ownership.yaml.
  # ==========================================================================

  - id: brain.write_roles_operational
    type: operational
    description: "Count of distinct roles that have written to gbrain in last 30 days (via mcp__gbrain__put_page / add_link / update_page). Target 6 by 2026-09-30 (customer-lead, feedback-aggregator, gtm-orchestrator, cs-coach, product-orchestrator, eval-evo-orchestrator)."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 6
    threshold_warn: 4
    threshold_critical: 2
    cadence: weekly
    source: "SELECT COUNT(DISTINCT split_part(cost_bucket, '.', 2)) FROM ops.cost_attributions WHERE cost_bucket LIKE 'gbrain.%' AND ts > now() - interval '30 days' AND cost_bucket NOT LIKE 'gbrain.shared.%'"

  - id: brain.read_roles_active_30d
    type: operational
    description: "Count of distinct caller_roles that invoked any gbrain READ tool (search/get_page/list_pages/traverse_graph/find_*/code_*) in last 30 days. Target 20 by 2026-09-30 (all non-etl-runner roles)."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 20
    threshold_warn: 15
    threshold_critical: 8
    cadence: weekly
    source: "SELECT COUNT(DISTINCT caller_role) FROM ops.agent_runs WHERE tool_name LIKE 'mcp__gbrain__%' AND tool_name NOT IN ('mcp__gbrain__put_page','mcp__gbrain__update_page','mcp__gbrain__add_link','mcp__gbrain__remove_link','mcp__gbrain__archive_page') AND started_at > now() - interval '30 days'"

  - id: brain.operational_pages_total
    type: operational
    description: "Total gbrain pages excluding system templates. Mirrored to ops.kpi_snapshots daily via gbrain-dream-cycle handler push. Target 500 by 2026-09-30 (40-60 seed batch + 440-460 organic from CLA + customer + product workflow)."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 500
    threshold_warn: 300
    threshold_critical: 100
    cadence: daily
    source: "SELECT count(*) FROM gbrain.pages WHERE page_type != 'system' — mirrored to ops.kpi_snapshots via Sprint 4 cron handler"

  - id: brain.cost_usd_monthly_rolling30d
    type: business
    description: "Aggregate USD cost of all gbrain.* cost_bucket entries over rolling 30 days. HARD cap $100/mo enforced by .mcp.json wrapper scripts/pre-budget-check.sh (Hard-cap Option B graceful degrade — WRITES + dream cycle blocked at cap; READS continue). (Type 'business' chosen — closest semantic; existing schema has only operational/business/founder enum.)"
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 100
    threshold_warn: 80
    threshold_critical: 150
    cadence: daily
    source: "SELECT SUM(usd) FROM ops.cost_attributions WHERE cost_bucket LIKE 'gbrain.%' AND ts > now() - interval '30 days'"

  - id: brain.dream_cycle_success_rate_7d
    type: operational
    description: "Pct of gbrain-maintainer nightly dream cycle runs completed successfully in last 7 days. Target ≥ 0.95 (≥ 6.65 of 7 nights). Failures emit ritsu.gbrain.dream_cycle_failed event → hitl-router Tier B alert."
    owner_pillar: 10-metrics
    owner_role: metrics-curator
    target: 0.95
    threshold_warn: 0.85
    threshold_critical: 0.70
    cadence: daily
    source: "SELECT count(*) FILTER (WHERE state = 'completed')::float / NULLIF(count(*), 0) FROM ops.agent_runs WHERE persona_slug = 'gbrain-maintainer' AND started_at > now() - interval '7 days'"

  # === Capability `update` v1.0 KPIs (Sprint 4) ===
  - id: entity_update_run_count_monthly
    type: operational
    description: "Total completed /update runs per calendar month. Measures founder adoption of the third foundational write-loop. Target ≥ 10/month by day 30 post-ship (per SC1)."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 10
    threshold_warn: 5
    threshold_critical: 1
    cadence: monthly
    source: "SELECT count(*) FROM ops.agent_runs WHERE agent_slug = 'update' AND state = 'completed' AND date_trunc('month', started_at) = date_trunc('month', now())"

  - id: entity_update_extractions_reviewed_count
    type: operational
    description: "Pending_review extractions reviewed by founder per month (transitions from pending_review → founder_{accepted|rejected|edited}). Measures verify gate exercise. Target ≥ 5/month by day 30 (per SC3) — proves the citation discipline gate is engaging."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 5
    threshold_warn: 1
    threshold_critical: 0
    cadence: monthly
    source: "SELECT count(*) FROM ops.evolve_extractions WHERE review_state IN ('founder_accepted', 'founder_rejected', 'founder_edited') AND date_trunc('month', founder_decision_at) = date_trunc('month', now())"

  # v1.1 Sprint 2 KPI (file mode adoption)
  - id: entity_update_file_mode_run_count_monthly
    type: operational
    description: "Total /update file <path> runs per month (subset of entity_update_run_count_monthly). Measures arbitrary-file mode adoption. File mode is the fallback when no typed entity fits — expect lower volume than typed types."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 3
    threshold_warn: 0
    threshold_critical: 0
    cadence: monthly
    source: "SELECT count(*) FROM ops.agent_runs WHERE agent_slug = 'update' AND input_payload->>'entity_type' = 'file' AND state = 'completed' AND date_trunc('month', started_at) = date_trunc('month', now())"

  - id: entity_update_revert_rate
    type: operational
    description: "K4 revert rate over 30-day rolling window: reverted_quality_regression outcomes / total terminal outcomes. Target ≤ 0.20 (≤ 20%). Warn at > 0.30 (noisy proposer or distill prompt drift). Critical at > 0.50 (K4 broken or refs corrupted). Per spec §4 SC2/SC4."
    owner_pillar: 06-ai-ops
    owner_role: entity-update-orchestrator
    target: 0.20
    threshold_warn: 0.30
    threshold_critical: 0.50
    cadence: weekly
    source: "WITH terminal AS (SELECT outcome FROM ops.agent_runs WHERE agent_slug = 'update' AND state IN ('completed', 'failed') AND ended_at > now() - interval '30 days') SELECT count(*) FILTER (WHERE outcome = 'reverted_quality_regression')::float / NULLIF(count(*), 0) FROM terminal"

  # Business KPIs (customize per project)
  # {{ADD_BUSINESS_KPIS}}
