# ingestion-sources.yaml — Knowledge ingestion sources (Bài #18)
#
# v3.0 update (2026-05-18): wiki-sync v3.0 distill+extract is now the default
# semantic. Each source_kind gains `distillation_supported: true|false` flag.
# When true, ingest pipeline runs distill skill (Sprint 2) after extract.
# When false (or --verbatim flag), pipeline writes single source RECORD page
# without entity extraction. See wiki/capabilities/wiki-sync-from-refs/spec.md §0.
#
# v3.0 cost caps live in capability-registry.yaml.cost_caps_per_task_kind
# (raised wiki-distill-folder $15 with Tier B at $5 per Muse M6).
#
# v4.0 update (2026-05-18, Sprint 1): wiki_target values flipped from entity-
# type-grouped (wiki/articles/<slug>.md) to source-grouped (wiki/<slug>/source.md).
# Source RECORDs always at wiki/<slug>/source.md; derived entities at
# wiki/<source-slug>/<page_type>s/<entity-slug>.md (composite UNIQUE within
# source). See spec.md §0 B1 + migration 00032.
version: "1.2.0"

source_kinds:
  # `article` — edited per Sprint 1 of wiki-sync-from-refs to swap adapter + add
  # extraction/cost_estimate/wiki_target fields (was: article-adapter + bare fetch).
  - id: article
    adapter: url-adapter
    fetch_method: http_get_with_readability
    extraction: html_to_markdown
    chunking: token_512_with_overlap_64
    cost_estimate: "$0.05-$0.10 / article"
    wiki_target: wiki/<slug>/source.md       # v4.0 source-grouped layout (was wiki/articles/<slug>.md)

  - id: voice_note
    adapter: voice-note-adapter
    fetch_method: telegram_voice_message + whisper_transcription
    classification_required: true
    cost_estimate: $0.006/minute

  # Added per Sprint 1 of wiki-sync-from-refs:
  - id: book
    adapter: pdf-adapter
    fetch_method: local_file
    extraction: pymupdf_text + optional_ocr_fallback
    chunking: structural_per_chapter_else_token_1024_overlap_128
    cost_estimate: "$0.40-$0.70 / 50-page book"
    chapter_split: prompt_when_pages_gt_100_or_flag
    wiki_target: wiki/<slug>/source.md (or wiki/<slug>/chapters/chapter-NN.md when split)  # v4.0 source-grouped (was wiki/books/<slug>.md)

  - id: markdown_passthrough
    adapter: markdown-adapter
    fetch_method: local_file
    extraction: passthrough
    chunking: structural_per_h2_else_token_512
    cost_estimate: "$0.02-$0.05 / file"
    wiki_target: wiki/<slug>/source.md       # v4.0 — source RECORD; derived entities (if distilled) at wiki/<slug>/<page_type>s/<entity-slug>.md

  - id: youtube_video
    adapter: youtube-adapter
    fetch_method: yt_dlp_transcript
    extraction: vtt_or_caption_passthrough_else_whisper_fallback
    chunking: structural_per_yt_chapter_else_token_1024
    cost_estimate: "$0.15-$0.25 / hour video"
    wiki_target: wiki/<slug>/source.md       # v4.0 source-grouped layout (was wiki/episodes/<slug>.md)

  - id: meeting_transcript
    adapter: meeting-adapter
    fetch_method: local_file
    extraction: vtt_srt_txt_passthrough
    chunking: structural_per_speaker_turn
    cost_estimate: "$0.10-$0.20 / hour transcript"
    wiki_target: wiki/<slug>/source.md       # v4.0 source-grouped layout (was wiki/meetings/<slug>.md)

  # Added per Sprint 2 PR3 of wiki-sync-from-refs (folder = collection, Cách C):
  - id: folder_collection
    adapter: folder-adapter
    fetch_method: local_directory_glob
    extraction: per_file_dispatch_to_sibling_adapter
    chunking: per_file_per_adapter
    cost_estimate: "$0.20-$2.00 / folder (N files x per-file cost; cap wiki-ingest-folder)"
    wiki_target: "wiki/<col-slug>/<child-slug>/source.md"       # v4.0 — children land at clean nested paths (drops the __ flat-slug pattern from v2/v3)
    discipline:
      slug_uniqueness: scoped              # v4.0: source RECORDs (extracted_from_source_id IS NULL) globally unique; derived entities composite UNIQUE (extracted_from_source_id, slug); enforced by migration 00032 partial indexes
      recursive: true                      # v4.1: BFS-recursive (lifted from v2.0 hard-refuse). Bounded by max_depth + max_folder_nodes.
      recursive_defaults:                  # v4.1 defaults; CLI override via --depth=N / --max-nodes=N
        max_depth: 3                       # tree depth budget; root folder = depth 0
        max_folder_nodes: 20               # max FOLDERS visited via BFS; files within a visited folder are always ingested (no per-file cap)
        max_depth_cap: 10                  # hard ceiling (safety)
        max_folder_nodes_cap: 500          # hard ceiling (safety)
      recursive_semantics: |
        BFS over folder tree from input root. Each LEAF folder (folder containing
        markdown files) becomes its own wiki/<col-slug>/ package. Files within
        each visited folder are processed wholesale. When max_folder_nodes is
        reached mid-traversal, remaining queued folders are reported as
        truncated_folders (NOT ingested) — founder reruns with raised --max-nodes
        to include them. Depth > max_depth folders are silently skipped.
      page_type_for_children: inherited    # NO new 'collection' enum in v2.0
      hidden_files: skipped                # .DS_Store, .obsidian, .git, .* skipped
      unsupported_extensions: skipped_with_summary

active_subscriptions:
  # {{ADD_PROJECT_SUBSCRIPTIONS}}
