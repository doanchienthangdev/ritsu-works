# KPI Ownership Index — auto-derived from pillar READMEs' "KPIs owned" sections
#
# Single-file lookup: kpi_id → owner pillar + owner role + sub-pillar (if applicable)
# Generated 2026-05-15 as part of pillar architecture v1.0.1 migration (Phase 1.7)
# Update protocol: whenever a pillar README's "KPIs owned" section changes, also update this file.
# Future: SOP-METRICS-002-kpi-ownership-mapping automates the regeneration.

version: 1.0.0
generated_at: 2026-05-15
generated_from: "Union of 11 pillar README 'KPIs owned' sections (Phase 1.7 of v1.0.1 migration)"

# ===========================================================================
# Funnel + GTM metrics — owned by 03-gtm (stage pillar)
# ===========================================================================

weekly_signups:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 04-funnel-orchestration
  formula: "COUNT(DISTINCT user_id) per week from signup events"
  source: metrics.product_dau_snapshot
  dashboard_tile: founder-monday/funnel
  alert_thresholds:
    p1: "weekly_signups < 50 for 2 consecutive weeks (post-launch)"

signup_to_activation_pct:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 04-funnel-orchestration
  formula: "activated_users / signed_up_users in same cohort window"
  source: ops.events (signup) + ops.events (aha_moment)
  dashboard_tile: founder-monday/funnel
  alert_thresholds:
    p1: "activation_pct < 30% for 2 weeks"

activation_to_paid_pct:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 04-funnel-orchestration
  formula: "first_paid_users / activated_users (rolling cohort)"

paid_retention_week_4:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 05-pmf-instrumentation
  formula: "% of paying users still subscribed at week 4 (cohort)"
  target: ">= 25%"   # PMF dissolution criteria

nps_very_disappointed_pct:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 05-pmf-instrumentation
  formula: "% of survey respondents answering 'very disappointed' to Sean Ellis question"
  target: ">= 40%"   # PMF dissolution criteria

channel_cac_by_channel:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 03-distribution-engine

blended_ltv_proxy:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 04-funnel-orchestration

# THE singular composite metric — composed in METRICS but DEFINED here as GTM-owned
hundred_paying_who_love_composite:
  owner_pillar: gtm
  owner_role: gtm-orchestrator
  sub_pillar: 05-pmf-instrumentation
  formula: "weighted blend of paying_count + week_4_retention + nps_very_disappointed_pct, normalized 0-100%"
  composite_in: 10-metrics/pmf-instrumentation/SOP-METRICS-007
  dashboard_tile: founder-monday/THE-tile
  alert_thresholds:
    p0: "value decreases week-over-week 2x in a row"
  notes: "If this number doesn't move, nothing else matters. — CEO Review v1.0.1"

