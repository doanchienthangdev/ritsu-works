etl_freshness_lag_minutes:
  owner_pillar: ai_ops
  owner_role: etl-runner
  alert_thresholds:
    p1: "lag > 120 minutes for product_dau_snapshot"

docs_drift_count:
  owner_pillar: ai_ops
  owner_role: code-reviewer
  sub_pillar: skill-library
  formula: "count(pages WHERE source_hash != computed_hash) from scripts/validate-docs-coverage.cjs"
  source: scripts/validate-docs-coverage.cjs
  dashboard_tile: founder-monday/system-health
  alert_thresholds:
    p2: "docs_drift_count > 0 for > 24h"
    p1: "docs_drift_count > 10 (sustained > 1h)"
  notes: "docs-engine capability — reports drift between source filesystem and docs/ MDX. Aim: 0 sustained drift."

deepask.complete_verdict_rate:
  owner_pillar: ai_ops
  owner_role: gps
  formula: "COUNT(ops.deepask_runs WHERE verdict='COMPLETE') / COUNT(WHERE dry_run=false)"
  source: ops.deepask_runs
  dashboard_tile: founder-monday/system-health
  notes: "Capability deepask v1.0. Honest-gaps mean a low rate isn't inherently bad — read alongside deepask.breaker_trip_rate."

deepask.uncited_claim_rate:
  owner_pillar: ai_ops
  owner_role: gps
  formula: "mean(scripts/deepask/citation-audit.cjs uncitedRate) across runs"
  source: ops.deepask_runs (citation-audit self-check)
  dashboard_tile: founder-monday/system-health
  alert_thresholds:
    p1: "deepask.uncited_claim_rate > 0 (citation-discipline breach — every claim must cite a source)"
  notes: "HARD guardrail — target 0; citation-audit.cjs enforces per-run before an answer is emitted."

deepask.breaker_trip_rate:
  owner_pillar: ai_ops
  owner_role: gps
  formula: "COUNT(runs with ops.deepask_coverage.gap_reason='breaker_budget') / total runs"
  source: ops.deepask_coverage + ops.deepask_runs
  dashboard_tile: founder-monday/system-health
  notes: "Resolver session-breaker exhaustion rate (@cto Phase-2 risk made first-class observable)."

# capability book-to-capability (/forge) v0.1 — Sprint 2 KPIs (owned by 06-ai-ops, gps)
forge.citation_coverage:
  owner_pillar: ai_ops
  owner_role: gps
  formula: "COUNT(ops.v_forge_lineage WHERE citation_count>0) / COUNT(WHERE forge_verdict='PASS')"
  source: ops.v_forge_lineage
  dashboard_tile: founder-monday/system-health
  notes: "Capability book-to-capability v0.1. HARD guardrail — every funnel-PASS promotion must trace to a wiki chunk (target 1.0)."

forge.gate_rejection_rate:
  owner_pillar: ai_ops
  owner_role: gps
  formula: "COUNT(ops.v_forge_lineage WHERE forge_verdict='REJECT') / COUNT(*)"
  source: ops.v_forge_lineage
  dashboard_tile: founder-monday/system-health
  notes: "Inverse-polarity — LOW is bad (funnel rubber-stamping). The anti-over-build funnel must be load-bearing."

forge.new_vs_extend_ratio:
  owner_pillar: ai_ops
  owner_role: gps
  formula: "COUNT(ops.v_forge_lineage WHERE route='net-new') / NULLIF(COUNT(WHERE route='extend'),0)"
  source: ops.v_forge_lineage
  dashboard_tile: founder-monday/system-health
  notes: "Lower = healthier (reuse over sprawl). Observational."

forge.post_install_score_delta:
  owner_pillar: ai_ops
  owner_role: gps
  formula: "median(ops.v_entity_update_lineage.score_delta joined via v_forge_lineage.spawned_run_id)"
  source: ops.v_forge_lineage + ops.v_entity_update_lineage
  dashboard_tile: founder-monday/system-health
  notes: "K4 ratchet surfaced at the forge level — must be >=0 (the /update delegate auto-reverts regressions)."

