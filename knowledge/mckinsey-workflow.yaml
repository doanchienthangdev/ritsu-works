# ============================================================================
# mckinsey-workflow.yaml — the 4S problem-solving ENGINE catalog
# ============================================================================
# Capability: thinking-toolkit v1.4 (/cla extend). The machine-readable spec of
# a world-class McKinsey problem-solving process — NOT a static map of "which
# skill at which stage", but a DYNAMIC, DATA-DRIVEN ENGINE:
#   frame → structure → WORKPLAN (route every hypothesis to a data source) →
#   analyze-loop (pull real data · validate · update the one-day answer ·
#   re-prioritize · porpoise) → synthesize → sell — with intermediate
#   artifacts persisted, findings flowing BACKWARD, and the user asked for
#   data only they hold.
#
# Source: *Bulletproof Problem Solving* (Conn & McLean 2018, the 7-step) +
# *Cracked It!* (Garrette/Phelps/Sibony 2018, the 4S). Spine = 4S; the 7-step
# is the finer cross-map. The load-bearing mechanics distilled from the books:
#   - 6-column WORKPLAN (Exhibit 4.3, verbatim): issue · hypothesis · analysis ·
#     source-of-data · responsibility · end-product. "We don't do any analysis
#     for which we don't have a hypothesis." This is the data-routing spine.
#   - ONE-DAY ANSWER (situation-observation-resolution): the living state,
#     updated after every analysis, re-ranks the remaining workplan rows.
#   - PORPOISING: dive into data → resurface a sharper problem statement.
#   - VALIDATION GATE + DIALECTIC: every datum gated before it moves the answer.
#   - MARGINAL-ANALYSIS stopping rule: stop when no cheap, answer-moving
#     analysis remains.
#
# v1.3 was a static reading-list index (audited: 0/6 real-engine capabilities;
# `porpoising` + `analysis-plan` existed in the wiki but were bound to ZERO
# steps). v1.4 bound them and added the engine sections: artifacts, data_routing,
# validation_gate, routing_rules, hitl_triggers, back_edges, stopping_criterion.
#
# v1.5 (the "load + select the right tool" upgrade) adds the missing mechanism:
#   - tool_selection: HOW the engine CLASSIFIEs a sub-need (book decision-trees)
#     → LOADs candidates (the registry below + ritsu JIT) → SELECTs + COMBINEs
#     (latticework + debias). The candidate pool is a NEW dedicated registry,
#     knowledge/problem-solving-frameworks.yaml — 207 classified candidates from
#     the two books (FILTERable by 4S step + type), extensible as more sync in.
#   - 4 fact-check gap-fixes vs the source process: the one-day-answer is now
#     SEEDED at State (a day-one hypothesis), not first born at Solve; the
#     analytics-tool decision tree (causation vs prediction) is bound; Sell now
#     SPLITS synthesize (step 6, the logic) from communicate (step 7, the story)
#     as two artifacts with an APK (anxious-parade-of-knowledge) guard; and the
#     design-thinking 5-phase branch is a first-class solve_mode in tool_selection.
#
# v1.6 (the "enforce the discipline mechanically" upgrade): a deterministic
#   helper, scripts/thinking-toolkit/mckinsey-run.cjs, scaffolds the run folder
#   and CHECKS it — the 6-column + status workplan, a provenance + degree(1-8)
#   tag on every analysis-log datum, the product firewall on source-of-data, and
#   the stopping gate (no `open` row before Sell). The engine's discipline is now
#   a gate, not just prose. The registry also gains source_chapter provenance
#   (every candidate traces to a book chapter) + a per-step coverage invariant
#   (every 4S step has ≥1 selectable candidate). artifact name `decomposition`
#   is canonical across catalog ↔ run-folder ↔ checker (coherence-guarded).
#
# v1.7 (the "compose deepask without recursion / runaway cost / ceded judgment"
#   upgrade): data_routing already lists deepask as a Solve data tool (since
#   v1.4), but the INTEGRATION CONTRACT was implicit. v1.7 makes it a first-class,
#   validated `composition_guards` engine section — 3 disciplines for composing a
#   HEAVYWEIGHT sub-capability (deepask first; gbrain `think` + deep-research share
#   the shape): (1) ANTI-RECURSION one-way layering (mckinsey → deepask → /think
#   micro-frameworks; deepask never re-enters /think mckinsey — breaks the latent
#   mckinsey→deepask→think-skills→mckinsey cycle; enforced deterministically by
#   scripts/deepask/capability-gate.cjs RECURSION_DENYLIST); (2) COST-VALVE — a
#   full /deepask loop fires ONLY on a knock-out-surviving, genuinely multi-source
#   workplan row (--dry-run first; budget the resolver breaker across the run;
#   heuristics before big guns); (3) EVIDENCE-NOT-DECIDER — deepask returns cited
#   evidence + a COMPLETE/PARTIAL verdict, not the call; a PARTIAL is a
#   data-blocked branch (ask-user or carry an explicit assumption), and the
#   synthesize→recommend judgment stays with the engine (Sell) + the owner.
#
# v3.1 (the "restore the 4S diagram topology + close the coherence gap" upgrade,
#   2026-06-05 audit fix): the 2026-06-05 audit found the engine had FLATTENED the
#   Cracked It! Fig 3.1 routing map — the three PATHS (hypothesis-driven / issue-
#   driven / design-thinking) existed only as prose, the five DECISION DIAMONDS were
#   softened into heuristics, and design-thinking was buried entirely in Solve
#   (the diagram spreads it Empathize=State → Ideate=Structure → Prototype=Solve).
#   It also found the human docs' tool counts had DRIFTED (460/667/19 vs the real
#   424/631/20) with NOTHING in CI checking them. v3.1 adds three sections —
#   `paths` (the 3 paths + their band_staging), `decision_gates` (the 5 diamonds +
#   YES/NO routing), and `tool_library` (the full v3.0 candidate pool reconciled
#   INTO the spec, closing the "spec lagged the SKILL" gap) — and a NEW coherence
#   validator (scripts/cross-tier/validate-mckinsey-coherence.cjs) that makes the
#   stated counts a falsifiable CI invariant. Plus an auto-run enforcement hook
#   (.claude/hooks/runtime/pre-write-mckinsey-gate.cjs) that fires the run-folder
#   gate the moment a Sell artifact is written, and a deeper before-sell checker
#   (decomposition ≥2 branches · non-trivial disconfirmation · ≥1 real data pull).
#
# Schema:    knowledge/schemas/mckinsey-workflow.schema.json
# Validator: scripts/cross-tier/validate-mckinsey-workflow.cjs (L2 critical;
#            check-consistency.cjs + CI + validate-tier1 FILE_TO_SCHEMA). Proves
#            every referenced skill + concept file exists, every `produces` +
#            `data_routing.tool` + `artifacts.files[].stage` is from a known set,
#            and the engine sections (incl. tool_selection) are present + non-empty.
# Registry:  knowledge/problem-solving-frameworks.yaml (the candidate pool;
#            validate-frameworks-registry.cjs proves it complete + on-disk).
# Skill:     06-ai-ops/skills/thinking-toolkit/mckinsey-workflow/SKILL.md
#            (the executable playbook reflecting this spec). /think mckinsey.
# Maintenance: hand-maintained, like design-systems.yaml / art-styles.yaml.
# ============================================================================

version: "3.5.0"
# v3.5 (Per-checkpoint tool-selection — thinking-toolkit v3.6, 2026-06-06): v3.4 made
#   tool-selection recorded at the RUN level; v3.5 makes it real AT EACH CHECKPOINT.
#   toolkit-log gains a `checkpoint` column (binds each selection to its team-session
#   C-id); the --before-sell gate now REQUIRES every 4S stage that ran a checkpoint to
#   record ≥1 selection ("không để đấy") + WARNS on any checkpoint with no selection bound.
#   A per-checkpoint execution loop is documented in the SKILL (READ info-so-far →
#   CLASSIFY → LOAD → SELECT → APPLY → RECORD → PROCEED). The reasoning-trace toolkit_map
#   shows the checkpoint binding. Artifact SET unchanged (still 10 — only a column added).
# v3.4 (Toolkit Selection made VISIBLE — thinking-toolkit v3.5, 2026-06-06): the
#   McKinsey crux is excellent, DELIBERATE tool use — but the engine SELECTED tools
#   (CLASSIFY→LOAD→SELECT) without RECORDING the choice, so it was invisible in both
#   the report and the reasoning-trace, and the MECE tree was never drawn. v3.4 adds
#   the 10th artifact `toolkit-log` (the METHOD LEDGER: per sub-need — classify · loaded
#   · selected+why · rejected+why), a `record` stage to tool_selection, a --before-sell
#   toolkit gate (≥1 selection row), and points the LOAD stage at thinking-tool-index/
#   <step>.md. Downstream (thinking-toolkit v3.5): the Sell report gains a Method
#   section + the reasoning-trace gains issue_tree + toolkit_map charts. ARTIFACTS set
#   stays set-equal across mckinsey-run.cjs ↔ validate-mckinsey-workflow.cjs ↔ this file.
# v3.3 (Reasoning Trace v2 — narrated engagement journey — thinking-toolkit v3.4,
#   2026-06-05): re-architects the `reasoning_trace` OUTPUT. The v3.2 trace was a
#   technical skeleton (4S box diagram + dot timeline + flat tables) the founder
#   found "khó hiểu và khó theo trình tự suy nghĩ". v3.3 makes it a McKinsey CLIENT
#   WALKTHROUGH: 4 acts (State/Structure/Solve/Sell), each milestone (the team-
#   session checkpoints) told in a fixed 5-beat rhythm (bối cảnh → options+chart →
#   chose+why → dropped+why → ✓ client sign-off), chart-rich (journey map · decision
#   funnel · the kept/dropped cut · funnel math · path), in the -vi-day-du register.
#   The skill now authors reasoning-trace.md (walkthrough) + trace-charts.json (chart
#   specs); trace-build.py is the chart-library renderer. `data_verification`
#   unchanged. Additive sub-fields under reasoning_trace (schema additionalProperties).
# v3.2 (Reasoning Trace + Data Verification — thinking-toolkit v3.3, 2026-06-05):
#   added `data_verification` (re-check MECHANISM: triangulate a load-bearing
#   EXTERNAL/degree->=5 datum across >=2 sources → a STATUS) + `reasoning_trace`
#   (the trace OUTPUT); wired data-verification into Solve. Additive top-level keys.
schema: knowledge/schemas/mckinsey-workflow.schema.json
spine: "4S"                                   # State / Structure / Solve / Sell (Cracked it! Ch 3)
source_books: [cracked-it, bulletproof-problem-solving]

# --------------------------------------------------------------------------
# INTERMEDIATE ARTIFACTS — the run produces persisted work products, not one
# brainstorm. Written to the run folder; the one-day-answer is the living state.
# (Accordion principle: for a small problem, compress — the one-day-answer alone
# may suffice. For a substantial one, produce the full chain.)
# --------------------------------------------------------------------------
artifacts:
  run_folder: ".archives/mckinsey/<slug>/"
  files:
    - {name: problem-statement, stage: state,     contents: "TOSCA 5 slots (Trouble/Owner/Success/Constraints/Actors) + Core Question + the 5-check"}
    - {name: decomposition,     stage: structure, contents: "issue tree OR hypothesis pyramid — MECE; each leaf a falsifiable hypothesis"}
    - {name: workplan,          stage: structure, contents: "the 6 book columns (issue · hypothesis · analysis · source-of-data · owner · end-product, dummy exhibit, Exhibit 4.3) + a STATUS column (open|pulled|validated|knocked-out|spawned) the Solve loop rewrites each iteration; knock-out-ordered. The status column is the ledger that keeps a long loop from drifting — you may not reach Sell with an 'open' row above the knock-out bar"}
    - {name: analysis-log,      stage: solve,     contents: "per workplan row: data pulled (which tool) + result + validation verdict + degree-of-certainty (1-8)"}
    - {name: one-day-answer,    stage: state,     contents: "the LIVING state, SEEDED at State as the day-one hypothesis ('if forced to answer today, we'd say X' — Bulletproof's day-one answer) the moment the problem is framed, then formalized as situation→observation→resolution and UPDATED after every Solve analysis. It is the spine that re-ranks the open workplan rows; it is NOT born at Solve — Solve only sharpens it"}
    - {name: hitl-log,          stage: state,     contents: "v1.8 HITL RECEIPT LEDGER — one row per REAL AskUserQuestion put to the founder (id H1, H2, …; verbatim ONE-LINE answer, <br> for breaks). Seeded at State (Success/Constraint asks), appended through Solve. analysis-log 'ask-user' data rows MUST carry a [H<n>] tag resolving here; the run-folder gate (mckinsey-run.cjs) FAILS a bare 'ask-user' with no receipt. DISCIPLINE NOT PROOF: it cannot prove the ask happened — it makes skipping it a gate failure + gives the founder an auditable spot-check trail. Did not ask → label the datum 'assumption' (degree >=6 + sensitivity), never a fabricated ask-user"}
    - {name: checkpoint-log,    stage: state,     contents: "v2.0 McKINSEY TEAM-SESSION LEDGER — one row per team problem-solving session. kind ∈ frame|hypothesize|plan|prioritize|porpoise|dissent|pre-wire. Seeded at State, appended through Solve. The Solve→Sell gate (mckinsey-run.cjs --before-sell) REQUIRES a pre-wire row (the close) + a dissent row (red-team the ANALYSIS: name the one analysis that, if wrong, flips the answer — the disconfirmation discipline) and WARNS if frame/prioritize are missing. interactive mode asks the founder-as-team-member 'what would have to be true for this to be WRONG?'. DISCIPLINE NOT PROOF: can't prove the session happened — makes skipping the closing sessions a failure + leaves an auditable trail"}
    - {name: toolkit-log,       stage: structure, contents: "v3.5/v3.6 METHOD LEDGER — PER-CHECKPOINT. One row per (checkpoint · sub-need): the `checkpoint` C-id binding it to the team-session where it happened · the CLASSIFY tags (solve_mode/analysis_mode/framework_shape) · the candidates LOADed from knowledge/thinking-tool-index/<step>.md · the ≤3 SELECTED tools (slug + why-fit) · the REJECTED (+ why-not / debias). The McKinsey crux — excellent, deliberate tool use AT EACH STEP — made RECORDED + auditable. Tool-selection is a live act at every checkpoint (READ info-so-far → CLASSIFY → LOAD → SELECT → APPLY → RECORD → PROCEED), not a ledger filled at the end. The --before-sell gate REQUIRES every 4S stage that ran a checkpoint to record ≥1 selection ('không để đấy') + WARNS on any checkpoint with no selection bound + WARNS if no rejected/debias note. DISCIPLINE NOT PROOF, like hitl-log/checkpoint-log. SURFACED downstream: the Sell report's Method section + the reasoning-trace's toolkit_map (per-checkpoint) + issue_tree charts"}
    - {name: synthesis,         stage: sell,      contents: "STEP 6 (synthesize the LOGIC): pyramid — governing thought → MECE key line → support; the argument must stand on its own before any storytelling. Built from the final one-day-answer + the analysis-log"}
    - {name: communication,     stage: sell,      contents: "STEP 7 (communicate the STORY): the synthesis rendered for THIS audience — grouping vs SCR/SCQA storyline, action titles, pre-wire plan. APK GUARD: lead with the answer; do NOT parade the analysis (anxious-parade-of-knowledge) or tell the story-of-the-search"}

# --------------------------------------------------------------------------
# DATA ROUTING — the "pull real data" mechanism. In Solve, each workplan row's
# `source-of-data` routes to ONE of these tools. Cheapest-sufficient-source
# first; never brainstorm a fact; if no tool has it → ask-user.
# --------------------------------------------------------------------------
data_routing:
  - need: "Broad internal company evidence / answer spanning multiple internal sources"
    tool: deepask
    invoke: '/deepask "<question>"   (inline; --dry-run first for cost/coverage)'
    hitl: A
    note: "heavyweight federated synthesis; Tier-B+ legs surfaced never auto-run; resolver-breaker bounded. Compose per `composition_guards`: knock-out-gated (big gun, not every leaf), one-way (deepask never re-enters this engine), evidence-not-decider (a PARTIAL is a data-blocked branch → ask-user, don't fabricate)"
  - need: "A framework / concept / definition / best-practice from the distilled reference library"
    tool: wiki_ask
    invoke: '/wiki ask "<q>"   OR   mcp__supabase-ops__wiki_ask({question})'
    hitl: A
    note: "fast/cheap; cite the wiki path; honest no_coverage if absent"
  - need: "A person / company / past decision / relationship / prior bet / entity history"
    tool: gbrain
    invoke: '/brain search "<q>" → recall --entity=<slug> → think only if needed'
    hitl: A
    note: "prefer search/recall (cheap) over think ($0.10-0.50, Opus); $100/mo hard cap"
  - need: "A current metric / number / KPI / count / live operational fact"
    tool: supabase-ops-query
    invoke: "mcp__supabase-ops__query({sql, schema:'metrics'|'ops'|'public'})"
    hitl: A
    note: "metrics.* ONLY (product firewall — never product.*); read knowledge/schemas first, don't invent columns; metrics.product_dau_snapshot ETL may be empty → then ask-user"
  - need: "External market / competitor / benchmark / industry trend / world fact"
    tool: deep-research
    invoke: '/deepask "<q>" (repo-native; delegates its web leg to deep-research) OR Skill({skill:"deep-research", args:"<refined question>"}) directly'
    hitl: A
    note: "deep-research is a HARNESS/plugin skill (registered at runtime in interactive sessions, not a repo file) — /deepask is the repo-native external route (it delegates the web leg to deep-research). SLOW + external; research only — never publish (publish = Tier C). In a headless context where deep-research is absent, route external via /deepask or ask-user. v3.2: ACTIVELY fire web/deep-research for a load-bearing external number (never recall a single figure), and run thinking-toolkit/data-verification (>=2 independent sources → a verification status) BEFORE the number moves the one-day answer — see the data_verification section."
  - need: "Structuring / sequencing the analysis itself (decompose a metric, MECE-gate, frame, stress-test)"
    tool: think-skills
    invoke: "/think driver-tree|mece|hypothesis|root-cause|pyramid|so-what|2x2"
    hitl: A
    note: "reasoning discipline, not evidence; scaffolds WHAT to pull, then route to a data tool. MICRO-FRAMEWORKS ONLY — never `/think mckinsey` (that IS this engine; re-invoking it recurses — see composition_guards anti-recursion)"
  - need: "Data that exists ONLY in the founder's head (private intent, unrecorded decisions, risk appetite, qualitative judgment, degree-6 internal plans)"
    tool: ask-user
    invoke: "AskUserQuestion — surface the gap + show where it changes the one-day answer + a proposed default"
    hitl: human
    note: "the McKinsey move: don't fabricate past a gap you could close by asking the owner; frame as a scheduled checkpoint"

# --------------------------------------------------------------------------
# COMPOSITION GUARDS (v1.7) — the contract for composing a HEAVYWEIGHT
# sub-capability as a Solve-loop data tool. data_routing says WHICH tool to call;
# these guards say HOW to compose the expensive ones (deepask first; gbrain
# `think` + deep-research share the shape) without (1) recursion, (2) runaway
# cost, or (3) ceding the judgment that belongs to the engine + the owner.
# Validated as a non-empty engine section (any `concept` ref is file-checked).
# --------------------------------------------------------------------------
composition_guards:
  - guard: "anti-recursion — one-way layering"
    applies_to: [deepask]
    rule: >
      The McKinsey engine is the ORCHESTRATOR; deepask (and any heavyweight
      sub-capability it routes to) is a LEAF data tool. A data pull MUST NOT
      re-enter this engine. Concretely: never invoke `/think mckinsey` from
      inside a Solve `data_routing` pull, and deepask composes ONLY the
      lightweight `/think` micro-frameworks (pyramid · mece · so-what ·
      hypothesis · driver-tree · root-cause · 2x2) — never `/think mckinsey`.
      One direction only: mckinsey → deepask → /think micro-frameworks. This
      breaks the latent `mckinsey → deepask → think-skills → mckinsey` cycle.
    enforced_by: >
      deepask/execute capability-gate (scripts/deepask/capability-gate.cjs
      RECURSION_DENYLIST refuses thinking-toolkit/mckinsey-workflow even at
      Tier-A) + the `think-skills` data_routing note (micro-frameworks only).
  - guard: "cost-valve — prioritize-gated, breaker-aware"
    applies_to: [deepask, deep-research]
    rule: >
      A full `/deepask` loop is a BIG GUN (multi-subagent, resolver-breaker
      bounded at 20 finds / 4h / session). Fire it ONLY on a workplan row that
      SURVIVED knock-out (high impact×influence) AND genuinely spans multiple
      internal sources. For a single-source need use the cheaper direct tool
      (supabase-ops-query for a number · wiki_ask for a concept · gbrain
      search/recall for an entity). Always `/deepask --dry-run` first (see
      coverage + cost), and BUDGET the breaker across the whole run so a
      10-leaf workplan doesn't exhaust it on leaf 3. Heuristics before big guns.
    concept: {book: bulletproof-problem-solving, slug: knock-out-analysis}
  - guard: "evidence-not-decider — deepask informs; the engine + owner decide"
    applies_to: [deepask, deep-research, gbrain]
    rule: >
      deepask returns CITED EVIDENCE + an honest COMPLETE/PARTIAL coverage
      verdict — it does NOT make the call. Its output is ONE input to the
      validation_gate (run degree-of-certainty + triangulation on it like any
      datum), not a finished recommendation. A deepask PARTIAL / honest-gap is
      a DATA-BLOCKED branch: do not fabricate past it — route to `ask-user`
      (founder-held data) or carry the assumption explicitly with a sensitivity
      note. The synthesize → recommend judgment stays with the engine (Sell)
      and the owner, never the data tool.
    concept: {book: cracked-it, slug: judgment-call-transparency}

# --------------------------------------------------------------------------
# TOOL SELECTION — HOW the engine loads + selects the RIGHT framework / model /
# concept / tool for a sub-need at each step. The founder's question (2026-06-03):
# the ~207 candidates existed as wiki files but with no structured pool to load
# from. This is the 3-stage mechanism over the dedicated registry:
#   CLASSIFY the need (source decision-trees) → LOAD candidates (the registry,
#   FILTERed by step+type, + resolver_find for skills + wiki_ask for content) →
#   SELECT + COMBINE (Munger latticework, ≤3 lenses) + DEBIAS (never force the
#   familiar tool). Candidate pool = knowledge/problem-solving-frameworks.yaml.
# Every `concept` here is validated to exist on disk (L2).
# --------------------------------------------------------------------------
tool_selection:
  # -- CLASSIFY: what KIND of need is this? (drives which candidates fit) --
  - stage: classify
    decides: "solve_mode — analytical (hypothesis + workplan loop) vs design (5-phase design-thinking loop)"
    via: "Well-defined / quantifiable / a right answer exists → analytical Solve. Ill-defined / human-centered / no single right answer / innovation → the DESIGN-THINKING BRANCH: empathize → reframe (How-Might-We) → ideate (diverge then converge) → prototype → test, looping until desirability × feasibility × viability all hold."
    concept: {book: cracked-it, slug: five-phases-of-design-thinking}
  - stage: classify
    decides: "analysis_mode — description vs causation vs prediction (picks the analytical tool)"
    via: "The analytics decision tree. Understand WHY (causation) → experiment / natural-experiment / regression. Forecast WHAT-NEXT (prediction) → machine-learning / Monte-Carlo. Just WHAT-IS (description) → summary stats. Heuristics before big guns ALWAYS — escalate only when a cheap tool can't move the answer."
    concept: {book: bulletproof-problem-solving, slug: analytics-tool-selection-decision-tree}
  - stage: classify
    decides: "framework_shape — formula vs typology vs checklist (picks the KIND of framework)"
    via: "Garrette's three styles: a deductive FORMULA (e.g. profit = price×volume − cost), a TYPOLOGY (2×2 / segmentation), or a CHECKLIST (factors to cover). Match the shape to the job — a typology won't compute a number; a formula won't surface options; a checklist won't prioritize."
    concept: {book: cracked-it, slug: three-styles-of-frameworks}
  # -- LOAD: pull the candidate shortlist for THIS step + classification --
  - stage: load
    decides: "the candidate shortlist for the current 4S step"
    via: "LOAD ONLY `knowledge/thinking-tool-index/<step>.md` (frame|structure|solve|sell|cross — the compact per-step map of the 631-tool library; at STRUCTURE also scan `processes.md` for a domain-process spine). This is the context-lost guard — do NOT load the full registries. Filter the map by domain + cognitive-move + `select when`. THEN resolver_find for matching /think skills, and wiki_ask to surface any long-tail concept not in the map. Read each finalist's → page before applying — the map is a pointer, the page is the how-to."
    registry: "knowledge/thinking-tool-index/<step>.md (backing-tag registries — knowledge/consulting-frameworks.yaml + knowledge/problem-solving-frameworks.yaml + knowledge/consulting-processes.yaml)"
  # -- SELECT + COMBINE: pick ≤3, guard against the familiar-tool trap --
  - stage: select
    decides: "which 1-3 candidates to actually apply"
    via: "Munger latticework — combine 2-3 COMPLEMENTARY lenses (e.g. a typology to map options + a causal analysis to test the driver), never just the one that came to mind. More than ~3 is parade, not insight."
    concept: {book: cracked-it, slug: multiple-frameworks-discipline}
  - stage: select
    decides: "guard the selection against bias"
    via: "Maslow's hammer / framework danger — do NOT reach for the framework you know best and bend the problem to fit it. Match the framework to the PROBLEM. If a familiar tool is the ONLY candidate that surfaced, that's a smell → widen the load (different cleave, different step's cross-candidates)."
    concept: {book: cracked-it, slug: framework-mental-model-danger}
  - stage: select
    decides: "cost discipline on the chosen tool"
    via: "Heuristics before big guns — the cheapest tool that resolves the sub-need wins; escalate to regression / ML / Monte-Carlo only when a heuristic provably can't move the answer (ties to the knock-out gate)."
    concept: {book: bulletproof-problem-solving, slug: heuristics-before-big-guns}
  # -- RECORD (v3.5): write the choice down — selection isn't real until it's logged --
  - stage: record
    decides: "make the selection auditable + visible AT EACH CHECKPOINT (the McKinsey crux is RECORDED, per-step tool use, not silent or end-of-run tool use)"
    via: "At EACH checkpoint, write a `toolkit-log.md` row per (checkpoint C-id · sub-need): the CLASSIFY tags · the candidates LOADed (from thinking-tool-index/<step>.md) · the ≤3 SELECTED (slug + why-fit) · the REJECTED (+ why-not / debias). The --before-sell gate REQUIRES every 4S stage that ran a checkpoint to record ≥1 selection (you can't run the Solve sessions and select no Solve tools) + WARNS on any checkpoint with no selection bound to it. This is the McKinsey execution loop made auditable (READ info-so-far → CLASSIFY → LOAD → SELECT → APPLY → RECORD → PROCEED) — and what makes tool-selection surfaceable in the Sell report (Method) + the reasoning-trace (per-checkpoint toolkit_map + issue_tree). A choice you didn't record can't be shown; a study that shows no deliberate per-step tool selection has hidden its most important work."
    artifact: toolkit-log

# --------------------------------------------------------------------------
# VALIDATION GATE — run on EVERY analysis/datum before it updates the one-day
# answer. Must clear a trust test (is it true?) AND a relevance test (does it
# matter?). Fail any → re-source, downgrade weight, or knock it out.
# --------------------------------------------------------------------------
validation_gate:
  - check: "Decision-relevance / knock-out (run FIRST — cheapest filter)"
    test: "Does this realistically move the answer? importance × influence × expected-value. If it can't move the answer → abandon now (80/20)."
    concept: {book: bulletproof-problem-solving, slug: knock-out-analysis}
  - check: "Source-quality / degree-of-certainty"
    test: "Tag the datum 1-8 (given-fact … judgment-call). Reliability falls as the number rises; discount degree-6 forecasts + degree-7 expert input for owner-incentive bias."
    concept: {book: cracked-it, slug: eight-degrees-of-analysis}
  - check: "Correlation ≠ causation (on any X-drives-Y claim)"
    test: "Reverse-causation? common-driver/confounder? If causation is load-bearing → demand an experiment/natural-experiment/regression, else downgrade to 'associated with'."
    concept: {book: bulletproof-problem-solving, slug: correlation-vs-causation-pitfall}
  - check: "Sensitivity / robustness (on any assumption-based conclusion)"
    test: "Inverse-sensitivity: by how much must assumptions change for the conclusion to flip? Tiny swing → fragile (gather more / hedge). Correct for overprecision."
    concept: {book: cracked-it, slug: sensitivity-analysis}
  - check: "Triangulation / independent challenge (anti-confirmation)"
    test: "Has a SECOND independent read reached the same conclusion? Generate + test one alternative interpretation before accepting the one that fits your storyline. v3.2 MECHANISM: for a load-bearing EXTERNAL / degree->=5 datum this is no longer optional prose — FIRE thinking-toolkit/data-verification (>=2 independent web/deep-research sources) and record a verification status (verified-multi / single-source / conflicting / unverified) in the analysis-log verdict. See the data_verification section."
    concept: {book: cracked-it, slug: confirmation-bias-in-analysis}
  - check: "Honesty-labeling (output of the gate)"
    test: "Tag the surviving datum with its degree-of-certainty; label irreducible judgment calls AS judgment calls — never let the reader believe a judgment is a fact."
    concept: {book: cracked-it, slug: judgment-call-transparency}

# --------------------------------------------------------------------------
# ROUTING RULES (IF → THEN) — after each validated analysis, RE-DECIDE the
# route. The engine is a continuously-updated loop, not a waterfall.
# --------------------------------------------------------------------------
routing_rules:
  - when: "any analysis clears the gate"
    then: "update the one-day-answer (SOR) immediately; re-derive whether the top-line still holds"
    concept: {book: bulletproof-problem-solving, slug: one-day-answer}
  - when: "the validated result CONTRADICTS the current one-day answer"
    then: "revise the governing thought; mark which downstream hypotheses are now dead/live; re-prioritize against the NEW answer (not the old plan)"
    concept: {book: bulletproof-problem-solving, slug: one-day-answer}
  - when: "the result CONFIRMS the one-day answer"
    then: "apply suspicion not relief — was it an adversarial test or confirmation-seeking? if not adversarial, route to an independent challenge before banking it"
    concept: {book: cracked-it, slug: confirmation-bias-in-analysis}
  - when: "an analysis materially MOVED the answer"
    then: "double down — spawn deeper sub-analyses around this lever (it's in the high-value 20%)"
    concept: {book: bulletproof-problem-solving, slug: knock-out-analysis}
  - when: "an analysis DIDN'T move the answer AND sensitivity is low"
    then: "knock the branch out; reallocate to the next-highest-expected-value open issue"
    concept: {book: bulletproof-problem-solving, slug: critical-path-analysis-prioritization}
  - when: "the central hypothesis FAILS its targeted test"
    then: "route to the sibling MECE branch of the hypothesis pyramid (the pre-built alternative), not a patch of the dead hypothesis"
    concept: {book: cracked-it, slug: hypothesis-pyramid-testing}
  - when: "a causal claim is load-bearing but only correlational evidence exists"
    then: "switch tools — from descriptive stats to experiment / natural-experiment / regression"
    concept: {book: bulletproof-problem-solving, slug: correlation-vs-causation-pitfall}

# --------------------------------------------------------------------------
# HITL DATA-REQUEST — when to STOP and ask the founder for data, and how to
# frame it. Going back to the owner for data is routine, not failure.
# --------------------------------------------------------------------------
# v1.8 RECEIPT GATE: when ANY trigger below fires you MUST emit a REAL AskUserQuestion,
# log the Q + verbatim answer to hitl-log.md as H<n>, then tag the analysis-log datum
# `ask-user (founder) [H<n>]`. The run-folder gate (scripts/thinking-toolkit/mckinsey-run.cjs)
# FAILS a bare 'ask-user' datum with no receipt. Choosing NOT to ask is allowed — but then
# the only honest provenance is 'assumption' (degree >=6 + a sensitivity note); a fabricated
# ask-user is the exact failure this gate exists to catch. Discipline, not proof: the gate
# cannot see the conversation, it makes skipping the ask a failure + leaves an auditable trail.
hitl_triggers:
  - when: "the missing input is a degree-6 internal plan/forecast or a target the owner holds and the team structurally cannot generate"
    ask: "request it; don't substitute a guess"
    gate: "log to hitl-log.md as H<n>; tag the datum [H<n>] — or relabel 'assumption'"
    concept: {book: cracked-it, slug: eight-degrees-of-analysis}
  - when: "the input is an irreducible judgment about the owner's own world (risk appetite, strategic intent, success threshold, stakeholder reactions)"
    ask: "surface it explicitly and ask the owner to weigh in"
    gate: "a degree-3 'likely' inference may NOT be promoted to an asserted fact without a logged receipt (the 2026-06-04 porpoise-fabrication failure mode)"
    concept: {book: cracked-it, slug: judgment-call-transparency}
  - when: "a sensitivity test shows the answer FLIPS on an assumption you can't verify yourself"
    ask: "the value of closing that gap is high (it passed knock-out) — request the real number"
    gate: "log the receipt before the flip changes the one-day answer"
    concept: {book: cracked-it, slug: sensitivity-analysis}
  - when: "framing or scope may have drifted since kickoff"
    ask: "fire an intermediary checkpoint — reconfirm the problem, share interim findings, pre-wire"
    gate: "a checkpoint row in hitl-log.md need not feed a datum (the gate is one-way)"
    concept: {book: cracked-it, slug: intermediary-checkpoints}

# --------------------------------------------------------------------------
# BACK-EDGES (porpoising / iterate) — the process is a cycle with explicit
# back-transitions, not a one-way waterfall.
# --------------------------------------------------------------------------
back_edges:
  - from: solve
    to: state
    trigger: "data shows the problem itself is mis-framed / mis-scoped / embeds a solution → surface, rewrite the problem statement, then dive again"
    concept: {book: bulletproof-problem-solving, slug: porpoising}
  - from: solve
    to: structure
    trigger: "a result opens a new avenue or kills a branch → rewrite the (chunky) workplan"
    concept: {book: bulletproof-problem-solving, slug: chunky-workplans-lean-project-plans}
  - from: solve
    to: structure
    trigger: "branch findings don't add up, or the frame was chosen by habit/expertise → re-cleave the tree (try multiple cleaves)"
    concept: {book: bulletproof-problem-solving, slug: team-bias-mitigation-practices}
  - from: sell
    to: solve
    trigger: "an intermediary checkpoint surfaces an objection or a gap → return to analysis before the final meeting"
    concept: {book: cracked-it, slug: intermediary-checkpoints}

# --------------------------------------------------------------------------
# STOPPING CRITERION — move from Solve to Sell only when ALL hold.
# --------------------------------------------------------------------------
stopping_criterion:
  - condition: "central hypothesis proven by a targeted, ADVERSARIAL (not confirmation-seeking) analysis; the one-day answer has stabilized"
    concept: {book: cracked-it, slug: hypothesis-pyramid-testing}
  - condition: "marginal: no remaining open analysis is cheap AND powerful enough to move the answer (clears the knock-out bar) — stop where marginal benefit ≈ marginal cost"
    concept: {book: bulletproof-problem-solving, slug: marginal-analysis}
  - condition: "robust to sensitivity — the recommendation holds across the plausible range of every key assumption"
    concept: {book: cracked-it, slug: sensitivity-analysis}
  - condition: "residual uncertainty is LABELED as judgment calls (with degree-of-certainty), not hidden; tail/downside understood, not just the mean"
    concept: {book: cracked-it, slug: judgment-call-transparency}

# --------------------------------------------------------------------------
# PATHS (v3.1) — the THREE problem-solving paths of the 4S diagram (Cracked It!
# Fig 3.1), restored as first-class catalog entries. The 2026-06-05 audit found
# the paths existed only as prose and were FLATTENED into the linear 4 steps
# (design-thinking buried entirely in Solve). Each path declares its
# entry_condition (the decision diamond that selects it) + its BAND STAGING —
# which 4S band each activity sits in — crucially fixing that DESIGN-THINKING
# SPANS State (Empathize, Ch 8), Structure (Ideate, Ch 9) and Solve (Prototype &
# test, Ch 9), NOT just Solve. `steps` below stays the linear 4S spine; `paths`
# is the routing overlay the agent selects via `decision_gates`.
# --------------------------------------------------------------------------
paths:
  - id: hypothesis-driven
    name: "Hypothesis-Driven Path"
    entry_condition: "You have a good candidate solution / a strong prior (or time starvation forces a bet). Diagram diamond: 'Do you have a good candidate solution? → YES'."
    when_to_prefer: "A credible answer already exists to test; speed matters; the team can state a falsifiable lead hypothesis."
    band_staging:
      - {band: structure, activity: "Build the Hypothesis Pyramid (governing hypothesis → sub-hypotheses)", source_chapter: "Cracked It! Ch 5-6"}
      - {band: solve,     activity: "Perform analyses to CONFIRM/DISPROVE the lead hypothesis (gate: 'Is the candidate solution confirmed?')", source_chapter: "Cracked It! Ch 7"}
    concept: {book: cracked-it, slug: hypothesis-driven-problem-solving}
  - id: issue-driven
    name: "Issue-Driven Path (DEFAULT)"
    entry_condition: "No strong candidate solution, but the problem decomposes into a logical issue tree. Diagram diamond: 'Can you build an issue tree? → YES'. This is the analytical DEFAULT."
    when_to_prefer: "Default analytical path: the problem is well-enough defined to cleave MECE but no answer is yet credible."
    band_staging:
      - {band: structure, activity: "Build the Issue Tree (MECE decomposition; each leaf a falsifiable hypothesis) + the 6-column workplan", source_chapter: "Cracked It! Ch 5-6"}
      - {band: solve,     activity: "Perform analyses leaf-by-leaf (gate: 'Have you found a satisfactory solution?')", source_chapter: "Cracked It! Ch 7"}
    concept: {book: cracked-it, slug: issue-driven-problem-solving}
  - id: design-thinking
    name: "Design-Thinking Path"
    entry_condition: "The problem is ill-defined / human-centered / you DON'T know enough to even state it, OR you cannot build an issue tree. Diagram: 'Do you know enough to state the problem? → NO' AND/OR 'Can you build an issue tree? → NO'."
    when_to_prefer: "Innovation / desirability-led problems with no single right answer; reframe via empathy before structuring."
    band_staging:
      - {band: state,     activity: "EMPATHIZE — immerse in users to (re)frame the problem (POV / How-Might-We)", source_chapter: "Cracked It! Ch 8"}
      - {band: structure, activity: "IDEATE — diverge then converge to candidate concepts", source_chapter: "Cracked It! Ch 9"}
      - {band: solve,     activity: "PROTOTYPE & TEST until desirability × feasibility × viability hold (gate: 'satisfactory solution?')", source_chapter: "Cracked It! Ch 9"}
    concept: {book: cracked-it, slug: five-phases-of-design-thinking}

# --------------------------------------------------------------------------
# DECISION GATES (v3.1) — the FIVE decision diamonds of the 4S diagram, restored
# explicitly. Each sits at a 4S band, asks the diagram's question, and routes
# YES/NO to a path or a back-edge. These are the routing logic the audit found
# softened into prose. They are GUIDANCE the agent applies (the run-folder
# checker can't enforce a routing CHOICE) — but making them first-class makes the
# path decision a conscious, auditable act instead of an implicit default.
# Route targets: to_step ∈ step id · to_path ∈ path id · to_gate ∈ gate id.
# --------------------------------------------------------------------------
decision_gates:
  - id: know-enough-to-state
    at: state
    question: "Do you know enough to STATE the problem?"
    yes_route: {to_step: structure, note: "proceed to the analytical paths (define the problem via TOSCA)"}
    no_route:  {to_path: design-thinking, note: "you cannot frame it yet → Empathize (Ch 8) to (re)discover the real problem"}
    concept: {book: cracked-it, slug: problem-reframing-via-empathy}
  - id: have-candidate-solution
    at: structure
    question: "Do you have a good candidate solution?"
    yes_route: {to_path: hypothesis-driven, note: "Build the Hypothesis Pyramid and test the lead"}
    no_route:  {to_gate: can-build-issue-tree, note: "no credible answer yet → try the issue tree"}
    concept: {book: cracked-it, slug: hypothesis-driven-vs-issue-driven}
  - id: can-build-issue-tree
    at: structure
    question: "Can you build an issue tree?"
    yes_route: {to_path: issue-driven, note: "Build the Issue Tree (the default analytical path)"}
    no_route:  {to_path: design-thinking, note: "the problem resists logical decomposition → Ideate (Ch 9)"}
    concept: {book: cracked-it, slug: issue-tree}
  - id: candidate-solution-confirmed
    at: solve
    question: "Is the candidate solution confirmed? (hypothesis-driven path)"
    yes_route: {to_step: sell, note: "the lead hypothesis survived an adversarial test → synthesize + sell"}
    no_route:  {to_step: structure, note: "route to the sibling MECE branch / re-cleave (NOT a patch) — back-edge"}
    concept: {book: cracked-it, slug: solution-confirmation}
  - id: satisfactory-solution
    at: solve
    question: "Have you found a satisfactory solution? (issue-driven + design-thinking paths)"
    yes_route: {to_step: sell, note: "stopping_criterion holds → synthesize + sell"}
    no_route:  {to_step: structure, note: "loop: re-cleave / re-ideate-prototype-test — back-edge (porpoise)"}
    concept: {book: bulletproof-problem-solving, slug: porpoising}

# --------------------------------------------------------------------------
# TOOL LIBRARY (v3.1) — the candidate pool for SELECTION, reconciled INTO the
# machine-readable spec. The audit found the SKILL.md cited the full v3.0 library
# (631 tools + 20 processes) but THIS yaml only referenced the 207-book registry
# — the spec lagged the playbook. Counts here are CI-checked against the actual
# registry entry counts by scripts/cross-tier/validate-mckinsey-coherence.cjs.
# --------------------------------------------------------------------------
tool_library:
  total_tools: 631
  total_processes: 20
  registries:
    - {kind: book-frameworks,       file: knowledge/problem-solving-frameworks.yaml, count: 207, note: "distilled from Bulletproof + Cracked It!; filter by fours_step + type"}
    - {kind: consulting-frameworks, file: knowledge/consulting-frameworks.yaml,      count: 424, note: "reconstructed from the 20 ex-McKinsey domain toolkits; tagged fours_step/cognitive_moves/domains/select_when/checkpoint_fit"}
    - {kind: domain-processes,      file: knowledge/consulting-processes.yaml,       count: 20,  note: "gated phase-spine playbooks; pulled at STRUCTURE as the issue-tree/workplan skeleton"}
  fast_maps:
    dir: knowledge/thinking-tool-index/
    files: [frame.md, structure.md, solve.md, sell.md, cross.md, processes.md]
    note: "load ONLY the current 4S step's map at a checkpoint (the no-context-lost guard); READ each finalist's wiki page before applying"
  selection_mechanism: "see tool_selection above (CLASSIFY → LOAD the per-step map → SELECT+COMBINE <=3 latticework lenses, debias against the familiar tool)"

# --------------------------------------------------------------------------
# THE 4S STAGES — each binds operations (skills) + concepts + the artifact it
# produces + a per-stage data/validation note. Solve is the data-driven loop.
# --------------------------------------------------------------------------
steps:
  # ------------------------------------------------------------------------
  - id: state
    order: 1
    name: "State the Problem"
    intent: >
      Define + frame before solutioning — most failures solve the wrong problem.
      Fill TOSCA (Trouble/Owner/Success/Constraints/Actors), write a Core
      Question, pass the 5-check. Iterate with the owner ("sing TOSCA as a
      choir"). Where TOSCA needs inputs only the founder holds, ASK (HITL).
      Then SEED THE DAY-ONE ANSWER: "if forced to answer today, we'd say X" — a
      provisional hypothesis written the moment framing is done. It is the living
      state from here on; Structure + Solve sharpen it, they don't birth it.
    bulletproof_7step: ["Define the problem"]
    produces: [problem-statement, one-day-answer, hitl-log, checkpoint-log]
    skills:
      - thinking-toolkit/tosca-problem-framing
    key_concepts:
      - {book: cracked-it, slug: tosca-framework}
      - {book: cracked-it, slug: core-question-scope}
      - {book: cracked-it, slug: success-criteria-component}
      - {book: cracked-it, slug: problem-statement-iteration}
      - {book: bulletproof-problem-solving, slug: problem-statement-worksheet}
      - {book: bulletproof-problem-solving, slug: smart-problem-statement-criteria}
      - {book: bulletproof-problem-solving, slug: outcomes-focused-problem-definition}
      - {book: bulletproof-problem-solving, slug: wicked-problems}
      - {book: bulletproof-problem-solving, slug: one-day-answer}
    retrieval:
      query: "problem framing, TOSCA, core question, success criteria, wicked problems"
      sources: [cracked-it, bulletproof-problem-solving]

  # ------------------------------------------------------------------------
  - id: structure
    order: 2
    name: "Structure the Problem + Build the Workplan"
    intent: >
      Disaggregate into a MECE tree (issue-driven by default; hypothesis pyramid
      only with a strong prior or time starvation; design-thinking path for
      ill-defined human problems). Prioritize via the impact×influence 2×2
      (knock-out). Then build the 6-COLUMN WORKPLAN — route every surviving
      hypothesis to an analysis + a DATA SOURCE + an owner + a dummy exhibit.
      "We don't do any analysis for which we don't have a hypothesis."
    bulletproof_7step: ["Disaggregate the issues", "Prioritize", "Build a workplan"]
    produces: [decomposition, workplan, toolkit-log]
    skills:
      - thinking-toolkit/mece-decomposition-check
      - thinking-toolkit/driver-tree-decomposition
      - thinking-toolkit/hypothesis-driven
    key_concepts:
      - {book: bulletproof-problem-solving, slug: logic-tree}
      - {book: bulletproof-problem-solving, slug: problem-disaggregation}
      - {book: bulletproof-problem-solving, slug: hypothesis-driven-workplanning}
      - {book: bulletproof-problem-solving, slug: chunky-workplans-lean-project-plans}
      - {book: bulletproof-problem-solving, slug: knock-out-analysis}
      - {book: bulletproof-problem-solving, slug: prioritization-2x2-matrix}
      - {book: cracked-it, slug: issue-tree}
      - {book: cracked-it, slug: hypothesis-pyramid}
      - {book: cracked-it, slug: hypothesis-driven-vs-issue-driven}
      - {book: cracked-it, slug: analysis-plan}
    retrieval:
      query: "issue tree, logic tree, MECE, prioritization, workplan, hypothesis vs issue driven, analysis plan"
      sources: [cracked-it, bulletproof-problem-solving]

  # ------------------------------------------------------------------------
  - id: solve
    order: 3
    name: "Solve — the analysis loop (pull · validate · update · re-route)"
    intent: >
      First CLASSIFY (see tool_selection): solve_mode (analytical vs the
      design-thinking 5-phase branch) and, per analysis, analysis_mode
      (description / causation / prediction → which tool). Then for the analytical
      loop: execute the workplan in KNOCK-OUT-FIRST order. For each row: SELECT
      the tool (tool_selection — heuristics before big guns; match the analytics
      tool to causation-vs-prediction), route to a real data source (data_routing),
      pull, run it through the VALIDATION GATE, write the verdict to the
      analysis-log, UPDATE THE ONE-DAY ANSWER, then RE-ROUTE per routing_rules
      (re-prioritize / porpoise / switch direction / pick a different tool). Ask
      the user for data only they hold. Iterate until the stopping_criterion holds.
      DESIGN BRANCH (ill-defined/human/innovation): empathize → reframe (HMW) →
      ideate → prototype → test, looping until desirability×feasibility×viability.
    bulletproof_7step: ["Conduct analyses"]
    produces: [analysis-log, one-day-answer, hitl-log, checkpoint-log, toolkit-log]
    skills:
      - thinking-toolkit/root-cause
      - thinking-toolkit/design-thinking
      - thinking-toolkit/pre-mortem
      - thinking-toolkit/debias
      - thinking-toolkit/2x2-synthesis-matrix
      - thinking-toolkit/data-verification
    key_concepts:
      - {book: bulletproof-problem-solving, slug: one-day-answer}
      - {book: bulletproof-problem-solving, slug: heuristics-before-big-guns}
      - {book: bulletproof-problem-solving, slug: analytics-tool-selection-decision-tree}
      - {book: bulletproof-problem-solving, slug: correlation-vs-causation-pitfall}
      - {book: bulletproof-problem-solving, slug: porpoising}
      - {book: bulletproof-problem-solving, slug: seven-step-process-as-accordion}
      - {book: bulletproof-problem-solving, slug: marginal-analysis}
      - {book: cracked-it, slug: eight-degrees-of-analysis}
      - {book: cracked-it, slug: sensitivity-analysis}
      - {book: cracked-it, slug: hypothesis-pyramid-testing}
      - {book: cracked-it, slug: scope-narrowing-during-solve}
      - {book: cracked-it, slug: desirability-feasibility-viability-triad}
      - {book: cracked-it, slug: five-phases-of-design-thinking}
      - {book: cracked-it, slug: problem-reframing-via-empathy}
      - {book: cracked-it, slug: prototype-as-experiment}
    retrieval:
      query: "analysis, heuristics, one-day answer, porpoising, sensitivity, eight degrees, validation, marginal analysis, causation vs prediction, design thinking"
      sources: [cracked-it, bulletproof-problem-solving]

  # ------------------------------------------------------------------------
  - id: sell
    order: 4
    name: "Sell the Solution"
    intent: >
      TWO distinct moves (Bulletproof steps 6 then 7 — do not conflate them).
      (6) SYNTHESIZE the LOGIC: build the argument as a pyramid — governing
      thought / top-line first, MECE key line, support — from the final one-day
      answer + analysis-log. The logic must stand on its own before any telling.
      (7) COMMUNICATE the STORY: render that logic for THIS audience — grouping
      vs SCR/SCQA, action titles, pre-wire the owner so nothing is a surprise.
      APK GUARD: lead with the answer; NEVER parade the analysis you did
      (anxious-parade-of-knowledge) or tell the story-of-the-search. v2.0: the
      story is RENDERED by thinking-toolkit/mckinsey-sell to a McKinsey TEMPLATE
      (knowledge/mckinsey-templates.yaml) in any /deepask format + design-system
      (--sell/--audience/--style/--art-style) — structure (template) and design
      (--style) orthogonal. The action-titled storyline skeleton was built at
      STRUCTURE (the workplan end-product column = the dummy/ghost exhibits); Sell
      FILLS + pre-wires it, never invents it.
    bulletproof_7step: ["Synthesize findings", "Communicate / tell a great story"]
    produces: [synthesis, communication]
    skills:
      - thinking-toolkit/pyramid-principle-output
      - thinking-toolkit/so-what-test
      - thinking-toolkit/mckinsey-sell
    key_concepts:
      - {book: cracked-it, slug: pyramid-principle}
      - {book: cracked-it, slug: governing-thought}
      - {book: cracked-it, slug: argument-pattern-scr}
      - {book: cracked-it, slug: storyline-design}
      - {book: cracked-it, slug: action-title-discipline}
      - {book: cracked-it, slug: pre-wiring-the-final-meeting}
      - {book: cracked-it, slug: story-of-the-search-antipattern}
      - {book: bulletproof-problem-solving, slug: synthesis-and-storytelling}
      - {book: bulletproof-problem-solving, slug: situation-observation-resolution}
    retrieval:
      query: "synthesis, storyline, pyramid, governing thought, SCR, action titles, pre-wire"
      sources: [cracked-it, bulletproof-problem-solving]

# --------------------------------------------------------------------------
# DATA VERIFICATION (v3.2) — the re-check MECHANISM. "Research numbers can be
# wrong." Triangulation is no longer just prose in the validation_gate — for a
# load-bearing EXTERNAL / degree->=5 datum it FIRES: >=2 INDEPENDENT web/deep-
# research lookups → cross-check → a verification STATUS. Implemented by the
# Solve-step skill thinking-toolkit/data-verification; recorded into the
# analysis-log verdict. (Additive top-level section; the L2 validator ignores
# unknown sections, the schema is additionalProperties:true.)
# --------------------------------------------------------------------------
data_verification:
  fires_when: "a datum is load-bearing (survived knock-out — it moves the one-day answer) AND external/forecast (degree >= 5: a benchmark, market rate, CAC/CPI, competitor fact). Internal degree-2 pulls (ritsu-analytics/supabase) are already hard — skip."
  mechanism: ">=2 INDEPENDENT lookups (WebSearch / WebFetch / deep-research; prefer primary/industry sources over content-farm restatements) → cross-check agreement → assign a status."
  statuses:
    - {status: verified-multi, meaning: ">=2 independent sources agree within range → keep the number + its degree"}
    - {status: single-source,  meaning: "only one credible source → use the range + a sensitivity note"}
    - {status: conflicting,    meaning: "sources disagree materially → use the RANGE, flag fragility, run sensitivity"}
    - {status: unverified,     meaning: "no credible source → downgrade to an explicit assumption (degree >=6 + sensitivity), never assert as fact"}
  records_to: "the analysis-log row verdict (e.g. '[verified-multi: 2 sources agree 2-4% · Pathmonk + BusinessOfApps]'); optional verification-log.md in the run folder"
  decision_rule: "single-source / conflicting + a sensitivity flip on that number → fragile load-bearing input → escalate (deeper research or ask-user). unverified → cannot move the answer as a fact."
  skill: thinking-toolkit/data-verification
  concept: {book: cracked-it, slug: confirmation-bias-in-analysis}

# --------------------------------------------------------------------------
# REASONING TRACE (v3.2) — the thinking-journal OUTPUT. A DERIVED artifact (NOT one
# of the 9 coherence-locked run artifacts): `/think trace <slug>` turns the
# completed run folder into a narrated 4S timeline + flow/tree graph + provenance
# ledger + decision log → PDF. Like reading a McKinsey expert's thinking journal —
# clear, full, easy to study + retrieve. Built by the skill
# thinking-toolkit/reasoning-trace + scripts/thinking-toolkit/{trace-extract.cjs,
# trace-build.py}.
# --------------------------------------------------------------------------
reasoning_trace:
  # v3.4 (2026-06-05): re-architected from a technical skeleton (4S box diagram +
  # dot timeline + flat tables) into a narrated McKinsey ENGAGEMENT JOURNEY — a
  # client walkthrough, milestone by milestone, with the client's ✓ sign-off at each.
  invoke: "/think trace <slug>"
  derived_from: [problem-statement, decomposition, workplan, analysis-log, hitl-log, checkpoint-log, one-day-answer, synthesis, communication]
  pipeline: "trace-extract.cjs (run folder → trace.json skeleton) → the reasoning-trace skill AUTHORS two files: reasoning-trace.md (the milestone walkthrough, -vi-day-du register) + trace-charts.json (narrative chart specs) → trace-build.py renders the chart library + compiles → McKinsey-styled PDF"
  shape: "client walkthrough: opening journey-map + how-to-read → 4 acts (State/Structure/Solve/Sell), each holding its milestones → closing 'why you can trust it' + path chart"
  milestone_rhythm:  # every checkpoint told in this fixed 5-beat shape
    - "Bối cảnh — what we faced; why this milestone mattered"
    - "Các lựa chọn — the options on the table, WITH a narrative chart"
    - "Lựa chọn và vì sao — what we chose + which framework/lens fit + why"
    - "Bỏ gì và vì sao — what we explicitly dropped + the reason (the discipline beat)"
    - "✓ Nghiệm thu — the client's recorded sign-off at that checkpoint (green box)"
  chart_library:  # matplotlib, McKinsey palette; auto = from trace.json, spec = from trace-charts.json
    auto: [journey, receipts, tools]
    spec: [journey-override, funnel, kept_dropped, line_band, assumptions, bars, twobytwo, callout]
  register: "flowing, accessible, deeply-explained Vietnamese — like ritsu-100-who-love-strategy-vi-day-du.pdf; charts narrated; no scaffolding/glossary"
  skill: thinking-toolkit/reasoning-trace
