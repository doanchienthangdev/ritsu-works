# ============================================================================
# mckinsey-workflow.yaml — the 4S problem-solving ENGINE catalog
# ============================================================================
# Capability: thinking-toolkit v1.4 (/cla extend). The machine-readable spec of
# a world-class McKinsey problem-solving process — NOT a static map of "which
# skill at which stage", but a DYNAMIC, DATA-DRIVEN ENGINE:
#   frame → structure → WORKPLAN (route every hypothesis to a data source) →
#   analyze-loop (pull real data · validate · update the one-day answer ·
#   re-prioritize · porpoise) → synthesize → sell — with intermediate
#   artifacts persisted, findings flowing BACKWARD, and the user asked for
#   data only they hold.
#
# Source: *Bulletproof Problem Solving* (Conn & McLean 2018, the 7-step) +
# *Cracked It!* (Garrette/Phelps/Sibony 2018, the 4S). Spine = 4S; the 7-step
# is the finer cross-map. The load-bearing mechanics distilled from the books:
#   - 6-column WORKPLAN (Exhibit 4.3, verbatim): issue · hypothesis · analysis ·
#     source-of-data · responsibility · end-product. "We don't do any analysis
#     for which we don't have a hypothesis." This is the data-routing spine.
#   - ONE-DAY ANSWER (situation-observation-resolution): the living state,
#     updated after every analysis, re-ranks the remaining workplan rows.
#   - PORPOISING: dive into data → resurface a sharper problem statement.
#   - VALIDATION GATE + DIALECTIC: every datum gated before it moves the answer.
#   - MARGINAL-ANALYSIS stopping rule: stop when no cheap, answer-moving
#     analysis remains.
#
# v1.3 was a static reading-list index (audited: 0/6 real-engine capabilities;
# `porpoising` + `analysis-plan` existed in the wiki but were bound to ZERO
# steps). v1.4 bound them and added the engine sections: artifacts, data_routing,
# validation_gate, routing_rules, hitl_triggers, back_edges, stopping_criterion.
#
# v1.5 (the "load + select the right tool" upgrade) adds the missing mechanism:
#   - tool_selection: HOW the engine CLASSIFIEs a sub-need (book decision-trees)
#     → LOADs candidates (the registry below + ritsu JIT) → SELECTs + COMBINEs
#     (latticework + debias). The candidate pool is a NEW dedicated registry,
#     knowledge/problem-solving-frameworks.yaml — 207 classified candidates from
#     the two books (FILTERable by 4S step + type), extensible as more sync in.
#   - 4 fact-check gap-fixes vs the source process: the one-day-answer is now
#     SEEDED at State (a day-one hypothesis), not first born at Solve; the
#     analytics-tool decision tree (causation vs prediction) is bound; Sell now
#     SPLITS synthesize (step 6, the logic) from communicate (step 7, the story)
#     as two artifacts with an APK (anxious-parade-of-knowledge) guard; and the
#     design-thinking 5-phase branch is a first-class solve_mode in tool_selection.
#
# v1.6 (the "enforce the discipline mechanically" upgrade): a deterministic
#   helper, scripts/thinking-toolkit/mckinsey-run.cjs, scaffolds the run folder
#   and CHECKS it — the 6-column + status workplan, a provenance + degree(1-8)
#   tag on every analysis-log datum, the product firewall on source-of-data, and
#   the stopping gate (no `open` row before Sell). The engine's discipline is now
#   a gate, not just prose. The registry also gains source_chapter provenance
#   (every candidate traces to a book chapter) + a per-step coverage invariant
#   (every 4S step has ≥1 selectable candidate). artifact name `decomposition`
#   is canonical across catalog ↔ run-folder ↔ checker (coherence-guarded).
#
# v1.7 (the "compose deepask without recursion / runaway cost / ceded judgment"
#   upgrade): data_routing already lists deepask as a Solve data tool (since
#   v1.4), but the INTEGRATION CONTRACT was implicit. v1.7 makes it a first-class,
#   validated `composition_guards` engine section — 3 disciplines for composing a
#   HEAVYWEIGHT sub-capability (deepask first; gbrain `think` + deep-research share
#   the shape): (1) ANTI-RECURSION one-way layering (mckinsey → deepask → /think
#   micro-frameworks; deepask never re-enters /think mckinsey — breaks the latent
#   mckinsey→deepask→think-skills→mckinsey cycle; enforced deterministically by
#   scripts/deepask/capability-gate.cjs RECURSION_DENYLIST); (2) COST-VALVE — a
#   full /deepask loop fires ONLY on a knock-out-surviving, genuinely multi-source
#   workplan row (--dry-run first; budget the resolver breaker across the run;
#   heuristics before big guns); (3) EVIDENCE-NOT-DECIDER — deepask returns cited
#   evidence + a COMPLETE/PARTIAL verdict, not the call; a PARTIAL is a
#   data-blocked branch (ask-user or carry an explicit assumption), and the
#   synthesize→recommend judgment stays with the engine (Sell) + the owner.
#
# Schema:    knowledge/schemas/mckinsey-workflow.schema.json
# Validator: scripts/cross-tier/validate-mckinsey-workflow.cjs (L2 critical;
#            check-consistency.cjs + CI + validate-tier1 FILE_TO_SCHEMA). Proves
#            every referenced skill + concept file exists, every `produces` +
#            `data_routing.tool` + `artifacts.files[].stage` is from a known set,
#            and the engine sections (incl. tool_selection) are present + non-empty.
# Registry:  knowledge/problem-solving-frameworks.yaml (the candidate pool;
#            validate-frameworks-registry.cjs proves it complete + on-disk).
# Skill:     06-ai-ops/skills/thinking-toolkit/mckinsey-workflow/SKILL.md
#            (the executable playbook reflecting this spec). /think mckinsey.
# Maintenance: hand-maintained, like design-systems.yaml / art-styles.yaml.
# ============================================================================

version: "1.7.0"
schema: knowledge/schemas/mckinsey-workflow.schema.json
spine: "4S"                                   # State / Structure / Solve / Sell (Cracked it! Ch 3)
source_books: [cracked-it, bulletproof-problem-solving]

# --------------------------------------------------------------------------
# INTERMEDIATE ARTIFACTS — the run produces persisted work products, not one
# brainstorm. Written to the run folder; the one-day-answer is the living state.
# (Accordion principle: for a small problem, compress — the one-day-answer alone
# may suffice. For a substantial one, produce the full chain.)
# --------------------------------------------------------------------------
artifacts:
  run_folder: ".archives/mckinsey/<slug>/"
  files:
    - {name: problem-statement, stage: state,     contents: "TOSCA 5 slots (Trouble/Owner/Success/Constraints/Actors) + Core Question + the 5-check"}
    - {name: decomposition,     stage: structure, contents: "issue tree OR hypothesis pyramid — MECE; each leaf a falsifiable hypothesis"}
    - {name: workplan,          stage: structure, contents: "the 6 book columns (issue · hypothesis · analysis · source-of-data · owner · end-product, dummy exhibit, Exhibit 4.3) + a STATUS column (open|pulled|validated|knocked-out|spawned) the Solve loop rewrites each iteration; knock-out-ordered. The status column is the ledger that keeps a long loop from drifting — you may not reach Sell with an 'open' row above the knock-out bar"}
    - {name: analysis-log,      stage: solve,     contents: "per workplan row: data pulled (which tool) + result + validation verdict + degree-of-certainty (1-8)"}
    - {name: one-day-answer,    stage: state,     contents: "the LIVING state, SEEDED at State as the day-one hypothesis ('if forced to answer today, we'd say X' — Bulletproof's day-one answer) the moment the problem is framed, then formalized as situation→observation→resolution and UPDATED after every Solve analysis. It is the spine that re-ranks the open workplan rows; it is NOT born at Solve — Solve only sharpens it"}
    - {name: synthesis,         stage: sell,      contents: "STEP 6 (synthesize the LOGIC): pyramid — governing thought → MECE key line → support; the argument must stand on its own before any storytelling. Built from the final one-day-answer + the analysis-log"}
    - {name: communication,     stage: sell,      contents: "STEP 7 (communicate the STORY): the synthesis rendered for THIS audience — grouping vs SCR/SCQA storyline, action titles, pre-wire plan. APK GUARD: lead with the answer; do NOT parade the analysis (anxious-parade-of-knowledge) or tell the story-of-the-search"}

# --------------------------------------------------------------------------
# DATA ROUTING — the "pull real data" mechanism. In Solve, each workplan row's
# `source-of-data` routes to ONE of these tools. Cheapest-sufficient-source
# first; never brainstorm a fact; if no tool has it → ask-user.
# --------------------------------------------------------------------------
data_routing:
  - need: "Broad internal company evidence / answer spanning multiple internal sources"
    tool: deepask
    invoke: '/deepask "<question>"   (inline; --dry-run first for cost/coverage)'
    hitl: A
    note: "heavyweight federated synthesis; Tier-B+ legs surfaced never auto-run; resolver-breaker bounded. Compose per `composition_guards`: knock-out-gated (big gun, not every leaf), one-way (deepask never re-enters this engine), evidence-not-decider (a PARTIAL is a data-blocked branch → ask-user, don't fabricate)"
  - need: "A framework / concept / definition / best-practice from the distilled reference library"
    tool: wiki_ask
    invoke: '/wiki ask "<q>"   OR   mcp__supabase-ops__wiki_ask({question})'
    hitl: A
    note: "fast/cheap; cite the wiki path; honest no_coverage if absent"
  - need: "A person / company / past decision / relationship / prior bet / entity history"
    tool: gbrain
    invoke: '/brain search "<q>" → recall --entity=<slug> → think only if needed'
    hitl: A
    note: "prefer search/recall (cheap) over think ($0.10-0.50, Opus); $100/mo hard cap"
  - need: "A current metric / number / KPI / count / live operational fact"
    tool: supabase-ops-query
    invoke: "mcp__supabase-ops__query({sql, schema:'metrics'|'ops'|'public'})"
    hitl: A
    note: "metrics.* ONLY (product firewall — never product.*); read knowledge/schemas first, don't invent columns; metrics.product_dau_snapshot ETL may be empty → then ask-user"
  - need: "External market / competitor / benchmark / industry trend / world fact"
    tool: deep-research
    invoke: '/deepask "<q>" (repo-native; delegates its web leg to deep-research) OR Skill({skill:"deep-research", args:"<refined question>"}) directly'
    hitl: A
    note: "deep-research is a HARNESS/plugin skill (registered at runtime in interactive sessions, not a repo file) — /deepask is the repo-native external route (it delegates the web leg to deep-research). SLOW + external; research only — never publish (publish = Tier C). In a headless context where deep-research is absent, route external via /deepask or ask-user."
  - need: "Structuring / sequencing the analysis itself (decompose a metric, MECE-gate, frame, stress-test)"
    tool: think-skills
    invoke: "/think driver-tree|mece|hypothesis|root-cause|pyramid|so-what|2x2"
    hitl: A
    note: "reasoning discipline, not evidence; scaffolds WHAT to pull, then route to a data tool. MICRO-FRAMEWORKS ONLY — never `/think mckinsey` (that IS this engine; re-invoking it recurses — see composition_guards anti-recursion)"
  - need: "Data that exists ONLY in the founder's head (private intent, unrecorded decisions, risk appetite, qualitative judgment, degree-6 internal plans)"
    tool: ask-user
    invoke: "AskUserQuestion — surface the gap + show where it changes the one-day answer + a proposed default"
    hitl: human
    note: "the McKinsey move: don't fabricate past a gap you could close by asking the owner; frame as a scheduled checkpoint"

# --------------------------------------------------------------------------
# COMPOSITION GUARDS (v1.7) — the contract for composing a HEAVYWEIGHT
# sub-capability as a Solve-loop data tool. data_routing says WHICH tool to call;
# these guards say HOW to compose the expensive ones (deepask first; gbrain
# `think` + deep-research share the shape) without (1) recursion, (2) runaway
# cost, or (3) ceding the judgment that belongs to the engine + the owner.
# Validated as a non-empty engine section (any `concept` ref is file-checked).
# --------------------------------------------------------------------------
composition_guards:
  - guard: "anti-recursion — one-way layering"
    applies_to: [deepask]
    rule: >
      The McKinsey engine is the ORCHESTRATOR; deepask (and any heavyweight
      sub-capability it routes to) is a LEAF data tool. A data pull MUST NOT
      re-enter this engine. Concretely: never invoke `/think mckinsey` from
      inside a Solve `data_routing` pull, and deepask composes ONLY the
      lightweight `/think` micro-frameworks (pyramid · mece · so-what ·
      hypothesis · driver-tree · root-cause · 2x2) — never `/think mckinsey`.
      One direction only: mckinsey → deepask → /think micro-frameworks. This
      breaks the latent `mckinsey → deepask → think-skills → mckinsey` cycle.
    enforced_by: >
      deepask/execute capability-gate (scripts/deepask/capability-gate.cjs
      RECURSION_DENYLIST refuses thinking-toolkit/mckinsey-workflow even at
      Tier-A) + the `think-skills` data_routing note (micro-frameworks only).
  - guard: "cost-valve — prioritize-gated, breaker-aware"
    applies_to: [deepask, deep-research]
    rule: >
      A full `/deepask` loop is a BIG GUN (multi-subagent, resolver-breaker
      bounded at 20 finds / 4h / session). Fire it ONLY on a workplan row that
      SURVIVED knock-out (high impact×influence) AND genuinely spans multiple
      internal sources. For a single-source need use the cheaper direct tool
      (supabase-ops-query for a number · wiki_ask for a concept · gbrain
      search/recall for an entity). Always `/deepask --dry-run` first (see
      coverage + cost), and BUDGET the breaker across the whole run so a
      10-leaf workplan doesn't exhaust it on leaf 3. Heuristics before big guns.
    concept: {book: bulletproof-problem-solving, slug: knock-out-analysis}
  - guard: "evidence-not-decider — deepask informs; the engine + owner decide"
    applies_to: [deepask, deep-research, gbrain]
    rule: >
      deepask returns CITED EVIDENCE + an honest COMPLETE/PARTIAL coverage
      verdict — it does NOT make the call. Its output is ONE input to the
      validation_gate (run degree-of-certainty + triangulation on it like any
      datum), not a finished recommendation. A deepask PARTIAL / honest-gap is
      a DATA-BLOCKED branch: do not fabricate past it — route to `ask-user`
      (founder-held data) or carry the assumption explicitly with a sensitivity
      note. The synthesize → recommend judgment stays with the engine (Sell)
      and the owner, never the data tool.
    concept: {book: cracked-it, slug: judgment-call-transparency}

# --------------------------------------------------------------------------
# TOOL SELECTION — HOW the engine loads + selects the RIGHT framework / model /
# concept / tool for a sub-need at each step. The founder's question (2026-06-03):
# the ~207 candidates existed as wiki files but with no structured pool to load
# from. This is the 3-stage mechanism over the dedicated registry:
#   CLASSIFY the need (source decision-trees) → LOAD candidates (the registry,
#   FILTERed by step+type, + resolver_find for skills + wiki_ask for content) →
#   SELECT + COMBINE (Munger latticework, ≤3 lenses) + DEBIAS (never force the
#   familiar tool). Candidate pool = knowledge/problem-solving-frameworks.yaml.
# Every `concept` here is validated to exist on disk (L2).
# --------------------------------------------------------------------------
tool_selection:
  # -- CLASSIFY: what KIND of need is this? (drives which candidates fit) --
  - stage: classify
    decides: "solve_mode — analytical (hypothesis + workplan loop) vs design (5-phase design-thinking loop)"
    via: "Well-defined / quantifiable / a right answer exists → analytical Solve. Ill-defined / human-centered / no single right answer / innovation → the DESIGN-THINKING BRANCH: empathize → reframe (How-Might-We) → ideate (diverge then converge) → prototype → test, looping until desirability × feasibility × viability all hold."
    concept: {book: cracked-it, slug: five-phases-of-design-thinking}
  - stage: classify
    decides: "analysis_mode — description vs causation vs prediction (picks the analytical tool)"
    via: "The analytics decision tree. Understand WHY (causation) → experiment / natural-experiment / regression. Forecast WHAT-NEXT (prediction) → machine-learning / Monte-Carlo. Just WHAT-IS (description) → summary stats. Heuristics before big guns ALWAYS — escalate only when a cheap tool can't move the answer."
    concept: {book: bulletproof-problem-solving, slug: analytics-tool-selection-decision-tree}
  - stage: classify
    decides: "framework_shape — formula vs typology vs checklist (picks the KIND of framework)"
    via: "Garrette's three styles: a deductive FORMULA (e.g. profit = price×volume − cost), a TYPOLOGY (2×2 / segmentation), or a CHECKLIST (factors to cover). Match the shape to the job — a typology won't compute a number; a formula won't surface options; a checklist won't prioritize."
    concept: {book: cracked-it, slug: three-styles-of-frameworks}
  # -- LOAD: pull the candidate shortlist for THIS step + classification --
  - stage: load
    decides: "the candidate shortlist for the current 4S step"
    via: "FILTER knowledge/problem-solving-frameworks.yaml WHERE fours_step ∈ {current-step, cross} AND type matches the need (framework/model/heuristic/technique = tools to apply; bias/antipattern = feed the validation gate, not the solution). THEN resolver_find for matching /think skills, and wiki_ask to surface any long-tail concept not in the shortlist. Read each finalist's wiki_path content before applying — type is only a filter hint."
    registry: knowledge/problem-solving-frameworks.yaml
  # -- SELECT + COMBINE: pick ≤3, guard against the familiar-tool trap --
  - stage: select
    decides: "which 1-3 candidates to actually apply"
    via: "Munger latticework — combine 2-3 COMPLEMENTARY lenses (e.g. a typology to map options + a causal analysis to test the driver), never just the one that came to mind. More than ~3 is parade, not insight."
    concept: {book: cracked-it, slug: multiple-frameworks-discipline}
  - stage: select
    decides: "guard the selection against bias"
    via: "Maslow's hammer / framework danger — do NOT reach for the framework you know best and bend the problem to fit it. Match the framework to the PROBLEM. If a familiar tool is the ONLY candidate that surfaced, that's a smell → widen the load (different cleave, different step's cross-candidates)."
    concept: {book: cracked-it, slug: framework-mental-model-danger}
  - stage: select
    decides: "cost discipline on the chosen tool"
    via: "Heuristics before big guns — the cheapest tool that resolves the sub-need wins; escalate to regression / ML / Monte-Carlo only when a heuristic provably can't move the answer (ties to the knock-out gate)."
    concept: {book: bulletproof-problem-solving, slug: heuristics-before-big-guns}

# --------------------------------------------------------------------------
# VALIDATION GATE — run on EVERY analysis/datum before it updates the one-day
# answer. Must clear a trust test (is it true?) AND a relevance test (does it
# matter?). Fail any → re-source, downgrade weight, or knock it out.
# --------------------------------------------------------------------------
validation_gate:
  - check: "Decision-relevance / knock-out (run FIRST — cheapest filter)"
    test: "Does this realistically move the answer? importance × influence × expected-value. If it can't move the answer → abandon now (80/20)."
    concept: {book: bulletproof-problem-solving, slug: knock-out-analysis}
  - check: "Source-quality / degree-of-certainty"
    test: "Tag the datum 1-8 (given-fact … judgment-call). Reliability falls as the number rises; discount degree-6 forecasts + degree-7 expert input for owner-incentive bias."
    concept: {book: cracked-it, slug: eight-degrees-of-analysis}
  - check: "Correlation ≠ causation (on any X-drives-Y claim)"
    test: "Reverse-causation? common-driver/confounder? If causation is load-bearing → demand an experiment/natural-experiment/regression, else downgrade to 'associated with'."
    concept: {book: bulletproof-problem-solving, slug: correlation-vs-causation-pitfall}
  - check: "Sensitivity / robustness (on any assumption-based conclusion)"
    test: "Inverse-sensitivity: by how much must assumptions change for the conclusion to flip? Tiny swing → fragile (gather more / hedge). Correct for overprecision."
    concept: {book: cracked-it, slug: sensitivity-analysis}
  - check: "Triangulation / independent challenge (anti-confirmation)"
    test: "Has a SECOND independent read reached the same conclusion? Generate + test one alternative interpretation before accepting the one that fits your storyline."
    concept: {book: cracked-it, slug: confirmation-bias-in-analysis}
  - check: "Honesty-labeling (output of the gate)"
    test: "Tag the surviving datum with its degree-of-certainty; label irreducible judgment calls AS judgment calls — never let the reader believe a judgment is a fact."
    concept: {book: cracked-it, slug: judgment-call-transparency}

# --------------------------------------------------------------------------
# ROUTING RULES (IF → THEN) — after each validated analysis, RE-DECIDE the
# route. The engine is a continuously-updated loop, not a waterfall.
# --------------------------------------------------------------------------
routing_rules:
  - when: "any analysis clears the gate"
    then: "update the one-day-answer (SOR) immediately; re-derive whether the top-line still holds"
    concept: {book: bulletproof-problem-solving, slug: one-day-answer}
  - when: "the validated result CONTRADICTS the current one-day answer"
    then: "revise the governing thought; mark which downstream hypotheses are now dead/live; re-prioritize against the NEW answer (not the old plan)"
    concept: {book: bulletproof-problem-solving, slug: one-day-answer}
  - when: "the result CONFIRMS the one-day answer"
    then: "apply suspicion not relief — was it an adversarial test or confirmation-seeking? if not adversarial, route to an independent challenge before banking it"
    concept: {book: cracked-it, slug: confirmation-bias-in-analysis}
  - when: "an analysis materially MOVED the answer"
    then: "double down — spawn deeper sub-analyses around this lever (it's in the high-value 20%)"
    concept: {book: bulletproof-problem-solving, slug: knock-out-analysis}
  - when: "an analysis DIDN'T move the answer AND sensitivity is low"
    then: "knock the branch out; reallocate to the next-highest-expected-value open issue"
    concept: {book: bulletproof-problem-solving, slug: critical-path-analysis-prioritization}
  - when: "the central hypothesis FAILS its targeted test"
    then: "route to the sibling MECE branch of the hypothesis pyramid (the pre-built alternative), not a patch of the dead hypothesis"
    concept: {book: cracked-it, slug: hypothesis-pyramid-testing}
  - when: "a causal claim is load-bearing but only correlational evidence exists"
    then: "switch tools — from descriptive stats to experiment / natural-experiment / regression"
    concept: {book: bulletproof-problem-solving, slug: correlation-vs-causation-pitfall}

# --------------------------------------------------------------------------
# HITL DATA-REQUEST — when to STOP and ask the founder for data, and how to
# frame it. Going back to the owner for data is routine, not failure.
# --------------------------------------------------------------------------
hitl_triggers:
  - when: "the missing input is a degree-6 internal plan/forecast or a target the owner holds and the team structurally cannot generate"
    ask: "request it; don't substitute a guess"
    concept: {book: cracked-it, slug: eight-degrees-of-analysis}
  - when: "the input is an irreducible judgment about the owner's own world (risk appetite, strategic intent, success threshold, stakeholder reactions)"
    ask: "surface it explicitly and ask the owner to weigh in"
    concept: {book: cracked-it, slug: judgment-call-transparency}
  - when: "a sensitivity test shows the answer FLIPS on an assumption you can't verify yourself"
    ask: "the value of closing that gap is high (it passed knock-out) — request the real number"
    concept: {book: cracked-it, slug: sensitivity-analysis}
  - when: "framing or scope may have drifted since kickoff"
    ask: "fire an intermediary checkpoint — reconfirm the problem, share interim findings, pre-wire"
    concept: {book: cracked-it, slug: intermediary-checkpoints}

# --------------------------------------------------------------------------
# BACK-EDGES (porpoising / iterate) — the process is a cycle with explicit
# back-transitions, not a one-way waterfall.
# --------------------------------------------------------------------------
back_edges:
  - from: solve
    to: state
    trigger: "data shows the problem itself is mis-framed / mis-scoped / embeds a solution → surface, rewrite the problem statement, then dive again"
    concept: {book: bulletproof-problem-solving, slug: porpoising}
  - from: solve
    to: structure
    trigger: "a result opens a new avenue or kills a branch → rewrite the (chunky) workplan"
    concept: {book: bulletproof-problem-solving, slug: chunky-workplans-lean-project-plans}
  - from: solve
    to: structure
    trigger: "branch findings don't add up, or the frame was chosen by habit/expertise → re-cleave the tree (try multiple cleaves)"
    concept: {book: bulletproof-problem-solving, slug: team-bias-mitigation-practices}
  - from: sell
    to: solve
    trigger: "an intermediary checkpoint surfaces an objection or a gap → return to analysis before the final meeting"
    concept: {book: cracked-it, slug: intermediary-checkpoints}

# --------------------------------------------------------------------------
# STOPPING CRITERION — move from Solve to Sell only when ALL hold.
# --------------------------------------------------------------------------
stopping_criterion:
  - condition: "central hypothesis proven by a targeted, ADVERSARIAL (not confirmation-seeking) analysis; the one-day answer has stabilized"
    concept: {book: cracked-it, slug: hypothesis-pyramid-testing}
  - condition: "marginal: no remaining open analysis is cheap AND powerful enough to move the answer (clears the knock-out bar) — stop where marginal benefit ≈ marginal cost"
    concept: {book: bulletproof-problem-solving, slug: marginal-analysis}
  - condition: "robust to sensitivity — the recommendation holds across the plausible range of every key assumption"
    concept: {book: cracked-it, slug: sensitivity-analysis}
  - condition: "residual uncertainty is LABELED as judgment calls (with degree-of-certainty), not hidden; tail/downside understood, not just the mean"
    concept: {book: cracked-it, slug: judgment-call-transparency}

# --------------------------------------------------------------------------
# THE 4S STAGES — each binds operations (skills) + concepts + the artifact it
# produces + a per-stage data/validation note. Solve is the data-driven loop.
# --------------------------------------------------------------------------
steps:
  # ------------------------------------------------------------------------
  - id: state
    order: 1
    name: "State the Problem"
    intent: >
      Define + frame before solutioning — most failures solve the wrong problem.
      Fill TOSCA (Trouble/Owner/Success/Constraints/Actors), write a Core
      Question, pass the 5-check. Iterate with the owner ("sing TOSCA as a
      choir"). Where TOSCA needs inputs only the founder holds, ASK (HITL).
      Then SEED THE DAY-ONE ANSWER: "if forced to answer today, we'd say X" — a
      provisional hypothesis written the moment framing is done. It is the living
      state from here on; Structure + Solve sharpen it, they don't birth it.
    bulletproof_7step: ["Define the problem"]
    produces: [problem-statement, one-day-answer]
    skills:
      - thinking-toolkit/tosca-problem-framing
    key_concepts:
      - {book: cracked-it, slug: tosca-framework}
      - {book: cracked-it, slug: core-question-scope}
      - {book: cracked-it, slug: success-criteria-component}
      - {book: cracked-it, slug: problem-statement-iteration}
      - {book: bulletproof-problem-solving, slug: problem-statement-worksheet}
      - {book: bulletproof-problem-solving, slug: smart-problem-statement-criteria}
      - {book: bulletproof-problem-solving, slug: outcomes-focused-problem-definition}
      - {book: bulletproof-problem-solving, slug: wicked-problems}
      - {book: bulletproof-problem-solving, slug: one-day-answer}
    retrieval:
