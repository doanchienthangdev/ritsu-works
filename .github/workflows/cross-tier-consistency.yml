          version: 9
      - run: pnpm install --frozen-lockfile
      - run: node scripts/cross-tier/validate-schedules-skills.cjs

  l2-personas:
    name: L2 — workforce personas ↔ ROLES.md ↔ runtime
    runs-on: ubuntu-latest
    needs: l1-tier1-yaml-schemas
    steps:
      - uses: actions/checkout@v4
