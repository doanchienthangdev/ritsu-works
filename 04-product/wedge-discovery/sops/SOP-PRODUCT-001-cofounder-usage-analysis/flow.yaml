# SOP-PRODUCT-001 — Cofounder Usage Analysis
#
# Purpose: extract wedge-validation signal from the N=2 cofounders' (founder +
# cofounder per governance/ROLES.md) actual usage of Ritsu, treating them as
# the smallest-possible user study BEFORE the N=10 strangers gate
# (SOP-PRODUCT-002).
#
# Discipline: per CPO voice profile (user-observed-evidence-first / PG-Collison
# discipline), this SOP must NAME the user (cofounder X), NAME the metric
# (cohort/activity), and avoid speculation. Output is evidence for the next
# wedge decision — either "this works, expand to strangers" OR "this doesn't
# work, drop scope".
#
# Caveat: N=2 is NOT validation. This SOP surfaces HYPOTHESES to test with
# strangers, not conclusions. If cofounders love feature X but no stranger
# touches it, the wedge is wrong. CPO is responsible for surfacing this caveat
# in every output via the wedge_signal_strength and next_action_recommendation
# fields.

name: SOP-PRODUCT-001-cofounder-usage-analysis
version: 1.0.0
owner_pillar: product
owner_role: product-orchestrator
trigger: manual

inputs:
  cohort_start_date:
    type: string
    required: true
    description: "ISO date (YYYY-MM-DD) marking start of usage window to analyze."
  cohort_end_date:
    type: string
    required: true
    description: "ISO date (YYYY-MM-DD) marking end of usage window. Recommended: 14d windows."
  hypothesis:
    type: string
    required: false
    description: "Optional pre-registered hypothesis for this analysis. If provided, the SOP grades evidence as supporting/contradicting. If absent, output is open-ended observation."

outputs:
  named_observations:
    type: array
    description: "List of objects { cofounder_id, activity_kind, count, sample_quote_or_session_ref }. Each observation cites a specific session, never aggregate-only."
  hypothesis_grade:
    type: string
    description: "When input hypothesis provided: 'supported' | 'contradicted' | 'inconclusive-need-more-data'. When not provided: 'n/a'."
  wedge_signal_strength:
    type: string
    description: "Subjective 1-line read: 'strong' | 'weak' | 'noise'. CPO uses this to decide whether to escalate to N=10 strangers (SOP-PRODUCT-002) or drop."
  next_action_recommendation:
    type: string
    description: "One of: 'escalate-to-SOP-PRODUCT-002' | 'iterate-on-feature' | 'drop-feature' | 'observe-larger-window'. CPO authors; founder confirms (HITL A is sufficient for output; the ACTION the recommendation triggers may be higher tier)."

steps:
  - id: fetch_cofounder_events
    type: db_write
    description: "Query ops.events filtered to cofounder user_ids within cohort window. Group by activity_kind, count occurrences, capture timestamps + session_ids for citation. (db_write step type covers the analysis-row insert in step write_analysis_row; this fetch is read-only against ops.events.)"
    cost_estimate: 0.01
    retry:
      max_attempts: 2
      backoff: exponential

  - id: fetch_session_excerpts
    type: tool_call
    description: "For each top-3-by-count activity_kind, fetch the latest 2 session transcripts from ops-transcripts bucket (per Tier 3 storage). Used for named-quote evidence in named_observations."
    cost_estimate: 0.02

  - id: synthesize_observations
    type: llm_call
    description: "LLM (claude-haiku-4-5) reads the events + excerpts and produces named_observations array. Per CPO voice: every entry MUST cite a specific session, never speculate. System prompt enforces this and rejects 'users generally' phrasing."
    cost_estimate: 0.15
    retry:
      max_attempts: 2
      backoff: exponential

  - id: grade_hypothesis_if_provided
    type: llm_call
    description: "If inputs.hypothesis present, LLM grades the assembled evidence against it. Output is one of 'supported' | 'contradicted' | 'inconclusive-need-more-data'. If no hypothesis, output 'n/a' and skip."
    cost_estimate: 0.05

  - id: write_analysis_row
    type: db_write
    description: "Insert one row into ops.tasks (task_type='sop-PRODUCT-001-output') with all outputs + the SOP run_id reference. CPO reads this in /cpo sessions."
    cost_estimate: 0.005

  - id: surface_to_cpo
    type: tool_call
    description: "Append a one-line entry to 06-ai-ops/workforce-personas/cpo/dossier.md summarizing the run + linking to the ops.tasks row. CPO picks it up in next session via dossier read."
    cost_estimate: 0.01

hitl_tier: A
cost_estimate: 0.25
idempotent: true
partial_idempotent: true
rollback: none
