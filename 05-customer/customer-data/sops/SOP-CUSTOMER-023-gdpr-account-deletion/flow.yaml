steps:
  - id: todo_implement
    type: subprocess
    description: TODO — replace this placeholder with real steps
    cost_estimate: 0

  # ==========================================================================
  # gbrain extension (capability gbrain-operational-brain v1.0 Sprint 6)
  # ==========================================================================
  - id: gbrain_pii_hard_delete
    type: subprocess
    description: |
      For GDPR Article 17 DSR requests on EU citizens, hard-delete matching
      gbrain people/<email-slug> pages. EXPLICIT EXCEPTION to gbrain
      "never hard-delete except archive→purge 90d" rule (per
      knowledge/memory-architecture.md v1.1 + governance/HITL.md Appendix A
      "Orthogonal rules: GDPR DSR exception").

      Sequence:
        1. Founder magic phrase ("override: <reason 5+ words>") per HITL.md
           D-Std ceremony, adapted for GDPR DSR context
        2. Founder GitHub PR comment /founder-approved-irreversible
        3. Invoke mcp__gbrain__mass_purge people/<email-slug> (Tier D-Std)
           OR mcp__gbrain__archive_purge_now if archived already
        4. Verify hard-delete: mcp__gbrain__get_page people/<email-slug>
           returns 404
        5. Log to ops.audit_log with action='gdpr_dsr_gbrain_purge' +
           target_kind='gbrain_page' + payload includes pr_url + magic_phrase
    cost_estimate: 0.02   # mcp__gbrain__mass_purge call
    hitl_tier: D-Std

  # ==========================================================================
  # analytics extension (capability product-db-readonly-access Sprint 4)
  # ==========================================================================
  - id: analytics_erasure_propagation
    type: subprocess
    description: |
      Propagate the erasure to the Door-2 pseudonymized copy on ritsu-analytics
      (capability product-db-readonly-access). The analytics dataset holds only
      user_hash-keyed pseudonymized rows (never email/name/content), but
      pseudonymized != anonymized → GDPR Art. 17 still applies, so the erased
      user must leave ritsu-analytics too.

      LARGELY AUTOMATIC — the nightly sync is a FULL REPLACE (live.sync_one drops
      + recreates each live.* table from the product analytics_export.* views).
      Once the product-side account deletion (the upstream steps) removes the user
      from public.*, the analytics_export.* views stop returning them, so they
      drop out of live.* on the NEXT nightly sync (≤ ~24h) with NO analytics action.

      FORCE within 24h (timely Art. 17 guarantee — recommended):
        1. Confirm the product-side deletion completed (user gone from public.*).
        2. On ritsu-analytics run `call live.sync_all();` (same procedure the
           nightly cron runs) — analytics-side, [A]; NO product write, NO D-MAX.
        3. Verify the user_hash no longer appears in live.* (unlinkable anyway once
           the product user_id is deleted — salt is product-only).
        4. Run scripts/cross-tier/check-analytics-sync-health.cjs → HEALTHY
           (a re-sync must keep PII canary 0).
        5. Log ops.audit_log: action='gdpr_dsr_analytics_resync',
           target_kind='ritsu_analytics_live', payload = the sync run id.

      The boundary design (drop content+identity, hash ids, full-replace sync)
      makes erasure a RE-SYNC, not a search-and-purge — there is no directly-
      identifying row to delete on the analytics side.
    cost_estimate: 0
    hitl_tier: B   # analytics re-sync is reversible [A]/B; the irreversible leg is
                   # the product-side account deletion (its own D-MAX steps above)

hitl_tier: D-Std
cost_estimate: 0    # TODO: estimate per run
