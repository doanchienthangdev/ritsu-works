      #root { position: relative; }

      /* ---- background ---- */
      .bg-fill {
        position: absolute; inset: 0;
        background:

      .bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 52%, rgba(0,0,0,0.6) 100%);

      /* ---- drifting code texture ---- */
      .code-scroll {
        position: absolute; top: -60px; left: 48px; right: 48px;

        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px; line-height: 31px;
        color: #2EE045; opacity: 0.07;
      }

      /* ---- scanline sweeps ---- */
      .scan-sweep {
        position: absolute; left: 0; top: 0; width: 100%; height: 150px;
        background: linear-gradient(180deg, transparent,
          rgba(46,224,69,0.10) 44%, rgba(46,224,69,0.26) 50%,
          rgba(46,224,69,0.10) 56%, transparent);
        filter: blur(2px);
      }
      .scan-line {
        position: absolute; left: 0; top: 0; width: 100%; height: 3px;
        background: rgba(160,255,190,0.55);
        box-shadow: 0 0 16px rgba(46,224,69,0.65);
      }

      /* ---- logomark: self-drawing outline -> watermark ---- */
      .mark-wrap {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
      }
      #mark-svg { width: 560px; height: 560px; display: block; }
      #mark-svg path {
        stroke: #2EE045;
        stroke-width: 0.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill-opacity: 0;      /* revealed later for the faint watermark fill */
      }

      /* ---- hero wordmark (glitch reveal + breathing) ---- */
      .hero-wrap {
        position: absolute; left: 50%; top: 43%;
        transform: translate(-50%, -50%);
      }
      .hero-glow {
        position: absolute; left: 50%; top: 50%;
        width: 1560px; height: 560px;
        transform: translate(-50%, -50%);
        background: radial-gradient(ellipse at center, rgba(46,224,69,0.30), rgba(46,224,69,0) 66%);
        filter: blur(22px);
        opacity: 0.22;
      }
      .hero-inner {
        position: relative;
        width: 1344px; height: 404px;
        opacity: 0;                 /* glitched in by the timeline */
        will-change: transform, opacity;
      }
      .hero-inner svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .wordmark path[fill="black"] { fill: #F4FFF6; }   /* recolor text for dark bg */
      .hero-ghost { opacity: 0; mix-blend-mode: screen; }

      /* ---- CTA: pill + url ---- */
      .cta-wrap {
        position: absolute; left: 50%; top: 68%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center;
      }
      .pill {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 20px 52px; border-radius: 999px;
        background: #0C7A2E;
        border: 2px solid #2EE045;
        box-shadow: 0 0 46px rgba(46,224,69,0.55), inset 0 0 0 1px rgba(255,255,255,0.07);
        color: #FFFFFF; font-weight: 800; font-size: 48px; letter-spacing: 0.5px;
        white-space: nowrap;
        opacity: 0;
      }
      .url {
        margin-top: 26px;
        font-family: "JetBrains Mono", ui-monospace, monospace;

        color: #8CF0A6; text-shadow: 0 0 18px rgba(46,224,69,0.4);

      }
      .fade-fill { position: absolute; inset: 0; background: #000; opacity: 0; }

    <script>
      window.__timelines = window.__timelines || {};

      /* ---------- deterministic code-rain texture ---------- */
      (function buildCode() {
        const pool = [
          'const frame = hyperframes.render(html, t);',
          'await timeline.seek(3.14);            // 0xC0DE',
          'for (const clip of composition.clips) {',
          '  gsap.to(clip, { opacity: 1, ease: "none" });',
          '}',
          'export function draw(ctx, blade) {    // 10110101',
          '  ctx.stroke(blade.path);',
          '}',
          'render.deterministic = true;          // 0xBEEF',
          'const signal = 0xA1 ^ 0x3F;           01001110',
          'while (frame < duration * fps) frame++;',
          'const accent = "#2EE045";             11010010',
          'model.forward([0.42, 0.13, 0.98]);',
          'if (seek) queue.push(frame);          // 0xFACE',
          'return compose(layers).flat();        00101101',
        ];
        let out = [];
        for (let i = 0; i < 56; i++) out.push(pool[i % pool.length]);
        document.getElementById('code-scroll').textContent = out.join('\n');
      })();

      /* ---------- measure logomark blades for the self-draw ---------- */
      document.querySelectorAll('#mark-svg path').forEach(function (p) {
        var len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      /* ---------- clone chromatic-aberration ghosts (setup-time, deterministic) ---------- */
      (function makeGhosts() {
        var main = document.getElementById('hero-wordmark');
        var inner = document.getElementById('hero-inner');
        [['ghost-cyan', '#06E3FA'], ['ghost-green', '#4FDB5E']].forEach(function (g) {
          var clone = main.cloneNode(true);
          clone.removeAttribute('id');
          clone.classList.remove('wordmark');
          clone.classList.add('hero-ghost', g[0]);
          var defs = clone.querySelector('defs'); if (defs) defs.remove();
          clone.querySelectorAll('path').forEach(function (p) {
            p.setAttribute('fill', g[1]);
            p.style.fill = g[1];
          });
          inner.appendChild(clone);
        });
      })();

      /* ---------- timeline ---------- */
      var tl = gsap.timeline({ paused: true });

      /* 0.0–1.75 · logomark self-draws in green */
